<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>초기 설정 따라 하기 · 발표 레이스</title>
<meta name="description" content="발표 레이스 초기 설정(반 만들기, 학생 명단, 설문지 사본, QR, 발표 시간, 자료 등록)을 실제 화면으로 따라 보는 안내">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --paper:#EEF6FF; --dot:#D2E4FA; --card:#FFFFFF; --soft:#F6FAFF; --ink:#1D2A4A; --muted:#5F6E8E; --line:#DCE7F7;
  --main:#3B8BFF; --main-s:#E1EDFF; --sub:#FF6FAE; --sub-s:#FFE1EF; --mint:#20C08A; --mint-s:#DDF7EC;
  --sun:#FFE07A; --sun-s:#FFF6D6; --red:#F0506E; --red-s:#FFE3E8; --orange:#F59E0B; --gray:#A3ADC2;
  --display:'Jua','Malgun Gothic',sans-serif; --body:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --bw:2.5px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font:15px/1.55 var(--body);background-color:var(--paper);
  background-image:radial-gradient(var(--dot) 1.5px,transparent 1.6px);background-size:24px 24px;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--main);outline-offset:2px}

/* ---------- 머리 ---------- */
.top{display:flex;align-items:center;gap:12px;padding:12px 18px 8px}
.top svg{width:38px;height:38px;flex:none}
.top h1{margin:0;font:400 23px/1.1 var(--display)}
.top h1 em{font-style:normal;color:var(--main)}
.top p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.top .grow{flex:1}
.x{width:40px;height:40px;border:var(--bw) solid var(--ink);border-radius:12px;background:var(--card);font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.x:active{transform:translateY(2px);box-shadow:none}

/* ---------- 틀 ---------- */
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 248px;gap:14px;padding:0 18px 14px}
.main{min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px;align-items:center}
.stage{position:relative;width:min(100%,calc((100vh - 268px) * 1.6));aspect-ratio:16/10;flex:none;border:var(--bw) solid var(--ink);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 5px 0 var(--ink)}
.canvas{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;background:var(--paper)}
.zoomer{position:absolute;inset:0;transform-origin:0 0;transition:transform 1.1s cubic-bezier(.45,.05,.25,1)}
.shot{position:absolute;left:0;top:0;width:1280px;height:800px;object-fit:contain;background:var(--paper);opacity:0;transition:opacity .45s ease}
.shot.on{opacity:1}
.art{position:absolute;inset:0;opacity:0;transition:opacity .45s ease;pointer-events:none}
.art.on{opacity:1}
.art.live{pointer-events:auto}
.hls{position:absolute;inset:0;pointer-events:none}
.hl{position:absolute;border:4px solid var(--sub);border-radius:12px;box-shadow:0 0 0 4px rgba(255,111,174,.25);opacity:0;transform:scale(1.08);transition:opacity .35s,transform .35s}
.hl.on{opacity:1;transform:none;animation:pulse 1.6s ease-in-out .4s infinite}
.hl.spot{box-shadow:0 0 0 4px rgba(255,111,174,.25),0 0 0 2400px rgba(29,42,74,.28)}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(255,111,174,.18)}}
.hl.spot.on{animation:none}
.tag{position:absolute;padding:7px 14px;border:var(--bw) solid var(--ink);border-radius:999px;background:var(--sun);font:400 20px/1.2 var(--display);white-space:nowrap;box-shadow:0 3px 0 var(--ink);opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s}
.tag.on{opacity:1;transform:none}
.cursor{position:absolute;left:0;top:0;width:34px;height:40px;transition:transform .85s cubic-bezier(.45,.05,.25,1);z-index:5;pointer-events:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.cursor svg{width:100%;height:100%;transform-origin:4px 3px;transform:scale(var(--ci,1))}
.cursor.hide{opacity:0}
.ripple{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:4px solid var(--main);opacity:0;z-index:4;pointer-events:none}
.ripple.go{animation:rip .65s ease-out}
@keyframes rip{0%{opacity:.95;transform:scale(.4)}100%{opacity:0;transform:scale(2.8)}}
.over{position:absolute;inset:0;pointer-events:none;z-index:3}
.loading{position:absolute;inset:0;display:grid;place-items:center;font:400 22px var(--display);color:var(--muted);background:var(--paper)}

/* ---------- 설명 ---------- */
.cap{width:min(100%,calc((100vh - 268px) * 1.6));min-height:84px;background:var(--card);border:var(--bw) solid var(--ink);border-radius:16px;padding:10px 16px 12px;box-shadow:0 4px 0 var(--ink)}
.cap-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.cap-ch{font:400 15px/1 var(--display);padding:5px 10px;border-radius:999px;background:var(--main-s);color:#1F5FA8}
.cap-n{font-size:12.5px;font-weight:700;color:var(--muted)}
.cap-t{margin:0;font-size:18px;line-height:1.6;font-weight:500;word-break:keep-all}
.cap-t b{color:#C2185B}
.cap-t.in{animation:capin .45s ease}
@keyframes capin{from{opacity:0;transform:translateY(6px)}}

/* ---------- 조작 ---------- */
.ctrl{width:min(100%,calc((100vh - 268px) * 1.6));display:flex;align-items:center;gap:8px}
.cb{flex:none;height:40px;min-width:40px;padding:0 12px;border:var(--bw) solid var(--ink);border-radius:12px;background:var(--card);font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.cb:active{transform:translateY(2px);box-shadow:none}
.cb.play{background:var(--main);color:#fff;min-width:92px}
.tl{position:relative;flex:1;min-width:120px;height:40px}
.tl input{position:absolute;inset:0;width:100%;margin:0;opacity:0;cursor:pointer;z-index:2}
.tl .rail{position:absolute;left:0;right:0;top:15px;height:10px;border-radius:99px;background:var(--line);border:2px solid var(--ink);overflow:hidden}
.tl .fill{position:absolute;left:0;top:0;bottom:0;background:var(--main);border-radius:99px}
.tl .mk{position:absolute;top:10px;width:3px;height:20px;margin-left:-1.5px;background:var(--ink);border-radius:2px;pointer-events:none}
.tl .knob{position:absolute;top:8px;width:24px;height:24px;margin-left:-12px;border:var(--bw) solid var(--ink);border-radius:50%;background:var(--sun);pointer-events:none;box-shadow:0 2px 0 var(--ink)}
.tl .tip{position:absolute;bottom:40px;transform:translateX(-50%);padding:4px 9px;border-radius:8px;background:var(--ink);color:#fff;font-size:12.5px;font-weight:700;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
.tl:hover .tip{opacity:1}
.sp{height:40px;border:var(--bw) solid var(--ink);border-radius:12px;background:var(--card);font-weight:700;padding:0 6px;cursor:pointer}
.pbar{width:min(100%,calc((100vh - 268px) * 1.6));height:4px;border-radius:99px;background:rgba(29,42,74,.1);overflow:hidden;margin-top:-6px}
.pbar i{display:block;height:100%;width:0;background:var(--sub)}

/* ---------- 슬라이드(장 목록) ---------- */
.side{min-height:0;display:flex;flex-direction:column;gap:8px;overflow:auto;padding:2px 4px 6px 2px}
.side h2{margin:2px 0 0;font:400 17px var(--display)}
.side .hint{margin:0 0 4px;font-size:12.5px;color:var(--muted)}
.chb{display:grid;grid-template-columns:30px 1fr;gap:2px 8px;align-items:center;text-align:left;padding:9px 10px;border:2px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer}
.chb .no{grid-row:span 2;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ink);font:400 15px var(--display);background:var(--soft)}
.chb .tt{font:400 16px/1.2 var(--display)}
.chb .dots{display:flex;flex-wrap:wrap;gap:4px}
.chb .dots i{width:9px;height:9px;border-radius:50%;background:var(--line);cursor:pointer}
.chb .dots i.done{background:#9CC3FF}
.chb .dots i.now{background:var(--sub);transform:scale(1.25)}
.chb:hover{border-color:var(--main)}
.chb.on{border:var(--bw) solid var(--ink);background:var(--sun-s);box-shadow:0 3px 0 var(--ink)}
.chb.on .no{background:var(--sun)}
.keys{margin-top:auto;font-size:12px;color:var(--muted);line-height:1.6}
.keys kbd{display:inline-block;padding:0 5px;border:1.5px solid var(--gray);border-bottom-width:3px;border-radius:5px;background:#fff;font:700 11px var(--body)}

@media (max-width:900px){
  body{overflow:auto}
  .wrap{grid-template-columns:1fr;padding:0 10px 12px}
  .stage,.cap,.ctrl,.pbar{width:100%}
  .side{flex-direction:row;overflow-x:auto;order:-1;padding-bottom:4px}
  .side h2,.side .hint,.keys{display:none}
  .side,#chs{align-items:flex-start}
  .chb{flex:none;min-width:136px;padding:7px 9px}
  .cap-t{font-size:16px}
  .ctrl{flex-wrap:wrap}
  .tl{order:-1;flex-basis:100%}
}

/* =================== 그림 장면 (1280×800 기준) =================== */
.A{position:absolute;inset:0;font-family:var(--body)}
.A .lbl{position:absolute;left:24px;bottom:20px;padding:6px 12px;border-radius:999px;background:rgba(29,42,74,.78);color:#fff;font-size:15px;font-weight:700}
.A .big{font:400 46px/1.25 var(--display);margin:0}
.A .pop{opacity:0;animation:popin .55s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes popin{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
.A .fr{display:none}.A .fr.on{display:block}

/* 0. 시작 */
.a-title{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center}
.a-title svg{width:120px;height:120px}
.a-title .big em{font-style:normal;color:var(--main)}
.a-title .sub{font-size:22px;color:var(--muted);margin:-8px 0 0}
.a-title .flow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:1240px}
.a-title .flow span{padding:12px 15px;border:var(--bw) solid var(--ink);border-radius:16px;background:#fff;font:400 22px var(--display);box-shadow:0 4px 0 var(--ink)}
.a-title .flow b{font:400 22px var(--display);color:var(--muted);align-self:center}

/* 구글 화면 그림 공통 */
.gwin{position:absolute;left:110px;top:56px;width:1060px;height:660px;border:3px solid #C9CED8;border-radius:14px;background:#F1F3F4;overflow:hidden;box-shadow:0 18px 40px rgba(29,42,74,.18)}
.gbar{height:46px;display:flex;align-items:center;gap:10px;padding:0 16px;background:#E8EAED;border-bottom:1px solid #D5D8DD}
.gbar i{width:12px;height:12px;border-radius:50%;background:#C4C8CF}
.gbar .url{flex:1;margin-left:10px;height:30px;border-radius:15px;background:#fff;display:flex;align-items:center;padding:0 14px;font-size:15px;color:#3C4043}
.gform-head{height:70px;background:#673AB7;display:flex;align-items:center;gap:14px;padding:0 24px;color:#fff;font-size:22px;font-weight:700}
.gform-head .doc{width:34px;height:42px;border-radius:4px;background:#fff;position:relative}
.gform-head .doc::after{content:'';position:absolute;left:8px;right:8px;top:12px;height:3px;background:#673AB7;box-shadow:0 7px 0 #673AB7,0 14px 0 #673AB7}
.gcard{position:absolute;background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.gbtn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 22px;border-radius:8px;background:#673AB7;color:#fff;font-size:18px;font-weight:700}
.gbtn.line{background:#fff;color:#673AB7;border:1.5px solid #DADCE0}
.gq{position:absolute;left:180px;width:700px;background:#fff;border-radius:10px;border-left:6px solid #4285F4;padding:22px 26px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.gq .qt{font-size:20px;font-weight:700}
.gq .sel{position:absolute;right:24px;top:18px;width:220px;height:46px;border:1.5px solid #DADCE0;border-radius:6px;display:flex;align-items:center;padding:0 14px;font-size:17px;gap:10px}
.gq .sel::after{content:'▾';margin-left:auto;color:#5F6368}
.gmenu{position:absolute;width:260px;background:#fff;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:8px 0;font-size:17px}
.gmenu div{padding:10px 20px}
.gmenu .hv{background:#EDE7F6;font-weight:700}
.gnote{font-size:15px;color:#5F6368;margin-top:8px}
.gchk{display:inline-flex;align-items:center;gap:10px;font-size:18px}
.gchk i{width:24px;height:24px;border:2px solid #5F6368;border-radius:4px;display:grid;place-items:center;font-style:normal;color:#fff;font-weight:900}
.gchk i.on{background:#673AB7;border-color:#673AB7}
.gfield{height:50px;border-bottom:2px solid #673AB7;display:flex;align-items:center;font-size:18px;color:#202124;background:#F8F9FA;padding:0 12px;overflow:hidden;white-space:nowrap}

/* 실제 구글 캡처 */
.a-real{background:#5d6577}
.a-real img{position:absolute;border-radius:10px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.a-real .chipr{position:absolute;left:24px;top:22px;padding:7px 14px;border-radius:999px;background:var(--mint);color:#fff;font-weight:700;font-size:16px}

/* 기기 틀 */
.lap{position:absolute}
.lap .scr{position:absolute;border:12px solid #1D2A4A;border-bottom-width:14px;border-radius:16px 16px 6px 6px;background:#1D2A4A;overflow:hidden}
.lap .scr img{display:block;width:100%;height:100%;object-fit:cover}
.lap .base{position:absolute;height:18px;border-radius:0 0 18px 18px;background:#9AA6BD;border:3px solid #1D2A4A}
.tv .scr{position:absolute;border:14px solid #0E1529;border-radius:12px;background:#0E1529;overflow:hidden}
.tv .scr img{display:block;width:100%;height:100%}
.tv .leg{position:absolute;width:120px;height:34px;border-radius:0 0 10px 10px;background:#0E1529}
.devlbl{position:absolute;text-align:center;font:400 26px/1.3 var(--display)}
.devlbl small{display:block;font:500 17px/1.4 var(--body);color:var(--muted)}
.phone{position:absolute;width:300px;height:600px;border:12px solid #1D2A4A;border-radius:44px;background:#fff;overflow:hidden;box-shadow:0 16px 30px rgba(29,42,74,.25)}
.phone .notch{position:absolute;left:50%;top:8px;width:90px;height:22px;margin-left:-45px;border-radius:12px;background:#1D2A4A;z-index:2}
.phone .pfr{position:absolute;inset:0;padding:44px 16px 16px;display:none}
.phone .pfr.on{display:block}

/* 발표 시간 그림 */
.a-time .clockbig{position:absolute;left:0;right:0;top:110px;text-align:center;font:400 150px/1 var(--display);color:var(--gray);transition:color .3s}
.a-time .st{position:absolute;left:0;right:0;top:280px;text-align:center;font:700 28px var(--body)}
.a-time .bar{position:absolute;left:140px;width:1000px;top:400px;height:44px;border:3px solid var(--ink);border-radius:22px;overflow:hidden;display:flex}
.a-time .bar i{display:block;height:100%}
.a-time .mark{position:absolute;top:384px;width:6px;height:76px;margin-left:-3px;border-radius:3px;background:var(--ink)}
.a-time .tick{position:absolute;top:458px;transform:translateX(-50%);text-align:center;font:700 19px/1.35 var(--body)}
.a-time .tick small{display:block;font-weight:500;font-size:15px;color:var(--muted)}
.a-time .zone{position:absolute;top:560px;width:235px;padding:14px 16px;border:var(--bw) solid var(--ink);border-radius:16px;background:#fff;text-align:center;box-shadow:0 4px 0 var(--ink)}
.a-time .zone b{display:block;font:400 26px var(--display)}
.a-time .zone span{font-size:16px;color:var(--muted)}

/* 드라이브 · 탐색기 그림 */
.flist{position:absolute;left:0;right:0;top:46px;bottom:0;background:#fff;padding:20px 30px}
.flist h4{margin:0 0 16px;font-size:22px;font-weight:500;color:#202124}
.frow{display:flex;align-items:center;gap:14px;height:56px;padding:0 14px;border-radius:10px;font-size:18px;color:#202124}
.frow.sel{background:#C2E7FF}
.frow .ic{width:30px;text-align:center;font-size:24px}
.cmenu{position:absolute;width:260px;background:#fff;border-radius:8px;box-shadow:0 6px 22px rgba(0,0,0,.28);padding:8px 0;font-size:17px}
.cmenu div{padding:11px 20px}
.cmenu .hv{background:#E8F0FE;font-weight:700}
.dlchip{position:absolute;right:30px;bottom:26px;padding:16px 20px;border-radius:12px;background:#202124;color:#fff;font-size:17px;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.fly{position:absolute;padding:14px 18px;border:var(--bw) solid var(--ink);border-radius:14px;background:var(--sun);font:400 24px var(--display);box-shadow:0 6px 0 var(--ink);white-space:nowrap}

/* 나누기 카드 */
.dcard{position:absolute;top:150px;width:370px;height:460px;border:var(--bw) solid var(--ink);border-radius:22px;background:#fff;box-shadow:0 6px 0 var(--ink);padding:22px;text-align:center}
.dcard h3{margin:0 0 6px;font:400 30px var(--display)}
.dcard p{margin:0 0 16px;font-size:17px;color:var(--muted);line-height:1.5}
.dcard .no{position:absolute;left:-14px;top:-14px;width:46px;height:46px;border-radius:50%;border:var(--bw) solid var(--ink);background:var(--sun);display:grid;place-items:center;font:400 24px var(--display)}
.chat{display:flex;flex-direction:column;gap:10px;text-align:left}
.chat .bub{align-self:flex-end;max-width:92%;padding:12px 14px;border-radius:16px 16px 4px 16px;background:var(--main-s);font-size:16px;line-height:1.5}
.chat .bub a{color:#1F5FA8;font-weight:700;word-break:break-all}
.paper{margin:0 auto;width:250px;height:300px;border:2px solid #C9CED8;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.12);padding:16px;text-align:left;position:relative;font-size:13px}
.paper .ln{height:10px;border-radius:4px;background:#E6EBF3;margin:9px 0}
.paper .qr{position:absolute;right:14px;top:14px;width:62px;height:62px;background:url(img/setup/c4-tv.webp) no-repeat;background-size:1004px 565px;background-position:-128px -82px;border:2px solid var(--ink)}

/* 끝 */
.a-end{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.a-end .checks{display:grid;grid-template-columns:repeat(3,300px);gap:14px}
.a-end .checks span{padding:14px 16px;border:var(--bw) solid var(--ink);border-radius:16px;background:#fff;font:400 23px var(--display);box-shadow:0 4px 0 var(--ink)}
.a-end .checks span::before{content:'✓ ';color:var(--mint)}
.a-end .next{display:grid;grid-template-columns:repeat(3,330px);gap:16px}
.a-end .next div{padding:16px 18px;border-radius:16px;background:var(--main-s);font-size:18px;line-height:1.5}
.a-end .next b{display:block;font:400 24px var(--display);margin-bottom:4px}
.a-end .acts{display:flex;gap:16px}
.a-end .acts button{height:58px;padding:0 26px;border:var(--bw) solid var(--ink);border-radius:16px;background:#fff;font:400 24px var(--display);cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.a-end .acts button.p{background:var(--main);color:#fff}
</style>
</head>
<body>
<header class="top">
  <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="18" fill="#FFE07A" stroke="#1D2A4A" stroke-width="3"/><path d="M47 15c3 3 3 9 0 12M51.5 11c5.5 5 5.5 15 0 20" fill="none" stroke="#FF6FAE" stroke-width="3" stroke-linecap="round"/><path d="M14.5 29a15.5 15.5 0 0 0 31 0" fill="none" stroke="#1D2A4A" stroke-width="3.5" stroke-linecap="round"/><path d="M30 44.5v7M22.5 53h15" stroke="#1D2A4A" stroke-width="3.5" stroke-linecap="round"/><rect x="18" y="7" width="24" height="31" rx="12" fill="#3B8BFF" stroke="#1D2A4A" stroke-width="3"/><circle cx="25.5" cy="24" r="2.3" fill="#1D2A4A"/><circle cx="34.5" cy="24" r="2.3" fill="#1D2A4A"/><circle cx="22" cy="29" r="2.4" fill="#FF8FC0" opacity=".9"/><circle cx="38" cy="29" r="2.4" fill="#FF8FC0" opacity=".9"/><path d="M27.5 29.2q2.5 2.6 5 0" fill="none" stroke="#1D2A4A" stroke-width="2" stroke-linecap="round"/></svg>
  <div><h1>초기 설정 <em>따라 하기</em></h1><p>실제 발표 레이스 화면으로 한 단계씩 보여 드려요</p></div>
  <span class="grow"></span>
  <button type="button" class="x" id="close" aria-label="닫기" title="닫기 (Esc)" hidden>✕</button>
</header>
<div class="wrap">
  <div class="main">
    <div class="stage" id="stage" aria-label="초기 설정 따라 하기 화면">
      <div class="canvas" id="cv">
        <div class="zoomer" id="zm">
          <img class="shot" id="imA" alt=""><img class="shot" id="imB" alt="">
          <div class="art" id="art"></div>
          <div class="over" id="over"></div>
          <div class="hls" id="hls"></div>
          <div class="ripple" id="rip"></div>
          <div class="cursor hide" id="cur"><svg viewBox="0 0 34 40" aria-hidden="true"><path d="M4 3l24 21-11 1.6 6.6 12.4-5 2.6-6.6-12.6L4 33z" fill="#fff" stroke="#1D2A4A" stroke-width="2.6" stroke-linejoin="round"/></svg></div>
        </div>
        <div class="loading" id="load">불러오는 중…</div>
      </div>
    </div>
    <div class="cap" aria-live="polite"><div class="cap-h"><span class="cap-ch" id="capCh"></span><span class="cap-n" id="capN"></span></div><p class="cap-t" id="capT"></p></div>
    <div class="ctrl">
      <button type="button" class="cb" id="prev" title="이전 장면 (←)">◀ 이전</button>
      <button type="button" class="cb play" id="play" title="재생 / 멈춤 (Space)">⏸ 멈춤</button>
      <button type="button" class="cb" id="next" title="다음 장면 (→)">다음 ▶</button>
      <div class="tl" id="tl"><div class="rail"><span class="fill" id="fill"></span></div><span class="knob" id="knob"></span><span class="tip" id="tip"></span><input type="range" id="rng" min="0" value="0" aria-label="장면 고르기 슬라이드"></div>
      <select class="sp" id="speed" aria-label="재생 빠르기"><option value="0.75">천천히</option><option value="1" selected>보통</option><option value="1.3">빠르게</option></select>
    </div>
    <div class="pbar" aria-hidden="true"><i id="pb"></i></div>
  </div>
  <aside class="side">
    <h2>📑 장면 고르기</h2>
    <p class="hint">놓친 부분은 제목이나 점을 눌러 다시 보세요.</p>
    <div id="chs" style="display:flex;flex-direction:inherit;gap:8px"></div>
    <p class="keys"><kbd>Space</kbd> 재생·멈춤 · <kbd>←</kbd><kbd>→</kbd> 장면 이동<br>아래 슬라이드를 끌어도 돼요.</p>
  </aside>
</div>
<script>
(async () => {
'use strict';
const $ = s => document.querySelector(s);
const W = 1280, H = 800;

/* ---------- 그림 장면 공용 도구 (장면 파일에서 씀) ---------- */
const LOGO = document.querySelector('.top svg').outerHTML;
const gwin = (url, inner) => `<div class="gwin"><div class="gbar"><i></i><i></i><i></i><span class="url">🔒 ${url}</span></div>${inner}</div>`;
const lbl = t => `<span class="lbl">${t}</span>`;
// 노트북과 TV를 나란히: dir = 사진 폴더
const dual = (dir, a, b, la = '💻 노트북 · 발표 학생이 보는 화면', lb = '📺 TV · 친구들이 보는 화면', sa = '이름 확인 → [▶ 시작] · [■ 마침]을 눌러요', sb = '자료나 발표자 이름을 크게 보여 줘요') => `<div class="A">
    <div class="lap"><div class="scr" data-r="lap" style="left:40px;top:120px;width:616px;height:401px"><img src="img/${dir}/${a}.webp" alt=""></div><div class="base" style="left:10px;top:521px;width:676px"></div></div>
    <div class="tv"><div class="scr" data-r="tv" style="left:700px;top:120px;width:548px;height:332px"><img src="img/${dir}/${b}.webp" alt=""></div><div class="leg" style="left:914px;top:452px"></div></div>
    <div class="devlbl" style="left:40px;width:616px;top:580px">${la}<small>${sa}</small></div>
    <div class="devlbl" style="left:700px;width:548px;top:520px">${lb}<small>${sb}</small></div></div>`;
window.G = { LOGO, gwin, lbl, dual };

/* ---------- 어떤 안내인지 고르고 장면 파일 불러오기 (?g=conf → 수업 설정, 없으면 초기 설정) ---------- */
const KEY = /[?&]g=conf\b/.test(location.search) ? 'conf' : 'setup';
const load = src => new Promise((ok, no) => { const e = document.createElement('script'); e.src = src; e.onload = ok; e.onerror = no; document.head.append(e); });
await load(`shots-${KEY}.js`); await load(`${KEY}.js`);
const S = window.SHOTS.shots, { ART, CH } = window.GUIDE;
document.title = window.GUIDE.title.replace(/<[^>]+>/g, '') + ' · 발표 레이스';
$('.top h1').innerHTML = window.GUIDE.title; $('.top p').textContent = window.GUIDE.sub; $('#stage').setAttribute('aria-label', document.title);

const STEPS = []; CH.forEach((c, ci) => c.steps.forEach((s, k) => STEPS.push(Object.assign(s, { ci, k }))));

/* ---------- 상태 · 화면 맞춤 ---------- */
let idx = 0, playing = true, speed = 1, timers = [], stepStart = 0, stepDur = 0, pausedAt = 0, frontA = true, curPos = [640, 760], zoomK = 1, runStop = null;
const imA = $('#imA'), imB = $('#imB'), art = $('#art'), hls = $('#hls'), cur = $('#cur'), rip = $('#rip'), zm = $('#zm'), over = $('#over');
function fit(){ const k = $('#stage').clientWidth / W; $('#cv').style.transform = `scale(${k})`; }
addEventListener('resize', fit); new ResizeObserver(fit).observe($('#stage'));

const later = (ms, fn) => timers.push(setTimeout(fn, ms / speed));
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; if (runStop) { runStop(); runStop = null; } };
// 위치 찾기: 실제 화면은 캡처할 때 잰 값, 그림 장면은 data-r 이름표가 붙은 요소의 자리 (1280×800 기준)
function rectOf(st, r){
  if (!r) return null; if (Array.isArray(r)) return r;
  if (st.img) { const s = S[st.curImg || st.img]; return (s && s.r[r]) || null; }
  const cv = $('#cv').getBoundingClientRect(), k = cv.width / W;
  const e = [...art.querySelectorAll(`[data-r="${r}"]`)].map(x => x.getBoundingClientRect()).find(b => b.width);
  return e ? [(e.left - cv.left) / k, (e.top - cv.top) / k, e.width / k, e.height / k] : null;
}

function setZoom(rc){
  if (!rc) { zoomK = 1; zm.style.transform = 'none'; cur.style.setProperty('--ci', 1); return; }
  const [x, y, w, h] = rc, pad = 50;
  let z = Math.min(W / (w + pad * 2), H / (h + pad * 2), 2.1); z = Math.max(1, z);
  let tx = W / 2 - z * (x + w / 2), ty = H / 2 - z * (y + h / 2);
  tx = Math.min(0, Math.max(W - W * z, tx)); ty = Math.min(0, Math.max(H - H * z, ty));
  zoomK = z; zm.style.transform = `translate(${tx}px,${ty}px) scale(${z})`; cur.style.setProperty('--ci', (1 / z).toFixed(3));
}
function moveCursor(rc){
  if (!rc) return; const x = rc[0] + Math.min(rc[2] * .5, rc[2] - 8), y = rc[1] + rc[3] * .55;
  curPos = [x, y]; cur.classList.remove('hide'); cur.style.transform = `translate(${x - 4}px,${y - 3}px)`;
}
function clickFx(){ rip.style.left = curPos[0] + 'px'; rip.style.top = curPos[1] + 'px'; rip.classList.remove('go'); void rip.offsetWidth; rip.classList.add('go'); rip.style.width = rip.style.height = 24 / zoomK + 'px'; rip.style.margin = `${-12 / zoomK}px 0 0 ${-12 / zoomK}px`; rip.style.borderWidth = 4 / zoomK + 'px'; }
function setHl(list, st){
  hls.innerHTML = ''; (list || []).forEach((r, i) => { const rc = rectOf(st, r); if (!rc) return;
    const d = document.createElement('div'); d.className = 'hl' + (i === 0 && list.length === 1 && st.spot !== false && st.img ? ' spot' : '');
    const p = 6 / zoomK; Object.assign(d.style, { left: rc[0] - p + 'px', top: rc[1] - p + 'px', width: rc[2] + 2 * p + 'px', height: rc[3] + 2 * p + 'px', borderWidth: Math.max(2, 4 / zoomK) + 'px', borderRadius: 12 / zoomK + 'px' });
    hls.append(d); requestAnimationFrame(() => d.classList.add('on')); });
}
const loaded = new Map();
const pre = n => { if (!n || loaded.has(n)) return loaded.get(n); const p = new Promise(ok => { const i = new Image(); i.onload = i.onerror = () => ok(); i.src = `img/${KEY}/${n}.webp`; }); loaded.set(n, p); return p; };
async function showImg(n, instant){
  await pre(n);
  const back = frontA ? imB : imA, front = frontA ? imA : imB;
  if (instant) { front.src = `img/${KEY}/${n}.webp`; front.classList.add('on'); return; }
  back.src = `img/${KEY}/${n}.webp`; await back.decode().catch(() => {});
  back.classList.add('on'); front.classList.remove('on'); frontA = !frontA;
}
function setFrame(st, f){
  if (st.frames) { st.curImg = st.frames[f]; showImg(st.frames[f], true); }
  else { const fr = art.querySelectorAll('.fr, .pfr'); fr.forEach((e, i) => e.classList.toggle('on', i === f)); }
}

/* ---------- 장면 그리기 ---------- */
async function go(i, keepPlay = true){
  idx = Math.max(0, Math.min(STEPS.length - 1, i)); clearTimers(); clearTimeout(advT);
  const st = STEPS[idx]; st.curImg = st.img;
  $('#load').style.display = 'none';
  // 설명
  const c = CH[st.ci];
  $('#capCh').textContent = `${st.ci}. ${c.t}`; $('#capN').textContent = `${st.k + 1} / ${c.steps.length} 장면 · 전체 ${idx + 1} / ${STEPS.length}`;
  const ct = $('#capT'); ct.innerHTML = st.cap; ct.classList.remove('in'); void ct.offsetWidth; ct.classList.add('in');
  syncUi();
  // 화면
  hls.innerHTML = ''; over.innerHTML = '';
  if (st.art) {
    art.innerHTML = ART[st.art](...(st.artArgs || [])); art.classList.add('on'); art.classList.toggle('live', !!st.live);
    imA.classList.remove('on'); imB.classList.remove('on');
    if (st.startFrame) setFrame(st, st.startFrame);
    if (st.run === 'time') runStop = runTime();
    art.querySelectorAll('[data-act]').forEach(b => b.onclick = () => b.dataset.act === 'restart' ? go(0) : closeMe());
  } else {
    art.classList.remove('on', 'live'); art.innerHTML = '';
    await showImg(st.img);
    if (STEPS[idx] !== st) return;
  }
  setZoom(st.zoom ? rectOf(st, st.zoom) : null);
  // 동작 순서
  const acts = st.acts ? [...st.acts] : [];
  if (!st.acts) {
    const hasCur = !!st.cur, z = st.zoom ? 1100 : 0;
    if (st.frames) st.frames.forEach((f, k) => k && acts.push({ t: z + 1500 + k * (st.frameMs || 430), frame:k }));
    if (hasCur) acts.push({ t: z ? 900 : 450, cur: st.cur });
    if (st.click) acts.push({ t: (z ? 900 : 450) + 900, click:true });
    acts.push({ t: hasCur ? (z ? 900 : 450) + 950 : (z ? 1000 : 350), hl: st.hl || [] });
  } else if (st.hl) acts.unshift({ t: 400, hl: st.hl });
  if (st.cur && st.acts) acts.unshift({ t: 450, cur: st.cur });
  if (!st.cur && !acts.some(a => a.cur)) cur.classList.add('hide');
  acts.forEach(a => later(a.t, () => {
    if (a.cur) moveCursor(rectOf(st, a.cur));
    if (a.click) clickFx();
    if (a.frame !== undefined) setFrame(st, a.frame);
    if (a.hl) setHl(a.hl, st);
  }));
  if (st.over === 'fly') later(600, () => { const d = rectOf(st, 'drop'); if (!d) return; over.innerHTML = `<div class="fly" style="left:${d[0] - 520}px;top:${d[1] + 10}px;transition:transform 1.8s cubic-bezier(.45,.05,.25,1),opacity .4s">📁 발표 자료 파일 (10개)</div>`;
    const f = over.firstChild; requestAnimationFrame(() => requestAnimationFrame(() => { f.style.transform = `translate(${520 + d[2] / 2 - 150}px,0)`; }));
    later(2500, () => { f.style.opacity = '0'; }); });
  // 다음 장면
  stepDur = (st.dur || Math.max(6200, 3000 + st.cap.replace(/<[^>]+>/g, '').length * 70));
  stepStart = performance.now(); pausedAt = playing ? 0 : stepStart;
  for (let k = 1; k <= 3; k++) { const n = STEPS[idx + k]; if (n) [n.img, ...(n.frames || []), ...(n.artArgs || []).filter(x => S[x])].forEach(pre); }
  finished = false; schedule(stepDur);
}
// 다음 장면으로 넘기는 타이머 (멈춰도 장면 안의 움직임은 끝까지 보여 줌)
let advT = null, finished = false;
function schedule(ms){
  clearTimeout(advT); if (!playing) return;
  advT = setTimeout(() => { if (idx < STEPS.length - 1) go(idx + 1); else { finished = true; setPlay(false); } }, ms / speed);
}
function runTime(){
  const el = $('#tClock'), stt = $('#tSt'), mk = $('#tMark'); if (!el) return null;
  let t = 0; const T = 112.5, total = 9.5;
  const iv = setInterval(() => {
    t += .05 * speed; const sec = Math.min(T * .93, t / total * T * .93 + 0);
    el.textContent = `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;
    const [c, m] = sec < 60 ? ['#8A94AA', '최소 시간 전 · 아직 짧아요'] : sec < 75 ? ['#14A06F', '👍 적정 구간'] : sec < 90 ? ['#E8750A', '⏰ 곧 끝나요'] : ['#E0405E', '⚠ 시간 초과'];
    el.style.color = c; stt.textContent = m; stt.style.color = c; mk.style.left = 140 + sec / T * 1000 + 'px';
  }, 50);
  return () => clearInterval(iv);
}

/* ---------- 조작 ---------- */
const rng = $('#rng'); rng.max = STEPS.length - 1;
function syncUi(){
  rng.value = idx; const p = STEPS.length > 1 ? idx / (STEPS.length - 1) * 100 : 0;
  $('#fill').style.width = p + '%'; $('#knob').style.left = p + '%';
  document.querySelectorAll('.chb').forEach((b, ci) => {
    b.classList.toggle('on', ci === STEPS[idx].ci);
    b.querySelectorAll('.dots i').forEach(d => { const n = +d.dataset.i; d.className = n === idx ? 'now' : n < idx ? 'done' : ''; });
  });
  const on = document.querySelector('.chb.on'); if (on) on.scrollIntoView({ block:'nearest', inline:'nearest' });
}
function setPlay(v){
  playing = v; $('#play').textContent = v ? '⏸ 멈춤' : '▶ 재생';
  if (v) {
    if (finished) { go(0); return; }
    const done = ((pausedAt || performance.now()) - stepStart) * speed, left = Math.max(1200, stepDur - done);
    stepStart = performance.now() - (stepDur - left) / speed; pausedAt = 0; schedule(left);
  } else { pausedAt = performance.now(); clearTimeout(advT); }
}
$('#play').onclick = () => setPlay(!playing);
$('#prev').onclick = () => go(idx - 1);
$('#next').onclick = () => go(idx + 1);
rng.oninput = () => go(+rng.value);
const tip = $('#tip');
$('#tl').addEventListener('mousemove', e => { const r = $('#tl').getBoundingClientRect(), f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), n = Math.round(f * (STEPS.length - 1)); tip.textContent = `${STEPS[n].ci}. ${CH[STEPS[n].ci].t} · ${STEPS[n].k + 1}`; tip.style.left = f * 100 + '%'; });
$('#speed').onchange = e => { speed = +e.target.value; go(idx); };
// 장 목록(슬라이드) · 슬라이드 위 장 표시
let gi = 0;
$('#chs').innerHTML = CH.map((c, ci) => { const dots = c.steps.map(() => `<i data-i="${gi++}" title="${ci}. ${c.t}"></i>`).join(''); return `<button type="button" class="chb" data-ci="${ci}"><span class="no">${ci}</span><span class="tt">${c.t}</span><span class="dots">${dots}</span></button>`; }).join('');
$('#chs').addEventListener('click', e => { const d = e.target.closest('.dots i'); if (d) { go(+d.dataset.i); return; } const b = e.target.closest('.chb'); if (b) go(STEPS.findIndex(s => s.ci === +b.dataset.ci)); });
CH.forEach((c, ci) => { if (!ci) return; const n = STEPS.findIndex(s => s.ci === ci), m = document.createElement('span'); m.className = 'mk'; m.style.left = n / (STEPS.length - 1) * 100 + '%'; $('#tl').append(m); });
addEventListener('keydown', e => {
  if (e.target.closest('select')) return;
  if (e.key === ' ' || e.key === 'k') { e.preventDefault(); setPlay(!playing); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); go(idx + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(idx - 1); }
  else if (e.key === 'Escape') closeMe();
});
// 진행 막대 (장면 안에서 남은 시간)
(function bar(){ const st = STEPS[idx]; const el = $('#pb'); if (st && stepDur) { const done = ((pausedAt || performance.now()) - stepStart) * speed; el.style.width = Math.min(100, done / stepDur * 100) + '%'; } requestAnimationFrame(bar); })();

const inFrame = window.parent !== window;
function closeMe(){ if (inFrame) parent.postMessage('sg-close', '*'); }
if (inFrame) { $('#close').hidden = false; $('#close').onclick = closeMe; }

// 주소 끝에 #s=장면번호 를 붙이면 그 장면부터 (예: #s=12)
const hs = /(?:^#|&)s=(\d+)/.exec(location.hash);
if (/[#&]pause/.test(location.hash)) setPlay(false);
fit(); go(hs ? +hs[1] : 0);
})();
</script>
</body>
</html>
