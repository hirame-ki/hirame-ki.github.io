<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생기부돋보기 · 임베딩 모델 검증</title>
<style>
  :root{
    --bg:#f7f8fa; --card:#fff; --ink:#1f2937; --muted:#6b7280;
    --line:#e3e7ee; --brand:#3f6b8c; --ok:#4a8f6d; --warn:#b5644f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Pretendard","Noto Sans KR","Malgun Gothic",-apple-system,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;padding:32px 20px 80px;
  }
  .wrap{max-width:980px;margin:0 auto}
  h1{font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:.9rem;margin-top:6px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:20px}
  h2{font-size:1rem;font-weight:700;margin-bottom:12px}
  label{display:flex;gap:9px;align-items:flex-start;padding:7px 0;font-size:.92rem;cursor:pointer}
  label input{margin-top:5px}
  .mdesc{color:var(--muted);font-size:.83rem}
  button{
    background:var(--brand);color:#fff;border:0;border-radius:10px;
    padding:11px 20px;font:inherit;font-weight:700;cursor:pointer;margin-top:14px;
  }
  button:disabled{opacity:.5;cursor:not-allowed}
  #log{
    font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:.82rem;
    color:var(--muted);white-space:pre-wrap;margin-top:14px;max-height:180px;overflow:auto;
  }
  table{border-collapse:collapse;width:100%;font-size:.88rem;margin-top:10px}
  th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left}
  th{font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
  td.num{font-variant-numeric:tabular-nums;text-align:right}
  .hi{color:var(--ok);font-weight:700}
  .lo{color:var(--warn);font-weight:700}
  .best{background:rgba(74,143,109,.10)}
  .pill{display:inline-block;font-size:.75rem;padding:2px 9px;border-radius:999px;background:rgba(63,107,140,.12);color:var(--brand);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <h1>생기부돋보기 · 임베딩 모델 검증</h1>
  <p class="sub">
    유사쌍 5개 / 상이쌍 5개로 각 모델의 점수 분포를 비교합니다.
    <b>유사쌍 평균 − 상이쌍 평균(마진)</b>이 클수록 우수한 모델입니다. 전 과정 브라우저 로컬 실행.
  </p>

  <div class="card">
    <h2>1. 비교할 모델 선택</h2>
    <div id="models"></div>
    <button id="run">검증 시작</button>
    <div id="log"></div>
  </div>

  <div id="results"></div>
</div>

<script type="module">
const MODELS = [
  { key:'small', id:'Xenova/multilingual-e5-small', label:'로컬 C · multilingual-e5-small',
    desc:'초경량(~120MB). 로딩 최속. e5 계열이라 "query: " 프리픽스 사용', prefix:'query: ', on:true },
  { key:'base',  id:'Xenova/multilingual-e5-base',  label:'로컬 B · multilingual-e5-base',
    desc:'다국어 검색 표준(~280MB). 품질/속도 균형', prefix:'query: ', on:true },
  { key:'m3',    id:'Xenova/bge-m3',                label:'로컬 A · bge-m3',
    desc:'다국어 강세, 한국어 양호(~600MB+). 첫 로딩 오래 걸림', prefix:'', on:false },
];

const CDNS = [
  'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.6',
  'https://cdn.jsdelivr.net/npm/@huggingface/transformers',
  'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2',
];

const $ = s => document.querySelector(s);
const log = m => { $('#log').textContent += m + '\n'; $('#log').scrollTop = 1e6; };

$('#models').innerHTML = MODELS.map(m => `
  <label>
    <input type="checkbox" value="${m.key}" ${m.on?'checked':''}>
    <span><b>${m.label}</b><br><span class="mdesc">${m.id} — ${m.desc}</span></span>
  </label>`).join('');

let lib = null;
async function loadLib(){
  if (lib) return lib;
  for (const url of CDNS){
    try { log('라이브러리 로딩: ' + url); lib = await import(url); return lib; }
    catch(e){ log('  실패 → 다음 CDN 시도'); }
  }
  throw new Error('transformers.js 로딩 실패 (네트워크 확인)');
}

const cos = (a,b) => { let s=0; for (let i=0;i<a.length;i++) s += a[i]*b[i]; return s; };
const avg = a => a.reduce((x,y)=>x+y,0)/a.length;

async function benchmark(model, samples){
  const { pipeline } = await loadLib();
  log(`[${model.key}] 모델 다운로드/초기화…`);
  const t0 = performance.now();
  const extractor = await pipeline('feature-extraction', model.id, {
    progress_callback: p => { if (p.status === 'progress' && p.progress != null && Math.random() < .04)
      log(`  ${p.file ?? ''} ${p.progress.toFixed(0)}%`); }
  });
  const loadMs = performance.now() - t0;
  log(`[${model.key}] 초기화 완료 (${(loadMs/1000).toFixed(1)}초)`);

  const embed = async t => {
    const out = await extractor(model.prefix + t, { pooling:'mean', normalize:true });
    return Array.from(out.data);
  };

  const t1 = performance.now();
  const score = async pairs => {
    const r = [];
    for (const p of pairs) r.push({ note:p.note, s: cos(await embed(p.a), await embed(p.b)) });
    return r;
  };
  const sim = await score(samples.similar);
  const dif = await score(samples.different);
  const embedMs = (performance.now() - t1) / ((samples.similar.length + samples.different.length) * 2);

  return { model, sim, dif, loadMs, embedMs,
           simAvg: avg(sim.map(x=>x.s)), difAvg: avg(dif.map(x=>x.s)) };
}

function render(results){
  results.sort((a,b) => (b.simAvg-b.difAvg) - (a.simAvg-a.difAvg));
  const fmt = n => n.toFixed(4);
  $('#results').innerHTML = `
    <div class="card">
      <h2>2. 채택 기준 비교 <span class="pill">마진 큰 순</span></h2>
      <table>
        <tr><th>모델</th><th>유사쌍 평균</th><th>상이쌍 평균</th><th>마진</th><th>초기화</th><th>문장당 임베딩</th></tr>
        ${results.map((r,i)=>`
          <tr class="${i===0?'best':''}">
            <td>${r.model.label}${i===0?' &nbsp;<span class="pill">채택 후보</span>':''}</td>
            <td class="num hi">${fmt(r.simAvg)}</td>
            <td class="num lo">${fmt(r.difAvg)}</td>
            <td class="num"><b>${fmt(r.simAvg-r.difAvg)}</b></td>
            <td class="num">${(r.loadMs/1000).toFixed(1)}s</td>
            <td class="num">${r.embedMs.toFixed(0)}ms</td>
          </tr>`).join('')}
      </table>
      <p class="mdesc" style="margin-top:12px">
        판정: 유사쌍 평균 &gt; 상이쌍 평균이며 마진이 넓을수록 우수.
        마진이 동률이면 초기화(모델 용량)가 짧은 쪽을 채택 — 계획서 3.4 기준.
      </p>
    </div>
    ${results.map(r=>`
      <div class="card">
        <h2>${r.model.label} · 쌍별 점수</h2>
        <table>
          <tr><th>구분</th><th>내용</th><th>코사인 유사도</th></tr>
          ${r.sim.map(x=>`<tr><td class="hi">유사쌍</td><td>${x.note}</td><td class="num">${fmt(x.s)}</td></tr>`).join('')}
          ${r.dif.map(x=>`<tr><td class="lo">상이쌍</td><td>${x.note}</td><td class="num">${fmt(x.s)}</td></tr>`).join('')}
        </table>
      </div>`).join('')}`;
}

$('#run').addEventListener('click', async () => {
  const keys = [...document.querySelectorAll('#models input:checked')].map(i=>i.value);
  if (!keys.length) { alert('모델을 하나 이상 선택하세요.'); return; }
  $('#run').disabled = true; $('#log').textContent = ''; $('#results').innerHTML = '';
  try {
    const samples = await (await fetch('./samples.json')).json();
    const results = [];
    for (const key of keys) results.push(await benchmark(MODELS.find(m=>m.key===key), samples));
    render(results);
    log('완료.');
  } catch(e){
    log('오류: ' + e.message);
    log('※ file:// 로 열면 fetch/모듈 로딩이 막힙니다. 프로젝트 폴더에서 로컬 서버로 여세요. 예) npx serve');
  } finally { $('#run').disabled = false; }
});
</script>
</body>
</html>
