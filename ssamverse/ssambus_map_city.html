<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>쌤버스 - 도시 맵</title>
<style>
*{box-sizing:border-box}
body{font-family:sans-serif;background:#1a1a2e;display:flex;flex-direction:column;align-items:center;padding:20px;margin:0}
#main-btn{position:fixed;top:12px;left:12px;z-index:999;background:#e94560;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);text-decoration:none}
#char-btn{position:fixed;top:12px;left:12px;z-index:999;background:#2980b9;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);text-decoration:none;display:none}
h2{margin:.3rem 0;color:#fff;font-size:1.1rem}
.info{font-size:12px;color:#aaa;margin-bottom:12px;text-align:center}
.stage-wrap{width:768px;max-width:100%;height:672px;overflow:hidden;border:3px solid #e94560;border-radius:8px;box-shadow:0 0 24px rgba(233,69,96,0.4)}
.stage{position:relative;line-height:0}
#map{display:block}
#player{position:absolute;width:48px;height:72px;pointer-events:none;transition:left .1s linear,top .1s linear;z-index:5}
#player svg{display:block;width:100%;height:100%;overflow:visible}
#player.flip svg{transform:scaleX(-1)}
.remote-player{position:absolute;width:48px;height:72px;pointer-events:none;transition:left .15s linear,top .15s linear;z-index:4}
.remote-player svg{display:block;width:100%;height:100%;overflow:visible}
.remote-player.flip svg{transform:scaleX(-1)}
.remote-player .nick{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;background:rgba(255,255,255,.9);padding:1px 5px;border-radius:4px;white-space:nowrap;font-weight:600}
.pad{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px 52px;gap:4px;margin-top:14px}
.pad button{font-size:20px;border-radius:10px;border:none;background:#e94560;color:#fff;cursor:pointer;font-weight:700;box-shadow:0 3px 0 #a0001a}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 0 #a0001a}
.legend{margin-top:10px;font-size:12px;color:#aaa;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.legend span{display:flex;align-items:center;gap:4px}
.sw{display:inline-block;width:13px;height:13px;border-radius:3px}
</style>
</head>
<body>
<a id="main-btn" href="index.html">메인</a>
<a id="char-btn" href="#">캐릭터 변경</a>
<h2>쌤버스 - 도시</h2>
<div class="info">방향키 또는 버튼으로 이동하세요</div>
<div class="stage-wrap">
<div class="stage">
  <canvas id="map" width="2304" height="1152"></canvas>
  <div id="player"><svg viewBox="0 0 60 76"><g id="cg_p"></g></svg></div>
  <div id="remote-players"></div>
</div>
</div>
<div class="pad">
  <div></div><button onclick="move('up')">&#8593;</button><div></div>
  <button onclick="move('left')">&#8592;</button><div></div><button onclick="move('right')">&#8594;</button>
  <div></div><button onclick="move('down')">&#8595;</button><div></div>
</div>
<div class="legend">
  <span><span class="sw" style="background:#3a7bd5"></span>건물</span>
  <span><span class="sw" style="background:#f0e6cc"></span>인도</span>
  <span><span class="sw" style="background:#2d2d2d"></span>도로</span>
  <span><span class="sw" style="background:#00d2ff"></span>분수</span>
  <span><span class="sw" style="background:#27ae60"></span>공원</span>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="ssambus_supabase_config.js"></script>
<script src="ssambus_character_render.js"></script>
<script src="ssambus_realtime.js"></script>
<script src="ssambus_missions.js"></script>
<script>
/* === City map 48x24 (1152 tiles ~3x original) === */
var TS=48, COLS=48, ROWS=24, VIEW_W=768, VIEW_H=672;

var TEACHER_VIEW=new URLSearchParams(window.location.search).get('teacherView')==='1';
if(TEACHER_VIEW){
  document.body.style.padding='0';
  document.body.style.background='#fff';
  document.body.style.overflow='hidden';
  document.querySelectorAll('h2,.info,.pad,.legend').forEach(function(el){el.style.display='none';});
  var sw=document.querySelector('.stage-wrap');
  if(sw){
    sw.style.width=(COLS*TS)+'px';
    sw.style.height=(ROWS*TS)+'px';
    sw.style.overflow='visible';
    sw.style.border='none';
    sw.style.borderRadius='0';
    sw.style.boxShadow='none';
  }
}
(function(){
  var _s=window.location.search;
  var _rm=(_s.match(/[?&]room=([^&]+)/)||[])[1];
  if(_rm&&!TEACHER_VIEW){
    var _mb=document.getElementById('main-btn');
    var _cb=document.getElementById('char-btn');
    if(_mb)_mb.style.display='none';
    if(_cb){
      _cb.style.cssText='position:fixed;top:12px;left:12px;z-index:999;background:#2980b9;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);text-decoration:none;display:inline';
      var _nk=((_s.match(/[?&]nickname=([^&]*)/)||[])[1])||'';
      try{_nk=_nk||sessionStorage.getItem('ssambus_nickname')||'';}catch(e){}
      var _mf=window.location.pathname.split('/').pop()||'ssambus_map_city.html';
      _cb.href='ssambus_characters.html?room='+_rm+'&map='+_mf+(_nk?'&nickname='+_nk:'');
    }
  }
})();

/* Tile: 0=sidewalk 1=building 2=road 3=intersection 9=park/tree */
/* Main roads: vcols 13-17,30-34; hrows 8-9,13-14; park rows 10-12 */
/* Cross roads: vcols 6-7,23-24,40-41 & hrows 4,19 within building blocks */
var grid=[];
for(var r=0;r<ROWS;r++){
  grid[r]=[];
  for(var c=0;c<COLS;c++){
    var vrd=(c>=13&&c<=17)||(c>=30&&c<=34);
    var hrd=(r===8||r===9||r===13||r===14);
    var park=(r>=10&&r<=12);
    var edge=(c===0||c===COLS-1||r===0||r===ROWS-1);
    var inBlock=(r>=1&&r<=7)||(r>=15&&r<=22);
    var crossV=inBlock&&((c===6||c===7)||(c===23||c===24)||(c===40||c===41));
    var blockCols=(c>=1&&c<=12)||(c>=18&&c<=29)||(c>=35&&c<=46);
    var crossH=blockCols&&(r===4||r===19);
    var isV=vrd||crossV, isH=hrd||crossH;
    if(edge) grid[r][c]=0;
    else if(isV&&isH) grid[r][c]=3;
    else if(isV||isH) grid[r][c]=2;
    else if(park) grid[r][c]=0;
    else if(inBlock) grid[r][c]=1;
    else grid[r][c]=0;
  }
}
/* Fountains */
[[10,5],[10,6],[11,5],[11,6],[12,5],[12,6],
 [10,23],[10,24],[11,23],[11,24],[12,23],[12,24],
 [10,41],[10,42],[11,41],[11,42],[12,41],[12,42]
].forEach(function(a){grid[a[0]][a[1]]=9;});
/* Perimeter trees */
[3,8,11,20,27,35,43].forEach(function(c){grid[0][c]=9;grid[23][c]=9;});
/* Exit gates where vertical roads meet top/bottom border */
grid[0][15]=5; grid[0][32]=5;
grid[23][15]=5; grid[23][32]=5;

var WALK=[0,2,3,5];
function isWalk(t){return WALK.indexOf(t)>=0;}

/* === Drawing === */
var cv=document.getElementById('map');
var ctx=cv.getContext('2d');

var __savedChar=(function(){
  try{
    var _cp=new URLSearchParams(window.location.search).get('c');
    if(_cp) return JSON.parse(_cp);
    return JSON.parse(localStorage.getItem('ssambus_player_character'));
  }catch(e){return null;}
})();
var PLAYER=Object.assign({
  type:'student',skin:'#FDEBD0',hcolor:'#1a1008',hair:'short',
  ccolor:'#1a3a6b',cloth:'suit',gender:'male',acc:[],dir:'down'
},__savedChar||{});
function renderPlayer(){
  document.getElementById('cg_p').innerHTML=renderCharacterSVG(PLAYER);
  document.getElementById('player').classList.toggle('flip',PLAYER.dir==='left'&&!PLAYER._facingRight);
}

/* Sidewalk: warm beige paving stones */
function drawSidewalk(x,y){
  ctx.fillStyle='#f0e6cc';
  ctx.fillRect(x,y,TS,TS);
  /* paving grid */
  ctx.strokeStyle='rgba(180,155,110,0.45)';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(x+TS/2,y); ctx.lineTo(x+TS/2,y+TS);
  ctx.moveTo(x,y+TS/2); ctx.lineTo(x+TS,y+TS/2);
  ctx.stroke();
  /* subtle shadow on each stone */
  ctx.fillStyle='rgba(0,0,0,0.04)';
  ctx.fillRect(x+1,y+1,TS/2-2,TS/2-2);
  ctx.fillRect(x+TS/2+1,y+TS/2+1,TS/2-2,TS/2-2);
}

/* Building: vivid colored with windows */
var BCOLORS=[
  ['#3a7bd5','#2255a0'],['#e94560','#b02040'],
  ['#f7971e','#c06000'],['#11998e','#0a6e65'],
  ['#8e44ad','#6c2f85'],['#2ecc71','#1a8c4b']
];
function drawBuilding(x,y,c,r){
  var idx=(c*3+r*7)%BCOLORS.length;
  var base=BCOLORS[idx][0], dark=BCOLORS[idx][1];
  /* main face */
  ctx.fillStyle=base;
  ctx.fillRect(x,y,TS,TS);
  /* top edge highlight */
  ctx.fillStyle='rgba(255,255,255,0.22)';
  ctx.fillRect(x,y,TS,4);
  /* right shadow */
  ctx.fillStyle='rgba(0,0,0,0.18)';
  ctx.fillRect(x+TS-4,y,4,TS);
  /* bottom shadow */
  ctx.fillStyle='rgba(0,0,0,0.18)';
  ctx.fillRect(x,y+TS-4,TS,4);
  /* windows */
  ctx.fillStyle='rgba(255,255,240,0.82)';
  for(var wy=7;wy<TS-10;wy+=13){
    for(var wx=6;wx<TS-8;wx+=13){
      /* window frame */
      ctx.fillStyle=dark;
      ctx.fillRect(x+wx-1,y+wy-1,10,9);
      /* glass */
      ctx.fillStyle='rgba(200,235,255,0.85)';
      ctx.fillRect(x+wx,y+wy,8,7);
      /* window cross */
      ctx.fillStyle='rgba(255,255,255,0.4)';
      ctx.fillRect(x+wx+3,y+wy,1,7);
      ctx.fillRect(x+wx,y+wy+3,8,1);
    }
  }
}

/* Road: dark asphalt with lane markings */
function drawRoad(x,y,isV){
  ctx.fillStyle='#2d2d2d';
  ctx.fillRect(x,y,TS,TS);
  /* subtle texture */
  ctx.fillStyle='rgba(255,255,255,0.03)';
  for(var i=0;i<TS;i+=6) ctx.fillRect(x+i,y,3,TS);
  /* center dashes */
  ctx.strokeStyle='#f9ca24';
  ctx.lineWidth=1.5;
  ctx.setLineDash([6,6]);
  ctx.beginPath();
  ctx.moveTo(x+TS/2,y); ctx.lineTo(x+TS/2,y+TS);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x,y+TS/2); ctx.lineTo(x+TS,y+TS/2);
  ctx.stroke();
  ctx.setLineDash([]);
  /* edge lines */
  ctx.strokeStyle='rgba(255,255,255,0.15)';
  ctx.lineWidth=1;
  ctx.strokeRect(x,y,TS,TS);
}

/* Intersection: crosswalk pattern */
function drawIntersection(x,y){
  ctx.fillStyle='#222222';
  ctx.fillRect(x,y,TS,TS);
  /* white crosswalk stripes */
  ctx.fillStyle='rgba(255,255,255,0.7)';
  for(var s=3;s<TS-3;s+=8){
    ctx.fillRect(x+s,y+2,5,TS-4);
  }
  /* yellow center dot */
  ctx.fillStyle='#f9ca24';
  ctx.beginPath();
  ctx.arc(x+TS/2,y+TS/2,4,0,Math.PI*2);
  ctx.fill();
}

/* Fountain: vivid cyan water */
function drawFountain(x,y){
  /* base plaza */
  ctx.fillStyle='#e8f8ff';
  ctx.fillRect(x,y,TS,TS);
  /* outer ring */
  ctx.fillStyle='rgba(0,210,255,0.2)';
  ctx.beginPath();
  ctx.arc(x+TS/2,y+TS/2,20,0,Math.PI*2);
  ctx.fill();
  /* water */
  ctx.fillStyle='#00d2ff';
  ctx.beginPath();
  ctx.arc(x+TS/2,y+TS/2,14,0,Math.PI*2);
  ctx.fill();
  /* water shimmer */
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.beginPath();
  ctx.arc(x+TS/2-3,y+TS/2-3,6,0,Math.PI*2);
  ctx.fill();
  /* spray */
  ctx.strokeStyle='rgba(255,255,255,0.8)';
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(x+TS/2,y+TS/2);
  ctx.lineTo(x+TS/2,y+TS/2-10);
  ctx.stroke();
  /* rim */
  ctx.strokeStyle='#0099bb';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(x+TS/2,y+TS/2,16,0,Math.PI*2);
  ctx.stroke();
}

/* Tree: bright green foliage */
function drawTree(x,y){
  /* ground */
  ctx.fillStyle='#f0e6cc';
  ctx.fillRect(x,y,TS,TS);
  /* trunk */
  ctx.fillStyle='#8B5E3C';
  ctx.fillRect(x+TS/2-3,y+TS*0.55,6,TS*0.35);
  /* shadow ellipse */
  ctx.fillStyle='rgba(0,0,0,0.1)';
  ctx.beginPath();
  ctx.ellipse(x+TS/2,y+TS*0.9,12,5,0,0,Math.PI*2);
  ctx.fill();
  /* foliage layers */
  ctx.fillStyle='#27ae60';
  ctx.beginPath();
  ctx.arc(x+TS/2,y+TS*0.38,14,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#2ecc71';
  ctx.beginPath();
  ctx.arc(x+TS/2-5,y+TS*0.32,10,0,Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x+TS/2+5,y+TS*0.30,9,0,Math.PI*2);
  ctx.fill();
  /* highlight */
  ctx.fillStyle='rgba(255,255,255,0.2)';
  ctx.beginPath();
  ctx.arc(x+TS/2-3,y+TS*0.28,5,0,Math.PI*2);
  ctx.fill();
}

/* Exit gate: vivid green arch on sidewalk */
function drawExitGate(x,y){
  drawSidewalk(x,y);
  ctx.fillStyle='#27ae60';
  ctx.fillRect(x+3,y+2,8,TS-4);
  ctx.fillRect(x+TS-11,y+2,8,TS-4);
  ctx.fillStyle='#2ecc71';
  ctx.fillRect(x+3,y+2,TS-6,10);
  ctx.fillStyle='#ffffff';
  ctx.font='bold 9px sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('EXIT',x+TS/2,y+TS*0.42);
  ctx.strokeStyle='#f1c40f';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(x+TS*0.25,y+TS*0.68);
  ctx.lineTo(x+TS*0.75,y+TS*0.68);
  ctx.moveTo(x+TS*0.6,y+TS*0.58);
  ctx.lineTo(x+TS*0.75,y+TS*0.68);
  ctx.lineTo(x+TS*0.6,y+TS*0.78);
  ctx.stroke();
}

function drawMap(){
  for(var r=0;r<ROWS;r++){
    for(var c=0;c<COLS;c++){
      var x=c*TS,y=r*TS,t=grid[r][c];
      if(t===1) drawBuilding(x,y,c,r);
      else if(t===2) drawRoad(x,y);
      else if(t===3) drawIntersection(x,y);
      else if(t===5) drawExitGate(x,y);
      else if(t===9){
        if(r===0||r===ROWS-1) drawTree(x,y);
        else drawFountain(x,y);
      }
      else drawSidewalk(x,y);
    }
  }
}
drawMap();

/* === Camera === */
function updateCamera(){
  var stage=document.querySelector('.stage');
  if(TEACHER_VIEW){ stage.style.transform='translate(0,0)'; return; }
  var offX=Math.max(0,Math.min(pos.c*TS-VIEW_W/2+TS/2,COLS*TS-VIEW_W));
  var offY=Math.max(0,Math.min(pos.r*TS-VIEW_H/2+TS/2,ROWS*TS-VIEW_H));
  stage.style.transform='translate(-'+offX+'px,-'+offY+'px)';
}

/* === Player === */
var pos={r:8,c:24};

function placePlayer(){
  var el=document.getElementById('player');
  if(TEACHER_VIEW) el.style.display='none';
  el.style.left=(pos.c*TS)+'px';
  el.style.top=(pos.r*TS-24)+'px';
  updateCamera();
  try{broadcastMyPosition();}catch(e){}
  try{checkZoneOnMove(pos);}catch(e){}
}

function move(dir){
  var nr=pos.r,nc=pos.c;
  if(dir==='up') nr--;
  else if(dir==='down') nr++;
  else if(dir==='left') nc--;
  else if(dir==='right') nc++;
  PLAYER._facingRight=(dir==='right');
  PLAYER.dir=(dir==='right')?'left':dir;
  renderPlayer();
  if(nr<0||nr>=ROWS||nc<0||nc>=COLS) return;
  if(!isWalk(grid[nr][nc])) return;
  try{if(__rtIsOverlayBlocked(nr,nc)) return;}catch(e){}
  try{if(__rtIsTileOccupied(nr,nc)) return;}catch(e){}
  try{if(typeof __msBlockExit==='function'&&__msBlockExit(nr,nc)){__msShowBlockedNotice();return;}}catch(e){}
  pos.r=nr; pos.c=nc;
  placePlayer();
}

window.addEventListener('keydown',function(e){
  if(TEACHER_VIEW) return;
  var m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
  if(m[e.key]){e.preventDefault();move(m[e.key]);}
});

/* Touch */
if(!TEACHER_VIEW){
  var sw=document.querySelector('.stage-wrap');
  var tx=0,ty=0,ta=false;
  sw.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;ta=true;tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
  sw.addEventListener('touchmove',function(e){if(ta)e.preventDefault();},{passive:false});
  sw.addEventListener('touchend',function(e){
    if(!ta)return;ta=false;
    var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
    if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;
    if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');
    else move(dy>0?'down':'up');
  },{passive:true});
}

/* Init */
renderPlayer();
try{placePlayer();}catch(e){console.warn('[city] placePlayer:',e);}
try{initRealtime('city');}catch(e){console.warn('[city] realtime:',e);}
if(!TEACHER_VIEW){
  try{initMissionSystem('city');}catch(e){console.warn('[city] missions:',e);}
}
try{loadMapOverlays('city',ctx,TS);}catch(e){console.warn('[city] overlays:',e);}
</script>
</body>
</html>
