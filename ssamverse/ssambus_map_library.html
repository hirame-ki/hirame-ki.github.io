<!DOCTYPE html>

<style>
*{box-sizing:border-box}
body{font-family:sans-serif;background:#1a0d00;display:flex;flex-direction:column;align-items:center;padding:20px;margin:0}
#main-btn{position:fixed;top:12px;left:12px;z-index:999;background:#8e44ad;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);text-decoration:none}
#char-btn{position:fixed;top:12px;left:12px;z-index:999;background:#2980b9;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);text-decoration:none;display:none}
h2{margin:.3rem 0;color:#fff;font-size:1.1rem}
.info{font-size:12px;color:#c9a87a;margin-bottom:12px;text-align:center}
.stage-wrap{width:768px;max-width:100%;height:672px;overflow:hidden;border:3px solid #8e44ad;border-radius:8px;box-shadow:0 0 24px rgba(142,68,173,0.4)}
.stage{position:relative;line-height:0}
#map{display:block}
#player{position:absolute;width:48px;height:72px;pointer-events:none;transition:left .1s linear,top .1s linear;z-index:5}
#player svg{display:block;width:100%;height:100%;overflow:visible}
#player.flip svg{transform:scaleX(-1)}
.remote-player{position:absolute;width:48px;height:72px;pointer-events:none;transition:left .15s linear,top .15s linear;z-index:4}
.remote-player svg{display:block;width:100%;height:100%;overflow:visible}
.remote-player.flip svg{transform:scaleX(-1)}
.remote-player .nick{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;background:rgba(255,255,255,.9);padding:1px 5px;border-radius:4px;white-space:nowrap;font-weight:600}
.pad{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px 52px;gap:4px;margin-top:14px}
.pad button{font-size:20px;border-radius:10px;border:none;background:#8e44ad;color:#fff;cursor:pointer;font-weight:700;box-shadow:0 3px 0 #5c2070}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 0 #5c2070}
.legend{margin-top:10px;font-size:12px;color:#c9a87a;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.legend span{display:flex;align-items:center;gap:4px}
.sw{display:inline-block;width:13px;height:13px;border-radius:3px}

/* --- fullscreen + classroom design overrides --- */
html{height:100%}
body{height:100%;align-items:stretch;padding:0;overflow:hidden;font-family:'Noto Sans KR',sans-serif;background:linear-gradient(to bottom,#0A1628,#0E1E34)}
#main-btn{background:rgba(26,53,88,.85);border-radius:10px;padding:8px 16px;font-size:13px;font-weight:600;box-shadow:0 2px 12px rgba(0,0,0,.4);backdrop-filter:blur(8px);font-family:'Noto Sans KR',sans-serif;transition:all .15s;display:flex;align-items:center;gap:6px}
#main-btn:hover{background:rgba(17,36,64,.9)}
#char-btn{background:rgba(52,112,212,.85);border-radius:10px;padding:8px 16px;font-size:13px;font-weight:600;box-shadow:0 2px 12px rgba(0,0,0,.4);backdrop-filter:blur(8px);font-family:'Noto Sans KR',sans-serif;transition:all .15s}
#char-btn:hover{background:rgba(41,90,172,.9)}
h2{text-align:center;padding-top:18px;color:rgba(255,255,255,.85);font-size:.95rem;font-weight:600;letter-spacing:-.01em}

.stage-wrap{flex:1;min-height:0;width:100%}
.legend{justify-content:center;padding-bottom:10px;font-size:11.5px;color:rgba(255,255,255,.45)}
</style>

<body>
<a id="main-btn" href="index.html">메인</a>
<a id="char-btn" href="#">캐릭터 변경</a>
<h2>쌤버스 - 도서관</h2>
<div class="info">방향키 · 화면 스와이프로 이동</div>
<div class="stage-wrap">
<div class="stage">
  <canvas id="map" width="1248" height="1728"></canvas>
  <div id="player"><svg viewBox="0 0 60 76"><g id="cg_p"></g></svg></div>
  <div id="remote-players"></div>
</div>
</div>

<div class="legend">
  <span><span class="sw" style="background:#c8a87a"></span>바닥</span>
  <span><span class="sw" style="background:#7a4520"></span>책장</span>
  <span><span class="sw" style="background:#d4a853"></span>열람테이블</span>
  <span><span class="sw" style="background:#27ae60"></span>식물</span>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="ssambus_supabase_config.js"></script>

<script>
/* === Library map 26x36 (936 tiles ~3x original 15x21=315) === */
var TS=48,COLS=26,ROWS=36,VIEW_W=768,VIEW_H=672;

var TEACHER_VIEW=new URLSearchParams(window.location.search).get('teacherView')==='1';
if(TEACHER_VIEW){
  document.body.style.padding='0';
  document.body.style.background='#fff';
  document.body.style.overflow='hidden';
  document.querySelectorAll('h2,.info,.pad,.legend').forEach(function(el){el.style.display='none';});
  var sw=document.querySelector('.stage-wrap');
  if(sw){
    sw.style.width=(COLS*TS)+'px';
    sw.style.height=(ROWS*TS)+'px';
    sw.style.overflow='visible';
    sw.style.border='none';
    sw.style.borderRadius='0';
    sw.style.boxShadow='none';
  }
}
(function(){
  var _s=window.location.search;
  var _rm=(_s.match(/[?&]room=([^&]+)/)||[])[1];
  if(_rm&&!TEACHER_VIEW){
    var _mb=document.getElementById('main-btn');
    var _cb=document.getElementById('char-btn');
    if(_mb)_mb.style.display='none';
    if(_cb){
      _cb.style.cssText='position:fixed;top:12px;left:12px;z-index:999;background:#2980b9;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);text-decoration:none;display:inline';
      var _nk=((_s.match(/[?&]nickname=([^&]*)/)||[])[1])||'';
      try{_nk=_nk||sessionStorage.getItem('ssambus_nickname')||'';}catch(e){}
      var _mf=window.location.pathname.split('/').pop()||'ssambus_map_library.html';
      _cb.href='ssambus_characters.html?room='+_rm+'&map='+_mf+(_nk?'&nickname='+_nk:'');
    }
  }
})();

/* Tile: 0=floor 1=wall 5=door 9=bookshelf 10=reading-table 11=plant */
/* Layout:
   Perimeter: wall (1)
   Top row (0): wall with windows + entrance doors at cols 11-14
   Bookshelves: rows 2-3, 6-7, 10-11, 14-15, 18-19, 22-23, 26-27
                at cols 2-5, 8-11, 14-17, 20-23
   Aisle between shelves: rows 4-5, 8-9, 12-13, 16-17, 20-21, 24-25
   Reading tables: rows 29-34, cols 4-21 (reading room)
   Plants in corners */
var grid=[];
for(var r=0;r<ROWS;r++){
  grid[r]=[];
  for(var c=0;c<COLS;c++){
    var wall=(r===0||r===ROWS-1||c===0||c===COLS-1);
    /* entrance doors */
    var door=(r===0&&(c>=11&&c<=14));
    if(door){grid[r][c]=5;continue;}
    if(wall){grid[r][c]=1;continue;}
    /* bookshelf rows: pairs at rows 2-3, 6-7, 10-11, 14-15, 18-19, 22-23, 26-27 */
    var shelfRowStart=[2,6,10,14,18,22,26];
    var inShelfRow=false;
    for(var i=0;i<shelfRowStart.length;i++){
      if(r===shelfRowStart[i]||r===shelfRowStart[i]+1){inShelfRow=true;break;}
    }
    /* bookshelf columns: cols 2-4, 7-9, 12-14, 17-19, 22-23 */
    var shelfColGroups=[[2,4],[7,9],[12,14],[17,19],[22,23]];
    var inShelfCol=false;
    for(var j=0;j<shelfColGroups.length;j++){
      if(c>=shelfColGroups[j][0]&&c<=shelfColGroups[j][1]){inShelfCol=true;break;}
    }
    /* reading room: rows 29-34 */
    var readRoom=(r>=29&&r<=34&&c>=3&&c<=22);
    /* reception desk: rows 2-3, cols 11-14 */
    var desk=(r>=2&&r<=3&&c>=11&&c<=14);
    /* plants in corners */
    var plant=(r===2&&(c===2||c===COLS-2)); /* bottom plants removed - blocked path */
    if(plant){grid[r][c]=11;continue;}
    if(desk){grid[r][c]=10;continue;}
    if(inShelfRow&&inShelfCol&&r<=27){grid[r][c]=9;continue;}
    if(readRoom&&(r%2===1)){grid[r][c]=10;continue;}
    grid[r][c]=0;
  }
}

var WALK=[0,5];
function isWalk(t){return WALK.indexOf(t)>=0;}

var cv=document.getElementById('map');
var ctx=cv.getContext('2d');

var __savedChar=(function(){
  try{
    var _cp=new URLSearchParams(window.location.search).get('c');
    if(_cp) return JSON.parse(_cp);
    return JSON.parse(localStorage.getItem('ssambus_player_character'));
  }catch(e){return null;}
})();
var PLAYER=Object.assign({
  type:'student',skin:'#FDEBD0',hcolor:'#1a1008',hair:'short',
  ccolor:'#1a3a6b',cloth:'suit',gender:'male',acc:[],dir:'down'
},__savedChar||{});
function renderPlayer(){
  document.getElementById('cg_p').innerHTML=renderCharacterSVG(PLAYER);
  document.getElementById('player').classList.toggle('flip',PLAYER.dir==='left'&&!PLAYER._facingRight);
}

/* Floor: warm wood parquet */
function drawFloor(x,y,c,r){
  var light=(((c+r)%2===0))?'#d4b896':'#c8a87a';
  ctx.fillStyle=light;
  ctx.fillRect(x,y,TS,TS);
  /* parquet pattern */
  ctx.strokeStyle='rgba(100,60,20,0.2)';
  ctx.lineWidth=1;
  if((r+c)%4<2){
    for(var i=1;i<4;i++){
      ctx.beginPath();
      ctx.moveTo(x+i*12,y); ctx.lineTo(x+i*12,y+TS);
      ctx.stroke();
    }
  } else {
    for(var i=1;i<4;i++){
      ctx.beginPath();
      ctx.moveTo(x,y+i*12); ctx.lineTo(x+TS,y+i*12);
      ctx.stroke();
    }
  }
}

/* Wall */
function drawWall(x,y){
  ctx.fillStyle='#4a3020';
  ctx.fillRect(x,y,TS,TS);
  ctx.fillStyle='rgba(255,255,255,0.06)';
  ctx.fillRect(x,y,TS,4);
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.fillRect(x,y+TS-4,TS,4);
  /* wallpaper pattern */
  ctx.strokeStyle='rgba(255,220,160,0.12)';
  ctx.lineWidth=1;
  ctx.strokeRect(x+3,y+3,TS-6,TS-6);
}

/* Door */
function drawDoor(x,y){
  ctx.shadowColor='rgba(0,0,0,0.45)';ctx.shadowBlur=0;ctx.shadowOffsetX=5;ctx.shadowOffsetY=5;
  /* vivid EXIT gate */
  ctx.fillStyle='#e67e22';
  ctx.fillRect(x,y,TS,TS);
  ctx.fillStyle='#27ae60';
  ctx.fillRect(x+4,y+3,TS-8,TS-6);
  /* glass top */
  ctx.fillStyle='rgba(150,230,255,0.5)';
  ctx.fillRect(x+6,y+5,TS-12,TS*0.3);
  /* EXIT label */
  ctx.fillStyle='#ffffff';
  ctx.font='bold 9px sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('EXIT',x+TS/2,y+TS*0.6);
  /* handle */
  ctx.fillStyle='#f1c40f';
  ctx.beginPath();
  ctx.arc(x+TS-9,y+TS*0.55,3.5,0,Math.PI*2);
  ctx.fill();
  /* frame glow */
  ctx.strokeStyle='#f1c40f';
  ctx.lineWidth=2;
  ctx.strokeRect(x+4,y+3,TS-8,TS-6);
  ctx.shadowColor='transparent';
}

/* Bookshelf: colorful books */
var BOOK_COLORS=['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22'];
function drawBookshelf(x,y,c,r){
  ctx.shadowColor='rgba(0,0,0,0.45)';ctx.shadowBlur=0;ctx.shadowOffsetX=5;ctx.shadowOffsetY=5;
  /* shelf back */
  ctx.fillStyle='#7a4520';
  ctx.fillRect(x,y,TS,TS);
  /* shelf boards */
  ctx.fillStyle='#5c3010';
  ctx.fillRect(x,y+TS/2-2,TS,4);
  ctx.fillRect(x,y,TS,3);
  ctx.fillRect(x,y+TS-3,TS,3);
  /* books on shelf */
  var bw=6, gap=1, startX=x+2;
  for(var i=0;i<7;i++){
    var bx=startX+i*(bw+gap);
    if(bx+bw>x+TS-2) break;
    /* top shelf */
    ctx.fillStyle=BOOK_COLORS[(c+r+i)%7];
    var bh=14+((c+r+i)%5)*2;
    ctx.fillRect(bx,y+4,bw,bh);
    /* spine highlight */
    ctx.fillStyle='rgba(255,255,255,0.25)';
    ctx.fillRect(bx,y+4,2,bh);
    /* bottom shelf */
    ctx.fillStyle=BOOK_COLORS[(c+r+i+3)%7];
    var bh2=12+((c+r+i*2)%5)*2;
    ctx.fillRect(bx,y+TS/2+2,bw,bh2);
    ctx.fillStyle='rgba(255,255,255,0.25)';
    ctx.fillRect(bx,y+TS/2+2,2,bh2);
  }
  ctx.shadowColor='transparent';
}

/* Reading table */
function drawTable(x,y){
  ctx.shadowColor='rgba(0,0,0,0.45)';ctx.shadowBlur=0;ctx.shadowOffsetX=5;ctx.shadowOffsetY=5;
  ctx.fillStyle='#d4a853';
  ctx.fillRect(x,y,TS,TS);
  /* table top surface */
  ctx.fillStyle='#e8c060';
  ctx.fillRect(x+2,y+2,TS-4,TS/2-2);
  /* book on table */
  ctx.fillStyle='#c0392b';
  ctx.fillRect(x+TS/2-8,y+6,16,10);
  ctx.fillStyle='#e74c3c';
  ctx.fillRect(x+TS/2-7,y+7,14,8);
  /* lamp */
  ctx.fillStyle='#7f8c8d';
  ctx.fillRect(x+TS-14,y+4,3,12);
  ctx.fillStyle='#f9ca24';
  ctx.beginPath();
  ctx.arc(x+TS-12,y+3,5,Math.PI,0);
  ctx.fill();
  ctx.shadowColor='transparent';
}

/* Plant */
function drawPlant(x,y){
  ctx.shadowColor='rgba(0,0,0,0.45)';ctx.shadowBlur=0;ctx.shadowOffsetX=5;ctx.shadowOffsetY=5;
  /* pot */
  ctx.fillStyle='#c0392b';
  ctx.fillRect(x+TS/2-8,y+TS*0.55,16,TS*0.35);
  ctx.fillStyle='#922b21';
  ctx.fillRect(x+TS/2-9,y+TS*0.53,18,5);
  /* soil */
  ctx.fillStyle='#5d4037';
  ctx.fillRect(x+TS/2-7,y+TS*0.57,14,6);
  /* leaves */
  ctx.fillStyle='#27ae60';
  ctx.beginPath();
  ctx.arc(x+TS/2,y+TS*0.35,15,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#2ecc71';
  ctx.beginPath();
  ctx.arc(x+TS/2-8,y+TS*0.28,10,0,Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x+TS/2+7,y+TS*0.30,9,0,Math.PI*2);
  ctx.fill();
  /* highlight */
  ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.beginPath();
  ctx.arc(x+TS/2-4,y+TS*0.23,5,0,Math.PI*2);
  ctx.fill();
  ctx.shadowColor='transparent';
}

function drawMap(){
  for(var r=0;r<ROWS;r++){
    for(var c=0;c<COLS;c++){
      var x=c*TS,y=r*TS,t=grid[r][c];
      if(t===1) drawWall(x,y);
      else if(t===5) drawDoor(x,y);
      else if(t===9) drawBookshelf(x,y,c,r);
      else if(t===10) drawTable(x,y);
      else if(t===11) drawPlant(x,y);
      else drawFloor(x,y,c,r);
    }
  }
  /* Reception counter */
  ctx.fillStyle='#8B4513';
  ctx.fillRect(11*TS+4,2*TS+4,3*TS-8,TS*2-8);
  ctx.fillStyle='#a0522d';
  ctx.fillRect(11*TS+6,2*TS+6,3*TS-12,TS-10);
  /* Chandelier / reading lamp decoration */
  for(var col=5;col<21;col+=5){
    ctx.fillStyle='rgba(255,220,100,0.15)';
    ctx.beginPath();
    ctx.arc(col*TS+TS/2,31*TS,30,0,Math.PI*2);
    ctx.fill();
  }
  /* 45-degree drop shadows */
  ctx.fillStyle='rgba(0,0,0,0.30)';
  for(var __r=0;__r<ROWS;__r++){for(var __c=0;__c<COLS;__c++){
    if(isWalk(grid[__r][__c])) continue;
    var __x=__c*TS,__y=__r*TS;
    if((__c+1<COLS)&&isWalk(grid[__r][__c+1])&&grid[__r][__c+1]!==5) ctx.fillRect(__x+TS,__y+5,6,TS);
    if((__r+1<ROWS)&&isWalk(grid[__r+1][__c])&&grid[__r+1][__c]!==5) ctx.fillRect(__x+5,__y+TS,TS,6);
  }}
}
drawMap();

function updateCamera(){var _sw=document.querySelector('.stage-wrap');var _vw=_sw.clientWidth||VIEW_W;var _vh=_sw.clientHeight||VIEW_H;
  var stage=document.querySelector('.stage');
  if(TEACHER_VIEW){ stage.style.transform='translate(0,0)'; return; }
  var offX=Math.max(0,Math.min(pos.c*TS-_vw/2+TS/2,COLS*TS-_vw));
  var offY=Math.max(0,Math.min(pos.r*TS-_vh/2+TS/2,ROWS*TS-_vh));
  stage.style.transform='translate(-'+offX+'px,-'+offY+'px)';
}

var pos={r:1,c:13};
function placePlayer(){
  var el=document.getElementById('player');
  if(TEACHER_VIEW) el.style.display='none';
  el.style.left=(pos.c*TS)+'px';
  el.style.top=(pos.r*TS-24)+'px';
  updateCamera();
  try{broadcastMyPosition();}catch(e){}
  try{checkZoneOnMove(pos);}catch(e){}
}
function move(dir){
  var nr=pos.r,nc=pos.c;
  if(dir==='up') nr--;
  else if(dir==='down') nr++;
  else if(dir==='left') nc--;
  else if(dir==='right') nc++;
  PLAYER._facingRight=(dir==='right');
  PLAYER.dir=(dir==='right')?'left':dir;
  renderPlayer();
  if(nr<0||nr>=ROWS||nc<0||nc>=COLS) return;
  if(!isWalk(grid[nr][nc])) return;
  try{if(__rtIsOverlayBlocked(nr,nc)) return;}catch(e){}
  try{if(__rtIsTileOccupied(nr,nc)) return;}catch(e){}
  try{if(typeof __msBlockExit==='function'&&__msBlockExit(nr,nc)){__msShowBlockedNotice();return;}}catch(e){}
  pos.r=nr; pos.c=nc;
  placePlayer();
}
window.addEventListener('keydown',function(e){
  if(TEACHER_VIEW) return;
  var m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
  if(m[e.key]){e.preventDefault();move(m[e.key]);}
});
if(!TEACHER_VIEW){
  var sw=document.querySelector('.stage-wrap');
  var tx=0,ty=0,ta=false;
  sw.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;ta=true;tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
  sw.addEventListener('touchmove',function(e){if(ta)e.preventDefault();},{passive:false});
  sw.addEventListener('touchend',function(e){
    if(!ta)return;ta=false;
    var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
    if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;
    if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');
    else move(dy>0?'down':'up');
  },{passive:true});
}
renderPlayer();
try{placePlayer();}catch(e){console.warn('[library] placePlayer:',e);}
try{initRealtime('library');}catch(e){console.warn('[library] realtime:',e);}
if(!TEACHER_VIEW){
  try{initMissionSystem('library');}catch(e){console.warn('[library] missions:',e);}
}
try{loadMapOverlays('library',ctx,TS);}catch(e){console.warn('[library] overlays:',e);}
window.addEventListener('resize',updateCamera);
</script>
