<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>쌤버스 3D - 과학실</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000;
    font-family:'Pretendard','Malgun Gothic',sans-serif; }
  #canvas-wrap { position:fixed; inset:0; }

  /* ── 크로스헤어 ─────────────────────── */
  #crosshair { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    width:8px; height:8px; border:2px solid rgba(255,255,255,.85); border-radius:50%;
    pointer-events:none; z-index:10; display:none; }

  /* ── 시작 오버레이 ───────────────────── */
  #start-overlay { position:fixed; inset:0; z-index:100;
    background:linear-gradient(160deg,#0b1d2a 0%,#12324a 60%,#0d2436 100%);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:20px; }
  #start-card { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15);
    border-radius:16px; padding:36px 44px; text-align:center; color:#eaf4fb;
    backdrop-filter:blur(6px); max-width:420px; width:90%; }
  #start-card h1 { font-size:26px; margin-bottom:6px; letter-spacing:1px; }
  #start-card h1 .flask { color:#7fd8c8; }
  #start-card p.sub { font-size:13px; color:#9fc3d8; margin-bottom:22px; }
  #start-card .keys { font-size:13px; line-height:2; color:#cfe6f2; text-align:left;
    background:rgba(0,0,0,.25); border-radius:10px; padding:14px 18px; margin-bottom:22px; }
  #start-card .keys b { color:#7fd8c8; display:inline-block; min-width:86px; }
  #start-btn { background:#1f8f7a; color:#fff; border:none; border-radius:10px;
    padding:13px 40px; font-size:16px; font-weight:700; cursor:pointer; letter-spacing:1px; }
  #start-btn:hover { background:#25a98f; }

  /* ── HUD ────────────────────────────── */
  #hud-top { position:fixed; top:12px; left:12px; z-index:20; color:#fff;
    background:rgba(10,25,35,.65); border:1px solid rgba(255,255,255,.15);
    border-radius:10px; padding:8px 14px; font-size:13px; display:none; }
  #hud-top .map-name { font-weight:700; color:#7fd8c8; }
  #mission-count { color:#ffd97a; font-weight:700; }

  #char-btn {
    position:fixed; top:12px; right:12px; z-index:20; display:none;
    background:rgba(41,128,185,.85); color:#fff; backdrop-filter:blur(6px);
    padding:8px 14px; border-radius:12px; font-size:13px; font-weight:700;
    border:1px solid rgba(255,255,255,.12); text-decoration:none;
    font-family:inherit;
  }

  /* ── 미션 프롬프트 ─────────────────── */
  #interact-hint { position:fixed; left:50%; bottom:18%; transform:translateX(-50%);
    z-index:20; background:rgba(10,25,35,.8); color:#fff; border:1px solid #7fd8c8;
    border-radius:10px; padding:10px 20px; font-size:14px; display:none; pointer-events:none;
    white-space:nowrap; }
  #interact-hint b { color:#7fd8c8; }

  /* ── 모바일 컨트롤 ───────────────────
     교실맵식 좌하단 고정 원형 조이스틱(항상 표시).
     bottom 오프셋은 하단 채팅바(#rt-chat-bar, 약 54px)에 가리지 않게 88px. */
  #joy-zone { position:fixed; left:24px; bottom:88px; width:120px; height:120px; z-index:30; display:none; touch-action:none; }
  #look-zone { position:fixed; right:0; bottom:0; width:55%; height:60%; z-index:30; display:none; }
  #joy-base {
    position:absolute; inset:0; border-radius:50%;
    border:2px solid rgba(255,255,255,.35); background:rgba(255,255,255,.08);
  }
  #joy-stick {
    position:absolute; width:48px; height:48px; border-radius:50%;
    background:rgba(127,216,200,.55); left:36px; top:36px;
    border:2px solid rgba(255,255,255,.5);
    box-shadow:0 4px 12px rgba(0,0,0,.3);
  }
  #action-btn { position:fixed; right:28px; bottom:112px; width:74px; height:74px;
    border-radius:50%; background:rgba(31,143,122,.75); border:2px solid rgba(255,255,255,.4);
    color:#fff; font-size:14px; font-weight:700; z-index:31; display:none;
    font-family:inherit; }
  #action-btn.pulse { animation:pulse 1s infinite; background:rgba(60,179,113,.9); }
  @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.1); } }
  body.touch #joy-zone, body.touch #look-zone, body.touch #action-btn { display:block; }

  /* ssambus_missions.js의 기본 진행률 배지는 숨기고 HUD(#mission-count)만 사용 */
  #ms-progress { display:none !important; }
</style>
</head>
<body>

<div id="canvas-wrap"></div>
<div id="crosshair"></div>

<!-- ssambus_realtime.js가 평소처럼 DOM에 쓰도록 두는 숨김 요소 (3D 어댑터가 매 프레임 읽어 미러링) -->
<div id="player" style="display:none"><svg viewBox="0 0 60 76"><g id="cg_p"></g></svg></div>
<div id="remote-players" style="display:none"></div>
<a id="char-btn" href="#">← 캐릭터 변경</a>

<div id="start-overlay">
  <div id="start-card">
    <h1><span class="flask">⚗</span> 쌤버스 3D · 과학실</h1>
    <p class="sub">1인칭 시점으로 과학실을 탐험하며 미션을 수행하세요</p>
    <div class="keys" id="keys-desc">
      <b>이동</b> W A S D / 방향키<br>
      <b>시점</b> 마우스 (클릭하여 시점 고정)<br>
      <b>달리기</b> Shift<br>
      <b>상호작용</b> E (미션 마커 근처에서)<br>
      <b>모바일</b> 좌측 레버 이동 · 우측 드래그 시점
    </div>
    <button id="start-btn">입장하기</button>
  </div>
</div>

<div id="hud-top">
  <span class="map-name">🧪 과학실</span> &nbsp;|&nbsp;
  미션 <span id="mission-count">0/0</span>
</div>
<div id="interact-hint"><b>[E]</b> <span id="hint-text">미션 수행하기</span></div>

<div id="joy-zone"><div id="joy-base"><div id="joy-stick"></div></div></div>
<div id="look-zone"></div>
<button id="action-btn">미션</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../ssambus_supabase_config.js"></script>
<script src="../ssambus_character_render.js"></script>
<script src="../ssambus_realtime.js"></script>
<script src="../ssambus_missions.js"></script>
<script src="ssambus_3d_adapter.js"></script>
<script>
/* ════════════════════════════════════════════════════════════════
   쌤버스 3D 과학실 맵
   - Three.js r128, 절차적 지오메트리만 사용 (라이선스 에셋 없음)
   - 방 크기: 26m × 18m (교실보다 큰 과학실, 30명 동시 이동 가능)
   - 쌤버스 공용 시스템 통합: 실시간 멀티(ssambus_realtime.js)
     + 미션(ssambus_missions.js, trigger_point) + 3D 어댑터
   ════════════════════════════════════════════════════════════════ */

// ── 기본 설정 ─────────────────────────────────────────────
const ROOM_W = 26;          // 가로(m)
const ROOM_D = 18;          // 세로(m)
const ROOM_H = 3.6;         // 천장 높이
const EYE_H  = 1.6;         // 시점 높이
const PLAYER_R = 0.35;      // 플레이어 충돌 반경

/* ── 쌤버스 통합: URL 파라미터 + 캐릭터 외형 + 위치(r/c=z/x, TS=1) ── */
var TEACHER_VIEW = new URLSearchParams(window.location.search).get('teacherView') === '1';
var TS = 1;
var __savedChar = (function(){
  try{
    var _cp = new URLSearchParams(window.location.search).get('c');
    if(_cp) return JSON.parse(_cp);
    return JSON.parse(localStorage.getItem('ssambus_player_character'));
  }catch(e){ return null; }
})();
var PLAYER = Object.assign({
  type:'student', skin:'#FDEBD0', hcolor:'#1a1008', hair:'short',
  ccolor:'#1a3a6b', cloth:'suit', gender:'male', acc:[], dir:'down'
}, __savedChar || {});
var pos = { r: 0, c: 0 }; // ssambus_3d_adapter.js가 매 프레임 camera 위치로 갱신

/* ── 캐릭터 변경 버튼 (2D 맵의 #char-btn과 동일 동작, teacherMode 유지) ── */
(function(){
  var params = new URLSearchParams(window.location.search);
  var room = params.get('room');
  if(!room || TEACHER_VIEW) return;
  var btn = document.getElementById('char-btn');
  if(!btn) return;
  var nickname = params.get('nickname') || '';
  try{ nickname = nickname || sessionStorage.getItem('ssambus_nickname') || ''; }catch(e){}
  var q = 'room=' + encodeURIComponent(room) + '&map=' + encodeURIComponent('ssamverse3d/ssamverse-science-lab-3d.html');
  if(nickname) q += '&nickname=' + encodeURIComponent(nickname);
  if(params.get('teacherMode') === '1') q += '&teacherMode=1'; // 애니 캐릭터 잠금 면제 유지
  btn.href = '../ssambus_characters.html?' + q;
  btn.style.display = 'inline-block';
})();

/* ── 터치 판정: OR 판정(미디어쿼리 단독은 일부 기기 오탐) ── */
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0
  || matchMedia('(hover: none) and (pointer: coarse)').matches;
if (isTouch) document.body.classList.add('touch');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfeef5);
scene.fog = new THREE.Fog(0xdfeef5, 30, 60);

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, EYE_H, ROOM_D/2 - 2.2);   // 뒷문 근처 스폰

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('canvas-wrap').appendChild(renderer.domElement);

// ── 조명 ─────────────────────────────────────────────────
scene.add(new THREE.HemisphereLight(0xfaffff, 0x8a9aa5, 0.75));
const sun = new THREE.DirectionalLight(0xfff4e0, 0.8);
sun.position.set(-8, 12, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -18; sun.shadow.camera.right = 18;
sun.shadow.camera.top = 14;  sun.shadow.camera.bottom = -14;
scene.add(sun);
// 천장 형광등 느낌의 포인트 라이트 2개 (성능 위해 그림자 없음)
[[ -6,0 ],[ 6,0 ]].forEach(([x,z])=>{
  const p = new THREE.PointLight(0xf2fbff, 0.35, 24);
  p.position.set(x, ROOM_H-0.3, z);
  scene.add(p);
});

// ── 충돌 박스 목록 ────────────────────────────────────────
const colliders = [];  // {minX,maxX,minZ,maxZ}
function addCollider(cx, cz, w, d, pad=0.05){
  colliders.push({ minX:cx-w/2-pad, maxX:cx+w/2+pad, minZ:cz-d/2-pad, maxZ:cz+d/2+pad });
}

// ── 캔버스 텍스처 유틸 ────────────────────────────────────
function canvasTexture(w, h, draw){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  return t;
}

// 바닥 타일 텍스처
const floorTex = canvasTexture(512, 512, (g)=>{
  g.fillStyle = '#cfd8dc'; g.fillRect(0,0,512,512);
  g.strokeStyle = '#aeb9bf'; g.lineWidth = 3;
  for(let i=0;i<=4;i++){
    g.beginPath(); g.moveTo(i*128,0); g.lineTo(i*128,512); g.stroke();
    g.beginPath(); g.moveTo(0,i*128); g.lineTo(512,i*128); g.stroke();
  }
  // 얼룩 느낌
  g.fillStyle = 'rgba(255,255,255,.25)';
  for(let i=0;i<40;i++) g.fillRect(Math.random()*512, Math.random()*512, 2, 2);
});
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
floorTex.repeat.set(ROOM_W/2, ROOM_D/2);

// 주기율표 포스터
const periodicTex = canvasTexture(512, 340, (g,w,h)=>{
  g.fillStyle='#ffffff'; g.fillRect(0,0,w,h);
  g.fillStyle='#123'; g.font='bold 26px sans-serif'; g.textAlign='center';
  g.fillText('주기율표  Periodic Table', w/2, 34);
  const colors=['#ef9a9a','#ffcc80','#fff59d','#a5d6a7','#90caf9','#ce93d8','#80cbc4'];
  const syms=['H','He','Li','Be','B','C','N','O','F','Ne','Na','Mg','Al','Si','P','S','Cl','Ar'];
  let idx=0;
  for(let r=0;r<3;r++) for(let c=0;c<6;c++){
    const x=30+c*76, y=56+r*84;
    g.fillStyle=colors[(r*6+c)%colors.length]; g.fillRect(x,y,66,74);
    g.strokeStyle='#456'; g.strokeRect(x,y,66,74);
    g.fillStyle='#123'; g.font='bold 24px sans-serif';
    g.fillText(syms[idx%syms.length], x+33, y+44); idx++;
    g.font='11px sans-serif'; g.fillText(String(idx), x+33, y+16);
  }
});

// 안전 수칙 포스터
const safetyTex = canvasTexture(360, 460, (g,w,h)=>{
  g.fillStyle='#fff8e1'; g.fillRect(0,0,w,h);
  g.fillStyle='#e65100'; g.fillRect(0,0,w,64);
  g.fillStyle='#fff'; g.font='bold 26px sans-serif'; g.textAlign='center';
  g.fillText('실험실 안전 수칙', w/2, 42);
  g.fillStyle='#3e2723'; g.font='17px sans-serif'; g.textAlign='left';
  ['1. 보안경과 실험복을 착용한다','2. 약품 냄새를 직접 맡지 않는다',
   '3. 실험 중 장난치지 않는다','4. 가열 기구 사용 시 주의한다',
   '5. 폐액은 지정된 통에 버린다','6. 실험 후 손을 깨끗이 씻는다']
   .forEach((s,i)=> g.fillText(s, 26, 110+i*54));
});

// 화이트보드
const boardTex = canvasTexture(640, 300, (g,w,h)=>{
  g.fillStyle='#f7fbfc'; g.fillRect(0,0,w,h);
  g.fillStyle='#1a6b8f'; g.font='bold 34px sans-serif';
  g.fillText('오늘의 실험', 30, 60);
  g.fillStyle='#333'; g.font='24px sans-serif';
  g.fillText('산과 염기의 중화 반응', 30, 112);
  g.fillStyle='#c0392b'; g.font='22px sans-serif';
  g.fillText('HCl + NaOH → NaCl + H₂O', 30, 160);
  g.strokeStyle='#1a6b8f'; g.lineWidth=3;
  g.strokeRect(400, 90, 200, 170);
  g.fillStyle='#1a6b8f'; g.font='18px sans-serif';
  g.fillText('지시약 색 변화 관찰', 410, 120);
});

// ── 재질 팔레트 ───────────────────────────────────────────
const MAT = {
  floor:  new THREE.MeshStandardMaterial({ map:floorTex, roughness:0.9 }),
  wall:   new THREE.MeshStandardMaterial({ color:0xe8f1ec, roughness:0.95 }),
  wain:   new THREE.MeshStandardMaterial({ color:0x9fb8ad, roughness:0.9 }),   // 벽 하단
  ceil:   new THREE.MeshStandardMaterial({ color:0xf4f7f8, roughness:1 }),
  top:    new THREE.MeshStandardMaterial({ color:0x22282c, roughness:0.35, metalness:0.1 }), // 실험대 상판(에폭시)
  cab:    new THREE.MeshStandardMaterial({ color:0xd7e3e8, roughness:0.8 }),   // 실험대 하부장
  wood:   new THREE.MeshStandardMaterial({ color:0x8d6e63, roughness:0.85 }),
  woodD:  new THREE.MeshStandardMaterial({ color:0x5d4037, roughness:0.85 }),
  glass:  new THREE.MeshPhongMaterial({ color:0xbfe3ea, transparent:true, opacity:0.28, shininess:90 }),
  liquidB:new THREE.MeshPhongMaterial({ color:0x42a5f5, transparent:true, opacity:0.75 }),
  liquidG:new THREE.MeshPhongMaterial({ color:0x66bb6a, transparent:true, opacity:0.75 }),
  liquidP:new THREE.MeshPhongMaterial({ color:0xec407a, transparent:true, opacity:0.75 }),
  liquidY:new THREE.MeshPhongMaterial({ color:0xffca28, transparent:true, opacity:0.75 }),
  metal:  new THREE.MeshStandardMaterial({ color:0x8e979e, roughness:0.35, metalness:0.7 }),
  metalD: new THREE.MeshStandardMaterial({ color:0x37474f, roughness:0.4, metalness:0.6 }),
  white:  new THREE.MeshStandardMaterial({ color:0xf5f5f5, roughness:0.7 }),
  stoolT: new THREE.MeshStandardMaterial({ color:0x37665a, roughness:0.7 }),
  sink:   new THREE.MeshStandardMaterial({ color:0xc7d2d8, roughness:0.3, metalness:0.5 }),
  hood:   new THREE.MeshStandardMaterial({ color:0xb0bec5, roughness:0.6, metalness:0.3 }),
};

function box(w,h,d,mat,x,y,z,shadow=true,parent=scene){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z);
  m.castShadow = shadow; m.receiveShadow = true;
  parent.add(m);
  return m;
}
function cyl(rt,rb,h,mat,x,y,z,parent=scene,seg=16){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
  m.position.set(x,y,z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}

// ── 방 구조 (바닥/벽/천장) ─────────────────────────────────
{
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_D), MAT.floor);
  floor.rotation.x = -Math.PI/2; floor.receiveShadow = true;
  scene.add(floor);

  // 천장은 단면(아래에서만 보임) — 교사 실시간 맵 보기(위에서 조감)가 가능
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_D), MAT.ceil);
  ceil.rotation.x = Math.PI/2; ceil.position.y = ROOM_H;
  scene.add(ceil);

  // 벽 4면 + 하단 걸레받이
  const wallDefs = [
    { w:ROOM_W, x:0, z:-ROOM_D/2, ry:0 },        // 앞(칠판)
    { w:ROOM_W, x:0, z: ROOM_D/2, ry:Math.PI },  // 뒤
    { w:ROOM_D, x:-ROOM_W/2, z:0, ry:Math.PI/2 },// 좌
    { w:ROOM_D, x: ROOM_W/2, z:0, ry:-Math.PI/2 } // 우
  ];
  wallDefs.forEach(def=>{
    const wall = new THREE.Mesh(new THREE.PlaneGeometry(def.w, ROOM_H), MAT.wall);
    wall.position.set(def.x, ROOM_H/2, def.z); wall.rotation.y = def.ry;
    wall.receiveShadow = true; scene.add(wall);
    const wain = new THREE.Mesh(new THREE.PlaneGeometry(def.w, 1.0), MAT.wain);
    wain.position.set(def.x, 0.5, def.z); wain.rotation.y = def.ry;
    wain.position.x += Math.sin(def.ry)*0.01; wain.position.z += Math.cos(def.ry)*0.01;
    scene.add(wain);
  });
  // 벽 충돌
  addCollider(0, -ROOM_D/2, ROOM_W, 0.4);
  addCollider(0,  ROOM_D/2, ROOM_W, 0.4);
  addCollider(-ROOM_W/2, 0, 0.4, ROOM_D);
  addCollider( ROOM_W/2, 0, 0.4, ROOM_D);

  // 천장 형광등(시각용)
  for(let x=-8; x<=8; x+=8) for(let z=-5; z<=5; z+=5){
    box(2.4, 0.08, 0.5, MAT.white, x, ROOM_H-0.05, z, false);
  }
  // 창문 (좌측 벽)
  const skyMat = new THREE.MeshBasicMaterial({ color:0xaee3f5 });
  for(let i=0;i<3;i++){
    const win = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 1.5), skyMat);
    win.position.set(-ROOM_W/2+0.03, 1.9, -5.5 + i*5.5);
    win.rotation.y = Math.PI/2; scene.add(win);
    const frame = box(0.06, 1.62, 3.34, MAT.white, -ROOM_W/2+0.02, 1.9, -5.5+i*5.5, false);
  }
  // 문 (뒤쪽 벽 양측) — 출구로 사용
  [-9, 9].forEach(x=>{

function makeBeaker(x, y, z, liquid, s=1){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.09*s, 0.085*s, 0.16*s, 14, 1, true), MAT.glass);
  body.position.y = 0.08*s; g.add(body);
  const bottom = new THREE.Mesh(new THREE.CircleGeometry(0.085*s, 14), MAT.glass);
  bottom.rotation.x = -Math.PI/2; bottom.position.y = 0.002; g.add(bottom);
  if(liquid){
    const liq = cyl(0.082*s, 0.078*s, 0.08*s, liquid, 0, 0.045*s, 0, g);
    liq.castShadow = false;
  }
  g.position.set(x,y,z); scene.add(g); return g;
}
function makeFlask(x, y, z, liquid, s=1){  // 삼각플라스크
  const g = new THREE.Group();

/* ════════════════════════════════════════════════════════════════
   미션 마커 — Supabase missions의 trigger_point로 동적 생성
   (교사가 대시보드 "3D 좌표 지정"으로 배치한 미션만 마커가 생김)
   ════════════════════════════════════════════════════════════════ */
function makeLabel(text) {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 128;
  const c = cv.getContext('2d');
  c.font = 'bold 56px "Malgun Gothic", sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = 'rgba(10,25,35,0.72)';
  const w = c.measureText(text).width + 60;
  c.beginPath(); c.roundRect((512-w)/2, 14, w, 100, 22); c.fill();
  c.fillStyle = '#fff';
  c.fillText(text, 256, 66);
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true}));
  sp.scale.set(5, 1.25, 1);
  return sp;
}

const missionMarkers = {}; // id -> {data, group, ring, beam, orb}
let missionMarkersBuilt = false;
function buildMissionMarkers(){
  if (missionMarkersBuilt) return;
  if (typeof __msMissions === 'undefined' || __msMissions === null) return;
  missionMarkersBuilt = true;
  __msMissions.forEach(m => {
    if (!m.trigger_point) return;
    const group = new THREE.Group();
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.55, 0.75, 32),
      new THREE.MeshBasicMaterial({ color: 0x7fd8c8, transparent: true, opacity: 0.85, side: THREE.DoubleSide })
    );
    ring.rotation.x = -Math.PI/2;
    ring.position.y = 0.03;
    group.add(ring);
    const beam = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12, 0.3, 2.4, 12, 1, true),
      new THREE.MeshBasicMaterial({ color: 0x7fd8c8, transparent: true, opacity: 0.25 })
    );
    beam.position.y = 1.2;
    group.add(beam);
    const orb = new THREE.Mesh(
      new THREE.SphereGeometry(0.18, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xbdf5ea })
    );
    orb.position.y = 1.5;
    group.add(orb);
    const label = makeLabel(m.title || '미션');
    label.position.y = 2.5;
    group.add(label);
    group.position.set(m.trigger_point.x, 0, m.trigger_point.z);
    scene.add(group);
    missionMarkers[m.id] = { data: m, group, ring, beam, orb };
  });
}
function refreshMissionMarkers(){
  buildMissionMarkers();
  if (typeof __msDone === 'undefined') return;
  for (const id in missionMarkers) {
    const mk = missionMarkers[id];
    const done = __msDone.has(id);
    mk.beam.visible = !done;
    mk.ring.material.color.set(done ? 0xaaaaaa : 0x7fd8c8);
    mk.orb.material.color.set(done ? 0xcccccc : 0xbdf5ea);
  }
}

}
let doorNoticeActive = false;

// ── 1인칭 컨트롤 ─────────────────────────────────────────
const player = { x:0, z:ROOM_D/2 - 2.2, yaw:0, pitch:0 }; // 앞쪽(칠판, -z 방향)을 바라보고 시작
const keys = {};
let locked = false;
let skipLook = false; // 포인터락 진입 직후 첫 mousemove는 movementX/Y가 비정상적으로 커서 시점이 튐 → 1회 무시
let started = false;
let modalOpen = false; // ssambus_missions.js 모달(#ms-overlay) 열림 여부

const startOverlay = document.getElementById('start-overlay');
const crosshair = document.getElementById('crosshair');
const hud = document.getElementById('hud-top');

// #ms-overlay 표시 여부로 모달 상태 추적 (열려 있으면 이동/포인터락 정지)
function isMsModalOpen() {
  const ov = document.getElementById('ms-overlay');
  return !!(ov && !ov.classList.contains('hidden'));
}

document.getElementById('start-btn').addEventListener('click', ()=>{
  started = true;
  startOverlay.style.display = 'none';
  hud.style.display = 'block';
  if(!isTouch){
    crosshair.style.display = 'block';
    lockPtr(renderer.domElement);
  }
});
// unadjustedMovement(OS 마우스 가속 우회)로 요청 — Windows+Chrome movementX/Y 스파이크(시점 튐) 방지. 미지원 시 폴백
function lockPtr(el){
  try {
    const p = el.requestPointerLock({ unadjustedMovement: true });
    if (p && p.catch) p.catch(() => { try { el.requestPointerLock(); } catch(e){} });
  } catch(e) { try { el.requestPointerLock(); } catch(e2){} }
}
renderer.domElement.addEventListener('click', ()=>{
  if(!isTouch && started && !modalOpen && !TEACHER_VIEW && !document.pointerLockElement)
    lockPtr(renderer.domElement);
});
document.addEventListener('pointerlockchange', ()=>{
  locked = document.pointerLockElement === renderer.domElement;
  if (locked) skipLook = true;
});
document.addEventListener('mousemove', e=>{
  if(!locked) return;
  if (skipLook) { skipLook = false; return; }
  // 스파이크 필터: 한 이벤트에 200px 이상 델타는 물리적으로 불가능(Chrome/Windows 포인터락 버그) → 무시
  if (Math.abs(e.movementX) > 200 || Math.abs(e.movementY) > 200) return;
  player.yaw   -= e.movementX * 0.0022;
  player.pitch -= e.movementY * 0.0022;
  player.pitch = Math.max(-1.35, Math.min(1.35, player.pitch));
});

// capture 단계 등록: ssambus_realtime.js의 "글자키 → 채팅창 자동포커스"가 WASD/E를 가로채지 않도록 선점 차단
const MOVE_KEY_CODES = ['KeyW','KeyA','KeyS','KeyD','KeyE','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','ShiftLeft','ShiftRight'];
addEventListener('keydown', e=>{
  if (typeof SsamAdapter3D !== 'undefined' && SsamAdapter3D.isChatInputFocused()) return;
  keys[e.code] = true;
  if(e.code === 'KeyE' && nearMission && !modalOpen && !TEACHER_VIEW) tryInteract();
  if (MOVE_KEY_CODES.includes(e.code)) e.stopPropagation();
}, true);
addEventListener('keyup', e=> keys[e.code] = false);

/* ── 모바일: 좌하단 고정 조이스틱 + 오른쪽 드래그 (교실맵과 동일 방식) ── */
const joy = { active:false, id:null, dx:0, dy:0 };
const look = { id:null, lx:0, ly:0 };
const joyZone = document.getElementById('joy-zone');
const lookZone = document.getElementById('look-zone');
const joyStick = document.getElementById('joy-stick');
const JOY_MAX = 45;            // 노브 최대 이동 반경(px)
const JOY_REST = 36;           // 노브 중앙 위치(zone 120 − knob 48)/2

function joyUpdate(t) {
  const r = joyZone.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let dx = t.clientX - cx, dy = t.clientY - cy;
  const d = Math.hypot(dx, dy);
  if (d > JOY_MAX) { dx = dx / d * JOY_MAX; dy = dy / d * JOY_MAX; }
  joy.dx = dx / JOY_MAX; joy.dy = dy / JOY_MAX;
  joyStick.style.left = (JOY_REST + dx) + 'px';
  joyStick.style.top  = (JOY_REST + dy) + 'px';
}
function joyReset() {
  joy.active = false; joy.id = null; joy.dx = 0; joy.dy = 0;
  joyStick.style.left = JOY_REST + 'px'; joyStick.style.top = JOY_REST + 'px';
}
joyZone.addEventListener('touchstart', e => {
  if (joy.id !== null) return;
  const t = e.changedTouches[0];
  joy.active = true; joy.id = t.identifier;
  joyUpdate(t);
}, {passive:true});
joyZone.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) { if (t.identifier === joy.id) joyUpdate(t); }
}, {passive:true});
joyZone.addEventListener('touchend', e => {
  for (const t of e.changedTouches) { if (t.identifier === joy.id) joyReset(); }
});
joyZone.addEventListener('touchcancel', e => {
  for (const t of e.changedTouches) { if (t.identifier === joy.id) joyReset(); }
});

lookZone.addEventListener('touchstart', e => {
  const t = e.changedTouches[0];
  look.id = t.identifier; look.lx = t.clientX; look.ly = t.clientY;
}, {passive:true});
lookZone.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    if (t.identifier !== look.id) continue;
    player.yaw   -= (t.clientX - look.lx) * 0.005;
    player.pitch -= (t.clientY - look.ly) * 0.005;
    player.pitch = Math.max(-1.35, Math.min(1.35, player.pitch));
    look.lx = t.clientX; look.ly = t.clientY;
  }
}, {passive:true});

document.getElementById('action-btn').addEventListener('click', ()=>{
  if (nearMission && !modalOpen && !TEACHER_VIEW) tryInteract();
});

// ── 충돌 처리 (원 vs AABB, 축별 슬라이드) ──────────────────
function collide(px, pz){
  for(const c of colliders){
    const nx = Math.max(c.minX, Math.min(px, c.maxX));
    const nz = Math.max(c.minZ, Math.min(pz, c.maxZ));
    if((px-nx)**2 + (pz-nz)**2 < PLAYER_R**2) return true;
  }
  return false;
}

// ── 이동 ─────────────────────────────────────────────────
function movePlayer(dt){
  let mx = 0, mz = 0;
  if(keys['KeyW'] || keys['ArrowUp'])    mz -= 1;
  if(keys['KeyS'] || keys['ArrowDown'])  mz += 1;
  if(keys['KeyA'] || keys['ArrowLeft'])  mx -= 1;
  if(keys['KeyD'] || keys['ArrowRight']) mx += 1;
  mx += joy.dx; mz += joy.dy;

  const len = Math.hypot(mx, mz);
  if(len > 0.01){
    mx /= Math.max(len,1); mz /= Math.max(len,1);
    const speed = (keys['ShiftLeft']||keys['ShiftRight']) ? 5.2 : 3.0;
    const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
    const dx = (mx*cos + mz*sin) * speed * dt;
    const dz = (mz*cos - mx*sin) * speed * dt;
    // 축별 이동 → 벽에 붙어 미끄러지기
    if(!collide(player.x + dx, player.z)) player.x += dx;
    if(!collide(player.x, player.z + dz)) player.z += dz;
  }

  camera.position.set(player.x, EYE_H, player.z);
  // roll(z)을 항상 0으로 고정 — 개별 .x/.y 대입만 하면 lookAt 등이 남긴 roll이
  // YXZ 순서로 적용돼 화면이 기울어질 수 있음(forest3d에서 발견된 버그 패턴).
  camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');
}

// ── 미션 상호작용 (ssambus_missions.js의 #ms-overlay 모달 사용) ──
let nearMission = null; // checkMission3D()가 반환한 ssambus 미션 객체(또는 null)
const hintEl = document.getElementById('interact-hint');
const actionBtn = document.getElementById('action-btn');

function tryInteract(){
  if(!nearMission || modalOpen) return;
  if(document.pointerLockElement) document.exitPointerLock();
  __msOpenMission([nearMission]); // ssambus 모달로 문제 표시/채점/완료
}

/* ── 쌤버스 통합 초기화 (실시간 멀티플레이어 + 미션 + 3D 어댑터) ── */
try { initRealtime('science3d'); } catch (e) { console.warn('[science3d] realtime:', e); }
if (!TEACHER_VIEW) {
  try { initMissionSystem('science3d'); } catch (e) { console.warn('[science3d] missions:', e); }
}
try { SsamAdapter3D.init({ THREE, scene, camera }); } catch (e) { console.warn('[science3d] adapter:', e); }

/* ── 교사 실시간 맵 보기(teacherView=1): 자동 시작 + 조감 시점 고정(관찰 전용) ──
   started=true 라야 SsamAdapter3D.update()가 돌아 원격 학생 스프라이트가 동기화된다. */
if (TEACHER_VIEW) {
  startOverlay.style.display = 'none';
  hud.style.display = 'block';
  started = true;
  camera.position.set(0, 14, ROOM_D/2 + 4); // 뒤쪽(+Z) 위에서 과학실 안쪽을 내려다봄
  camera.lookAt(0, 1, 0);
}

// ── 메인 루프 ────────────────────────────────────────────
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // 모달 열림 추적 — 닫히면 포인터락 복원
  const wasModal = modalOpen;
  modalOpen = isMsModalOpen();
  if (wasModal && !modalOpen && started && !isTouch && !TEACHER_VIEW) lockPtr(renderer.domElement);

  if (started && !modalOpen && !TEACHER_VIEW) {
    movePlayer(dt);
  }

  // 미션 마커 갱신(완료색) + 부유/회전 애니메이션
  refreshMissionMarkers();
  for (const id in missionMarkers) {
    const mk = missionMarkers[id];
    mk.orb.position.y = 1.5 + Math.sin(t * 2.2 + mk.group.position.x) * 0.1;
    mk.ring.rotation.z = t * 0.8;
  }

  // 근접 미션 판정 (Supabase에 교사가 배치한 trigger_point 기준)
  nearMission = (started && !modalOpen && !TEACHER_VIEW && typeof checkMission3D === 'function')
    ? checkMission3D(player.x, player.z)
    : null;

  if (started && !modalOpen && nearMission) {
    hintEl.style.display = 'block';
    document.getElementById('hint-text').textContent = (nearMission.title || '미션') + ' 수행하기';
    actionBtn.classList.add('pulse');
  } else {
    hintEl.style.display = 'none';
    actionBtn.classList.remove('pulse');
  }

  // 출구(뒷문) 판정 — 필수 미션 완료 시 다음 맵으로 자동 이동
  if (started && !modalOpen && !TEACHER_VIEW && !nearMission
      && typeof requestMapExit3D === 'function' && isAtExitDoor(player.x, player.z)) {
    const st = requestMapExit3D();
    if (st === 'incomplete' && !doorNoticeActive) {
      doorNoticeActive = true;
      if (typeof __msShowBlockedNotice === 'function') __msShowBlockedNotice();
    }
  } else {
    doorNoticeActive = false;
  }

  // 원격 학생 실시간 동기화 (모달 열려 있어도 계속)
  if (started && typeof SsamAdapter3D !== 'undefined') {
    try { SsamAdapter3D.update(dt, camera); } catch (e) {}
  }

  // HUD 진행률 (이 맵의 완료 수 / 이 맵의 미션 수 — __msDone.size는 방 전체 누적이라 맵 단위로 카운트)
  const __sids = Object.keys(missionMarkers);
  const __sdone = (typeof __msDone !== 'undefined') ? __sids.filter(id => __msDone.has(id)).length : 0;
  document.getElementById('mission-count').textContent = __sdone + '/' + __sids.length;

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
