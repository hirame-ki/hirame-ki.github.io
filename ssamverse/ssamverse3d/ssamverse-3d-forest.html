<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>쌤버스 3D - 자연숲 맵</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#1a2f1a; font-family:'Pretendard','Malgun Gothic',sans-serif; }
  #canvas-wrap { position:fixed; inset:0; }
  canvas { display:block; }

  /* ── HUD ───────────────────────── */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }

  #crosshair {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:6px; height:6px; border-radius:50%;
    background:rgba(255,255,255,.85); box-shadow:0 0 6px rgba(0,0,0,.5);
  }

  #top-bar {
    position:absolute; top:12px; left:12px; display:flex; gap:8px; align-items:center;
  }
  .badge {
    background:rgba(20,35,20,.75); backdrop-filter:blur(6px);
    color:#e8f5e0; padding:7px 14px; border-radius:20px; font-size:13px; font-weight:600;
    border:1px solid rgba(255,255,255,.12);
  }
  .badge b { color:#9be87a; }

  #minimap {
    position:absolute; top:12px; right:12px;
    width:150px; height:150px; border-radius:12px;
    border:2px solid rgba(255,255,255,.25);
    background:rgba(15,28,15,.8); overflow:hidden;
  }

  #mission-toast {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-140%);
    background:rgba(20,35,20,.9); backdrop-filter:blur(8px);
    border:1px solid #9be87a; border-radius:14px;
    padding:14px 20px; color:#fff; text-align:center; min-width:240px;
    opacity:0; transition:opacity .25s; pointer-events:none;
  }
  #mission-toast.show { opacity:1; }
  #mission-toast .m-title { font-size:16px; font-weight:700; color:#9be87a; margin-bottom:4px; }
  #mission-toast .m-desc { font-size:13px; color:#d5e8cc; line-height:1.5; }
  #mission-toast .m-key { font-size:11px; color:#8aa87f; margin-top:8px; }

  #mission-panel {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(420px, 88vw);
    background:rgba(18,30,18,.96); backdrop-filter:blur(10px);
    border:1px solid #9be87a; border-radius:18px; padding:24px;
    color:#fff; display:none; pointer-events:auto; z-index:30;
  }
  #mission-panel.open { display:block; }
  #mission-panel h2 { font-size:19px; color:#9be87a; margin-bottom:10px; }
  #mission-panel p { font-size:14px; line-height:1.6; color:#d5e8cc; margin-bottom:18px; }
  #mission-panel .btn-row { display:flex; gap:10px; }
  .btn {
    flex:1; padding:11px 0; border:none; border-radius:10px; font-size:14px; font-weight:700;
    cursor:pointer; font-family:inherit;
  }
  .btn-go { background:#6fbf44; color:#0d1a0a; }
  .btn-close { background:rgba(255,255,255,.12); color:#cfe3c5; }

  #controls-hint {
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    background:rgba(20,35,20,.7); color:#b9d4ab; font-size:12px;
    padding:7px 16px; border-radius:16px; white-space:nowrap;
    border:1px solid rgba(255,255,255,.1);
  }

  /* ── 시작 화면 ─────────────────── */
  #start-screen {
    position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px;
    background:radial-gradient(ellipse at 50% 40%, #2c4a26 0%, #14240f 70%);
  }
  #start-screen h1 { color:#e9f7dd; font-size:30px; letter-spacing:-.5px; }
  #start-screen h1 span { color:#9be87a; }
  #start-screen p { color:#a8c496; font-size:14px; text-align:center; line-height:1.7; }
  #start-btn {
    padding:14px 44px; font-size:17px; font-weight:800; border:none; border-radius:14px;
    background:#6fbf44; color:#0d1a0a; cursor:pointer; font-family:inherit;
    box-shadow:0 6px 24px rgba(111,191,68,.35);
  }
  #start-btn:active { transform:scale(.97); }
  #npc-toggle-wrap { display:flex; align-items:center; gap:8px; color:#a8c496; font-size:13px; }

  /* ── 모바일 조작 ───────────────── */
  #joy-zone { position:fixed; left:0; bottom:0; width:45%; height:45%; z-index:20; display:none; }
  #look-zone { position:fixed; right:0; bottom:0; width:55%; height:60%; z-index:20; display:none; }
  #joy-base {
    position:absolute; width:110px; height:110px; border-radius:50%;
    border:2px solid rgba(255,255,255,.35); background:rgba(255,255,255,.08);
    display:none;
  }
  #joy-stick {
    position:absolute; width:48px; height:48px; border-radius:50%;
    background:rgba(255,255,255,.55); left:31px; top:31px;
  }
  body.touch #joy-zone, body.touch #look-zone { display:block; }
  body.touch #controls-hint { display:none; }

  /* ssambus_missions.js의 기본 진행률 배지는 숨기고 기존 HUD(#mission-count)만 사용 */
  #ms-progress { display:none !important; }
  #char-btn {
    position:absolute; top:170px; right:12px; pointer-events:auto;
    background:rgba(41,128,185,.85); color:#fff; padding:7px 12px; border-radius:12px;
    font-size:12px; font-weight:700; text-decoration:none; border:1px solid rgba(255,255,255,.2);
    display:none; font-family:inherit;
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../ssambus_supabase_config.js"></script>
<script src="../ssambus_character_render.js"></script>
<script src="../ssambus_realtime.js"></script>
<script src="../ssambus_missions.js"></script>
<script src="ssambus_3d_adapter.js"></script>
<script>
/* ============================================================
   쌤버스 3D · 자연숲 맵  (Three.js r128)
   - 1인칭 시점 (포인터락 + 모바일 터치)
   - 플레이 구역: 96 x 96 유닛 (타일 48x48, 1타일 = 2유닛)
     → 30명 동시 활동에 충분한 크기
   - 프로시저럴 숲: 나무/바위/풀 전부 코드 생성 (라이선스 無)
   - 미션: 근접 트리거 방식 (기존 쌤버스 JSON 구조와 호환)
   - Supabase 연동 훅: 하단 SsamverseAPI 참고
   ============================================================ */

// ── 설정 ─────────────────────────────────────────
const CONFIG = {
  TILE: 2,            // 1타일 = 2유닛 (기존 쌤버스 타일 좌표 변환용)
  PLAY_HALF: 48,      // 플레이 구역 반경(±48) → 96x96
  WORLD_HALF: 110,    // 배경 지형 포함 전체 크기
  EYE: 1.6,
  SPEED: 7.5,
  PLAYER_R: 0.45,
};

/* ── 쌤버스 통합: URL 파라미터 + 캐릭터 외형 + 위치(r/c=z/x, TS=1) ──
   (미션은 이제 Supabase missions 테이블의 trigger_point로 로드 — classroom3d와 동일) */
var TEACHER_VIEW = new URLSearchParams(window.location.search).get('teacherView') === '1';
var TS = 1;
var __savedChar = (function(){
  try{
    var _cp = new URLSearchParams(window.location.search).get('c');
    if(_cp) return JSON.parse(_cp);
    return JSON.parse(localStorage.getItem('ssambus_player_character'));
  }catch(e){ return null; }
})();
var PLAYER = Object.assign({
  type:'student', skin:'#FDEBD0', hcolor:'#1a1008', hair:'short',
  ccolor:'#1a3a6b', cloth:'suit', gender:'male', acc:[], dir:'down'
}, __savedChar || {});
var pos = { r: 0, c: 0 }; // ssambus_3d_adapter.js가 매 프레임 camera 위치로 갱신

/* ── 캐릭터 변경 버튼 (2D 맵의 #char-btn과 동일 동작) ── */
(function(){
  var params = new URLSearchParams(window.location.search);
  var room = params.get('room');
  if(!room || TEACHER_VIEW) return;
  var btn = document.getElementById('char-btn');
  if(!btn) return;
  var nickname = params.get('nickname') || '';
  try{ nickname = nickname || sessionStorage.getItem('ssambus_nickname') || ''; }catch(e){}
  var q = 'room=' + encodeURIComponent(room) + '&map=' + encodeURIComponent('ssamverse3d/ssamverse-3d-forest.html');
  if(nickname) q += '&nickname=' + encodeURIComponent(nickname);
  if(params.get('teacherMode') === '1') q += '&teacherMode=1'; // 애니 캐릭터 잠금 면제 유지
  btn.href = '../ssambus_characters.html?' + q;
  btn.style.display = 'inline-block';
})();

// ── 기본 셋업 ─────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd4f0);
scene.fog = new THREE.Fog(0x9fd4f0, 60, 170);

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 400);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('canvas-wrap').appendChild(renderer.domElement);

// 조명
scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x3a5c2e, 0.75));
const sun = new THREE.DirectionalLight(0xfff2d0, 1.05);
sun.position.set(50, 80, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -70; sun.shadow.camera.right = 70;
sun.shadow.camera.top = 70;  sun.shadow.camera.bottom = -70;
sun.shadow.camera.far = 220;
scene.add(sun);

// ── 지형 (중앙 평지 + 외곽 언덕) ──────────────────
function terrainH(x, z) {
  const d = Math.max(Math.abs(x), Math.abs(z));
  if (d <= CONFIG.PLAY_HALF + 2) return 0;
  const t = Math.min((d - CONFIG.PLAY_HALF - 2) / 40, 1);
  const s = t * t * (3 - 2 * t); // smoothstep
  const n = Math.sin(x * 0.11) * Math.cos(z * 0.13) * 2.2
          + Math.sin(x * 0.05 + 3) * Math.sin(z * 0.06) * 3.5;
  return s * (7 + n);
}

{
  const seg = 110;
  const g = new THREE.PlaneGeometry(CONFIG.WORLD_HALF*2, CONFIG.WORLD_HALF*2, seg, seg);
  g.rotateX(-Math.PI/2);
  const pos = g.attributes.position;
  const colors = [];
  const cGrass = new THREE.Color(0x69a84f), cGrass2 = new THREE.Color(0x5c9a44), cHill = new THREE.Color(0x4a7d38);
  for (let i=0; i<pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const h = terrainH(x, z);
    pos.setY(i, h);
    const mix = Math.min(h/8, 1);
    const patch = (Math.sin(x*0.35)*Math.cos(z*0.3) > 0.4) ? cGrass2 : cGrass;
    const c = patch.clone().lerp(cHill, mix);
    colors.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  g.computeVertexNormals();
  const ground = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors:true }));
  ground.receiveShadow = true;
  scene.add(ground);
}

// ── 충돌 시스템 ───────────────────────────────────
const colliders = []; // {x, z, r}
function addCollider(x, z, r) { colliders.push({x, z, r}); }

function resolveCollision(px, pz) {
  // 원형 콜라이더
  for (const c of colliders) {
    const dx = px - c.x, dz = pz - c.z;
    const min = c.r + CONFIG.PLAYER_R;
    const d2 = dx*dx + dz*dz;
    if (d2 < min*min && d2 > 1e-6) {
      const d = Math.sqrt(d2);
      px = c.x + dx/d*min;
      pz = c.z + dz/d*min;
    }
  }
  // 맵 경계
  const B = CONFIG.PLAY_HALF - CONFIG.PLAYER_R;
  px = Math.max(-B, Math.min(B, px));
  pz = Math.max(-B, Math.min(B, pz));
  return [px, pz];
}

// ── 나무 (InstancedMesh, 3종) ─────────────────────
const treeDots = []; // 미니맵용
function rand(a,b){ return a + Math.random()*(b-a); }

function scatterTrees() {
  const dummy = new THREE.Object3D();
  // 배치 위치 계산: 외곽 링 + 내부 산발
  const spots = [];
  // 경계 안쪽 링 (빽빽한 숲 벽)
  for (let i=0; i<210; i++) {
    const side = Math.floor(Math.random()*4);
    const t = rand(-CONFIG.PLAY_HALF+2, CONFIG.PLAY_HALF-2);
    const off = rand(CONFIG.PLAY_HALF-7, CONFIG.PLAY_HALF-1.5);
    let x, z;
    if (side===0){x=t; z=-off;} else if(side===1){x=t; z=off;}
    else if (side===2){x=-off; z=t;} else {x=off; z=t;}
    // 출구 포털(0,44) 주변은 나무 벽으로 막지 않고 통로를 비워둔다
    if (Math.hypot(x - 0, z - 44) < 7) continue;
    spots.push([x, z, true]);
  }
  // 플레이 구역 바깥 배경 숲
  for (let i=0; i<260; i++) {
    let x, z;
    do { x = rand(-CONFIG.WORLD_HALF+5, CONFIG.WORLD_HALF-5); z = rand(-CONFIG.WORLD_HALF+5, CONFIG.WORLD_HALF-5); }
    while (Math.max(Math.abs(x),Math.abs(z)) < CONFIG.PLAY_HALF+3);
    spots.push([x, z, false]);
  }
  // 내부 산발 나무 (중앙 광장·주요 랜드마크·출구 피해서)
  // (미션은 이제 교사가 동적으로 배치하므로, 대시보드 3D 레이아웃의 기준 지점만 비워둔다)
  const RESERVED = [[0,0],[-30,-30],[32,-28],[34,32],[-32,30],[0,44]];
  let placed = 0;
  while (placed < 26) {
    const x = rand(-CONFIG.PLAY_HALF+10, CONFIG.PLAY_HALF-10);
    const z = rand(-CONFIG.PLAY_HALF+10, CONFIG.PLAY_HALF-10);
    if (Math.hypot(x,z) < 12) continue;
    if (RESERVED.some(([rx,rz]) => Math.hypot(x-rx, z-rz) < 6)) continue;
    spots.push([x, z, true]); placed++;
  }

  // 3종 분배
  const groups = [[],[],[]];
  spots.forEach(s => groups[Math.floor(Math.random()*3)].push(s));

  // 종류1: 침엽수 (원뿔 2단)
  makeTreeType(groups[0], () => {
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.32,1.6,6), new THREE.MeshLambertMaterial({color:0x6b4a2f}));
    trunk.position.y = 0.8; g.add(trunk);
    const m = new THREE.MeshLambertMaterial({color:0x2e6b34});
    const c1 = new THREE.Mesh(new THREE.ConeGeometry(1.7,2.6,7), m); c1.position.y=2.4; g.add(c1);
    const c2 = new THREE.Mesh(new THREE.ConeGeometry(1.2,2.2,7), m); c2.position.y=3.9; g.add(c2);
    return g;
  }, 0.9, 1.5);

  // 종류2: 활엽수 (구형 잎)
  makeTreeType(groups[1], () => {
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.38,2.1,6), new THREE.MeshLambertMaterial({color:0x7a5636}));
    trunk.position.y = 1.05; g.add(trunk);
    const leaf = new THREE.Mesh(new THREE.IcosahedronGeometry(1.8,0), new THREE.MeshLambertMaterial({color:0x4f9b3c, flatShading:true}));
    leaf.position.y = 3.1; g.add(leaf);
    return g;
  }, 0.9, 1.6);

  // 종류3: 연녹색 낮은 나무
  makeTreeType(groups[2], () => {
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.28,1.3,5), new THREE.MeshLambertMaterial({color:0x6b4a2f}));
    trunk.position.y = 0.65; g.add(trunk);
    const leaf = new THREE.Mesh(new THREE.DodecahedronGeometry(1.5,0), new THREE.MeshLambertMaterial({color:0x7bc257, flatShading:true}));
    leaf.position.y = 2.2; g.add(leaf);
    return g;
  }, 0.8, 1.3);

  function makeTreeType(list, builder, sMin, sMax) {
    if (!list.length) return;
    const proto = builder();
    proto.traverse(o => { if (o.isMesh) { o.castShadow = true; } });
    // 그룹 → 병합 대신 각 메시별 InstancedMesh
    proto.children.forEach(child => {
      const inst = new THREE.InstancedMesh(child.geometry, child.material, list.length);
      inst.castShadow = true;
      const dummy2 = new THREE.Object3D();
      list.forEach(([x,z,solid], i) => {
        const s = rand(sMin, sMax);
        const y = terrainH(x,z);
        dummy2.position.set(x, y + child.position.y*s, z);
        dummy2.scale.setScalar(s);
        dummy2.rotation.y = Math.random()*Math.PI*2;
        dummy2.updateMatrix();
        inst.setMatrixAt(i, dummy2.matrix);
      });
      scene.add(inst);
    });
    list.forEach(([x,z,solid]) => {
      if (solid) { addCollider(x, z, 0.6); treeDots.push([x,z]); }
    });
  }
}
scatterTrees();

// ── 벚꽃나무 (미션1 랜드마크) ─────────────────────
{
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.65,3.2,7), new THREE.MeshLambertMaterial({color:0x5e4030}));
  trunk.position.y = 1.6; trunk.castShadow = true; g.add(trunk);
  const pink = new THREE.MeshLambertMaterial({color:0xf6a8c8, flatShading:true});
  [[0,4.6,0,2.6],[1.6,3.9,0.8,1.7],[-1.5,4.1,-0.7,1.6],[0.4,3.8,-1.6,1.5]].forEach(([x,y,z,r]) => {
    const b = new THREE.Mesh(new THREE.IcosahedronGeometry(r,0), pink);
    b.position.set(x,y,z); b.castShadow = true; g.add(b);
  });
  g.position.set(-30,-0,-30);
  scene.add(g);
  addCollider(-30,-30,0.9);
}

// ── 연못 (미션2) ──────────────────────────────────
{
  const water = new THREE.Mesh(
    new THREE.CircleGeometry(7, 28),
    new THREE.MeshLambertMaterial({color:0x4fa8d8, transparent:true, opacity:0.85})
  );
  water.rotation.x = -Math.PI/2;
  water.position.set(32, 0.06, -22);
  scene.add(water);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(7, 0.35, 6, 28), new THREE.MeshLambertMaterial({color:0xb9a27c}));
  rim.rotation.x = Math.PI/2; rim.position.set(32, 0.15, -22);
  scene.add(rim);
  addCollider(32, -22, 7.4); // 연못은 못 들어감
}

// ── 바위 언덕 (미션3) + 산발 바위 ─────────────────
function addRock(x, z, s) {
  const r = new THREE.Mesh(
    new THREE.DodecahedronGeometry(s, 0),
    new THREE.MeshLambertMaterial({color:0x8f8f8f, flatShading:true})
  );
  r.position.set(x, terrainH(x,z)+s*0.5, z);
  r.rotation.set(Math.random(), Math.random()*3, Math.random());
  r.castShadow = true; r.receiveShadow = true;
  scene.add(r);
  addCollider(x, z, s*0.95);
  treeDots.push([x,z]);
}
addRock(34, 36, 2.4); addRock(37.5, 33, 1.5); addRock(31, 34.5, 1.2);
addRock(-14, 18, 1.0); addRock(20, 8, 0.9); addRock(-8, -22, 1.1); addRock(12, -38, 1.0);

{

// ── 미션 마커 (빛기둥 + 라벨) — Supabase missions의 trigger_point로 동적 생성 ──
// (교사가 대시보드 "3D 좌표 지정"으로 배치한 미션만 마커가 생김. classroom3d와 동일 패턴)
const missionMarkers = {}; // id -> { m, beam, ring, label }
let __markersBuilt = false;
function makeLabel(text) {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 128;
  const c = cv.getContext('2d');
  c.font = 'bold 56px "Malgun Gothic", sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = 'rgba(15,30,12,0.7)';
  const w = c.measureText(text).width + 60;
  c.beginPath(); c.roundRect((512-w)/2, 14, w, 100, 22); c.fill();
  c.fillStyle = '#fff';
  c.fillText(text, 256, 66);
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true}));
  sp.scale.set(8, 2, 1);
  return sp;
}

function buildMissionMarkers() {
  if (__markersBuilt) return;
  if (typeof __msMissions === 'undefined' || __msMissions === null) return;
  __markersBuilt = true;
  __msMissions.forEach(m => {
    if (!m.trigger_point) return;
    const px = m.trigger_point.x, pz = m.trigger_point.z;
    const rad = m.trigger_point.r || 2.2;
    const beam = new THREE.Mesh(
      new THREE.CylinderGeometry(0.45, 0.45, 9, 10, 1, true),
      new THREE.MeshBasicMaterial({color:0x9be87a, transparent:true, opacity:0.4, side:THREE.DoubleSide, depthWrite:false})
    );
    beam.position.set(px, 4.5, pz);
    scene.add(beam);

    const ring = new THREE.Mesh(
      new THREE.RingGeometry(Math.max(0.3, rad-0.35), rad, 36),
      new THREE.MeshBasicMaterial({color:0x9be87a, transparent:true, opacity:0.55, side:THREE.DoubleSide})
    );
    ring.rotation.x = -Math.PI/2; ring.position.set(px, 0.08, pz);
    scene.add(ring);

    const label = makeLabel(m.title || '미션');
    label.position.set(px, 6.2, pz);
    scene.add(label);

    missionMarkers[m.id] = { m, beam, ring, label };
  });
}

// 완료 상태에 따라 마커 색 갱신(초록→금색). __msMissions 로드 지연 대응 위해 매 프레임 호출.
function refreshMissionMarkers() {
  buildMissionMarkers();
  if (typeof __msDone === 'undefined') return;
  for (const id in missionMarkers) {
    const col = __msDone.has(id) ? 0xffd24a : 0x9be87a;
    missionMarkers[id].beam.material.color.set(col);
    missionMarkers[id].ring.material.color.set(col);
  }
}

// ── (데모 NPC 제거) 실제 학생은 ssambus_realtime.js + 3D 어댑터가 렌더링 ──

// ── 플레이어 & 1인칭 컨트롤 ───────────────────────
const player = { x: 0, z: 14, yaw: Math.PI, pitch: 0 };
const keys = {};
let locked = false;
let modalOpen = false; // ssambus_missions.js 모달(#ms-overlay) 열림 여부
const isTouch = ('ontouchstart' in window) &&
  (matchMedia('(pointer:coarse)').matches || navigator.maxTouchPoints > 0);
if (isTouch) document.body.classList.add('touch');

// #ms-overlay 표시 여부로 모달 상태 추적 (열려 있으면 이동/포인터락 정지)
function isMsModalOpen() {
  const ov = document.getElementById('ms-overlay');
  return !!(ov && !ov.classList.contains('hidden'));
}

// capture 단계 등록: ssambus_realtime.js의 "글자키 → 채팅창 자동포커스"가 WASD/E를 가로채지 않도록 선점 차단
const MOVE_KEY_CODES = ['KeyW','KeyA','KeyS','KeyD','KeyE','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','ShiftLeft','ShiftRight'];
addEventListener('keydown', e => {
  if (typeof SsamAdapter3D !== 'undefined' && SsamAdapter3D.isChatInputFocused()) return;
  keys[e.code] = true;
  if (e.code === 'KeyE' && nearMission && !modalOpen && !TEACHER_VIEW) tryInteract();
  if (MOVE_KEY_CODES.includes(e.code)) e.stopPropagation();
}, true);
addEventListener('keyup', e => keys[e.code] = false);

// 포인터락 (데스크톱) — 교사뷰/모달 열림 시 제외
renderer.domElement.addEventListener('click', () => {
  if (!isTouch && started && !modalOpen && !TEACHER_VIEW && !document.pointerLockElement) renderer.domElement.requestPointerLock();
});
document.addEventListener('pointerlockchange', () => { locked = !!document.pointerLockElement; });
document.addEventListener('mousemove', e => {
  if (!locked) return;
  player.yaw   -= e.movementX * 0.0024;
  player.pitch -= e.movementY * 0.0024;
  player.pitch = Math.max(-1.35, Math.min(1.35, player.pitch));
});

// 모바일: 왼쪽 조이스틱 + 오른쪽 드래그
const joy = { active:false, id:null, ox:0, oy:0, dx:0, dy:0 };
const look = { id:null, lx:0, ly:0 };
const joyZone = document.getElementById('joy-zone');
const lookZone = document.getElementById('look-zone');
const joyBase = document.getElementById('joy-base');
const joyStick = document.getElementById('joy-stick');

joyZone.addEventListener('touchstart', e => {
  const t = e.changedTouches[0];
  joy.active = true; joy.id = t.identifier;
  joy.ox = t.clientX; joy.oy = t.clientY; joy.dx = 0; joy.dy = 0;
  joyBase.style.display = 'block';
  joyBase.style.left = (t.clientX-55)+'px';
  joyBase.style.top = (t.clientY-55)+'px';
}, {passive:true});
joyZone.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    if (t.identifier !== joy.id) continue;
    let dx = t.clientX - joy.ox, dy = t.clientY - joy.oy;
    const d = Math.hypot(dx,dy), max = 45;
    if (d > max) { dx = dx/d*max; dy = dy/d*max; }
    joy.dx = dx/max; joy.dy = dy/max;
    joyStick.style.left = (31+dx)+'px';
    joyStick.style.top = (31+dy)+'px';
  }
}, {passive:true});
joyZone.addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    if (t.identifier !== joy.id) continue;
    joy.active = false; joy.dx = 0; joy.dy = 0;
    joyBase.style.display = 'none';
    joyStick.style.left = '31px'; joyStick.style.top = '31px';
  }
});

lookZone.addEventListener('touchstart', e => {
  const t = e.changedTouches[0];
  look.id = t.identifier; look.lx = t.clientX; look.ly = t.clientY;
}, {passive:true});
lookZone.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    if (t.identifier !== look.id) continue;
    player.yaw   -= (t.clientX - look.lx) * 0.005;
    player.pitch -= (t.clientY - look.ly) * 0.005;
    player.pitch = Math.max(-1.35, Math.min(1.35, player.pitch));
    look.lx = t.clientX; look.ly = t.clientY;
  }
}, {passive:true});

// 모바일 미션 버튼 (근접 시 토스트 탭)
document.getElementById('mission-toast').style.pointerEvents = 'auto';
document.getElementById('mission-toast').addEventListener('click', tryInteract);

function movePlayer(dt) {
  let fx = 0, fz = 0;
  if (keys['KeyW'] || keys['ArrowUp']) fz += 1;
  if (keys['KeyS'] || keys['ArrowDown']) fz -= 1;
  if (keys['KeyA'] || keys['ArrowLeft']) fx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) fx += 1;
  if (joy.active) { fx += joy.dx; fz += -joy.dy; }

  const len = Math.hypot(fx, fz);
  if (len > 0.01) {
    fx /= Math.max(len,1); fz /= Math.max(len,1);
    const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
    const wx = (fx * cos - fz * sin);
    const wz = (-fx * sin - fz * cos);
    let nx = player.x + wx * CONFIG.SPEED * dt;
    let nz = player.z + wz * CONFIG.SPEED * dt;
    [nx, nz] = resolveCollision(nx, nz);
    player.x = nx; player.z = nz;
  }

  camera.position.set(player.x, CONFIG.EYE, player.z);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;
}

// ── 미션 근접 트리거 (checkMission3D — trigger_point 좌표 기반) ──
let nearMission = null; // checkMission3D()가 반환한 ssambus 미션 객체(또는 null)
const toast = document.getElementById('mission-toast');
const panel = document.getElementById('mission-panel');
if (panel) panel.style.display = 'none'; // 자체 미션 패널 미사용(ssambus 모달로 대체)

function checkMissions() {
  const found = (typeof checkMission3D === 'function') ? checkMission3D(player.x, player.z) : null;
  const foundId = found ? found.id : null;
  const nearId = nearMission ? nearMission.id : null;
  if (foundId !== nearId) {
    nearMission = found;
    if (found) {
      document.getElementById('toast-title').textContent = found.title || '미션';
      document.getElementById('toast-desc').textContent = '가까이 왔어요! 미션을 수행하세요.';
      document.getElementById('toast-key').textContent = isTouch ? '여기를 탭하여 미션 시작' : 'E 키를 눌러 미션 시작';
      toast.classList.add('show');
    } else {
      toast.classList.remove('show');
    }
  }
}

function tryInteract() {
  if (!nearMission || modalOpen) return;
  if (document.pointerLockElement) document.exitPointerLock();
  toast.classList.remove('show');
  __msOpenMission([nearMission]); // ssambus 모달로 문제 표시/채점/완료
}
// 모바일: 토스트 탭으로 미션 시작
document.getElementById('mission-toast').style.pointerEvents = 'auto';
document.getElementById('mission-toast').addEventListener('click', () => { if (!TEACHER_VIEW) tryInteract(); });

// ── 출구 포털 (필수 미션 완료 후 다가가면 다음 맵으로 이동) ──
const EXIT_POS = { x: 0, z: 44 };
(function makeExitPortal(){
  const g = new THREE.Group();
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(2.2, 0.22, 12, 40),
    new THREE.MeshBasicMaterial({ color:0x4da6ff })
  );
  ring.position.y = 2.4; g.add(ring);
  const glow = new THREE.Mesh(
    new THREE.CircleGeometry(2.0, 32),
    new THREE.MeshBasicMaterial({ color:0x8fd0ff, transparent:true, opacity:0.35, side:THREE.DoubleSide })
  );
  glow.position.y = 2.4; g.add(glow);
  const label = makeLabel('🚪 출구');
  label.position.y = 5.2; g.add(label);
  g.position.set(EXIT_POS.x, 0, EXIT_POS.z);
  scene.add(g);
  window.__exitPortal = g;
})();
function isAtExit(x, z) {
  return Math.hypot(x - EXIT_POS.x, z - EXIT_POS.z) < 2.8;
}
let exitNoticeActive = false;

// ── 미니맵 ────────────────────────────────────────
const mmCanvas = document.getElementById('minimap');
const mmCtx = mmCanvas.getContext('2d');
function drawMinimap() {
  const S = 300, half = CONFIG.PLAY_HALF + 4;
  const toPx = v => (v + half) / (half*2) * S;
  mmCtx.clearRect(0,0,S,S);
  mmCtx.fillStyle = '#2c4a26'; mmCtx.fillRect(0,0,S,S);
  // 나무/바위
  mmCtx.fillStyle = '#1d3318';
  treeDots.forEach(([x,z]) => mmCtx.fillRect(toPx(x)-2, toPx(z)-2, 4, 4));
  // 미션
  Object.values(missionMarkers).forEach(mk => {
    mmCtx.fillStyle = (typeof __msDone !== 'undefined' && __msDone.has(mk.m.id)) ? '#ffd24a' : '#9be87a';
    mmCtx.beginPath(); mmCtx.arc(toPx(mk.m.trigger_point.x), toPx(mk.m.trigger_point.z), 7, 0, 7); mmCtx.fill();
  });
  // 출구
  mmCtx.fillStyle = '#4da6ff';
  mmCtx.beginPath(); mmCtx.arc(toPx(EXIT_POS.x), toPx(EXIT_POS.z), 6, 0, 7); mmCtx.fill();
  // 플레이어 (방향 삼각형)
  mmCtx.save();
  mmCtx.translate(toPx(player.x), toPx(player.z));
  mmCtx.rotate(-player.yaw + Math.PI);
  mmCtx.fillStyle = '#ff5b5b';
  mmCtx.beginPath();
  mmCtx.moveTo(0,-9); mmCtx.lineTo(6,7); mmCtx.lineTo(-6,7); mmCtx.closePath(); mmCtx.fill();
  mmCtx.restore();
}

// ── 쌤버스 통합 초기화 (실시간 멀티플레이어 + 미션 + 3D 어댑터) ──
try { initRealtime('forest3d'); } catch (e) { console.warn('[forest3d] realtime:', e); }
if (!TEACHER_VIEW) {
  try { initMissionSystem('forest3d'); } catch (e) { console.warn('[forest3d] missions:', e); }
}
try { SsamAdapter3D.init({ THREE, scene, camera }); } catch (e) { console.warn('[forest3d] adapter:', e); }

// ── 시작 & 메인 루프 ──────────────────────────────
let started = false;
document.getElementById('start-btn').addEventListener('click', () => {
  started = true;
  document.getElementById('start-screen').style.display = 'none';
  if (!isTouch) renderer.domElement.requestPointerLock();
});

// 교사 실시간 맵 보기(teacherView=1): 버튼 없이 자동 시작 + 조감 시점 고정(관찰 전용)
if (TEACHER_VIEW) {
  const ss = document.getElementById('start-screen');
  if (ss) ss.style.display = 'none';
  started = true;
  camera.position.set(0, 62, 70);
  camera.lookAt(0, 0, 0);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
let mmTimer = 0;
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = performance.now() * 0.001;

  // 모달 열림 추적 — 닫히면 포인터락 복원
  const wasModal = modalOpen;
  modalOpen = isMsModalOpen();
  if (wasModal && !modalOpen && started && !isTouch && !TEACHER_VIEW) renderer.domElement.requestPointerLock();

  if (started && !modalOpen && !TEACHER_VIEW) {
    movePlayer(dt);
    checkMissions();
  } else if (!started) {
    // 시작 전 소개 카메라
    camera.position.set(Math.sin(t*0.1)*30, 14, Math.cos(t*0.1)*30);
    camera.lookAt(0, 2, 0);
  }

  // 미션 마커 갱신(완료색) + 빛기둥 애니메이션
  refreshMissionMarkers();
  let bi = 0;
  for (const id in missionMarkers) {
    missionMarkers[id].beam.material.opacity = 0.3 + Math.sin(t*2 + bi)*0.12;
    missionMarkers[id].ring.rotation.z = t * 0.4;
    bi++;
  }
  // 출구 포털 회전
  if (window.__exitPortal) window.__exitPortal.rotation.y = t * 0.6;

  // 출구 판정 — 필수 미션 완료 시 다음 맵으로 자동 이동
  if (started && !modalOpen && !TEACHER_VIEW && !nearMission
      && typeof requestMapExit3D === 'function' && isAtExit(player.x, player.z)) {
    const st = requestMapExit3D();
    if (st === 'incomplete' && !exitNoticeActive) {
      exitNoticeActive = true;
      if (typeof __msShowBlockedNotice === 'function') __msShowBlockedNotice();
    }
  } else {
    exitNoticeActive = false;
  }

  // 원격 학생 실시간 동기화 (모달 열려 있어도 계속)
  if (started && typeof SsamAdapter3D !== 'undefined') {
    try { SsamAdapter3D.update(dt, camera); } catch (e) {}
  }

  // HUD 진행률
  document.getElementById('mission-count').textContent =
    ((typeof __msDone !== 'undefined') ? __msDone.size : 0) + '/' + Object.keys(missionMarkers).length;

  // 미니맵
  mmTimer += dt;
  if (mmTimer > 0.15) { drawMinimap(); mmTimer = 0; }

  // 모닥불
  if (window.__campfire) {
    window.__campfire.userData.fire.forEach((f, i) => {
      f.scale.y = 1 + Math.sin(t*9 + i*2)*0.18;
      f.rotation.y = t * (2+i);
    });
  }

  renderer.render(scene, camera);
}
loop();
