<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>쌤버스 3D - 보건실</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#1a2530; font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif; }
  #canvas-wrap { position:fixed; inset:0; }
  canvas { display:block; }

  /* 시작 오버레이 */
  #overlay {
    position:fixed; inset:0; z-index:50;
    background:linear-gradient(160deg,#e8f6f3 0%,#d3ecf7 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
  }
  #overlay .cross {
    width:72px; height:72px; border-radius:18px; background:#ff6b6b; position:relative;
    box-shadow:0 8px 24px rgba(255,107,107,.35);
  }
  #overlay .cross::before, #overlay .cross::after {
    content:''; position:absolute; background:#fff; border-radius:4px;
    top:50%; left:50%; transform:translate(-50%,-50%);
  }
  #overlay .cross::before { width:14px; height:42px; }
  #overlay .cross::after { width:42px; height:14px; }
  #overlay h1 { color:#2c3e50; font-size:26px; letter-spacing:-0.5px; }
  #overlay p { color:#5a6b7b; font-size:14px; line-height:1.7; text-align:center; }
  #overlay button {
    padding:14px 44px; font-size:17px; font-weight:700; color:#fff;
    background:#2bb3a3; border:none; border-radius:30px; cursor:pointer;
    box-shadow:0 6px 18px rgba(43,179,163,.4); font-family:inherit;
  }
  #overlay button:active { transform:scale(.96); }
  #overlay .keys { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  #overlay .key {
    background:#fff; border:1px solid #cfe3e0; border-radius:8px; padding:6px 12px;
    font-size:12px; color:#3a4b5c; box-shadow:0 2px 0 #cfe3e0;
  }

  /* HUD */
  #hud { position:fixed; inset:0; z-index:10; pointer-events:none; display:none; }
  #crosshair {
    position:absolute; top:50%; left:50%; width:6px; height:6px;
    transform:translate(-50%,-50%); border-radius:50%;
    background:rgba(255,255,255,.85); box-shadow:0 0 6px rgba(0,0,0,.4);
  }
  #zone-label {
    position:absolute; top:18px; left:50%; transform:translateX(-50%);
    background:rgba(30,45,58,.78); color:#fff; padding:8px 20px; border-radius:20px;
    font-size:14px; font-weight:600; backdrop-filter:blur(4px); white-space:nowrap;
  }
  #mission-count {
    position:absolute; top:18px; left:16px;
    background:rgba(30,45,58,.78); color:#ffd166; padding:8px 16px; border-radius:20px;
    font-size:13px; font-weight:700;
  }
  #interact-hint {
    position:absolute; left:50%; bottom:130px; transform:translateX(-50%);
    background:rgba(43,179,163,.92); color:#fff; padding:10px 20px; border-radius:14px;
    font-size:14px; font-weight:600; display:none;
    box-shadow:0 6px 20px rgba(0,0,0,.25); white-space:nowrap; max-width:90vw;
  }

  #char-btn {
    position:fixed; top:18px; right:16px; z-index:20; display:none;
    background:rgba(41,128,185,.85); color:#fff; backdrop-filter:blur(6px);
    padding:8px 14px; border-radius:12px; font-size:13px; font-weight:700;
    border:1px solid rgba(255,255,255,.12); text-decoration:none;
    font-family:inherit;
  }

  /* 모바일 컨트롤 — 교실맵식 좌하단 고정 원형 조이스틱(항상 표시).
     bottom 오프셋은 하단 채팅바(#rt-chat-bar, 약 54px)에 가리지 않게 88px. */
  #joy-zone { position:fixed; left:24px; bottom:88px; width:120px; height:120px; z-index:20; display:none; touch-action:none; }
  #look-zone { position:fixed; right:0; bottom:0; width:55%; height:60%; z-index:20; display:none; }
  #joy-base {
    position:absolute; inset:0; border-radius:50%;
    border:2px solid rgba(255,255,255,.35); background:rgba(255,255,255,.12);
  }
  #joy-stick {
    position:absolute; width:48px; height:48px; border-radius:50%;
    background:rgba(255,255,255,.55); left:36px; top:36px;
    box-shadow:0 4px 12px rgba(0,0,0,.3);
  }
  #action-btn {
    position:fixed; right:28px; bottom:112px; width:74px; height:74px;
    border-radius:50%; z-index:21; display:none;
    background:rgba(43,179,163,.85); color:#fff; border:2px solid rgba(255,255,255,.4);
    font-size:15px; font-weight:800; font-family:inherit;
  }
  #action-btn.pulse { animation:pulse 1s infinite; background:rgba(60,179,113,.95); }
  @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.1); } }
  body.touch #joy-zone, body.touch #look-zone, body.touch #action-btn { display:block; }

  /* ssambus_missions.js의 기본 진행률 배지는 숨기고 HUD(#mission-count)만 사용 */
  #ms-progress { display:none !important; }
</style>
</head>
<body>

<!-- ssambus_realtime.js가 평소처럼 DOM에 쓰도록 두는 숨김 요소 (3D 어댑터가 매 프레임 읽어 미러링) -->
<div id="player" style="display:none"><svg viewBox="0 0 60 76"><g id="cg_p"></g></svg></div>
<div id="remote-players" style="display:none"></div>
<a id="char-btn" href="#">← 캐릭터 변경</a>

<div id="overlay">
  <div class="cross"></div>
  <h1>쌤버스 · 보건실</h1>
  <p>1인칭 시점으로 보건실을 탐험하며 미션 포인트를 찾아보세요.<br>빛나는 곳에 가까이 가서 미션을 수행하세요.</p>
  <div class="keys" id="pc-keys">
    <span class="key">W A S D 이동</span>
    <span class="key">마우스 시점</span>
    <span class="key">Shift 달리기</span>
    <span class="key">E 미션 수행</span>
    <span class="key">ESC 마우스 해제</span>
  </div>
  <button id="start-btn">입장하기</button>
</div>

<div id="hud">
  <div id="crosshair"></div>
  <div id="zone-label">보건실</div>
  <div id="mission-count">미션 0/0</div>
  <div id="interact-hint"></div>
</div>

<div id="joy-zone"><div id="joy-base"><div id="joy-stick"></div></div></div>
<div id="look-zone"></div>
<button id="action-btn">미션</button>

<div id="canvas-wrap"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../ssambus_supabase_config.js"></script>
<script src="../ssambus_character_render.js"></script>
<script src="../ssambus_realtime.js"></script>
<script src="../ssambus_missions.js"></script>
<script src="ssambus_3d_adapter.js"></script>
<script>
/* =========================================================
   쌤버스 3D 보건실 맵
   - 맵 크기: 36m x 24m (30명 동시 활동 가능)
   - 1인칭 시점(PC: 포인터락 / 모바일: 고정 조이스틱+드래그)
   - 쌤버스 공용 시스템 통합: 실시간 멀티(ssambus_realtime.js)
     + 미션(ssambus_missions.js, trigger_point) + 3D 어댑터
   ========================================================= */

// ---------- 기본 설정 ----------
const ROOM_W = 36, ROOM_D = 24, WALL_H = 4.2;
const HW = ROOM_W/2, HD = ROOM_D/2;
const PLAYER_H = 1.6, PLAYER_R = 0.35;

/* ── 쌤버스 통합: URL 파라미터 + 캐릭터 외형 + 위치(r/c=z/x, TS=1) ── */
var TEACHER_VIEW = new URLSearchParams(window.location.search).get('teacherView') === '1';
var TS = 1;
var __savedChar = (function(){
  try{
    var _cp = new URLSearchParams(window.location.search).get('c');
    if(_cp) return JSON.parse(_cp);
    return JSON.parse(localStorage.getItem('ssambus_player_character'));
  }catch(e){ return null; }
})();
var PLAYER = Object.assign({
  type:'student', skin:'#FDEBD0', hcolor:'#1a1008', hair:'short',
  ccolor:'#1a3a6b', cloth:'suit', gender:'male', acc:[], dir:'down'
}, __savedChar || {});
var pos = { r: 0, c: 0 }; // ssambus_3d_adapter.js가 매 프레임 camera 위치로 갱신

/* ── 캐릭터 변경 버튼 (2D 맵의 #char-btn과 동일 동작, teacherMode 유지) ── */
(function(){
  var params = new URLSearchParams(window.location.search);
  var room = params.get('room');
  if(!room || TEACHER_VIEW) return;
  var btn = document.getElementById('char-btn');
  if(!btn) return;
  var nickname = params.get('nickname') || '';
  try{ nickname = nickname || sessionStorage.getItem('ssambus_nickname') || ''; }catch(e){}
  var q = 'room=' + encodeURIComponent(room) + '&map=' + encodeURIComponent('ssamverse3d/health-room-3d.html');
  if(nickname) q += '&nickname=' + encodeURIComponent(nickname);
  if(params.get('teacherMode') === '1') q += '&teacherMode=1'; // 애니 캐릭터 잠금 면제 유지
  btn.href = '../ssambus_characters.html?' + q;
  btn.style.display = 'inline-block';
})();

/* ── 터치 판정: OR 판정(미디어쿼리 단독은 일부 기기 오탐) ── */
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0
  || matchMedia('(hover: none) and (pointer: coarse)').matches;
if (isTouch) document.body.classList.add('touch');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdff0f5);
scene.fog = new THREE.Fog(0xdff0f5, 30, 70);

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 120);
camera.position.set(0, PLAYER_H, HD - 3);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('canvas-wrap').appendChild(renderer.domElement);

// ---------- 조명 ----------
scene.add(new THREE.HemisphereLight(0xffffff, 0xb8d4d0, 0.75));
const sun = new THREE.DirectionalLight(0xfff4e0, 0.85);
sun.position.set(12, 18, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -25; sun.shadow.camera.right = 25;
sun.shadow.camera.top = 25;   sun.shadow.camera.bottom = -25;
scene.add(sun);
// 실내 천장등 느낌의 포인트 라이트
[[-12,0],[0,0],[12,0]].forEach(([x,z])=>{
  const pl = new THREE.PointLight(0xffffff, 0.25, 28);
  pl.position.set(x, WALL_H-0.5, z);
  scene.add(pl);
});

// ---------- 재질 ----------
const M = {
  floor:  new THREE.MeshLambertMaterial({ color:0xeef4ee }),
  floor2: new THREE.MeshLambertMaterial({ color:0xdcebe4 }),
  wall:   new THREE.MeshLambertMaterial({ color:0xf6fbf9 }),
  wallLo: new THREE.MeshLambertMaterial({ color:0xbfe3da }),
  white:  new THREE.MeshLambertMaterial({ color:0xffffff }),
  metal:  new THREE.MeshLambertMaterial({ color:0xb9c4cc }),
  steel:  new THREE.MeshLambertMaterial({ color:0x8e9aa4 }),
  wood:   new THREE.MeshLambertMaterial({ color:0xd8b78e }),
  woodDk: new THREE.MeshLambertMaterial({ color:0xa9825c }),
  mint:   new THREE.MeshLambertMaterial({ color:0x7fd1c5 }),
  mintDk: new THREE.MeshLambertMaterial({ color:0x2bb3a3 }),
  red:    new THREE.MeshLambertMaterial({ color:0xff6b6b }),
  blanket:new THREE.MeshLambertMaterial({ color:0xa8d8ce }),
  pillow: new THREE.MeshLambertMaterial({ color:0xffffff }),
  curtain:new THREE.MeshLambertMaterial({ color:0xcfe9e2, transparent:true, opacity:0.85, side:THREE.DoubleSide }),
  glass:  new THREE.MeshLambertMaterial({ color:0xa8d8ef, transparent:true, opacity:0.35 }),
  navy:   new THREE.MeshLambertMaterial({ color:0x3a5a78 }),
  yellow: new THREE.MeshLambertMaterial({ color:0xffd166 }),
  green:  new THREE.MeshLambertMaterial({ color:0x74c69d }),
  skin:   new THREE.MeshLambertMaterial({ color:0xf1e0c5 }),
  black:  new THREE.MeshLambertMaterial({ color:0x37474f }),
};

// ---------- 충돌 박스 ----------
const colliders = []; // {minX,maxX,minZ,maxZ}
function addCollider(cx, cz, w, d, pad=0.05){
  colliders.push({ minX:cx-w/2-pad, maxX:cx+w/2+pad, minZ:cz-d/2-pad, maxZ:cz+d/2+pad });
}

// ---------- 유틸 ----------
function box(w,h,d,mat,x,y,z,shadow=true){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z);
  m.castShadow = shadow; m.receiveShadow = true;
  scene.add(m);
  return m;
}
function cyl(rt,rb,h,mat,x,y,z,seg=16){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
  m.position.set(x,y,z);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  return m;
}
function makeTextTexture(text, opt={}){
  const c = document.createElement('canvas');
  c.width = opt.w||512; c.height = opt.h||256;
  const g = c.getContext('2d');
  g.fillStyle = opt.bg||'#ffffff'; g.fillRect(0,0,c.width,c.height);
  if (opt.border){ g.strokeStyle=opt.border; g.lineWidth=14; g.strokeRect(7,7,c.width-14,c.height-14); }
  g.fillStyle = opt.color||'#2c3e50';
  g.font = `bold ${opt.size||72}px 'Malgun Gothic',sans-serif`;
  g.textAlign='center'; g.textBaseline='middle';
  const lines = text.split('\n');
  const lh = (opt.size||72)*1.25;
  lines.forEach((ln,i)=> g.fillText(ln, c.width/2, c.height/2 + (i-(lines.length-1)/2)*lh));
  const tx = new THREE.CanvasTexture(c);
  return tx;
}
function sign(text, w, h, x, y, z, ry=0, opt={}){
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(w,h),
    new THREE.MeshBasicMaterial({ map:makeTextTexture(text,opt) })
  );
  m.position.set(x,y,z); m.rotation.y = ry;
  scene.add(m);
  return m;
}

// =========================================================
// 1. 방 구조 (바닥 / 벽 / 창문 / 문)
// =========================================================
(function buildRoom(){
  // 체크무늬 바닥
  const TILE = 3;
  for(let ix=0; ix<ROOM_W/TILE; ix++){
    for(let iz=0; iz<ROOM_D/TILE; iz++){
      const t = new THREE.Mesh(new THREE.PlaneGeometry(TILE,TILE), (ix+iz)%2? M.floor : M.floor2);
      t.rotation.x = -Math.PI/2;
      t.position.set(-HW+TILE/2+ix*TILE, 0, -HD+TILE/2+iz*TILE);
      t.receiveShadow = true;
      scene.add(t);
    }
  }
  // 천장 — 단면(아래에서만 보임): DoubleSide로 두면 교사 실시간 맵 보기(위에서 조감)가 막힘
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W,ROOM_D), new THREE.MeshLambertMaterial({color:0xf9fcfb}));
  ceil.rotation.x = Math.PI/2; ceil.position.y = WALL_H;
  scene.add(ceil);

  // 벽 4면 (하단 민트 몰딩 포함)
  const wallDefs = [
    { x:0, z:-HD, w:ROOM_W, ry:0 },          // 북
    { x:0, z: HD, w:ROOM_W, ry:Math.PI },    // 남
    { x:-HW, z:0, w:ROOM_D, ry:Math.PI/2 },  // 서
    { x: HW, z:0, w:ROOM_D, ry:-Math.PI/2 }, // 동
  ];
  wallDefs.forEach(wd=>{
    const wall = new THREE.Mesh(new THREE.PlaneGeometry(wd.w, WALL_H), M.wall);
    wall.position.set(wd.x, WALL_H/2, wd.z); wall.rotation.y = wd.ry;
    wall.receiveShadow = true; scene.add(wall);
    const lo = new THREE.Mesh(new THREE.PlaneGeometry(wd.w, 1.1), M.wallLo);
    lo.position.set(wd.x, 0.55, wd.z); lo.rotation.y = wd.ry;
    lo.position.add(new THREE.Vector3(Math.sin(wd.ry), 0, Math.cos(wd.ry)).multiplyScalar(0.01));
    scene.add(lo);
  });
  // 벽 충돌 (경계)
  colliders.push({minX:-HW-1, maxX:-HW, minZ:-HD-1, maxZ:HD+1});
  colliders.push({minX: HW,  maxX: HW+1, minZ:-HD-1, maxZ:HD+1});
  colliders.push({minX:-HW-1, maxX:HW+1, minZ:-HD-1, maxZ:-HD});
  colliders.push({minX:-HW-1, maxX:HW+1, minZ: HD,  maxZ:HD+1});

  // 북쪽 벽 창문 5개
  for(let i=0;i<5;i++){
    const wx = -14 + i*7;
    box(4.2, 2.0, 0.08, M.glass, wx, 2.3, -HD+0.06, false);
    box(4.4, 0.12, 0.14, M.white, wx, 1.28, -HD+0.07);
    box(4.4, 0.12, 0.14, M.white, wx, 3.32, -HD+0.07);
    box(0.12, 2.16, 0.14, M.white, wx-2.15, 2.3, -HD+0.07);
    box(0.12, 2.16, 0.14, M.white, wx+2.15, 2.3, -HD+0.07);
  }

  // 남쪽 벽 출입문 2개 (미닫이 느낌) — 출구로 사용
  [-10, 10].forEach(dx=>{
    box(2.6, 2.6, 0.12, M.wood, dx, 1.3, HD-0.07);
    box(0.35, 0.1, 0.2, M.steel, dx-0.9, 1.15, HD-0.16);
    sign('출입구', 1.6, 0.5, dx, 2.85, HD-0.1, Math.PI, {bg:'#2bb3a3', color:'#ffffff', size:88});
  });

  // 보건실 안내판 (남쪽 중앙)
  sign('🏥 보건실\nHealth Room', 5, 2, 0, 2.6, HD-0.08, Math.PI, {bg:'#ffffff', color:'#2bb3a3', border:'#2bb3a3', size:80});
})();

// =========================================================
// 2. 침대 구역 (북쪽 벽, 침대 10개 + 커튼)
// =========================================================
(function buildBeds(){
  const BED_W = 1.1, BED_L = 2.2, GAP = 3.3;
  const startX = -HW + 3.2;
  for(let i=0;i<10;i++){
    const bx = startX + i*GAP;
    const bz = -HD + 2.2;
    // 프레임 + 매트리스
    box(BED_W, 0.35, BED_L, M.steel, bx, 0.35, bz);
    box(BED_W, 0.18, BED_L, M.white, bx, 0.6, bz);
    // 베개 / 이불
    box(0.7, 0.12, 0.4, M.pillow, bx, 0.75, bz - BED_L/2 + 0.35);
    box(BED_W-0.05, 0.1, 1.3, M.blanket, bx, 0.73, bz + 0.35);
    // 다리 4개
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>{
      cyl(0.04,0.04,0.36,M.steel, bx+sx*(BED_W/2-0.08), 0.18, bz+sz*(BED_L/2-0.1), 8);
    });
    // 헤드보드
    box(BED_W, 0.55, 0.06, M.steel, bx, 0.85, bz - BED_L/2);
    addCollider(bx, bz, BED_W, BED_L);

    // 침대 사이 커튼 (레일 + 커튼)
    if (i < 9){
      const cx2 = bx + GAP/2;
      cyl(0.025,0.025,3.0,M.steel, cx2, 2.5, -HD+1.8, 8).rotation.x = Math.PI/2;
      const cur = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 1.9), M.curtain);
      cur.position.set(cx2, 1.5, -HD+1.8);
      cur.rotation.y = Math.PI/2;
      scene.add(cur);
    }
    // 침대 옆 협탁 (짝수 침대에만)
    if (i%2===0){
      box(0.5,0.55,0.5,M.wood, bx+BED_W/2+0.4, 0.28, bz - 0.5);
      cyl(0.09,0.06,0.18,M.mint, bx+BED_W/2+0.4, 0.65, bz-0.5, 10); // 컵
      addCollider(bx+BED_W/2+0.4, bz-0.5, 0.5, 0.5);
    }
  }
  sign('😴 침대 구역', 3.4, 0.9, 0, 3.5, -HD+0.09, 0, {bg:'#a8d8ce', color:'#1e3d38', size:76});
})();

// =========================================================
// 3. 처치(치료) 구역 (서쪽)
// =========================================================
(function buildTreatment(){
  const zx = -HW + 2.5;
  // 처치대 2개
  [ -2, 2 ].forEach(dz=>{
    box(2.0, 0.85, 0.9, M.white, zx, 0.43, dz);

// =========================================================
function makeLabel(text) {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 128;
  const c = cv.getContext('2d');
  c.font = 'bold 56px "Malgun Gothic", sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = 'rgba(30,45,58,0.78)';
  const w = c.measureText(text).width + 60;
  c.beginPath(); c.roundRect((512-w)/2, 14, w, 100, 22); c.fill();
  c.fillStyle = '#fff';
  c.fillText(text, 256, 66);
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true}));
  sp.scale.set(5, 1.25, 1);
  return sp;
}

const missionMarkers = {}; // id -> {data, group, ring, beam, orb}
let missionMarkersBuilt = false;
function buildMissionMarkers(){
  if (missionMarkersBuilt) return;
  if (typeof __msMissions === 'undefined' || __msMissions === null) return;
  missionMarkersBuilt = true;
  __msMissions.forEach(m => {
    if (!m.trigger_point) return;
    const group = new THREE.Group();
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.55, 0.75, 32),
      new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.85, side: THREE.DoubleSide })
    );
    ring.rotation.x = -Math.PI/2;
    ring.position.y = 0.03;
    group.add(ring);
    const beam = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12, 0.3, 2.6, 12, 1, true),
      new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.25 })
    );
    beam.position.y = 1.3;
    group.add(beam);
    const orb = new THREE.Mesh(
      new THREE.SphereGeometry(0.18, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xffe6a8 })
    );
    orb.position.y = 1.6;
    group.add(orb);
    const label = makeLabel(m.title || '미션');
    label.position.y = 2.6;
    group.add(label);
    group.position.set(m.trigger_point.x, 0, m.trigger_point.z);
    scene.add(group);
    missionMarkers[m.id] = { data: m, group, ring, beam, orb };
  });
}
function refreshMissionMarkers(){
  buildMissionMarkers();
  if (typeof __msDone === 'undefined') return;
  for (const id in missionMarkers) {
    const mk = missionMarkers[id];
    const done = __msDone.has(id);
    mk.beam.visible = !done;
    mk.ring.material.color.set(done ? 0x74c69d : 0xffd166);
    mk.orb.material.color.set(done ? 0xa8d8ce : 0xffe6a8);
  }
}

// 포인터락 요청: unadjustedMovement(OS 마우스 가속 우회) — Windows+Chrome movementX/Y 스파이크(시점 튐) 방지. 미지원 시 폴백
function lockPtr(el){
  try {
    const p = el.requestPointerLock({ unadjustedMovement: true });
    if (p && p.catch) p.catch(() => { try { el.requestPointerLock(); } catch(e){} });
  } catch(e) { try { el.requestPointerLock(); } catch(e2){} }
}
startBtn.addEventListener('click', ()=>{
  started = true;
  overlay.style.display = 'none';
  hud.style.display = 'block';
  if (!isTouch) lockPtr(renderer.domElement);
});
if (isTouch) document.getElementById('pc-keys').innerHTML =
  '<span class="key">왼쪽 레버 이동</span><span class="key">오른쪽 드래그 시점</span><span class="key">버튼 미션 수행</span>';

document.addEventListener('pointerlockchange', ()=>{
  locked = document.pointerLockElement === renderer.domElement;
  if (locked) skipLook = true;
});
renderer.domElement.addEventListener('click', ()=>{
  if (started && !isTouch && !modalOpen && !TEACHER_VIEW && !locked) lockPtr(renderer.domElement);
});
document.addEventListener('mousemove', e=>{
  if (!locked) return;
  if (skipLook) { skipLook = false; return; }
  // 스파이크 필터: 한 이벤트에 200px 이상 델타는 물리적으로 불가능(Chrome/Windows 포인터락 버그) → 무시
  if (Math.abs(e.movementX) > 200 || Math.abs(e.movementY) > 200) return;
  player.yaw   -= e.movementX * 0.0022;
  player.pitch -= e.movementY * 0.0022;
  player.pitch = Math.max(-1.35, Math.min(1.35, player.pitch));
});

/* ── 모바일: 좌하단 고정 조이스틱 + 오른쪽 드래그 (교실맵과 동일 방식) ── */
const joy = { active:false, id:null, dx:0, dy:0 };
const look = { id:null, lx:0, ly:0 };
const joyZone = document.getElementById('joy-zone');
const lookZone = document.getElementById('look-zone');
const joyStick = document.getElementById('joy-stick');
const JOY_MAX = 45;            // 노브 최대 이동 반경(px)
const JOY_REST = 36;           // 노브 중앙 위치(zone 120 − knob 48)/2

function joyUpdate(t) {
  const r = joyZone.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let dx = t.clientX - cx, dy = t.clientY - cy;
  const d = Math.hypot(dx, dy);
  if (d > JOY_MAX) { dx = dx / d * JOY_MAX; dy = dy / d * JOY_MAX; }
  joy.dx = dx / JOY_MAX; joy.dy = dy / JOY_MAX;
  joyStick.style.left = (JOY_REST + dx) + 'px';
  joyStick.style.top  = (JOY_REST + dy) + 'px';
}
function joyReset() {
  joy.active = false; joy.id = null; joy.dx = 0; joy.dy = 0;
  joyStick.style.left = JOY_REST + 'px'; joyStick.style.top = JOY_REST + 'px';
}
joyZone.addEventListener('touchstart', e => {
  if (joy.id !== null) return;
  const t = e.changedTouches[0];
  joy.active = true; joy.id = t.identifier;
  joyUpdate(t);
}, {passive:true});
joyZone.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) { if (t.identifier === joy.id) joyUpdate(t); }
}, {passive:true});
joyZone.addEventListener('touchend', e => {
  for (const t of e.changedTouches) { if (t.identifier === joy.id) joyReset(); }
});
joyZone.addEventListener('touchcancel', e => {
  for (const t of e.changedTouches) { if (t.identifier === joy.id) joyReset(); }
});

lookZone.addEventListener('touchstart', e => {
  const t = e.changedTouches[0];
  look.id = t.identifier; look.lx = t.clientX; look.ly = t.clientY;
}, {passive:true});
lookZone.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    if (t.identifier !== look.id) continue;
    player.yaw   -= (t.clientX - look.lx) * 0.005;
    player.pitch -= (t.clientY - look.ly) * 0.005;
    player.pitch = Math.max(-1.35, Math.min(1.35, player.pitch));
    look.lx = t.clientX; look.ly = t.clientY;
  }
}, {passive:true});

document.getElementById('action-btn').addEventListener('click', ()=>{
  if (nearMission && !modalOpen && !TEACHER_VIEW) tryInteract();
});

// ---------- 충돌 이동 ----------
function collideMove(px, pz, nx, nz){
  let rx = nx, rz = nz;
  // X축 이동 검사
  for (const c of colliders){
    if (rx+PLAYER_R > c.minX && rx-PLAYER_R < c.maxX && pz+PLAYER_R > c.minZ && pz-PLAYER_R < c.maxZ){
      rx = px; break;
    }
  }
  // Z축 이동 검사
  for (const c of colliders){
    if (rx+PLAYER_R > c.minX && rx-PLAYER_R < c.maxX && rz+PLAYER_R > c.minZ && rz-PLAYER_R < c.maxZ){
      rz = pz; break;
    }
  }
  return [rx, rz];
}

// ---------- 이동 ----------
function movePlayer(dt, t){
  let mx = 0, mz = 0;
  if (keys['KeyW']||keys['ArrowUp'])    mz -= 1;
  if (keys['KeyS']||keys['ArrowDown'])  mz += 1;
  if (keys['KeyA']||keys['ArrowLeft'])  mx -= 1;
  if (keys['KeyD']||keys['ArrowRight']) mx += 1;
  mx += joy.dx; mz += joy.dy;
  const len = Math.hypot(mx, mz);
  if (len > 0.01){
    mx /= Math.max(len,1); mz /= Math.max(len,1);
    const speed = (keys['ShiftLeft']||keys['ShiftRight']) ? 7.5 : 4.5;
    const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
    const dx = (mx*cos + mz*sin) * speed * dt;
    const dz = (mz*cos - mx*sin) * speed * dt;
    const [nx, nz] = collideMove(player.x, player.z, player.x + dx, player.z + dz);
    player.x = nx; player.z = nz;
    // 걷기 흔들림
    camera.position.set(player.x, PLAYER_H + Math.sin(t*10)*0.03, player.z);
  } else {
    camera.position.set(player.x, PLAYER_H, player.z);
  }
  // roll(z)을 항상 0으로 고정 — 개별 .x/.y 대입만 하면 lookAt 등이 남긴 roll이
  // YXZ 순서로 적용돼 화면이 기울어질 수 있음(forest3d에서 발견된 버그 패턴).
  camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');
}

// ---------- 구역 표시 ----------
const zoneLabel = document.getElementById('zone-label');
function currentZone(x, z){
  if (z < -HD+4.5) return '😴 침대 구역';
  if (x < -HW+5)   return '🩹 처치 구역';
  if (x > HW-6 && z < 0) return '👩‍⚕️ 보건교사 데스크';
  if (x > HW-6 && z >= 0) return '💬 상담 구역';
  if (z > HD-4)    return '🚪 입구 · 대기 구역';
  if (x > -8 && x < -3 && z > 4) return '📏 신체측정 구역';
  return '🏥 보건실';
}

// ---------- 미션 상호작용 (ssambus_missions.js의 #ms-overlay 모달 사용) ----------
let nearMission = null; // checkMission3D()가 반환한 ssambus 미션 객체(또는 null)
const hintEl = document.getElementById('interact-hint');
const actionBtn = document.getElementById('action-btn');

function tryInteract(){
  if (!nearMission || modalOpen) return;
  if (document.pointerLockElement) document.exitPointerLock();
  __msOpenMission([nearMission]); // ssambus 모달로 문제 표시/채점/완료
}

/* ── 쌤버스 통합 초기화 (실시간 멀티플레이어 + 미션 + 3D 어댑터) ── */
try { initRealtime('health3d'); } catch (e) { console.warn('[health3d] realtime:', e); }
if (!TEACHER_VIEW) {
  try { initMissionSystem('health3d'); } catch (e) { console.warn('[health3d] missions:', e); }
}
try { SsamAdapter3D.init({ THREE, scene, camera }); } catch (e) { console.warn('[health3d] adapter:', e); }

/* ── 교사 실시간 맵 보기(teacherView=1): 자동 시작 + 조감 시점 고정(관찰 전용) ──
   started=true 라야 SsamAdapter3D.update()가 돌아 원격 학생 스프라이트가 동기화된다. */
if (TEACHER_VIEW) {
  overlay.style.display = 'none';
  hud.style.display = 'block';
  started = true;
  camera.position.set(0, 15, HD + 4); // 남쪽(+Z) 위에서 보건실 안쪽을 내려다봄
  camera.lookAt(0, 1, 0);
}

// ---------- 메인 루프 ----------
const clock = new THREE.Clock();
let zoneTick = 0;
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // 모달 열림 추적 — 닫히면 포인터락 복원
  const wasModal = modalOpen;
  modalOpen = isMsModalOpen();
  if (wasModal && !modalOpen && started && !isTouch && !TEACHER_VIEW) lockPtr(renderer.domElement);

  if (started && !modalOpen && !TEACHER_VIEW){
    movePlayer(dt, t);
    // 구역 표시 (매 프레임은 과함 → 5프레임마다)
    if (++zoneTick % 5 === 0){
      zoneLabel.textContent = currentZone(player.x, player.z);
    }
  }

  // 미션 마커 갱신(완료색) + 부유/회전 애니메이션
  refreshMissionMarkers();
  for (const id in missionMarkers) {
    const mk = missionMarkers[id];
    mk.orb.position.y = 1.6 + Math.sin(t * 2.2 + mk.group.position.x) * 0.1;
    mk.ring.rotation.z = t * 0.8;
  }

  // 근접 미션 판정 (Supabase에 교사가 배치한 trigger_point 기준)
  nearMission = (started && !modalOpen && !TEACHER_VIEW && typeof checkMission3D === 'function')
    ? checkMission3D(player.x, player.z)
    : null;

  if (started && !modalOpen && nearMission) {
    hintEl.style.display = 'block';
    hintEl.textContent = (isTouch ? '버튼 — ' : 'E — ') + (nearMission.title || '미션') + ' 수행';
    actionBtn.classList.add('pulse');
  } else {
    hintEl.style.display = 'none';
    actionBtn.classList.remove('pulse');
  }

  // 출구(남쪽 문) 판정 — 필수 미션 완료 시 다음 맵으로 자동 이동
  if (started && !modalOpen && !TEACHER_VIEW && !nearMission
      && typeof requestMapExit3D === 'function' && isAtExitDoor(player.x, player.z)) {
    const st = requestMapExit3D();
    if (st === 'incomplete' && !doorNoticeActive) {
      doorNoticeActive = true;
      if (typeof __msShowBlockedNotice === 'function') __msShowBlockedNotice();
    }
  } else {
    doorNoticeActive = false;
  }

  // 원격 학생 실시간 동기화 (모달 열려 있어도 계속)
  if (started && typeof SsamAdapter3D !== 'undefined') {
    try { SsamAdapter3D.update(dt, camera); } catch (e) {}
  }

  // HUD 진행률 (이 맵의 완료 수 / 이 맵의 미션 수 — __msDone.size는 방 전체 누적이라 맵 단위로 카운트)
  const __hids = Object.keys(missionMarkers);
  const __hdone = (typeof __msDone !== 'undefined') ? __hids.filter(id => __msDone.has(id)).length : 0;
  document.getElementById('mission-count').textContent = '미션 ' + __hdone + '/' + __hids.length;

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
