<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>쌤버스 3D - 컴퓨터실</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0d0f14; font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif; }
  #canvas { display:block; width:100%; height:100%; }

  /* 크로스헤어 */
  #crosshair {
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    width:6px; height:6px; border-radius:50%;
    background:rgba(255,255,255,.85); box-shadow:0 0 6px rgba(0,0,0,.6);
    pointer-events:none; z-index:10;
  }

  /* 시작 오버레이 */
  #overlay {
    position:fixed; inset:0; z-index:30;
    background:rgba(10,12,18,.82); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    color:#eaeef5; text-align:center; cursor:pointer;
  }
  #overlay h1 { font-size:28px; letter-spacing:2px; margin-bottom:8px; }
  #overlay .sub { color:#8fd6ff; font-size:14px; margin-bottom:24px; letter-spacing:4px; }
  #overlay .card {
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
    border-radius:14px; padding:20px 30px; line-height:1.9; font-size:14px;
  }
  #overlay .key { display:inline-block; background:#2a3242; border:1px solid #4a556b;
    border-radius:6px; padding:1px 9px; margin:0 2px; font-size:12px; }
  #overlay .start { margin-top:26px; font-size:15px; color:#ffd66e; animation:blink 1.6s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.45} }

  /* 위치 표시 + 미션 카운트 */
  #zone {
    position:fixed; top:16px; left:50%; transform:translateX(-50%);
    background:rgba(15,20,30,.72); border:1px solid rgba(140,180,255,.25);
    color:#dce8ff; padding:7px 20px; border-radius:20px; font-size:14px;
    letter-spacing:1px; z-index:10; pointer-events:none;
    transition:opacity .3s;
  }
  #mission-count {
    position:fixed; top:16px; left:16px; z-index:10; pointer-events:none;
    background:rgba(15,20,30,.72); border:1px solid rgba(140,180,255,.25);
    color:#ffd66e; padding:7px 16px; border-radius:20px; font-size:13px; font-weight:700;
  }
  #interact-hint {
    position:fixed; left:50%; bottom:18%; transform:translateX(-50%);
    z-index:10; background:rgba(15,20,30,.85); color:#fff; border:1px solid #8fd6ff;
    border-radius:10px; padding:10px 20px; font-size:14px; display:none; pointer-events:none;
    white-space:nowrap;
  }
  #interact-hint b { color:#8fd6ff; }

  #char-btn {
    position:fixed; top:16px; right:16px; z-index:20; display:none;
    background:rgba(41,128,185,.85); color:#fff; backdrop-filter:blur(6px);
    padding:8px 14px; border-radius:12px; font-size:13px; font-weight:700;
    border:1px solid rgba(255,255,255,.12); text-decoration:none;
    font-family:inherit;
  }

  /* 모바일 컨트롤 — 교실맵식 좌하단 고정 원형 조이스틱(항상 표시).
     bottom 오프셋은 하단 채팅바(#rt-chat-bar, 약 54px)에 가리지 않게 88px. */
  #joy-zone { position:fixed; left:24px; bottom:88px; width:120px; height:120px; z-index:20; display:none; touch-action:none; }
  #look-zone { position:fixed; right:0; bottom:0; width:55%; height:60%; z-index:20; display:none; }
  #joy-base {
    position:absolute; inset:0; border-radius:50%;
    border:1.5px solid rgba(255,255,255,.35); background:rgba(255,255,255,.08);
  }
  #joy-stick {
    position:absolute; width:48px; height:48px; border-radius:50%;
    background:rgba(255,255,255,.4); left:36px; top:36px;
    border:1.5px solid rgba(255,255,255,.5);
    box-shadow:0 4px 12px rgba(0,0,0,.3);
  }
  #action-btn {
    position:fixed; right:28px; bottom:112px; width:74px; height:74px;
    border-radius:50%; z-index:21; display:none;
    background:rgba(42,114,200,.8); color:#fff; border:2px solid rgba(255,255,255,.4);
    font-size:15px; font-weight:800; font-family:inherit;
  }
  #action-btn.pulse { animation:pulse 1s infinite; background:rgba(60,179,113,.9); }
  @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.1); } }
  body.touch #joy-zone, body.touch #look-zone, body.touch #action-btn { display:block; }
  body.touch #crosshair { display:none; }

  /* ssambus_missions.js의 기본 진행률 배지는 숨기고 HUD(#mission-count)만 사용 */
  #ms-progress { display:none !important; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="crosshair"></div>
<div id="zone">💻 컴퓨터실</div>
<div id="mission-count">미션 0/0</div>
<div id="interact-hint"><b>[E]</b> <span id="hint-text">미션 수행하기</span></div>

<!-- ssambus_realtime.js가 평소처럼 DOM에 쓰도록 두는 숨김 요소 (3D 어댑터가 매 프레임 읽어 미러링) -->
<div id="player" style="display:none"><svg viewBox="0 0 60 76"><g id="cg_p"></g></svg></div>
<div id="remote-players" style="display:none"></div>
<a id="char-btn" href="#">← 캐릭터 변경</a>

<div id="overlay">
  <h1>💻 컴퓨터실</h1>
  <div class="sub">SSAMVERSE 3D MAP</div>
  <div class="card">
    <div><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> 이동 &nbsp;|&nbsp; <span class="key">Shift</span> 달리기 &nbsp;|&nbsp; <span class="key">E</span> 미션 &nbsp;|&nbsp; 마우스 시점 회전</div>
    <div>모바일: 왼쪽 레버 이동, 오른쪽 화면 드래그 시점 회전</div>
    <div style="margin-top:6px; color:#9fb2cc;">뒤쪽 문으로 <b style="color:#7fe3a0;">서버실</b> · <b style="color:#ffce7a;">교무실</b> 입장 가능</div>
  </div>
  <div class="start">화면을 클릭 / 터치하면 시작합니다</div>
</div>

<div id="joy-zone"><div id="joy-base"><div id="joy-stick"></div></div></div>
<div id="look-zone"></div>
<button id="action-btn">미션</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../ssambus_supabase_config.js"></script>
<script src="../ssambus_character_render.js"></script>
<script src="../ssambus_realtime.js"></script>
<script src="../ssambus_missions.js"></script>
<script src="ssambus_3d_adapter.js"></script>
<script>
/* ============================================================
   쌤버스 3D 맵 - 컴퓨터실 (Computer Lab)
   구조
   - 메인 컴퓨터실 : x -16~16, z -12~12  (32m x 24m, 학생용 책상 30개)
   - 서버실       : x -14~-4, z 12~19   (뒷벽 왼쪽 문)
   - 교무실       : x   4~14, z 12~19   (뒷벽 오른쪽 문)
   - 스폰 지점    : (0, 10)
   - 쌤버스 공용 시스템 통합: 실시간 멀티(ssambus_realtime.js)
     + 미션(ssambus_missions.js, trigger_point) + 3D 어댑터
   ============================================================ */

const MAP_DATA = {
  name: "computer3d",
  spawn: { x: 0, z: 10 },
  zones: [
    { id: "lab",    label: "💻 컴퓨터실", minX:-16, maxX:16,  minZ:-12, maxZ:12 },
    { id: "server", label: "🖥️ 서버실",   minX:-14, maxX:-4,  minZ:12,  maxZ:19 },
    { id: "office", label: "📋 교무실",   minX:4,   maxX:14,  minZ:12,  maxZ:19 }
  ]
};

/* ── 쌤버스 통합: URL 파라미터 + 캐릭터 외형 + 위치(r/c=z/x, TS=1) ──
   주의: 원본이 플레이어 위치로 쓰던 `const pos`(Vector3)는 realtime.js의
   전역 pos(r/c 객체)와 이름이 충돌해서 player 객체로 교체함 */
var TEACHER_VIEW = new URLSearchParams(window.location.search).get('teacherView') === '1';
var TS = 1;
var __savedChar = (function(){
  try{
    var _cp = new URLSearchParams(window.location.search).get('c');
    if(_cp) return JSON.parse(_cp);
    return JSON.parse(localStorage.getItem('ssambus_player_character'));
  }catch(e){ return null; }
})();
var PLAYER = Object.assign({
  type:'student', skin:'#FDEBD0', hcolor:'#1a1008', hair:'short',
  ccolor:'#1a3a6b', cloth:'suit', gender:'male', acc:[], dir:'down'
}, __savedChar || {});
var pos = { r: 0, c: 0 }; // ssambus_3d_adapter.js가 매 프레임 camera 위치로 갱신

/* ── 캐릭터 변경 버튼 (2D 맵의 #char-btn과 동일 동작, teacherMode 유지) ── */
(function(){
  var params = new URLSearchParams(window.location.search);
  var room = params.get('room');
  if(!room || TEACHER_VIEW) return;
  var btn = document.getElementById('char-btn');
  if(!btn) return;
  var nickname = params.get('nickname') || '';
  try{ nickname = nickname || sessionStorage.getItem('ssambus_nickname') || ''; }catch(e){}
  var q = 'room=' + encodeURIComponent(room) + '&map=' + encodeURIComponent('ssamverse3d/ssamverse-3d-lab.html');
  if(nickname) q += '&nickname=' + encodeURIComponent(nickname);
  if(params.get('teacherMode') === '1') q += '&teacherMode=1'; // 애니 캐릭터 잠금 면제 유지
  btn.href = '../ssambus_characters.html?' + q;
  btn.style.display = 'inline-block';
})();

/* ── 터치 판정: OR 판정(미디어쿼리 단독은 일부 기기 오탐) ── */
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0
  || matchMedia('(hover: none) and (pointer: coarse)').matches;
if (isTouch) document.body.classList.add('touch');

// ---------- 기본 세팅 ----------
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10141c);
scene.fog = new THREE.Fog(0x10141c, 30, 70);

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 120);
const EYE = 1.6;
camera.position.set(MAP_DATA.spawn.x, EYE, MAP_DATA.spawn.z);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- 조명 ----------
scene.add(new THREE.HemisphereLight(0xbcd4ff, 0x30281e, 0.55));
const sun = new THREE.DirectionalLight(0xfff2dd, 0.55);
sun.position.set(-8, 14, -6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -25; sun.shadow.camera.right = 25;
sun.shadow.camera.top = 25;   sun.shadow.camera.bottom = -25;
scene.add(sun);

function roomLight(x, z, color, intensity, dist) {
  const l = new THREE.PointLight(color, intensity, dist, 1.6);
  l.position.set(x, 2.9, z);
  scene.add(l);
}
roomLight(-8, -5, 0xeef4ff, 0.5, 18);
roomLight( 8, -5, 0xeef4ff, 0.5, 18);
roomLight(-8,  6, 0xeef4ff, 0.5, 18);
roomLight( 8,  6, 0xeef4ff, 0.5, 18);
roomLight(-9, 15.5, 0x9fd8ff, 0.7, 12);  // 서버실 - 푸른빛
roomLight( 9, 15.5, 0xffe6bd, 0.7, 12);  // 교무실 - 따뜻한 빛

// ---------- 재질 ----------
const MAT = {
  floorLab:   new THREE.MeshStandardMaterial({ color:0x9aa4ad, roughness:.85 }),
  floorSrv:   new THREE.MeshStandardMaterial({ color:0x3c4450, roughness:.7 }),
  floorOff:   new THREE.MeshStandardMaterial({ color:0xb99b74, roughness:.9 }),
  wall:       new THREE.MeshStandardMaterial({ color:0xe8e4da, roughness:.95 }),
  wallLower:  new THREE.MeshStandardMaterial({ color:0x8fa3b0, roughness:.9 }),
  ceiling:    new THREE.MeshStandardMaterial({ color:0xf2f0ea, roughness:1 }),
  deskTop:    new THREE.MeshStandardMaterial({ color:0xd7c7a8, roughness:.7 }),
  deskLeg:    new THREE.MeshStandardMaterial({ color:0x5a6068, roughness:.5, metalness:.5 }),
  chairSeat:  new THREE.MeshStandardMaterial({ color:0x3e6ea8, roughness:.8 }),
  chairLeg:   new THREE.MeshStandardMaterial({ color:0x444a52, metalness:.6, roughness:.4 }),
  aluminum:   new THREE.MeshStandardMaterial({ color:0xd9dce1, metalness:.75, roughness:.3 }),
  screenOn:   new THREE.MeshStandardMaterial({ color:0x0e1622, emissive:0x2a72c8, emissiveIntensity:.55, roughness:.35 }),
  screenBezel:new THREE.MeshStandardMaterial({ color:0x14161a, roughness:.4 }),
  whiteboard: new THREE.MeshStandardMaterial({ color:0xfbfbf9, roughness:.35 }),
  frame:      new THREE.MeshStandardMaterial({ color:0x8b929c, metalness:.6, roughness:.4 }),
  doorSrv:    new THREE.MeshStandardMaterial({ color:0x50606f, roughness:.6 }),
  doorOff:    new THREE.MeshStandardMaterial({ color:0x8a6b4a, roughness:.7 }),
  rack:       new THREE.MeshStandardMaterial({ color:0x1d2229, roughness:.5, metalness:.35 }),
  rackFace:   new THREE.MeshStandardMaterial({ color:0x12161c, roughness:.45 }),
  cabinet:    new THREE.MeshStandardMaterial({ color:0xa9b2ba, metalness:.4, roughness:.55 }),
  teacherDesk:new THREE.MeshStandardMaterial({ color:0x7a5a3d, roughness:.75 }),
  plantPot:   new THREE.MeshStandardMaterial({ color:0xb5563c, roughness:.9 }),
  plantLeaf:  new THREE.MeshStandardMaterial({ color:0x3f8f4e, roughness:.9 }),
  lightPanel: new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0xf5f8ff, emissiveIntensity:.85 })
};

// ---------- 충돌 시스템 (AABB) ----------
const colliders = [];
function addCollider(minX, maxX, minZ, maxZ) { colliders.push({ minX, maxX, minZ, maxZ }); }
const PLAYER_R = 0.32;
function collide(x, z) {
  for (const c of colliders) {
    if (x > c.minX - PLAYER_R && x < c.maxX + PLAYER_R &&
        z > c.minZ - PLAYER_R && z < c.maxZ + PLAYER_R) return true;
  }
  return false;
}

// ---------- 유틸 ----------
function box(w, h, d, mat, x, y, z, opts = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  if (opts.ry) m.rotation.y = opts.ry;
  m.castShadow = opts.cast !== false;
  m.receiveShadow = true;
  scene.add(m);
  if (opts.solid) addCollider(x - w/2, x + w/2, z - d/2, z + d/2);
  return m;
}

function makeLabelSprite(text, color) {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 160;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = 'rgba(15,20,28,.85)';
  const r = 34;
  ctx.beginPath();
  ctx.moveTo(r, 0); ctx.lineTo(512-r, 0); ctx.arcTo(512,0,512,r,r);
  ctx.lineTo(512,160-r); ctx.arcTo(512,160,512-r,160,r);
  ctx.lineTo(r,160); ctx.arcTo(0,160,0,160-r,r);
  ctx.lineTo(0,r); ctx.arcTo(0,0,r,0,r); ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 6; ctx.stroke();
  ctx.fillStyle = '#f2f6fc';
  ctx.font = 'bold 84px "Malgun Gothic", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 256, 86);
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true }));
  sp.scale.set(3.2, 1.0, 1);
  return sp;
}

// ============================================================
// 1. 바닥 · 천장
// ============================================================
function floorPlane(w, d, mat, x, z) {
  const f = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
  f.rotation.x = -Math.PI/2;
  f.position.set(x, 0, z);
  f.receiveShadow = true;
  scene.add(f);
}
floorPlane(32, 24, MAT.floorLab, 0, 0);          // 컴퓨터실
floorPlane(10, 7,  MAT.floorSrv, -9, 15.5);       // 서버실
floorPlane(10, 7,  MAT.floorOff,  9, 15.5);       // 교무실

// 천장은 단면(아래에서만 보임) — 교사 실시간 맵 보기(위에서 조감)가 가능
function ceilingPlane(w, d, x, z, h) {
  const c = new THREE.Mesh(new THREE.PlaneGeometry(w, d), MAT.ceiling);
  c.rotation.x = Math.PI/2;
  c.position.set(x, h, z);
  scene.add(c);
}
const CEIL = 3.2;
ceilingPlane(32, 24, 0, 0, CEIL);
ceilingPlane(10, 7, -9, 15.5, CEIL);
ceilingPlane(10, 7,  9, 15.5, CEIL);

// 천장 형광등 패널
for (let x = -12; x <= 12; x += 8) {
  for (let z = -8; z <= 8; z += 8) {
    box(2.4, 0.06, 1.2, MAT.lightPanel, x, CEIL - 0.05, z, { cast:false });
  }
}
box(2.2, 0.06, 1.1, MAT.lightPanel, -9, CEIL - 0.05, 15.5, { cast:false });
box(2.2, 0.06, 1.1, MAT.lightPanel,  9, CEIL - 0.05, 15.5, { cast:false });

// ============================================================
// 2. 벽 (문 개구부 포함)
// ============================================================
const WALL_H = 3.2, WT = 0.3;
function wall(x1, x2, z1, z2) {
  const w = Math.max(x2 - x1, WT), d = Math.max(z2 - z1, WT);
  const cx = (x1 + x2) / 2, cz = (z1 + z2) / 2;
  // 상부 벽
  box(w, WALL_H, d, MAT.wall, cx, WALL_H/2, cz, { solid:true });
  // 하부 몰딩
  box(w + 0.02, 0.9, d + 0.02, MAT.wallLower, cx, 0.45, cz, { cast:false });
}

// 컴퓨터실 외벽
wall(-16.3, -16,  -12.3, 12.3);   // 좌
wall( 16,    16.3,-12.3, 12.3);   // 우
wall(-16.3,  16.3,-12.3,-12);     // 앞 (화이트보드 벽)
// 뒷벽 (문 2개 개구부: 서버실 x -9.9~-8.1 / 교무실 x 8.1~9.9)
wall(-16.3, -9.9, 12, 12.3);
wall(-8.1,   8.1, 12, 12.3);
wall( 9.9,  16.3, 12, 12.3);
// 문 상단 인방(문 높이 2.2m 위)
box(1.8, WALL_H - 2.2, WT, MAT.wall, -9, 2.2 + (WALL_H-2.2)/2, 12.15, { cast:false });
box(1.8, WALL_H - 2.2, WT, MAT.wall,  9, 2.2 + (WALL_H-2.2)/2, 12.15, { cast:false });

// 서버실 벽
wall(-14.3, -14, 12.3, 19.3);     // 좌
wall(-4.3,  -4,  12.3, 19.3);     // 우
wall(-14.3, -4,  19,   19.3);     // 뒤
// 교무실 벽
wall( 4,    4.3, 12.3, 19.3);     // 좌
wall(14,   14.3, 12.3, 19.3);     // 우
wall( 4,   14.3, 19,   19.3);     // 뒤

// ---------- 문 (열린 상태, 통과 가능) ----------
function doorway(x, doorMat, label, color) {
  // 문틀
  box(0.12, 2.25, 0.4, MAT.frame, x - 0.95, 1.12, 12.15, { cast:false });
  box(0.12, 2.25, 0.4, MAT.frame, x + 0.95, 1.12, 12.15, { cast:false });
  box(2.0,  0.12, 0.4, MAT.frame, x, 2.26, 12.15, { cast:false });
  // 열린 문짝 (안쪽으로 열려 벽에 붙음)
  const door = box(0.08, 2.15, 0.85, doorMat, x - 0.92, 1.08, 12.6, { cast:true });
  addCollider(x - 0.98, x - 0.86, 12.18, 13.05);
  // 문패
  const sp = makeLabelSprite(label, color);
  sp.position.set(x, 2.75, 11.6);
  scene.add(sp);
  return door;
}
doorway(-9, MAT.doorSrv, '🖥️ 서버실', '#7fe3a0');

const missionMarkers = {}; // id -> {data, group, ring, beam, orb}

function buildMissionMarkers(){
  if (missionMarkersBuilt) return;
  if (typeof __msMissions === 'undefined' || __msMissions === null) return;
  missionMarkersBuilt = true;
  __msMissions.forEach(m => {
    if (!m.trigger_point) return;
    const group = new THREE.Group();
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.55, 0.75, 32),
      new THREE.MeshBasicMaterial({ color: 0xffd66e, transparent: true, opacity: 0.85, side: THREE.DoubleSide })
    );
    ring.rotation.x = -Math.PI/2;
    ring.position.y = 0.03;
    group.add(ring);
    const beam = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12, 0.3, 2.2, 12, 1, true),
      new THREE.MeshBasicMaterial({ color: 0xffd66e, transparent: true, opacity: 0.25 })
    );
    beam.position.y = 1.1;
    group.add(beam);
    const orb = new THREE.Mesh(
      new THREE.SphereGeometry(0.18, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xffe6a8 })
    );
    orb.position.y = 1.4;
    group.add(orb);
    const label = makeLabelSprite(m.title || '미션', '#ffd66e');
    label.position.y = 2.4;
    group.add(label);
    group.position.set(m.trigger_point.x, 0, m.trigger_point.z);
    scene.add(group);
    missionMarkers[m.id] = { data: m, group, ring, beam, orb };
  });
}
function refreshMissionMarkers(){
  buildMissionMarkers();
  if (typeof __msDone === 'undefined') return;
  for (const id in missionMarkers) {
    const mk = missionMarkers[id];
    const done = __msDone.has(id);
    mk.beam.visible = !done;
    mk.ring.material.color.set(done ? 0x7fe3a0 : 0xffd66e);
    mk.orb.material.color.set(done ? 0xbdf5d0 : 0xffe6a8);
  }
}

// unadjustedMovement(OS 마우스 가속 우회)로 요청 — Windows+Chrome movementX/Y 스파이크(시점 튐) 방지. 미지원 시 폴백
function lockPtr(el){
  if (!el.requestPointerLock) return;
  try {
    const p = el.requestPointerLock({ unadjustedMovement: true });
    if (p && p.catch) p.catch(() => { try { el.requestPointerLock(); } catch(e){} });
  } catch(e) { try { el.requestPointerLock(); } catch(e2){} }
}
overlay.addEventListener('click', () => {
  overlay.style.display = 'none';
  started = true;
  if (!isTouch) lockPtr(canvas);
});
canvas.addEventListener('click', () => {
  if (started && !isTouch && !modalOpen && !TEACHER_VIEW && document.pointerLockElement !== canvas) {
    lockPtr(canvas);
  }
});
// 포인터락 진입 직후 첫 mousemove는 movementX/Y가 비정상적으로 커서(브라우저 버그) 시점이 튐 → 1회 무시
let skipLook = false;
document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement === canvas) skipLook = true;
});
document.addEventListener('mousemove', e => {
  if (document.pointerLockElement === canvas) {
    if (skipLook) { skipLook = false; return; }
    // 스파이크 필터: 한 이벤트에 200px 이상 델타는 물리적으로 불가능(Chrome/Windows 포인터락 버그) → 무시
    if (Math.abs(e.movementX) > 200 || Math.abs(e.movementY) > 200) return;
    player.yaw   -= e.movementX * 0.0022;
    player.pitch -= e.movementY * 0.0022;
    player.pitch = Math.max(-1.35, Math.min(1.35, player.pitch));
  }
});

/* ── 모바일: 좌하단 고정 조이스틱 + 오른쪽 드래그 (교실맵과 동일 방식) ── */
const joy = { active:false, id:null, dx:0, dy:0 };
const look = { id:null, lx:0, ly:0 };
const joyZone = document.getElementById('joy-zone');
const lookZone = document.getElementById('look-zone');
const joyStick = document.getElementById('joy-stick');
const JOY_MAX = 45;            // 노브 최대 이동 반경(px)
const JOY_REST = 36;           // 노브 중앙 위치(zone 120 − knob 48)/2

function joyUpdate(t) {
  const r = joyZone.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let dx = t.clientX - cx, dy = t.clientY - cy;
  const d = Math.hypot(dx, dy);
  if (d > JOY_MAX) { dx = dx / d * JOY_MAX; dy = dy / d * JOY_MAX; }
  joy.dx = dx / JOY_MAX; joy.dy = dy / JOY_MAX;
  joyStick.style.left = (JOY_REST + dx) + 'px';
  joyStick.style.top  = (JOY_REST + dy) + 'px';
}
function joyReset() {
  joy.active = false; joy.id = null; joy.dx = 0; joy.dy = 0;
  joyStick.style.left = JOY_REST + 'px'; joyStick.style.top = JOY_REST + 'px';
}
joyZone.addEventListener('touchstart', e => {
  if (joy.id !== null) return;
  const t = e.changedTouches[0];
  joy.active = true; joy.id = t.identifier;
  joyUpdate(t);
}, {passive:true});
joyZone.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) { if (t.identifier === joy.id) joyUpdate(t); }
}, {passive:true});
joyZone.addEventListener('touchend', e => {
  for (const t of e.changedTouches) { if (t.identifier === joy.id) joyReset(); }
});
joyZone.addEventListener('touchcancel', e => {
  for (const t of e.changedTouches) { if (t.identifier === joy.id) joyReset(); }
});

lookZone.addEventListener('touchstart', e => {
  const t = e.changedTouches[0];
  look.id = t.identifier; look.lx = t.clientX; look.ly = t.clientY;
}, {passive:true});
lookZone.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    if (t.identifier !== look.id) continue;
    player.yaw   -= (t.clientX - look.lx) * 0.005;
    player.pitch -= (t.clientY - look.ly) * 0.005;
    player.pitch = Math.max(-1.35, Math.min(1.35, player.pitch));
    look.lx = t.clientX; look.ly = t.clientY;
  }
}, {passive:true});

document.getElementById('action-btn').addEventListener('click', () => {

// ---------- 이동 ----------
function movePlayer(dt) {
  let mx = 0, mz = 0;
  if (keys['KeyW'] || keys['ArrowUp'])    mz -= 1;
  if (keys['KeyS'] || keys['ArrowDown'])  mz += 1;
  if (keys['KeyA'] || keys['ArrowLeft'])  mx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
  mx += joy.dx; mz += joy.dy;

  const len = Math.hypot(mx, mz);
  const run = keys['ShiftLeft'] || keys['ShiftRight'];
  let moving = false;
  if (len > 0.01) {
    mx /= Math.max(len,1); mz /= Math.max(len,1);
    const speed = (run ? 6.2 : 3.6);
    const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
    const dx = (mx*cos + mz*sin) * speed * dt;
    const dz = (mz*cos - mx*sin) * speed * dt;
    // 축 분리 충돌 (벽 슬라이드)
    if (!collide(player.x + dx, player.z)) player.x += dx;
    if (!collide(player.x, player.z + dz)) player.z += dz;
    moving = true;
  }

  // 헤드 밥
  if (moving) bobT += dt * (run ? 11 : 8);
  camera.position.set(player.x, EYE + (moving ? Math.sin(bobT) * 0.03 : 0), player.z);
  // roll(z)을 항상 0으로 고정 — 개별 .x/.y 대입만 하면 lookAt 등이 남긴 roll이
  // YXZ 순서로 적용돼 화면이 기울어질 수 있음(forest3d에서 발견된 버그 패턴).
  camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');
}

// ---------- 위치 표시 ----------
let curZone = '';
function updateZone() {
  for (const z of MAP_DATA.zones) {
    if (player.x >= z.minX && player.x <= z.maxX && player.z >= z.minZ && player.z <= z.maxZ) {
      if (curZone !== z.id) { curZone = z.id; zoneEl.textContent = z.label; }
      return;
    }
  }
}

  __msOpenMission([nearMission]); // ssambus 모달로 문제 표시/채점/완료
}

/* ── 쌤버스 통합 초기화 (실시간 멀티플레이어 + 미션 + 3D 어댑터) ── */
try { initRealtime('computer3d'); } catch (e) { console.warn('[computer3d] realtime:', e); }
if (!TEACHER_VIEW) {
  try { initMissionSystem('computer3d'); } catch (e) { console.warn('[computer3d] missions:', e); }
}
try { SsamAdapter3D.init({ THREE, scene, camera }); } catch (e) { console.warn('[computer3d] adapter:', e); }

/* ── 교사 실시간 맵 보기(teacherView=1): 자동 시작 + 조감 시점 고정(관찰 전용) ──
   started=true 라야 SsamAdapter3D.update()가 돌아 원격 학생 스프라이트가 동기화된다. */
if (TEACHER_VIEW) {
  overlay.style.display = 'none';
  started = true;
  camera.position.set(0, 24, 18); // 남쪽(+Z) 위에서 컴퓨터실+서버실+교무실을 내려다봄
  camera.lookAt(0, 0, 3);
}

// ---------- 루프 ----------
const clock3 = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock3.getDelta(), 0.05);
  const t = clock3.elapsedTime;

  // 모달 열림 추적 — 닫히면 포인터락 복원
  const wasModal = modalOpen;
  modalOpen = isMsModalOpen();
  if (wasModal && !modalOpen && started && !isTouch && !TEACHER_VIEW) {
    lockPtr(canvas);
  }

  if (started && !modalOpen && !TEACHER_VIEW) {
    movePlayer(dt);
    updateZone();
  }

  // 서버 LED 깜빡임
  for (const l of ledMats) {
    const v = Math.sin(t * l.speed + l.t);
    l.mat.emissiveIntensity = v > 0 ? 1.5 : 0.15;
  }

  // 미션 마커 갱신(완료색) + 부유/회전 애니메이션
  refreshMissionMarkers();
  for (const id in missionMarkers) {
    const mk = missionMarkers[id];
    mk.orb.position.y = 1.4 + Math.sin(t * 2.2 + mk.group.position.x) * 0.1;
    mk.ring.rotation.z = t * 0.8;
  }
  // 출구 포털 회전
  if (window.__exitPortal) window.__exitPortal.rotation.y = t * 0.6;

  // 근접 미션 판정 (Supabase에 교사가 배치한 trigger_point 기준)
  nearMission = (started && !modalOpen && !TEACHER_VIEW && typeof checkMission3D === 'function')
    ? checkMission3D(player.x, player.z)
    : null;

  if (started && !modalOpen && nearMission) {
    hintEl.style.display = 'block';
    document.getElementById('hint-text').textContent = (nearMission.title || '미션') + ' 수행하기';
    actionBtn.classList.add('pulse');
  } else {
    hintEl.style.display = 'none';
    actionBtn.classList.remove('pulse');
  }

  // 출구 판정 — 필수 미션 완료 시 다음 맵으로 자동 이동
  if (started && !modalOpen && !TEACHER_VIEW && !nearMission
      && typeof requestMapExit3D === 'function' && isAtExit(player.x, player.z)) {
    const st = requestMapExit3D();
    if (st === 'incomplete' && !exitNoticeActive) {
      exitNoticeActive = true;
      if (typeof __msShowBlockedNotice === 'function') __msShowBlockedNotice();
    }
  } else {
    exitNoticeActive = false;
  }

  // 원격 학생 실시간 동기화 (모달 열려 있어도 계속)
  if (started && typeof SsamAdapter3D !== 'undefined') {
    try { SsamAdapter3D.update(dt, camera); } catch (e) {}
  }

  // HUD 진행률 (이 맵의 완료 수 / 이 맵의 미션 수 — __msDone.size는 방 전체 누적이라 맵 단위로 카운트)
  const __cids = Object.keys(missionMarkers);
  const __cdone = (typeof __msDone !== 'undefined') ? __cids.filter(id => __msDone.has(id)).length : 0;
  document.getElementById('mission-count').textContent = '미션 ' + __cdone + '/' + __cids.length;

  renderer.render(scene, camera);
}
animate();
</script>
