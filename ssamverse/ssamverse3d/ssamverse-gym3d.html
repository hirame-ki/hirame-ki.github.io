<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>쌤버스 3D - 체육관</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#111; font-family:'Pretendard','Malgun Gothic',sans-serif; }
  #canvas-wrap { position:fixed; inset:0; }
  canvas { display:block; }

  /* ---------- HUD ---------- */
  #crosshair {
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    width:6px; height:6px; border-radius:50%;
    background:rgba(255,255,255,.85); box-shadow:0 0 4px rgba(0,0,0,.6);
    pointer-events:none; z-index:10;
  }
  #interact-hint {
    position:fixed; left:50%; top:58%; transform:translateX(-50%);
    padding:8px 16px; border-radius:20px;
    background:rgba(0,0,0,.65); color:#fff;
    font:600 14px 'Pretendard','Malgun Gothic',sans-serif;
    display:none; z-index:10; pointer-events:none; white-space:nowrap;
  }
  #hud-top {
    position:fixed; top:12px; left:12px; z-index:10;
    padding:8px 14px; border-radius:12px;
    background:rgba(0,0,0,.55); color:#fff;
    font:600 13px 'Pretendard','Malgun Gothic',sans-serif;
    pointer-events:none;
  }
  #hud-top small { display:block; font-weight:400; opacity:.75; margin-top:2px; }
  #hud-top b { color:#ffd166; }

  #char-btn {
    position:fixed; top:12px; right:12px; z-index:10; display:none;
    background:rgba(41,128,185,.85); color:#fff; backdrop-filter:blur(6px);
    padding:8px 14px; border-radius:12px; font-size:13px; font-weight:700;
    border:1px solid rgba(255,255,255,.12); text-decoration:none;
    font-family:inherit;
  }

  /* ---------- 시작 오버레이 ---------- */
  #start-overlay {
    position:fixed; inset:0; z-index:50;
    background:rgba(10,14,22,.88); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center;
    font-family:'Pretendard','Malgun Gothic',sans-serif;
  }
  #start-card {
    max-width:420px; width:88%; text-align:center; color:#fff;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15);
    border-radius:20px; padding:32px 28px;
  }
  #start-card h1 { font-size:24px; margin-bottom:6px; }
  #start-card .sub { font-size:14px; opacity:.8; margin-bottom:20px; }
  #start-card .keys {
    text-align:left; font-size:13px; line-height:1.9; opacity:.9;
    background:rgba(0,0,0,.3); border-radius:12px; padding:14px 18px; margin-bottom:22px;
  }
  #start-card .keys b {
    display:inline-block; min-width:70px;
    color:#ffd166;
  }
  #start-btn {
    width:100%; padding:14px 0; border:none; border-radius:12px;
    background:#ff8a3d; color:#1a1a1a; font-size:16px; font-weight:800;
    cursor:pointer;
  }
  #start-btn:active { transform:scale(.98); }

  /* ---------- 모바일 컨트롤 ----------
     교실맵식 좌하단 고정 원형 조이스틱(항상 표시).
     bottom 오프셋은 하단 채팅바(#rt-chat-bar, 약 54px)에 가리지 않게 88px. */
  #joy-zone { position:fixed; left:24px; bottom:88px; width:120px; height:120px; z-index:20; display:none; touch-action:none; }
  #look-zone { position:fixed; right:0; bottom:0; width:55%; height:60%; z-index:20; display:none; }
  #joy-base {
    position:absolute; inset:0; border-radius:50%;
    border:2px solid rgba(255,255,255,.35); background:rgba(255,255,255,.08);
  }
  #joy-stick {
    position:absolute; width:48px; height:48px; border-radius:50%;
    background:rgba(255,255,255,.55); left:36px; top:36px;
    box-shadow:0 4px 12px rgba(0,0,0,.3);
  }
  #action-btn {
    position:fixed; right:28px; bottom:112px; width:74px; height:74px;
    border-radius:50%; z-index:21; display:none;
    border:2px solid rgba(255,255,255,.4);
    background:rgba(255,138,61,.85); color:#1a1a1a;
    font:800 15px 'Pretendard','Malgun Gothic',sans-serif;
  }
  #action-btn.pulse { animation:pulse 1s infinite; background:rgba(60,179,113,.9); color:#fff; }
  @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.1); } }
  body.touch #joy-zone, body.touch #look-zone, body.touch #action-btn { display:block; }

  /* ssambus_missions.js의 기본 진행률 배지는 숨기고 HUD(#mission-count)만 사용 */
  #ms-progress { display:none !important; }
</style>
</head>
<body>
<div id="canvas-wrap"></div>

<!-- ssambus_realtime.js가 평소처럼 DOM에 쓰도록 두는 숨김 요소 (3D 어댑터가 매 프레임 읽어 미러링) -->
<div id="player" style="display:none"><svg viewBox="0 0 60 76"><g id="cg_p"></g></svg></div>
<div id="remote-players" style="display:none"></div>
<a id="char-btn" href="#">← 캐릭터 변경</a>

<div id="crosshair"></div>
<div id="interact-hint"></div>
<div id="hud-top">🏀 쌤버스 3D — 체육관 · 미션 <b id="mission-count">0/0</b><small id="hud-sub">WASD 이동 · 마우스 시점 · E 미션/문 · Shift 달리기</small></div>

<div id="joy-zone"><div id="joy-base"><div id="joy-stick"></div></div></div>
<div id="look-zone"></div>
<button id="action-btn">미션</button>

<div id="start-overlay">
  <div id="start-card">
    <h1>🏀 쌤버스 체육관</h1>
    <div class="sub">1인칭 시점으로 체육관을 탐험하고 미션을 수행하세요</div>
    <div class="keys" id="keys-desc">
      <div><b>W A S D</b> 이동</div>
      <div><b>마우스</b> 시점 회전</div>
      <div><b>Shift</b> 달리기</div>
      <div><b>E</b> 미션 수행 / 창고 문 열기</div>
      <div><b>ESC</b> 마우스 잠금 해제</div>
    </div>
    <button id="start-btn">입장하기</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../ssambus_supabase_config.js"></script>
<script src="../ssambus_character_render.js"></script>
<script src="../ssambus_realtime.js"></script>
<script src="../ssambus_missions.js"></script>
<script src="ssambus_3d_adapter.js"></script>
<script>
/* ==========================================================
   쌤버스 3D · 체육관 (Three.js r128)
   - 체육관: 40m × 24m, 높이 9m / 창고: 10m × 8m (+Z 벽 바깥 부착)
   - 쌤버스 공용 시스템 통합: 실시간 멀티(ssambus_realtime.js)
     + 미션(ssambus_missions.js, trigger_point) + 3D 어댑터
   ========================================================== */
const GYM = { W:40, D:24, H:9 };                 // x: -20~20, z: -12~12
const STORE = { x1:8, x2:18, z1:GYM.D/2, z2:GYM.D/2+8, H:4 }; // 창고 영역
const DOOR = { x:13, z:GYM.D/2, w:1.6, h:2.4 };  // 창고 문 위치(벽 중앙)

/* ── 쌤버스 통합: URL 파라미터 + 캐릭터 외형 + 위치(r/c=z/x, TS=1) ── */
var TEACHER_VIEW = new URLSearchParams(window.location.search).get('teacherView') === '1';
var TS = 1;
var __savedChar = (function(){
  try{
    var _cp = new URLSearchParams(window.location.search).get('c');
    if(_cp) return JSON.parse(_cp);
    return JSON.parse(localStorage.getItem('ssambus_player_character'));
  }catch(e){ return null; }
})();
var PLAYER = Object.assign({
  type:'student', skin:'#FDEBD0', hcolor:'#1a1008', hair:'short',
  ccolor:'#1a3a6b', cloth:'suit', gender:'male', acc:[], dir:'down'
}, __savedChar || {});
var pos = { r: 0, c: 0 }; // ssambus_3d_adapter.js가 매 프레임 camera 위치로 갱신

/* ── 캐릭터 변경 버튼 (2D 맵의 #char-btn과 동일 동작, teacherMode 유지) ── */
(function(){
  var params = new URLSearchParams(window.location.search);
  var room = params.get('room');
  if(!room || TEACHER_VIEW) return;
  var btn = document.getElementById('char-btn');
  if(!btn) return;
  var nickname = params.get('nickname') || '';
  try{ nickname = nickname || sessionStorage.getItem('ssambus_nickname') || ''; }catch(e){}
  var q = 'room=' + encodeURIComponent(room) + '&map=' + encodeURIComponent('ssamverse3d/ssamverse-gym3d.html');
  if(nickname) q += '&nickname=' + encodeURIComponent(nickname);
  if(params.get('teacherMode') === '1') q += '&teacherMode=1'; // 애니 캐릭터 잠금 면제 유지
  btn.href = '../ssambus_characters.html?' + q;
  btn.style.display = 'inline-block';
})();

/* ── 터치 판정: OR 판정(미디어쿼리 단독은 일부 기기 오탐) ── */
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0
  || matchMedia('(hover: none) and (pointer: coarse)').matches;
if (isTouch) {
  document.body.classList.add('touch');
  document.getElementById('hud-sub').textContent = '왼쪽 레버 이동 · 오른쪽 드래그 시점';
  document.getElementById('keys-desc').innerHTML =
    '<div><b>왼쪽 레버</b> 이동</div>' +
    '<div><b>오른쪽 화면</b> 드래그로 시점 회전</div>' +
    '<div><b>버튼</b> 미션 수행 / 문 열기</div>';
}

/* ---------- 렌더러 / 씬 / 카메라 ---------- */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('canvas-wrap').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1c2430);
scene.fog = new THREE.Fog(0x1c2430, 55, 90);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth/window.innerHeight, 0.1, 200);
const EYE = 1.6;

/* ---------- 조명 ---------- */
scene.add(new THREE.HemisphereLight(0xdde6ff, 0x3a3228, 0.55));

const sun = new THREE.DirectionalLight(0xfff2dd, 0.85);
sun.position.set(-14, 22, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30;   sun.shadow.camera.bottom = -30;
scene.add(sun);

// 체육관 천장 조명(포인트) 3개
[-12, 0, 12].forEach(x => {
  const p = new THREE.PointLight(0xffffff, 0.35, 40);
  p.position.set(x, GYM.H - 1.2, 0);
  scene.add(p);
});
// 창고 조명
const storeLight = new THREE.PointLight(0xffe9c4, 0.7, 16);
storeLight.position.set((STORE.x1+STORE.x2)/2, STORE.H-0.6, (STORE.z1+STORE.z2)/2);
scene.add(storeLight);

/* ==========================================================
   충돌 시스템 (AABB)
   ========================================================== */
const colliders = [];   // {minX,maxX,minZ,maxZ, ref?}
function addCollider(minX, maxX, minZ, maxZ, ref){
  const c = { minX, maxX, minZ, maxZ, ref: ref||null, enabled:true };
  colliders.push(c);
  return c;
}
function addBoxCollider(cx, cz, w, d, ref){
  return addCollider(cx-w/2, cx+w/2, cz-d/2, cz+d/2, ref);
}

/* ==========================================================
   재질 / 텍스처 유틸 (모든 그래픽 절차 생성 — 외부 에셋 없음)
   ========================================================== */
function canvasTexture(w, h, draw){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  return t;
}

/* ---------- 체육관 바닥 (마루 + 코트 라인) ---------- */
const floorTex = canvasTexture(2048, 1229, (ctx,W,H)=>{
  const px = W / GYM.W;                 // 1m 당 픽셀
  // 마루판
  ctx.fillStyle = '#c8965a';
  ctx.fillRect(0,0,W,H);
  for(let y=0; y<H; y+=26){
    ctx.fillStyle = (y/26)%2 ? 'rgba(0,0,0,.05)' : 'rgba(255,255,255,.04)';
    ctx.fillRect(0,y,W,26);
    ctx.fillStyle = 'rgba(90,50,15,.25)';
    ctx.fillRect(0,y,W,2);
    // 판자 세로 이음새
    for(let x=((y/26)%2)*140; x<W; x+=280){
      ctx.fillRect(x, y, 2, 26);
    }
  }
  const cx = W/2, cy = H/2;
  ctx.lineWidth = 6;

  // --- 농구 코트 (전체 경기장) ---
  ctx.strokeStyle = '#f5f5f5';
  const bx = 2*px, by = 2.5*px;               // 외곽 여백
  ctx.strokeRect(bx, by, W-2*bx, H-2*by);
  // 센터 라인 + 센터 서클
  ctx.beginPath(); ctx.moveTo(cx, by); ctx.lineTo(cx, H-by); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 1.8*px, 0, Math.PI*2); ctx.stroke();
  // 3점 라인(양쪽)
  ctx.strokeStyle = '#e6533c';
  [bx, W-bx].forEach((ex,i)=>{
    const dir = i===0 ? 1 : -1;
    ctx.beginPath();
    ctx.arc(ex + dir*1.575*px, cy, 6.6*px, i===0 ? -Math.PI/2 : Math.PI/2, i===0 ? Math.PI/2 : Math.PI*1.5, false);
    ctx.stroke();
    // 페인트 존
    ctx.strokeStyle = '#f5f5f5';
    const pw = 5.8*px, ph = 4.9*px;
    ctx.strokeRect(i===0 ? ex : ex-pw, cy-ph/2, pw, ph);
    ctx.beginPath();
    ctx.arc(i===0 ? ex+pw : ex-pw, cy, 1.8*px, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = '#e6533c';
  });

  // --- 배구 코트 (중앙, 18m × 9m, 파란 라인) ---
  ctx.strokeStyle = '#3d7bd9';
  ctx.lineWidth = 5;
  const vw = 18*px, vh = 9*px;
  ctx.strokeRect(cx - vw/2, cy - vh/2, vw, vh);
  // 어택 라인 (네트 좌우 3m)
  ctx.setLineDash([18,14]);
  ctx.beginPath(); ctx.moveTo(cx-3*px, cy-vh/2); ctx.lineTo(cx-3*px, cy+vh/2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx+3*px, cy-vh/2); ctx.lineTo(cx+3*px, cy+vh/2); ctx.stroke();
  ctx.setLineDash([]);
});
const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness:.7, metalness:.05 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(GYM.W, GYM.D), floorMat);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

/* ---------- 창고 바닥 (콘크리트) ---------- */
const storeFloorTex = canvasTexture(512, 512, (ctx,W,H)=>{
  ctx.fillStyle = '#8b8b8f'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<900;i++){
    ctx.fillStyle = `rgba(${Math.random()>0.5?255:0},${Math.random()>0.5?255:0},0,${Math.random()*0.04})`;
    ctx.fillRect(Math.random()*W, Math.random()*H, 2, 2);
  }
  ctx.strokeStyle='rgba(0,0,0,.2)'; ctx.lineWidth=3;
  ctx.strokeRect(0,0,W,H);
});
const storeFloor = new THREE.Mesh(
  new THREE.PlaneGeometry(STORE.x2-STORE.x1, STORE.z2-STORE.z1),
  new THREE.MeshStandardMaterial({ map:storeFloorTex, roughness:.95 })
);
storeFloor.rotation.x = -Math.PI/2;
storeFloor.position.set((STORE.x1+STORE.x2)/2, 0.001, (STORE.z1+STORE.z2)/2);
storeFloor.receiveShadow = true;
scene.add(storeFloor);

/* ---------- 벽 유틸 ---------- */
const wallMatGym = new THREE.MeshStandardMaterial({ color:0xdfe3e8, roughness:.9 });
const wallMatLow = new THREE.MeshStandardMaterial({ color:0x4e88c2, roughness:.85 }); // 하단 보호 패드 톤
const wallMatStore = new THREE.MeshStandardMaterial({ color:0xb9b2a4, roughness:.95 });

function wall(cx, cy, cz, w, h, d, mat, collide=true, castShadow=false){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(cx, cy, cz);
  m.receiveShadow = true;
  m.castShadow = castShadow;
  scene.add(m);
  if (collide) addBoxCollider(cx, cz, w, d);
  return m;
}

/* ---------- 체육관 벽 (하단 파란 패드 + 상단 밝은 벽) ---------- */
const T = 0.3;   // 벽 두께
const PAD = 2.2; // 패드 높이
// -Z 벽
wall(0, PAD/2, -GYM.D/2, GYM.W, PAD, T, wallMatLow);
wall(0, PAD + (GYM.H-PAD)/2, -GYM.D/2, GYM.W, GYM.H-PAD, T, wallMatGym, false);
// +Z 벽 : 문 구멍을 남기고 3조각
{
  const z = GYM.D/2;
  const leftW  = (DOOR.x - DOOR.w/2) - (-GYM.W/2);
  const rightW = (GYM.W/2) - (DOOR.x + DOOR.w/2);
  wall(-GYM.W/2 + leftW/2, PAD/2, z, leftW, PAD, T, wallMatLow);
  wall(GYM.W/2 - rightW/2, PAD/2, z, rightW, PAD, T, wallMatLow);
  wall(-GYM.W/2 + leftW/2, PAD+(GYM.H-PAD)/2, z, leftW, GYM.H-PAD, T, wallMatGym, false);
  wall(GYM.W/2 - rightW/2, PAD+(GYM.H-PAD)/2, z, rightW, GYM.H-PAD, T, wallMatGym, false);
  // 문 위 상인방
  wall(DOOR.x, DOOR.h + (GYM.H-DOOR.h)/2, z, DOOR.w, GYM.H-DOOR.h, T, wallMatGym, false);
}
// ±X 벽
wall(-GYM.W/2, PAD/2, 0, T, PAD, GYM.D, wallMatLow);
wall(-GYM.W/2, PAD+(GYM.H-PAD)/2, 0, T, GYM.H-PAD, GYM.D, wallMatGym, false);
wall(GYM.W/2, PAD/2, 0, T, PAD, GYM.D, wallMatLow);
wall(GYM.W/2, PAD+(GYM.H-PAD)/2, 0, T, GYM.H-PAD, GYM.D, wallMatGym, false);

/* ---------- 체육관 천장 + 트러스 ----------
   천장은 단면(아래에서만 보임) — DoubleSide로 두면 교사 실시간 맵 보기(위에서 조감)가 막힘 */
const ceil = new THREE.Mesh(
  new THREE.PlaneGeometry(GYM.W, GYM.D),
  new THREE.MeshStandardMaterial({ color:0x9aa3ad, roughness:.95 })
);
ceil.rotation.x = Math.PI/2;
ceil.position.y = GYM.H;
scene.add(ceil);
const trussMat = new THREE.MeshStandardMaterial({ color:0x6d7680, roughness:.6, metalness:.4 });
for(let x=-16; x<=16; x+=8){
  const beam = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.5, GYM.D), trussMat);
  beam.position.set(x, GYM.H-0.35, 0);
  scene.add(beam);
}
// 천장 등 박스
[-12,0,12].forEach(x=>{
  const lampBody = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.15,0.7),
    new THREE.MeshStandardMaterial({ color:0x555b63 }));
  lampBody.position.set(x, GYM.H-0.75, 0);
  scene.add(lampBody);
  const lamp = new THREE.Mesh(new THREE.BoxGeometry(1.5,0.06,0.6),
    new THREE.MeshBasicMaterial({ color:0xfff6dd }));
  lamp.position.set(x, GYM.H-0.83, 0);
  scene.add(lamp);
});

/* ---------- 창고 외벽/천장 ---------- */
{
  const cw = STORE.x2 - STORE.x1, cd = STORE.z2 - STORE.z1;
  const cxm = (STORE.x1+STORE.x2)/2, czm = (STORE.z1+STORE.z2)/2;
  wall(cxm, STORE.H/2, STORE.z2, cw, STORE.H, T, wallMatStore);            // 뒤벽
  wall(STORE.x1, STORE.H/2, czm, T, STORE.H, cd, wallMatStore);            // 좌벽
  wall(STORE.x2, STORE.H/2, czm, T, STORE.H, cd, wallMatStore);            // 우벽
  // 창고 천장도 단면(아래에서만 보임) — 교사 조감뷰에서 창고 안 학생이 보이도록

function ballTexture(kind){
  return canvasTexture(256, 128, (ctx,W,H)=>{
    if (kind === 'basket'){
      ctx.fillStyle = '#d9642e'; ctx.fillRect(0,0,W,H);
      ctx.strokeStyle = '#3a2417'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(W/4,0); ctx.lineTo(W/4,H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(3*W/4,0); ctx.lineTo(3*W/4,H); ctx.stroke();
      ctx.beginPath(); ctx.arc(W/2, H/2, H/3, 0, Math.PI*2); ctx.stroke();
    } else if (kind === 'volley'){
      ctx.fillStyle = '#f2f2f0'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle = '#3d6fc4';
      ctx.fillRect(0, H*0.32, W, H*0.18);
      ctx.fillStyle = '#e8c33a';
      ctx.fillRect(0, H*0.55, W, H*0.16);
    } else { // soccer
      ctx.fillStyle = '#f5f5f5'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle = '#222';
      for(let i=0;i<8;i++){
        const x = (i*W/8 + (i%2)*14) % W, y = H*0.2 + (i%3)*H*0.3;
        ctx.beginPath();
        ctx.moveTo(x, y-12); ctx.lineTo(x+11, y-4); ctx.lineTo(x+7, y+10);
        ctx.lineTo(x-7, y+10); ctx.lineTo(x-11, y-4); ctx.closePath(); ctx.fill();
      }
    }
  });
}

function shelf(cx, cz, w, rotY){
  const g = new THREE.Group();

    const s = new THREE.Mesh(new THREE.BoxGeometry(w, 0.05, d), woodMat);

  });

    [ -d/2+0.05, d/2-0.05 ].forEach(z=>{
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.07, h, 0.07), woodMat);
      leg.position.set(x, h/2, z);
      g.add(leg);
    });
  });
  // 상자 몇 개
  for(let i=0;i<4;i++){
    const bw = 0.35 + Math.random()*0.2;
    const box = new THREE.Mesh(new THREE.BoxGeometry(bw, bw*0.8, 0.4), i%2?boxMatA:boxMatB);
    box.position.set(-w/2 + 0.4 + i*(w-0.8)/3, (i%2? 0.55:1.2) + bw*0.4 + 0.03, 0);
    box.rotation.y = (Math.random()-0.5)*0.3;
    box.castShadow = true;
    g.add(box);
  }
  g.position.set(cx, 0, cz);
  g.rotation.y = rotY;
  scene.add(g);
  // 회전 고려한 대략적 충돌 박스
  const cw = Math.abs(Math.cos(rotY))*w + Math.abs(Math.sin(rotY))*d;
  const cd = Math.abs(Math.sin(rotY))*w + Math.abs(Math.cos(rotY))*d;
  addBoxCollider(cx, cz, cw, cd);
}

function makeLabel(text) {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 128;
  const c = cv.getContext('2d');
  c.font = 'bold 56px "Malgun Gothic", sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = 'rgba(12,18,28,0.72)';
  const w = c.measureText(text).width + 60;
  c.beginPath(); c.roundRect((512-w)/2, 14, w, 100, 22); c.fill();
  c.fillStyle = '#fff';
  c.fillText(text, 256, 66);
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true}));
  sp.scale.set(6, 1.5, 1);
  return sp;
}

const missionMarkers = {}; // id -> {data, group, ring, beam, orb}
let missionMarkersBuilt = false;
function buildMissionMarkers(){
  if (missionMarkersBuilt) return;
  if (typeof __msMissions === 'undefined' || __msMissions === null) return;
  missionMarkersBuilt = true;
  __msMissions.forEach(m => {
    if (!m.trigger_point) return;
    const group = new THREE.Group();
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.55, 0.75, 32),
      new THREE.MeshBasicMaterial({ color: 0x7dd87d, transparent: true, opacity: 0.85, side: THREE.DoubleSide })
    );
    ring.rotation.x = -Math.PI/2;
    ring.position.y = 0.03;
    group.add(ring);
    const beam = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12, 0.3, 2.6, 12, 1, true),
      new THREE.MeshBasicMaterial({ color: 0x7dd87d, transparent: true, opacity: 0.25 })
    );
    beam.position.y = 1.3;
    group.add(beam);
    const orb = new THREE.Mesh(
      new THREE.SphereGeometry(0.2, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xaef0ae })
    );
    orb.position.y = 1.6;
    group.add(orb);
    const label = makeLabel(m.title || '미션');
    label.position.y = 2.6;
    group.add(label);
    group.position.set(m.trigger_point.x, 0, m.trigger_point.z);
    scene.add(group);
    missionMarkers[m.id] = { data: m, group, ring, beam, orb };
  });
}
function refreshMissionMarkers(){
  buildMissionMarkers();
  if (typeof __msDone === 'undefined') return;
  for (const id in missionMarkers) {
    const mk = missionMarkers[id];
    const done = __msDone.has(id);
    mk.beam.visible = !done;
    mk.ring.material.color.set(done ? 0xaaaaaa : 0x7dd87d);
    mk.orb.material.color.set(done ? 0xcccccc : 0xaef0ae);
  }
}

document.getElementById('start-btn').addEventListener('click', ()=>{
  started = true;
  startOverlay.style.display = 'none';
  if (!isTouch) lockPtr(renderer.domElement);
});
renderer.domElement.addEventListener('click', ()=>{
  if (!isTouch && started && !modalOpen && !TEACHER_VIEW && !document.pointerLockElement)
    lockPtr(renderer.domElement);
});
let locked = false;
let skipLook = false; // 포인터락 진입 직후 첫 mousemove는 movementX/Y가 비정상적으로 커서 시점이 튐 → 1회 무시
document.addEventListener('pointerlockchange', ()=>{ locked = !!document.pointerLockElement; if (locked) skipLook = true; });
document.addEventListener('mousemove', e=>{
  if (!locked) return;
  if (skipLook) { skipLook = false; return; }
  // 스파이크 필터: 한 이벤트에 200px 이상 델타는 물리적으로 불가능(Chrome/Windows 포인터락 버그) → 무시
  if (Math.abs(e.movementX) > 200 || Math.abs(e.movementY) > 200) return;
  player.yaw   -= e.movementX * 0.0022;
  player.pitch -= e.movementY * 0.0022;
  player.pitch = Math.max(-1.35, Math.min(1.35, player.pitch));
});

/* ---------- 모바일: 좌하단 고정 조이스틱 + 오른쪽 드래그 (교실맵과 동일 방식) ---------- */
const joy = { active:false, id:null, dx:0, dy:0 };
const look = { id:null, lx:0, ly:0 };
const joyZone = document.getElementById('joy-zone');
const lookZone = document.getElementById('look-zone');
const joyStick = document.getElementById('joy-stick');
const JOY_MAX = 45;            // 노브 최대 이동 반경(px)
const JOY_REST = 36;           // 노브 중앙 위치(zone 120 − knob 48)/2

function joyUpdate(t) {
  const r = joyZone.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let dx = t.clientX - cx, dy = t.clientY - cy;
  const d = Math.hypot(dx, dy);
  if (d > JOY_MAX) { dx = dx / d * JOY_MAX; dy = dy / d * JOY_MAX; }
  joy.dx = dx / JOY_MAX; joy.dy = dy / JOY_MAX;
  joyStick.style.left = (JOY_REST + dx) + 'px';
  joyStick.style.top  = (JOY_REST + dy) + 'px';
}
function joyReset() {
  joy.active = false; joy.id = null; joy.dx = 0; joy.dy = 0;
  joyStick.style.left = JOY_REST + 'px'; joyStick.style.top = JOY_REST + 'px';
}
joyZone.addEventListener('touchstart', e => {
  if (joy.id !== null) return;
  const t = e.changedTouches[0];
  joy.active = true; joy.id = t.identifier;
  joyUpdate(t);
}, {passive:true});
joyZone.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) { if (t.identifier === joy.id) joyUpdate(t); }
}, {passive:true});
joyZone.addEventListener('touchend', e => {
  for (const t of e.changedTouches) { if (t.identifier === joy.id) joyReset(); }
});
joyZone.addEventListener('touchcancel', e => {
  for (const t of e.changedTouches) { if (t.identifier === joy.id) joyReset(); }
});

lookZone.addEventListener('touchstart', e => {
  const t = e.changedTouches[0];
  look.id = t.identifier; look.lx = t.clientX; look.ly = t.clientY;
}, {passive:true});
lookZone.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    if (t.identifier !== look.id) continue;
    player.yaw   -= (t.clientX - look.lx) * 0.005;
    player.pitch -= (t.clientY - look.ly) * 0.005;
    player.pitch = Math.max(-1.35, Math.min(1.35, player.pitch));
    look.lx = t.clientX; look.ly = t.clientY;
  }
}, {passive:true});

document.getElementById('action-btn').addEventListener('click', ()=>{
  if (!modalOpen && !TEACHER_VIEW) tryInteract();
});

/* ---------- 충돌 처리 (축별 분리 이동) ---------- */
function collide(nx, nz){
  let x = nx, z = player.z;
  for (const c of colliders){
    if (!c.enabled) continue;
    if (x + PLAYER_R > c.minX && x - PLAYER_R < c.maxX &&
        z + PLAYER_R > c.minZ && z - PLAYER_R < c.maxZ){
      x = player.x; break;
    }
  }
  z = nz;
  for (const c of colliders){
    if (!c.enabled) continue;
    if (x + PLAYER_R > c.minX && x - PLAYER_R < c.maxX &&
        z + PLAYER_R > c.minZ && z - PLAYER_R < c.maxZ){
      z = player.z; break;
    }
  }
  player.x = x; player.z = z;
}

/* ---------- 이동 ---------- */
function movePlayer(dt){
  let fx = 0, fz = 0;
  if (keys['KeyW'] || keys['ArrowUp'])    fz -= 1;
  if (keys['KeyS'] || keys['ArrowDown'])  fz += 1;
  if (keys['KeyA'] || keys['ArrowLeft'])  fx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) fx += 1;
  fx += joy.dx; fz += joy.dy;

  const len = Math.hypot(fx, fz);
  if (len > 0.01){
    fx /= Math.max(len,1); fz /= Math.max(len,1);
    const speed = (keys['ShiftLeft'] || keys['ShiftRight']) ? 6.5 : 3.6;
    const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
    const wx = (fx * cos + fz * sin) * speed * dt;
    const wz = (-fx * sin + fz * cos) * speed * dt;
    collide(player.x + wx, player.z + wz);
  }

  camera.position.set(player.x, EYE, player.z);
  // roll(z)을 항상 0으로 고정 — 개별 .x/.y 대입만 하면 lookAt 등이 남긴 roll이
  // YXZ 순서로 적용돼 화면이 기울어질 수 있음(forest3d에서 발견된 버그 패턴).
  camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');
}

/* ---------- 상호작용 (미션 우선, 그 다음 창고 문) ---------- */
const hintEl = document.getElementById('interact-hint');
const actionBtn = document.getElementById('action-btn');
let nearMission = null; // checkMission3D()가 반환한 ssambus 미션 객체(또는 null)

function nearDoor(){
  const dx = player.x - DOOR.x, dz = player.z - DOOR.z;
  return (dx*dx + dz*dz) < 2.2*2.2;
}
function tryInteract(){
  if (nearMission){
    if (document.pointerLockElement) document.exitPointerLock();
    __msOpenMission([nearMission]); // ssambus 모달로 문제 표시/채점/완료
    return;
  }
  if (nearDoor()) toggleDoor();
}

/* ── 쌤버스 통합 초기화 (실시간 멀티플레이어 + 미션 + 3D 어댑터) ── */
try { initRealtime('gym3d'); } catch (e) { console.warn('[gym3d] realtime:', e); }
if (!TEACHER_VIEW) {
  try { initMissionSystem('gym3d'); } catch (e) { console.warn('[gym3d] missions:', e); }
}
try { SsamAdapter3D.init({ THREE, scene, camera }); } catch (e) { console.warn('[gym3d] adapter:', e); }

/* ── 교사 실시간 맵 보기(teacherView=1): 자동 시작 + 조감 시점 고정(관찰 전용) ──
   started=true 라야 SsamAdapter3D.update()가 돌아 원격 학생 스프라이트가 동기화된다. */
if (TEACHER_VIEW) {
  startOverlay.style.display = 'none';
  started = true;
  camera.position.set(0, 30, 26); // 남쪽(+Z) 위에서 코트+창고를 내려다봄
  camera.lookAt(0, 0, 2);
}

/* ---------- 메인 루프 ---------- */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = performance.now() * 0.001;

  // 모달 열림 추적 — 닫히면 포인터락 복원
  const wasModal = modalOpen;
  modalOpen = isMsModalOpen();
  if (wasModal && !modalOpen && started && !isTouch && !TEACHER_VIEW) lockPtr(renderer.domElement);

  if (started && !modalOpen && !TEACHER_VIEW) {
    movePlayer(dt);
  }

  // 문 애니메이션
  const target = doorOpen ? 1 : 0;
  if (Math.abs(doorAnim - target) > 0.001){
    doorAnim += (target - doorAnim) * Math.min(dt*6, 1);
    doorGroup.rotation.y = -doorAnim * Math.PI * 0.55;  // 창고 쪽으로 열림
  }

  // 미션 마커 갱신(완료색) + 부유/회전 애니메이션
  refreshMissionMarkers();
  for (const id in missionMarkers) {
    const mk = missionMarkers[id];
    mk.orb.position.y = 1.6 + Math.sin(t * 2.2 + mk.group.position.x) * 0.12;
    mk.ring.rotation.z = t * 0.8;
  }
  // 출구 포털 회전
  if (window.__exitPortal) window.__exitPortal.rotation.y = t * 0.6;

  // 근접 미션 판정 (Supabase에 교사가 배치한 trigger_point 기준)
  nearMission = (started && !modalOpen && !TEACHER_VIEW && typeof checkMission3D === 'function')
    ? checkMission3D(player.x, player.z)
    : null;

  // 상호작용 힌트 (미션 우선, 그 다음 창고 문)
  if (started && !modalOpen && !TEACHER_VIEW && nearMission){
    hintEl.style.display = 'block';
    hintEl.textContent = isTouch ? ('버튼 — ' + (nearMission.title || '미션') + ' 수행') : ('E — ' + (nearMission.title || '미션') + ' 수행');
    actionBtn.textContent = '미션';
    actionBtn.classList.add('pulse');
  } else if (started && !modalOpen && !TEACHER_VIEW && nearDoor()){
    hintEl.style.display = 'block';
    hintEl.textContent = isTouch
      ? (doorOpen ? '버튼으로 문 닫기' : '버튼으로 문 열기')
      : (doorOpen ? 'E — 문 닫기' : 'E — 문 열기');
    actionBtn.textContent = doorOpen ? '닫기' : '열기';
    actionBtn.classList.remove('pulse');
  } else {
    hintEl.style.display = 'none';
    actionBtn.textContent = '미션';
    actionBtn.classList.remove('pulse');
  }

  // 출구 판정 — 필수 미션 완료 시 다음 맵으로 자동 이동
  if (started && !modalOpen && !TEACHER_VIEW && !nearMission
      && typeof requestMapExit3D === 'function' && isAtExit(player.x, player.z)) {
    const st = requestMapExit3D();
    if (st === 'incomplete' && !exitNoticeActive) {
      exitNoticeActive = true;
      if (typeof __msShowBlockedNotice === 'function') __msShowBlockedNotice();
    }
  } else {
    exitNoticeActive = false;
  }

  // 원격 학생 실시간 동기화 (모달 열려 있어도 계속)
  if (started && typeof SsamAdapter3D !== 'undefined') {
    try { SsamAdapter3D.update(dt, camera); } catch (e) {}
  }

  // HUD 진행률 (이 맵의 완료 수 / 이 맵의 미션 수 — __msDone.size는 방 전체 누적이라 맵 단위로 카운트)
  const __gids = Object.keys(missionMarkers);
  const __gdone = (typeof __msDone !== 'undefined') ? __gids.filter(id => __msDone.has(id)).length : 0;
  document.getElementById('mission-count').textContent = __gdone + '/' + __gids.length;

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
