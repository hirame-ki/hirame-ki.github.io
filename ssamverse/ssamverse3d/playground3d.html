<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>쌤버스 · 운동장 (3D)</title>
<!--
═══════════════════════════════════════════════════════════════
 쌤버스 3D 운동장 맵  (playground3d.html)
 - Three.js r128 (CDN) / 외부 에셋 없음 (전부 코드 생성)
 - 1인칭 시점: PC = 클릭 후 마우스 시점 + WASD, 모바일 = 조이스틱 + 드래그
 - 맵 크기: 132 x 90 유닛 (30명 이상 동시 활동 가능)
 - 구성: 6레인 트랙, 잔디 축구장(흰 선), 축구골대 2개, 구령대,
         응원석(북측 지붕형 2동 + 남측 2동), 국기게양대, 미션 포인트 4곳

 ── Supabase Realtime 연동 훅 ─────────────────────────────────
 window.SsamverseMap3D 로 외부에서 접근:
   .getState()            → { x, y, z, yaw }  (내 위치, broadcast 송신용)
   .upsertPeer(id, data)  → 다른 학생 아바타 생성/이동  data={x,z,yaw,name,color}
   .removePeer(id)        → 아바타 제거
   .onMission(fn)         → 미션 완료 콜백 fn({id, title})

 예시 (기존 쌤버스 Realtime 패턴):
   const ch = supabase.channel('room-' + roomCode);
   ch.on('broadcast', {event:'pos'}, ({payload}) =>
       SsamverseMap3D.upsertPeer(payload.uid, payload));
   ch.subscribe();
   setInterval(() => {
     const s = SsamverseMap3D.getState();
     ch.send({type:'broadcast', event:'pos',
              payload:{uid: myUid, name: myName, color: myColor, ...s}});
   }, 100);
═══════════════════════════════════════════════════════════════
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#8ecbe8;
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    touch-action:none; user-select:none; -webkit-user-select:none; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  /* ── 시작 화면 ── */
  #startOverlay { position:fixed; inset:0; z-index:50; display:flex;
    align-items:center; justify-content:center;
    background:linear-gradient(160deg,#1b3a5b 0%,#20507a 55%,#2a6a8f 100%); }
  .startCard { width:min(420px,88vw); background:#fffdf6; border-radius:22px;
    padding:30px 28px 26px; text-align:center;
    box-shadow:0 18px 50px rgba(0,0,0,.35); border:3px solid #1b3a5b; }
  .startBadge { display:inline-block; background:#ff6b57; color:#fff;
    font-size:12px; font-weight:800; letter-spacing:.14em;
    padding:5px 12px; border-radius:99px; margin-bottom:12px; }
  .startCard h1 { font-size:26px; color:#1b3a5b; font-weight:900; letter-spacing:-.02em; }
  .startCard h1 small { display:block; font-size:13px; font-weight:600;
    color:#7a8aa0; margin-top:6px; letter-spacing:0; }
  .ctrlGrid { display:grid; grid-template-columns:1fr 1fr; gap:8px;
    margin:20px 0 18px; text-align:left; }
  .ctrlItem { background:#f2f6fb; border-radius:12px; padding:10px 12px; }
  .ctrlItem b { display:block; font-size:12px; color:#ff6b57; margin-bottom:3px; }
  .ctrlItem span { font-size:12.5px; color:#40536b; line-height:1.4; }
  #enterBtn { width:100%; border:none; cursor:pointer; background:#1b3a5b;
    color:#fff; font-size:17px; font-weight:800; padding:14px; border-radius:14px;
    transition:transform .12s, background .12s; }
  #enterBtn:hover { background:#ff6b57; transform:translateY(-2px); }
  #enterBtn:focus-visible { outline:3px solid #ff6b57; outline-offset:2px; }

  /* ── HUD ── */
  #hud { position:fixed; inset:0; z-index:20; pointer-events:none; display:none; }
  #topBar { position:absolute; top:12px; left:12px; display:flex; gap:8px; align-items:center; }
  .chip { background:rgba(20,38,58,.78); color:#fff; border-radius:99px;
    padding:7px 14px; font-size:13px; font-weight:700; backdrop-filter:blur(4px); }
  .chip.accent { background:rgba(255,107,87,.92); }
  #crosshair { position:absolute; left:50%; top:50%; width:10px; height:10px;
    transform:translate(-50%,-50%); }
  #crosshair::before,#crosshair::after { content:''; position:absolute; background:#fff;
    opacity:.85; border-radius:2px; box-shadow:0 0 3px rgba(0,0,0,.5); }
  #crosshair::before { left:4px; top:0; width:2px; height:10px; }
  #crosshair::after { left:0; top:4px; width:10px; height:2px; }
  #missionBanner { position:absolute; left:50%; bottom:120px; transform:translateX(-50%);
    background:#fffdf6; border:3px solid #1b3a5b; border-radius:16px;
    padding:12px 20px; text-align:center; display:none; min-width:240px;
    box-shadow:0 10px 26px rgba(0,0,0,.28); }
  #missionBanner .mTitle { font-size:15px; font-weight:800; color:#1b3a5b; }
  #missionBanner .mKey { font-size:12px; color:#7a8aa0; margin-top:4px; font-weight:600; }
  #toast { position:absolute; left:50%; top:70px; transform:translateX(-50%);
    background:#2fae6e; color:#fff; font-weight:800; font-size:14px;
    padding:10px 20px; border-radius:99px; display:none;
    box-shadow:0 8px 20px rgba(0,0,0,.25); }
  #hintBar { position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    background:rgba(20,38,58,.6); color:#dbe7f3; font-size:12px;
    padding:6px 14px; border-radius:99px; }

  /* ── 모바일 컨트롤 ── */
  /* 방향 레버 — 교실맵과 동일: 좌하단에 항상 보이는 고정 원형 조이스틱 */
  #joyZone { position:fixed; left:24px; bottom:96px; width:120px; height:120px;
    pointer-events:auto; display:none; touch-action:none;
    border-radius:50%; background:rgba(255,255,255,.16); border:2px solid rgba(255,255,255,.45); }
  #joyBase { display:none; } /* 미사용: joyZone 자체가 베이스 링 역할 */
  #joyStick { position:fixed; width:48px; height:48px; border-radius:50%;
    background:rgba(255,255,255,.85); box-shadow:0 4px 12px rgba(0,0,0,.3); display:none; }
  #lookZone { position:absolute; right:0; bottom:0; width:55%; height:100%; pointer-events:auto; display:none; }

  /* ssambus_missions.js 기본 진행바 숨김(운동장 자체 HUD 사용) */
  #ms-progress { display:none !important; }
  #char-btn { position:fixed; top:12px; right:12px; z-index:22; pointer-events:auto;
    background:rgba(27,58,91,.85); color:#fff; padding:7px 12px; border-radius:12px;
    font-size:12px; font-weight:700; text-decoration:none; border:1px solid rgba(255,255,255,.2);
    display:none; font-family:inherit; }
  .mBtn { position:absolute; pointer-events:auto; display:none; border:none;
    border-radius:50%; font-weight:900; color:#fff; box-shadow:0 6px 14px rgba(0,0,0,.3); }
  #jumpBtn { right:22px; bottom:96px; width:64px; height:64px;
    background:rgba(27,58,91,.85); font-size:13px; }
  /* 운동장 전용 달리기 토글 버튼 (점프 버튼 위) */
  #runBtn { right:22px; bottom:170px; width:64px; height:64px;
    background:rgba(27,58,91,.85); font-size:13px; }
  #runBtn.on { background:#ff6b57;
    box-shadow:0 0 0 3px rgba(255,107,87,.45), 0 6px 14px rgba(0,0,0,.3); }
  #actBtn { right:100px; bottom:30px; width:72px; height:72px;
    background:#ff6b57; font-size:14px; }
</style>
</head>
<body>
<div id="app"></div>

<!-- ssambus_realtime.js가 평소처럼 DOM에 쓰도록 두는 숨김 요소 (3D 어댑터가 매 프레임 읽어 미러링) -->
<div id="player" style="display:none"><svg viewBox="0 0 60 76"><g id="cg_p"></g></svg></div>
<div id="remote-players" style="display:none"></div>
<a id="char-btn" href="#">← 캐릭터 변경</a>

<div id="startOverlay">
  <div class="startCard">
    <span class="startBadge">SSAMVERSE MAP</span>
    <h1>운동장<small>3D · 1인칭 · 최대 30명 동시 활동</small></h1>
    <div class="ctrlGrid">
      <div class="ctrlItem"><b>이동</b><span>W A S D / 방향키<br>(모바일: 왼쪽 조이스틱)</span></div>
      <div class="ctrlItem"><b>시점</b><span>마우스 이동<br>(모바일: 오른쪽 드래그)</span></div>
      <div class="ctrlItem"><b>점프</b><span>Space<br>구령대·응원석 계단 이용 가능</span></div>

  </div>
</div>

<div id="hud">
  <div id="topBar">
    <span class="chip">🏟️ 쌤버스 · 운동장</span>
    <span class="chip accent" id="missionCount">미션 0 / 4</span>
  </div>
  <div id="crosshair"></div>
  <div id="missionBanner">
    <div class="mTitle" id="mTitle"></div>
    <div class="mKey" id="mKey">E 키를 눌러 미션 수행</div>
  </div>
  <div id="toast"></div>
  <div id="hintBar">ESC: 마우스 해제 · Shift: 달리기 · Space: 점프</div>
  <div id="joyZone"></div>
  <div id="joyBase"></div><div id="joyStick"></div>
  <div id="lookZone"></div>
  <button class="mBtn" id="runBtn">달리기</button>
  <button class="mBtn" id="jumpBtn">점프</button>
  <button class="mBtn" id="actBtn">미션</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../ssambus_supabase_config.js"></script>
<script src="../ssambus_character_render.js"></script>
<script src="../ssambus_realtime.js"></script>
<script src="../ssambus_missions.js"></script>
<script src="ssambus_3d_adapter.js"></script>
<script>
'use strict';
/* ════════════════ 기본 설정 ════════════════ */
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0
  || matchMedia('(hover: none) and (pointer: coarse)').matches;

// 맵 치수 (유닛 = 대략 1m)
const FIELD_L = 60, FIELD_W = 40;          // 축구장
const TRK_STR = 30;                        // 트랙 직선 절반 길이
const TRK_RIN = 21, LANES = 6, LANE_W = 1.25;
const TRK_ROUT = TRK_RIN + LANES * LANE_W; // 28.5
const BOUND_X = 63, BOUND_Z = 42;          // 이동 한계 (펜스 안쪽)

/* ── 쌤버스 통합: URL 파라미터 + 캐릭터 외형 + 위치(r/c=z/x, TS=1) ── */
var TEACHER_VIEW = new URLSearchParams(window.location.search).get('teacherView') === '1';
var TS = 1;
var __savedChar = (function(){
  try{
    var _cp = new URLSearchParams(window.location.search).get('c');
    if(_cp) return JSON.parse(_cp);
    return JSON.parse(localStorage.getItem('ssambus_player_character'));
  }catch(e){ return null; }
})();
var PLAYER = Object.assign({
  type:'student', skin:'#FDEBD0', hcolor:'#1a1008', hair:'short',
  ccolor:'#1a3a6b', cloth:'suit', gender:'male', acc:[], dir:'down'
}, __savedChar || {});
var pos = { r: 0, c: 0 }; // ssambus_3d_adapter.js가 매 프레임 camera 위치로 갱신

/* ── 캐릭터 변경 버튼 (2D 맵의 #char-btn과 동일 동작) ── */
(function(){
  var params = new URLSearchParams(window.location.search);
  var room = params.get('room');
  if(!room || TEACHER_VIEW) return;
  var btn = document.getElementById('char-btn');
  if(!btn) return;
  var nickname = params.get('nickname') || '';
  try{ nickname = nickname || sessionStorage.getItem('ssambus_nickname') || ''; }catch(e){}
  var q = 'room=' + encodeURIComponent(room) + '&map=' + encodeURIComponent('ssamverse3d/playground3d.html');
  if(nickname) q += '&nickname=' + encodeURIComponent(nickname);
  if(params.get('teacherMode') === '1') q += '&teacherMode=1'; // 애니 캐릭터 잠금 면제 유지
  btn.href = '../ssambus_characters.html?' + q;
  btn.style.display = 'inline-block';
})();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8ecbe8);
scene.fog = new THREE.Fog(0x8ecbe8, 90, 220);

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 400);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ════════════════ 조명 & 하늘 ════════════════ */
scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x6a8f5a, 0.75));
const sun = new THREE.DirectionalLight(0xfff4dd, 1.0);
sun.position.set(45, 70, 25);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera;
sc.left=-80; sc.right=80; sc.top=60; sc.bottom=-60; sc.near=10; sc.far=180;
scene.add(sun);

// 구름
const clouds = [];
(function makeClouds(){
  const mat = new THREE.MeshLambertMaterial({ color:0xffffff });
  for (let i=0;i<6;i++){
    const g = new THREE.Group();
    const n = 3 + Math.floor(Math.random()*3);
    for (let j=0;j<n;j++){
      const s = 4 + Math.random()*5;
      const m = new THREE.Mesh(new THREE.SphereGeometry(s, 10, 8), mat);
      m.position.set(j*5 - n*2.5, Math.random()*1.5, Math.random()*3);
      m.scale.y = 0.55;
      g.add(m);
    }
    g.position.set(-140 + Math.random()*280, 42 + Math.random()*16, -90 + Math.random()*180);
    scene.add(g); clouds.push(g);
  }
})();

/* ════════════════ 바닥: 캔버스 텍스처 ════════════════ */
const PLANE_W = 132, PLANE_H = 90, PX = 16;         // 16px / unit
function w2px(x){ return (x + PLANE_W/2) * PX; }
function w2py(z){ return (z + PLANE_H/2) * PX; }

function stadiumPath(ctx, cx, cy, halfStr, r){
  ctx.beginPath();
  ctx.arc(cx - halfStr, cy, r, Math.PI/2, Math.PI*1.5);
  ctx.lineTo(cx + halfStr, cy - r);
  ctx.arc(cx + halfStr, cy, r, -Math.PI/2, Math.PI/2);
  ctx.lineTo(cx - halfStr, cy + r);
  ctx.closePath();
}

function buildGroundTexture(){
  const cv = document.createElement('canvas');
  cv.width = PLANE_W*PX; cv.height = PLANE_H*PX;
  const c = cv.getContext('2d');
  const CX = cv.width/2, CY = cv.height/2, U = PX;

  // 1) 잔디 베이스
  c.fillStyle = '#4a9553'; c.fillRect(0,0,cv.width,cv.height);
  c.globalAlpha = 0.08; c.fillStyle = '#2e6e3a';
  for (let i=0;i<800;i++)
    c.fillRect(Math.random()*cv.width, Math.random()*cv.height, 3+Math.random()*8, 3+Math.random()*8);
  c.globalAlpha = 1;

  // 2) 콘크리트 보도 (트랙 바깥 테두리)
  c.fillStyle = '#cfc9ba';
  stadiumPath(c, CX, CY, TRK_STR*U, (TRK_ROUT+2.2)*U); c.fill();

  // 3) 트랙 (테라코타)
  c.fillStyle = '#c95a3c';
  stadiumPath(c, CX, CY, TRK_STR*U, TRK_ROUT*U); c.fill();
  // 트랙 질감
  c.save();
  stadiumPath(c, CX, CY, TRK_STR*U, TRK_ROUT*U); c.clip();
  c.globalAlpha = 0.07; c.fillStyle = '#8f3d28';
  for (let i=0;i<1400;i++)
    c.fillRect(Math.random()*cv.width, Math.random()*cv.height, 2, 2);
  c.restore();

  // 4) 트랙 안쪽 잔디 (축구장 포함, 잔디 줄무늬)
  c.save();
  stadiumPath(c, CX, CY, TRK_STR*U, TRK_RIN*U); c.clip();
  c.fillStyle = '#4a9553'; c.fillRect(0,0,cv.width,cv.height);
  c.fillStyle = '#54a55e';
  const stripe = 5*U;
  for (let x = CX - TRK_STR*U - TRK_RIN*U; x < CX + TRK_STR*U + TRK_RIN*U; x += stripe*2)
    c.fillRect(x, 0, stripe, cv.height);
  c.restore();

  // 5) 트랙 레인 라인 (흰색)
  c.strokeStyle = '#f5f2ea'; c.lineWidth = Math.max(2, 0.1*U);
  for (let i=0;i<=LANES;i++){
    stadiumPath(c, CX, CY, TRK_STR*U, (TRK_RIN + i*LANE_W)*U); c.stroke();
  }
  // 출발/결승선 (근측 직선, x=0)
  c.fillStyle = '#f5f2ea';
  c.fillRect(w2px(-0.25), w2py(TRK_RIN), 0.5*U, LANES*LANE_W*U);
  c.fillRect(w2px(-0.25), w2py(-TRK_ROUT), 0.5*U, LANES*LANE_W*U);

  // 6) 축구장 흰 선
  const LW = Math.max(3, 0.16*U);
  c.strokeStyle = '#ffffff'; c.lineWidth = LW; c.fillStyle = '#ffffff';
  const fl = w2px(-FIELD_L/2), fr = w2px(FIELD_L/2),
        ft = w2py(-FIELD_W/2), fb = w2py(FIELD_W/2);
  c.strokeRect(fl, ft, FIELD_L*U, FIELD_W*U);              // 외곽선
  c.beginPath(); c.moveTo(CX, ft); c.lineTo(CX, fb); c.stroke();   // 하프라인
  c.beginPath(); c.arc(CX, CY, 5.5*U, 0, Math.PI*2); c.stroke();   // 센터서클
  c.beginPath(); c.arc(CX, CY, 0.28*U, 0, Math.PI*2); c.fill();    // 센터스팟
  for (const s of [-1, 1]){                                        // 좌우 진영
    const gx = w2px(s*FIELD_L/2);
    const dir = -s;
    c.strokeRect(Math.min(gx, gx + dir*9.5*U), w2py(-12), 9.5*U, 24*U);   // 페널티박스
    c.strokeRect(Math.min(gx, gx + dir*3.6*U), w2py(-6),  3.6*U, 12*U);   // 골에어리어
    const px_ = gx + dir*6.6*U;                                            // 페널티스팟
    c.beginPath(); c.arc(px_, CY, 0.26*U, 0, Math.PI*2); c.fill();
    c.beginPath();                                                         // 페널티아크
    c.arc(px_, CY, 5.5*U, s>0 ? Math.PI*0.62 : -Math.PI*0.38, s>0 ? Math.PI*1.38 : Math.PI*0.38);
    c.stroke();
    // 코너아크
    c.beginPath(); c.arc(gx, ft, 0.9*U, s>0 ? Math.PI/2 : 0, s>0 ? Math.PI : Math.PI/2); c.stroke();
    c.beginPath(); c.arc(gx, fb, 0.9*U, s>0 ? Math.PI : Math.PI*1.5, s>0 ? Math.PI*1.5 : Math.PI*2); c.stroke();
  }
  return new THREE.CanvasTexture(cv);
}

const groundTex = buildGroundTexture();
groundTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(PLANE_W, PLANE_H),
  new THREE.MeshLambertMaterial({ map: groundTex })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// 맵 바깥 여분 잔디
const outer = new THREE.Mesh(
  new THREE.PlaneGeometry(500, 500),
  new THREE.MeshLambertMaterial({ color:0x468f50 })
);
outer.rotation.x = -Math.PI/2; outer.position.y = -0.02;
outer.receiveShadow = true;
scene.add(outer);

/* ════════════════ 충돌/높이 시스템 ════════════════ */
const circleColliders = [];   // {x, z, r}
const heightZones = [];       // 걸어 올라갈 수 있는 지형

function heightAt(x, z){
  let h = 0;
  for (const zn of heightZones){
    const v = zn.fn(x, z);
    if (v !== null && v > h) h = v;
  }
  return h;
}

const SEAT_COLORS = [0xff6b57, 0xffc94d, 0x59c98f, 0x5aa7e0];

function buildBleacher(x0, x1, zFront, rows, dir, withRoof){
  const len = x1 - x0, cx = (x0 + x1)/2;
  const g = new THREE.Group();
  const concrete = new THREE.MeshLambertMaterial({ color:0xd7d2c4 });
  for (let i=0;i<rows;i++){
    const h = 0.42*(i+1), depth = 0.9;
    const zc = zFront + dir*(i*depth + depth/2);
    const step = new THREE.Mesh(new THREE.BoxGeometry(len, h, depth), concrete);
    step.position.set(cx, h/2, zc);
    step.castShadow = true; step.receiveShadow = true;
    g.add(step);
    const seat = new THREE.Mesh(new THREE.BoxGeometry(len-0.4, 0.12, 0.4),
      new THREE.MeshLambertMaterial({ color: SEAT_COLORS[i % SEAT_COLORS.length] }));
    seat.position.set(cx, h+0.06, zc + dir*0.15);
    seat.receiveShadow = true;
    g.add(seat);
  }
  if (withRoof){
    const roofMat = new THREE.MeshLambertMaterial({ color:0x2f5f8f });
    const roof = new THREE.Mesh(new THREE.BoxGeometry(len+1.2, 0.15, rows*0.9+2.2), roofMat);
    roof.position.set(cx, 0.42*rows + 2.6, zFront + dir*(rows*0.9/2 + 0.2));
    roof.rotation.x = dir * -0.12;
    roof.castShadow = true;
    g.add(roof);
    const postMat = new THREE.MeshLambertMaterial({ color:0x9aa4ad });
    for (const px of [x0+0.5, cx, x1-0.5]){
      const pz = zFront + dir*(rows*0.9 + 0.9);
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09, 0.42*rows+2.6, 8), postMat);
      post.position.set(px, (0.42*rows+2.6)/2, pz);
      post.castShadow = true;
      g.add(post);
      circleColliders.push({ x:px, z:pz, r:0.22 });
    }
  }
  scene.add(g);
  heightZones.push({ fn:(x,z) => {
    if (x < x0 || x > x1) return null;
    const d = dir > 0 ? z - zFront : zFront - z;
    if (d < 0 || d > rows*0.9) return null;
    return 0.42 * (Math.floor(d/0.9) + 1);
  }});
}

// 트랙 중심선 좌표 (거리 d → 위치/방향)
const TRK_RC = TRK_RIN + LANE_W*3;
const SEG1 = TRK_STR*2, SEG2 = Math.PI*TRK_RC;
const TRK_PERIM = SEG1*2 + SEG2*2;
function trackPoint(d){
  d = ((d % TRK_PERIM) + TRK_PERIM) % TRK_PERIM;
  if (d < SEG1) return { x:-TRK_STR+d, z:TRK_RC, yaw:-Math.PI/2 };
  d -= SEG1;
  if (d < SEG2){
    const a = Math.PI/2 - d/TRK_RC;
    return { x:TRK_STR + Math.cos(a)*TRK_RC, z:Math.sin(a)*TRK_RC, yaw:a };
  }
  d -= SEG2;
  if (d < SEG1) return { x:TRK_STR-d, z:-TRK_RC, yaw:Math.PI/2 };
  d -= SEG1;
  const a = -Math.PI/2 - d/TRK_RC;
  return { x:-TRK_STR + Math.cos(a)*TRK_RC, z:Math.sin(a)*TRK_RC, yaw:a };
}

// 모바일: 좌하단 고정 원형 조이스틱 + 오른쪽 드래그 시점 (교실맵과 동일 방식)
if (IS_TOUCH){
  const joyZone = document.getElementById('joyZone'),
        joyStick = document.getElementById('joyStick'),
        lookZone = document.getElementById('lookZone');
  const JOY_MAX = 48;
  let joyId = null;
  function joyCenter(){ const r = joyZone.getBoundingClientRect(); return { cx:r.left+r.width/2, cy:r.top+r.height/2 }; }
  function joySet(dx, dy){ const c = joyCenter(); joyStick.style.left = (c.cx+dx-24)+'px'; joyStick.style.top = (c.cy+dy-24)+'px'; }
  window.__pgJoyRest = function(){ joyVec.x = joyVec.y = 0; joySet(0, 0); }; // 입장 시 노브 중앙 배치용
  function joyHandle(t){
    const c = joyCenter();
    let dx = t.clientX-c.cx, dy = t.clientY-c.cy;
    const L = Math.hypot(dx,dy);
    if (L > JOY_MAX){ dx = dx/L*JOY_MAX; dy = dy/L*JOY_MAX; }
    joyVec.x = dx/JOY_MAX; joyVec.y = dy/JOY_MAX;
    joySet(dx, dy);
  }
  joyZone.addEventListener('touchstart', e => {
    if (joyId !== null) return;
    const t = e.changedTouches[0]; joyId = t.identifier; joyHandle(t);
  }, {passive:true});
  joyZone.addEventListener('touchmove', e => {
    for (const t of e.changedTouches){ if (t.identifier === joyId) joyHandle(t); }
  }, {passive:true});
  const joyEnd = e => {
    for (const t of e.changedTouches){ if (t.identifier === joyId){ joyId = null; joyVec.x = joyVec.y = 0; joySet(0,0); } }
  };
  joyZone.addEventListener('touchend', joyEnd);
  joyZone.addEventListener('touchcancel', joyEnd);

  let lookId = null, lx = 0, ly = 0;
  lookZone.addEventListener('touchstart', e => {
    const t = e.changedTouches[0];
    lookId = t.identifier; lx = t.clientX; ly = t.clientY;
  }, {passive:true});
  lookZone.addEventListener('touchmove', e => {
    for (const t of e.changedTouches){
      if (t.identifier !== lookId) continue;
      player.yaw -= (t.clientX-lx) * 0.005;
      player.pitch -= (t.clientY-ly) * 0.005;
      player.pitch = Math.max(-1.35, Math.min(1.35, player.pitch));
      lx = t.clientX; ly = t.clientY;
    }
  }, {passive:true});
  lookZone.addEventListener('touchend', e => {
    for (const t of e.changedTouches) if (t.identifier === lookId) lookId = null;
  });
  document.getElementById('jumpBtn').addEventListener('touchstart', () => {
    if (player.onGround && started && !modalOpen && !TEACHER_VIEW){ player.vy = 6.2; player.onGround = false; }
  }, {passive:true});
  document.getElementById('actBtn').addEventListener('touchstart', tryMission, {passive:true});
  // 달리기 토글 (모바일: Shift 대신 버튼). 눌린 상태를 색으로 표시.

    running = !running;
    runBtn.classList.toggle('on', running);
  });
}

function tryMove(nx, nz){
  // 맵 경계
  nx = Math.max(-BOUND_X, Math.min(BOUND_X, nx));
  nz = Math.max(-BOUND_Z, Math.min(BOUND_Z, nz));
  // 원형 충돌체 밀어내기
  for (const c of circleColliders){
    const dx = nx-c.x, dz = nz-c.z, rr = c.r + player.radius;
    const d2 = dx*dx + dz*dz;
    if (d2 < rr*rr && d2 > 1e-6){
      const d = Math.sqrt(d2);
      nx = c.x + dx/d*rr; nz = c.z + dz/d*rr;
    }
  }
  // 단차 검사 (0.5 초과는 벽으로 취급 → 축 분리 슬라이드)
  const curH = player.footY;
  if (heightAt(nx, nz) - curH <= 0.5){ player.x = nx; player.z = nz; return; }
  if (heightAt(nx, player.z) - curH <= 0.5){ player.x = nx; return; }
  if (heightAt(player.x, nz) - curH <= 0.5){ player.z = nz; }
}

/* ── 미션 근접 검사 (checkMission3D — trigger_point 좌표 기반) ── */
let nearMission = null; // checkMission3D()가 반환한 ssambus 미션 객체(또는 null)
function checkMissions(){
  nearMission = (typeof checkMission3D === 'function') ? checkMission3D(player.x, player.z) : null;
  const bn = document.getElementById('missionBanner');
  if (nearMission){
    document.getElementById('mTitle').textContent = '📍 ' + (nearMission.title || '미션');
    document.getElementById('mKey').textContent = IS_TOUCH ? '미션 버튼을 눌러 수행' : 'E 키를 눌러 미션 수행';
    bn.style.display = 'block';
    if (IS_TOUCH) document.getElementById('actBtn').style.display = 'block';
  } else {
    bn.style.display = 'none';
    if (IS_TOUCH) document.getElementById('actBtn').style.display = 'none';
  }
}
function tryMission(){
  if (!nearMission || modalOpen || TEACHER_VIEW) return;
  if (document.pointerLockElement) document.exitPointerLock();
  __msOpenMission([nearMission]); // ssambus 모달로 문제 표시/채점/완료
}

/* ════════════════ 원격 플레이어 (Supabase 연동용) ════════════════ */
const peers = {};   // id → { g, tx, tz, tyaw }
window.SsamverseMap3D = {
  getState(){ return { x:+player.x.toFixed(2), y:+player.footY.toFixed(2),
                       z:+player.z.toFixed(2), yaw:+player.yaw.toFixed(3) }; },
  upsertPeer(id, d){
    if (!peers[id]){
      const g = makeAvatar(d.color || 0x5aa7e0, d.name || '');
      scene.add(g);
      peers[id] = { g, tx:d.x||0, tz:d.z||0, tyaw:d.yaw||0 };
      g.position.set(d.x||0, 0, d.z||0);
    }
    const p = peers[id];
    p.tx = d.x; p.tz = d.z; p.tyaw = d.yaw || 0;
  },
  removePeer(id){
    if (peers[id]){ scene.remove(peers[id].g); delete peers[id]; }
  },
  onMission(fn){ missionCbs.push(fn); }
};

/* ── 출구 포털 (필수 미션 완료 후 다가가면 다음 맵으로 이동) ── */
const EXIT_POS = { x: 45, z: 35 }; // 트랙/응원석 밖의 개방된 코너
(function(){
  const g = new THREE.Group();
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.8, 0.2, 12, 40),
    new THREE.MeshBasicMaterial({ color:0x4da6ff }));
  ring.position.y = 2.0; g.add(ring);
  const glow = new THREE.Mesh(new THREE.CircleGeometry(1.6, 32),
    new THREE.MeshBasicMaterial({ color:0x8fd0ff, transparent:true, opacity:0.35, side:THREE.DoubleSide }));
  glow.position.y = 2.0; g.add(glow);
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 64;
  const cx = cv.getContext('2d');
  cx.fillStyle = 'rgba(20,38,58,.8)';
  if (cx.roundRect) { cx.beginPath(); cx.roundRect(20,8,216,48,20); cx.fill(); } else cx.fillRect(20,8,216,48);
  cx.fillStyle = '#fff'; cx.font = 'bold 30px sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.fillText('🚪 출구', 128, 34);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(cv), transparent:true }));
  sp.scale.set(3, 0.75, 1); sp.position.y = 4.3; g.add(sp);
  g.position.set(EXIT_POS.x, 0, EXIT_POS.z);
  scene.add(g);
  window.__exitPortal = g;
})();
function isAtExit(x, z){ return Math.hypot(x - EXIT_POS.x, z - EXIT_POS.z) < 2.8; }
let exitNoticeActive = false;

/* ── 쌤버스 통합 초기화 (실시간 멀티플레이어 + 미션 + 3D 어댑터) ── */
try { initRealtime('playground3d'); } catch (e) { console.warn('[playground3d] realtime:', e); }
if (!TEACHER_VIEW) {
  try { initMissionSystem('playground3d'); } catch (e) { console.warn('[playground3d] missions:', e); }
}
try { SsamAdapter3D.init({ THREE, scene, camera }); } catch (e) { console.warn('[playground3d] adapter:', e); }

// 교사 실시간 맵 보기(teacherView=1): 버튼 없이 자동 시작 + 조감 시점 고정(관찰 전용)
if (TEACHER_VIEW) {
  const so = document.getElementById('startOverlay'); if (so) so.style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  started = true;
  camera.position.set(0, 72, 80);
  camera.lookAt(0, 0, 0);
}

/* ════════════════ 메인 루프 ════════════════ */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // 모달 열림 추적 — 닫히면 포인터락 복원
  const wasModal = modalOpen;
  modalOpen = isMsModalOpen();
  if (wasModal && !modalOpen && started && !IS_TOUCH && !TEACHER_VIEW) lockPointer();

  if (started && !modalOpen && !TEACHER_VIEW){
    // 입력 → 이동
    let fw = 0, sd = 0;
    if (keys['KeyW'] || keys['ArrowUp']) fw += 1;
    if (keys['KeyS'] || keys['ArrowDown']) fw -= 1;
    if (keys['KeyA'] || keys['ArrowLeft']) sd -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) sd += 1;
    fw += -joyVec.y; sd += joyVec.x;
    const L = Math.hypot(fw, sd);
    if (L > 1){ fw /= L; sd /= L; }
    const speed = (running ? 7.2 : 4.3);
    const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
    const dx = (-sin*fw + cos*sd) * speed * dt;
    const dz = (-cos*fw - sin*sd) * speed * dt;
    if (dx || dz) tryMove(player.x + dx, player.z + dz);

    // 중력/지형 높이
    const gh = heightAt(player.x, player.z);
    if (player.onGround){
      if (player.footY > gh + 0.01){ player.onGround = false; }       // 낙하 시작
      else player.footY = gh;
    }
    if (!player.onGround){
      player.vy -= 18 * dt;
      player.footY += player.vy * dt;
      if (player.footY <= gh){ player.footY = gh; player.vy = 0; player.onGround = true; }
    }

    // 카메라 (걷기 흔들림 살짝). roll(z)=0 고정으로 화면 기울어짐 방지.
    const bob = (fw||sd) && player.onGround ? Math.sin(t*(running?13:9))*0.05 : 0;
    camera.position.set(player.x, player.footY + player.eye + bob, player.z);
    camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');

    checkMissions();

    // 출구 판정 — 필수 미션 완료 시 다음 맵으로 자동 이동
    if (!nearMission && typeof requestMapExit3D === 'function' && isAtExit(player.x, player.z)){
      const st = requestMapExit3D();
      if (st === 'incomplete' && !exitNoticeActive){
        exitNoticeActive = true;
        if (typeof __msShowBlockedNotice === 'function') __msShowBlockedNotice();
      }
    } else {
      exitNoticeActive = false;
    }
  }

  // 미션 마커 색 갱신(로드 지연 대응) + 원격 학생 동기화 + HUD
  refreshMissionMarkers();
  // 점프/계단 높이를 다른 학생에게도 보이도록 foot height를 pos.y로 전달(어댑터가 브로드캐스트)
  pos.y = player.footY;
  if (started && typeof SsamAdapter3D !== 'undefined'){ try { SsamAdapter3D.update(dt, camera); } catch (e) {} }
  // HUD: 이 맵의 완료 수 / 이 맵의 미션 수 (__msDone.size는 방 전체 누적이라 맵 단위로 카운트)
  const __ids = Object.keys(missionMeshes);
  const __doneN = (typeof __msDone !== 'undefined') ? __ids.filter(id => __msDone.has(id)).length : 0;
  document.getElementById('missionCount').textContent = '미션 ' + __doneN + ' / ' + __ids.length;
  // 출구 포털 회전
  if (window.__exitPortal) window.__exitPortal.rotation.y = t * 0.6;

  // NPC
  for (const n of npcs){
    if (n.mode === 'run'){
      n.d += n.spd * dt;
      const p = trackPoint(n.d);
      const off = n.lane;
      // 레인 오프셋: 중심 방향으로
      const cx = Math.max(-TRK_STR, Math.min(TRK_STR, p.x));
      const dirx = p.x - cx, dirz = p.z;
      const dl = Math.hypot(dirx, dirz) || 1;
      n.g.position.set(p.x + dirx/dl*off, 0, p.z + dirz/dl*off);
      n.g.rotation.y = p.yaw;
      n.g.position.y = Math.abs(Math.sin(t*8 + n.d))*0.08;   // 달리기 통통
    } else if (n.mode === 'idle'){
      n.g.rotation.y = Math.sin(t*0.5 + n.t) * 0.8;
    } else if (n.mode === 'sit'){
      n.g.position.y += 0;                                    // 착석 고정
    }
  }

  // 원격 플레이어 보간
  for (const id in peers){
    const p = peers[id];
    p.g.position.x += (p.tx - p.g.position.x) * Math.min(1, dt*10);
    p.g.position.z += (p.tz - p.g.position.z) * Math.min(1, dt*10);
    p.g.rotation.y += (p.tyaw - p.g.rotation.y) * Math.min(1, dt*10);
  }

  // 미션 링 회전/부유 (미완료만)
  for (const id in missionMeshes){
    const done = (typeof __msDone !== 'undefined') && __msDone.has(id);
    if (!done){
      const mm = missionMeshes[id];
      mm.ring.rotation.z = t * 1.5;
      mm.ring.userData.baseY = mm.ring.userData.baseY ?? mm.ring.position.y;
      mm.ring.position.y = mm.ring.userData.baseY + Math.sin(t*2)*0.12;
    }
  }

  // 구름 이동
  for (const c of clouds){
    c.position.x += dt * 1.2;
    if (c.position.x > 160) c.position.x = -160;
  }

  renderer.render(scene, camera);
}
animate();

/* ════════════════ 입장 ════════════════ */
document.getElementById('enterBtn').addEventListener('click', () => {
  document.getElementById('startOverlay').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  started = true;
  if (IS_TOUCH){
    document.getElementById('joyZone').style.display = 'block';
    document.getElementById('joyStick').style.display = 'block';
    document.getElementById('lookZone').style.display = 'block';
    document.getElementById('jumpBtn').style.display = 'block';
    document.getElementById('runBtn').style.display = 'block';
    document.getElementById('hintBar').textContent = '왼쪽: 이동 · 오른쪽: 시점 · 달리기/점프 버튼 · 계단으로 구령대·응원석 오르기';
    if (window.__pgJoyRest) window.__pgJoyRest(); // 노브를 레버 중앙에 배치
  } else {
    lockPointer();
  }
});
</script>
