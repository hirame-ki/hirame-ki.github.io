<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쌤버스 교사 대시보드</title>
<style>
*{box-sizing:border-box}
body{font-family:sans-serif;padding:0;margin:0;background:#f5f6f8;color:#222}

/* ===== 접속 코드 / 수업 선택 화면 ===== */
#gate, #roomGate{position:fixed;inset:0;background:#2c3e50;display:flex;align-items:center;justify-content:center;z-index:100}
#gate.hidden, #roomGate.hidden{display:none}
.gate-box{background:#fff;padding:2rem 2.5rem;border-radius:12px;text-align:center;width:320px}
.gate-box.wide{width:380px}
.gate-box h1{margin:0 0 .3rem;font-size:1.3rem}
.gate-box p{margin:0 0 1.2rem;font-size:13px;color:#777}
.gate-box input{width:100%;padding:10px;font-size:15px;border:1px solid #ccc;border-radius:8px;margin-bottom:.8rem;text-align:center}
.gate-box button{width:100%;padding:10px;font-size:15px;border:none;border-radius:8px;background:#2c3e50;color:#fff;cursor:pointer;font-weight:500}
.gate-box button:hover{background:#1a252f}
.gate-box button.secondary{background:#eee;color:#444}
.gate-box button.secondary:hover{background:#ddd}
.gate-err{color:#e74c3c;font-size:12px;margin-top:.5rem;min-height:16px}
.gate-divider{display:flex;align-items:center;gap:8px;margin:1.2rem 0;color:#bbb;font-size:11px}
.gate-divider::before,.gate-divider::after{content:'';flex:1;height:1px;background:#eee}

/* ===== 레이아웃 ===== */
#dash{display:none}
#dash.show{display:block}
.topbar{display:flex;align-items:center;justify-content:space-between;background:#2c3e50;color:#fff;padding:12px 20px}
.topbar h1{font-size:1.1rem;margin:0;font-weight:600}
.topbar .room{font-size:12px;background:#1a252f;padding:4px 10px;border-radius:6px;margin-left:10px}
.topbar button{padding:6px 14px;border-radius:6px;border:none;background:#fff;color:#2c3e50;font-size:12px;font-weight:500;cursor:pointer}
.topbar .left{display:flex;align-items:center;gap:0}

.maptabs{display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px;background:#fff;border-bottom:1px solid #e2e2e2}
.maptab{padding:8px 18px;font-size:13px;border-radius:20px;border:1px solid #ccc;background:#fff;cursor:pointer}
.maptab.on{background:#2c3e50;color:#fff;border-color:#2c3e50;font-weight:500}

.content{padding:20px;max-width:1000px;margin:0 auto}
.zone{background:#fff;border-radius:10px;padding:16px 18px;margin-bottom:16px;border:1px solid #e6e6e6}
.zone-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.zone-head h2{font-size:15px;margin:0}
.zone-head .badge{font-size:11px;color:#888;font-weight:normal;margin-left:6px}
.addbtn{padding:6px 12px;font-size:12px;border-radius:6px;border:1px solid #2c3e50;background:#fff;color:#2c3e50;cursor:pointer;font-weight:500}
.addbtn:hover{background:#2c3e50;color:#fff}

.mlist{display:flex;flex-direction:column;gap:8px}
.mcard{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:#f8f9fa;border-radius:8px;border:1px solid #ececec}
.mcard .info{flex:1;min-width:0}
.mcard .title{font-size:13.5px;font-weight:500;margin-bottom:3px}
.mcard .meta{font-size:11px;color:#888}
.mcard .meta span{margin-right:8px}
.mtype{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10.5px;font-weight:600;color:#fff}
.mtype.youtube{background:#e74c3c}
.mtype.quiz{background:#9b59b6}
.mtype.google_form{background:#27ae60}
.mtype.link{background:#3498db}
.req{color:#e67e22;font-weight:600}
.mcard .btns{display:flex;gap:6px;flex-shrink:0}
.mcard .btns button{padding:5px 10px;font-size:11.5px;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer}
.mcard .btns button.del{color:#e74c3c;border-color:#f5b7b1}
.mcard .btns button:hover{background:#eee}
.mcard .btns button:disabled{color:#ccc;border-color:#eee;cursor:not-allowed;background:#fafafa}
.mcard .btns button:disabled:hover{background:#fafafa}
.empty{font-size:12.5px;color:#aaa;padding:8px 0;text-align:center}

/* ===== 모달 ===== */
#modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal-bg.show{display:flex}
#modal{background:#fff;border-radius:12px;padding:1.6rem;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
#modal h2{margin:0 0 1rem;font-size:16px}
.field{margin-bottom:.9rem}
.field label{display:block;font-size:12.5px;color:#555;margin-bottom:4px;font-weight:500}
.field input[type=text],.field input[type=number],.field input[type=url],.field select,.field textarea{
  width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-size:13px;font-family:inherit}
.field textarea{resize:vertical;min-height:54px}
.row2{display:flex;gap:10px}
.row2 .field{flex:1}
.checkrow{display:flex;align-items:center;gap:6px;font-size:13px}
.checkrow input{width:auto}
.opt-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.opt-row input[type=text]{flex:1}
.opt-row input[type=radio]{width:auto;flex-shrink:0}
.modal-btns{display:flex;gap:8px;margin-top:1.2rem}
.modal-btns button{flex:1;padding:10px;border-radius:8px;border:none;font-size:14px;font-weight:500;cursor:pointer}
.btn-save{background:#2c3e50;color:#fff}
.btn-save:hover{background:#1a252f}
.btn-cancel{background:#eee;color:#444}
.btn-cancel:hover{background:#ddd}
.section-hint{font-size:11.5px;color:#999;margin:-4px 0 10px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2c3e50;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;display:none;z-index:60}

/* ===== 학생 초대 링크 모달 ===== */
#linkModal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#linkModal-bg.show{display:flex}
#linkModal{background:#fff;border-radius:12px;padding:1.6rem;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
#linkModal h2{margin:0 0 1rem;font-size:16px}
.roomcode-box{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#f8f9fa;border-radius:8px;padding:10px 12px;margin-bottom:14px}
.roomcode-box b{font-size:18px;letter-spacing:3px;font-family:monospace}
.linkrow{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.linkrow .lbl{width:64px;font-size:12px;color:#666;flex-shrink:0}
.linkrow input{flex:1;padding:7px 8px;border:1px solid #ccc;border-radius:6px;font-size:11.5px;background:#f8f9fa;font-family:monospace}
.linkrow button{padding:7px 10px;font-size:12px;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer;flex-shrink:0}
.linkrow button:hover{background:#eee}

/* ===== 상단바 버튼 그룹 ===== */
.topbar .right{display:flex;gap:8px}
.topbar .right button{padding:6px 14px;border-radius:6px;border:none;font-size:12px;font-weight:500;cursor:pointer}
.topbar .right .primary{background:#fff;color:#2c3e50}
.topbar .right .primary:hover{background:#eee}
.topbar .right .ghost{background:#3d5166;color:#fff}
.topbar .right .ghost:hover{background:#4a6178}
</style>
</head>
<body>

<!-- 접속 코드 화면 -->
<div id="gate">
  <div class="gate-box">
    <h1>🎓 쌤버스 교사 대시보드</h1>
    <p>교사 접속 코드를 입력하세요</p>
    <input type="password" id="gateCode" placeholder="접속 코드" autocomplete="off">
    <button onclick="checkGate()">입장</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>

<!-- 수업 만들기 / 불러오기 화면 -->
<div id="roomGate" class="hidden">
  <div class="gate-box wide">
    <h1>🏫 수업 선택</h1>
    <p>새 수업을 만들거나, 기존 수업 코드를 입력해 이어서 관리하세요</p>
    <button onclick="createNewRoom()">+ 새 수업 만들기</button>
    <div class="gate-divider">또는</div>
    <input type="text" id="roomCodeInput" placeholder="기존 수업 코드 입력 (예: A3F9K2)" maxlength="12" style="text-transform:uppercase">
    <button class="secondary" onclick="loadExistingRoom()">이 코드로 입장</button>
    <div class="gate-err" id="roomErr"></div>
  </div>
</div>

<!-- 대시보드 -->
<div id="dash">
  <div class="topbar">
    <div class="left">
      <h1>🎓 쌤버스 교사 대시보드</h1>
      <span class="room" id="roomBadge">수업 코드: -</span>
    </div>
    <div class="right">
      <button class="primary" onclick="openLinkModal()">🔗 학생 초대 링크</button>
      <button class="ghost" onclick="newClass()">수업 변경</button>
      <button class="ghost" onclick="logout()">로그아웃</button>
    </div>
  </div>

  <div class="maptabs" id="maptabs"></div>

  <div class="content" id="content"></div>
</div>

<!-- 학생 초대 링크 모달 -->
<div id="linkModal-bg">
  <div id="linkModal">
    <h2>학생 초대 링크</h2>
    <div class="roomcode-box">
      <span>수업 코드: <b id="lm_roomcode"></b></span>
      <button onclick="copyText(document.getElementById('lm_roomcode').textContent, this)">코드 복사</button>
    </div>
    <div class="section-hint">아래 링크를 학생들에게 안내하면, 해당 맵에서 이 수업의 미션을 받게 됩니다. (링크를 QR코드로 만들어 공유해도 좋습니다)</div>
    <div id="lm_links"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeLinkModal()">닫기</button>
    </div>
  </div>
</div>

<!-- 미션 추가/수정 모달 -->
<div id="modal-bg">
  <div id="modal">
    <h2 id="modalTitle">미션 추가</h2>
    <div class="field">
      <label>미션 제목</label>
      <input type="text" id="f_title" placeholder="예: 수업 안내 영상 시청">
    </div>
    <div class="row2">
      <div class="field">
        <label>유형</label>
        <select id="f_type" onchange="onTypeChange()">
          <option value="youtube">유튜브 영상</option>
          <option value="quiz">퀴즈</option>
          <option value="google_form">구글 설문</option>
          <option value="link">링크</option>
        </select>
      </div>
      <div class="field">
        <label>순서</label>
        <input type="number" id="f_order" min="1" value="1">
      </div>
    </div>
    <div class="field" id="contentField">
      <label>내용 (URL)</label>
      <input type="url" id="f_content" placeholder="https://...">
    </div>
    <div class="field" id="quizField" style="display:none">
      <label>퀴즈 질문</label>
      <textarea id="q_question" placeholder="질문을 입력하세요"></textarea>
      <div class="section-hint">아래 보기 중 정답에 해당하는 라디오 버튼을 선택하세요</div>
      <div class="opt-row"><input type="radio" name="q_answer" value="0"><input type="text" id="q_opt0" placeholder="보기 1"></div>
      <div class="opt-row"><input type="radio" name="q_answer" value="1"><input type="text" id="q_opt1" placeholder="보기 2"></div>
      <div class="opt-row"><input type="radio" name="q_answer" value="2"><input type="text" id="q_opt2" placeholder="보기 3"></div>
      <div class="opt-row"><input type="radio" name="q_answer" value="3"><input type="text" id="q_opt3" placeholder="보기 4"></div>
    </div>
    <div class="field">
      <label class="checkrow"><input type="checkbox" id="f_required" checked> 필수 미션 (체크 해제 시 선택 미션)</label>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveMission()">저장</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="ssambus_supabase_config.js"></script>
<script>
/* ===================== 설정 ===================== */
const ACCESS_CODE = 'ssambus2026';   // 교사 접속 코드 (필요시 이 값을 변경하세요)
const ROOM_KEY = 'ssambus_teacher_room';
let ROOM_ID = localStorage.getItem(ROOM_KEY) || null;

/* 학생용 맵 파일 (수업 코드를 ?room= 파라미터로 붙여 안내) */
const MAP_FILES = {
  classroom:'ssambus_map_classroom.html',
  library:'ssambus_map_library.html',
  playground:'ssambus_map_playground.html',
  gym:'ssambus_map_gym.html',
  city:'ssambus_map_city.html',
  forest:'ssambus_map_forest.html'
};

const MAPS = [
  { id:'classroom',  label:'일반교실', zones:[
    {id:'zone_A', label:'칠판·TV 앞'},
    {id:'zone_B', label:'앞쪽 통로·앞문'},
    {id:'zone_C', label:'책상 1열'},
    {id:'zone_D', label:'책상 2열'},
    {id:'zone_E', label:'책상 3열'},
    {id:'zone_F', label:'책상 4열'},
    {id:'zone_G', label:'책상 5열·뒷문'},
    {id:'zone_H', label:'뒤쪽 통로·게시판/사물함'}
  ]},
  { id:'library', label:'도서관', zones:[
    {id:'zone_A', label:'입구·대출대'},
    {id:'zone_B', label:'서가 1열'},
    {id:'zone_C', label:'서가 2열'},
    {id:'zone_D', label:'중앙 통로'},
    {id:'zone_E', label:'열람석 1열'},
    {id:'zone_F', label:'열람석 2열'},
    {id:'zone_G', label:'열람석 3열'},
    {id:'zone_H', label:'열람석 4·5열'}
  ]},
  { id:'playground', label:'운동장', zones:[
    {id:'zone_A', label:'서쪽 펜스·골대'},
    {id:'zone_B', label:'서쪽 놀이기구'},
    {id:'zone_C', label:'서쪽 잔디'},
    {id:'zone_D', label:'중앙 광장(좌)'},
    {id:'zone_E', label:'중앙 광장(우)'},
    {id:'zone_F', label:'동쪽 잔디'},
    {id:'zone_G', label:'동쪽 놀이기구'},
    {id:'zone_H', label:'동쪽 펜스·골대'}
  ]},
  { id:'gym', label:'체육관', zones:[
    {id:'zone_A', label:'무대·관람석(좌)'},
    {id:'zone_B', label:'코트 좌측1'},
    {id:'zone_C', label:'코트 좌측2'},
    {id:'zone_D', label:'코트 중앙(좌)'},
    {id:'zone_E', label:'코트 중앙(우)'},
    {id:'zone_F', label:'코트 우측1'},
    {id:'zone_G', label:'코트 우측2'},
    {id:'zone_H', label:'관람석·보관대(우)'}
  ]},
  { id:'city', label:'현대도시', zones:[
    {id:'zone_A', label:'블록1 상가(북)'},
    {id:'zone_B', label:'블록1 상가(남)'},
    {id:'zone_C', label:'블록2 상가(북)'},
    {id:'zone_D', label:'블록2 상가(남)'},
    {id:'zone_E', label:'블록3 상가(북)'},
    {id:'zone_F', label:'블록3 상가(남)'},
    {id:'zone_G', label:'사거리1(횡단보도)'},
    {id:'zone_H', label:'사거리2(횡단보도)'}
  ]},
  { id:'forest', label:'자연숲', zones:[
    {id:'zone_A', label:'입구·서북쪽 숲'},
    {id:'zone_B', label:'북쪽 연못가'},
    {id:'zone_C', label:'북동쪽 숲'},
    {id:'zone_D', label:'동쪽 깊은 숲'},
    {id:'zone_E', label:'서남쪽 숲'},
    {id:'zone_F', label:'남쪽 연못가'},
    {id:'zone_G', label:'남동쪽 숲'},
    {id:'zone_H', label:'동남쪽 깊은 숲'}
  ]}
];

const TYPE_LABEL = {
  youtube:'유튜브 영상', quiz:'퀴즈', google_form:'구글 설문', link:'링크'
};

/* ===================== 상태 ===================== */
let currentMap = MAPS[0].id;
let missionsCache = {};   // mapId -> [missions]
let editingId = null;     // 수정 중인 미션 id (null이면 새로 추가)
let editingMapId = null;
let editingZoneId = null;

/* ===================== Supabase ===================== */
function getClient(){
  try{
    if(typeof SUPABASE_URL === 'undefined' || !SUPABASE_URL) return null;
    return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }catch(e){ return null; }
}
const client = getClient();
let currentUserId = null;

/* 익명 인증: 기기(브라우저)별 ID를 발급받아, 본인이 만든 미션만 수정/삭제 가능하게 함 */
async function ensureAuth(){
  if(!client) return null;
  try{
    const { data: sessionData } = await client.auth.getSession();
    if(sessionData && sessionData.session && sessionData.session.user){
      currentUserId = sessionData.session.user.id;
      return currentUserId;
    }
    const { data, error } = await client.auth.signInAnonymously();
    if(error) throw error;
    currentUserId = data.user.id;
    return currentUserId;
  }catch(e){
    console.error('[쌤버스] 익명 인증 실패', e);
    return null;
  }
}

/* ===================== 접속 코드 ===================== */
function checkGate(){
  const v = document.getElementById('gateCode').value.trim();
  if(v === ACCESS_CODE){
    sessionStorage.setItem('ssambus_teacher_ok', '1');
    afterLogin();
  }else{
    document.getElementById('gateErr').textContent = '접속 코드가 올바르지 않습니다.';
  }
}
document.getElementById('gateCode').addEventListener('keydown', e=>{
  if(e.key === 'Enter') checkGate();
});

function afterLogin(){
  document.getElementById('gate').classList.add('hidden');
  if(ROOM_ID){
    showDash();
  }else{
    document.getElementById('roomGate').classList.remove('hidden');
  }
}

function logout(){
  sessionStorage.removeItem('ssambus_teacher_ok');
  document.getElementById('dash').classList.remove('show');
  document.getElementById('roomGate').classList.add('hidden');
  document.getElementById('gate').classList.remove('hidden');
  document.getElementById('gateCode').value = '';
}

/* ===================== 수업(수업 코드) ===================== */
function genRoomCode(){
  // 혼동되기 쉬운 0/O, 1/I 제외
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for(let i=0;i<6;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}

function createNewRoom(){
  ROOM_ID = genRoomCode();
  localStorage.setItem(ROOM_KEY, ROOM_ID);
  document.getElementById('roomGate').classList.add('hidden');
  showDash();
}

function loadExistingRoom(){
  const v = document.getElementById('roomCodeInput').value.trim().toUpperCase();
  if(!/^[A-Z0-9]{4,12}$/.test(v)){
    document.getElementById('roomErr').textContent = '수업 코드는 영문/숫자 4~12자입니다.';
    return;
  }
  ROOM_ID = v;
  localStorage.setItem(ROOM_KEY, ROOM_ID);
  document.getElementById('roomGate').classList.add('hidden');
  document.getElementById('roomErr').textContent = '';
  showDash();
}

function newClass(){
  document.getElementById('dash').classList.remove('show');
  document.getElementById('roomCodeInput').value = '';
  document.getElementById('roomErr').textContent = '';
  document.getElementById('roomGate').classList.remove('hidden');
}

async function showDash(){
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('roomGate').classList.add('hidden');
  document.getElementById('dash').classList.add('show');
  document.getElementById('roomBadge').textContent = '수업 코드: ' + ROOM_ID;
  if(!client){
    document.getElementById('content').innerHTML =
      '<div class="zone"><div class="empty">⚠ Supabase 설정을 확인할 수 없습니다. (ssambus_supabase_config.js)</div></div>';
    return;
  }
  await ensureAuth();
  if(!currentUserId){
    showToast('⚠ 인증에 실패했습니다. Supabase에서 익명 로그인(Anonymous Sign-In)이 켜져 있는지 확인해주세요.');
  }
  renderTabs();
  selectMap(currentMap);
}

/* ===================== 학생 초대 링크 ===================== */
function openLinkModal(){
  document.getElementById('lm_roomcode').textContent = ROOM_ID;
  const wrap = document.getElementById('lm_links');
  wrap.innerHTML = '';
  MAPS.forEach(m=>{
    const url = new URL(MAP_FILES[m.id], window.location.href).href + '?room=' + encodeURIComponent(ROOM_ID);
    const row = document.createElement('div');
    row.className = 'linkrow';
    row.innerHTML = `<span class="lbl">${m.label}</span><input type="text" readonly value="${url}"><button>복사</button>`;
    row.querySelector('button').onclick = (e) => copyText(url, e.target);
    wrap.appendChild(row);
  });
  document.getElementById('linkModal-bg').classList.add('show');
}

function closeLinkModal(){
  document.getElementById('linkModal-bg').classList.remove('show');
}

function copyText(text, btn){
  const done = () => {
    if(btn){
      const old = btn.textContent;
      btn.textContent = '복사됨!';
      setTimeout(()=> btn.textContent = old, 1200);
    }
    showToast('복사되었습니다.');
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  }else{
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){}
  document.body.removeChild(ta);
}

if(sessionStorage.getItem('ssambus_teacher_ok') === '1') afterLogin();

/* ===================== 탭 / 렌더링 ===================== */
function renderTabs(){
  const wrap = document.getElementById('maptabs');
  wrap.innerHTML = '';
  MAPS.forEach(m=>{
    const btn = document.createElement('button');
    btn.className = 'maptab' + (m.id === currentMap ? ' on' : '');
    btn.textContent = m.label;
    btn.onclick = () => selectMap(m.id);
    wrap.appendChild(btn);
  });
}

async function selectMap(mapId){
  currentMap = mapId;
  renderTabs();
  const content = document.getElementById('content');
  content.innerHTML = '<div class="zone"><div class="empty">불러오는 중...</div></div>';
  await loadMissions(mapId);
  renderZones(mapId);
}

async function loadMissions(mapId){
  try{
    const { data, error } = await client
      .from('missions')
      .select('*')
      .eq('room_id', ROOM_ID)
      .eq('map_id', mapId)
      .order('order', { ascending: true });
    if(error) throw error;
    missionsCache[mapId] = data || [];
  }catch(e){
    console.error(e);
    missionsCache[mapId] = [];
    showToast('미션을 불러오지 못했습니다. (' + e.message + ')');
  }
}

function renderZones(mapId){
  const map = MAPS.find(m => m.id === mapId);
  const missions = missionsCache[mapId] || [];
  const content = document.getElementById('content');
  content.innerHTML = '';

  map.zones.forEach(zone=>{
    const zoneMissions = missions.filter(m => m.zone_id === zone.id);
    const zoneEl = document.createElement('div');
    zoneEl.className = 'zone';

    const head = document.createElement('div');
    head.className = 'zone-head';
    head.innerHTML = `<h2>${zone.label} <span class="badge">${zone.id}</span></h2>`;
    const addBtn = document.createElement('button');
    addBtn.className = 'addbtn';
    addBtn.textContent = '+ 미션 추가';
    addBtn.onclick = () => openModal(mapId, zone.id, null);
    head.appendChild(addBtn);
    zoneEl.appendChild(head);

    const list = document.createElement('div');
    list.className = 'mlist';
    if(zoneMissions.length === 0){
      list.innerHTML = '<div class="empty">등록된 미션이 없습니다.</div>';
    }else{
      zoneMissions.forEach(m=>{
        const card = document.createElement('div');
        card.className = 'mcard';
        const typeLabel = TYPE_LABEL[m.type] || m.type;
        let metaExtra = '';
        if(m.type === 'quiz' && m.quiz && m.quiz.question){
          metaExtra = `<span>Q. ${escapeHtml(m.quiz.question)}</span>`;
        }else if(m.content){
          metaExtra = `<span>${escapeHtml(m.content)}</span>`;
        }
        const isOwner = !!currentUserId && m.teacher_id === currentUserId;
        card.innerHTML = `
          <div class="info">
            <div class="title">${escapeHtml(m.title)}</div>
            <div class="meta">
              <span class="mtype ${m.type}">${typeLabel}</span>
              <span>순서 ${m.order}</span>
              ${m.required ? '<span class="req">필수</span>' : '<span>선택</span>'}
              ${metaExtra}
              ${!isOwner ? '<span>🔒 다른 기기에서 작성 (이 기기에서 수정/삭제 불가)</span>' : ''}
            </div>
          </div>
          <div class="btns">
            <button class="edit" ${!isOwner ? 'disabled' : ''}>수정</button>
            <button class="del" ${!isOwner ? 'disabled' : ''}>삭제</button>
          </div>`;
        if(isOwner){
          card.querySelector('.edit').onclick = () => openModal(mapId, zone.id, m);
          card.querySelector('.del').onclick = () => deleteMission(mapId, m);
        }
        list.appendChild(card);
      });
    }
    zoneEl.appendChild(list);
    content.appendChild(zoneEl);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ===================== 모달 (추가/수정) ===================== */
function openModal(mapId, zoneId, mission){
  editingMapId = mapId;
  editingZoneId = zoneId;
  editingId = mission ? mission.id : null;

  document.getElementById('modalTitle').textContent = mission ? '미션 수정' : '미션 추가';
  document.getElementById('f_title').value = mission ? mission.title : '';
  document.getElementById('f_type').value = mission ? mission.type : 'youtube';
  document.getElementById('f_order').value = mission ? mission.order : (nextOrder(mapId, zoneId));
  document.getElementById('f_content').value = mission && mission.content ? mission.content : '';
  document.getElementById('f_required').checked = mission ? !!mission.required : true;

  // 퀴즈 필드 초기화
  const q = (mission && mission.quiz) ? mission.quiz : null;
  document.getElementById('q_question').value = q ? (q.question || '') : '';
  for(let i=0;i<4;i++){
    document.getElementById('q_opt'+i).value = (q && q.options && q.options[i]) ? q.options[i] : '';
  }
  const ansVal = (q && typeof q.answer === 'number') ? q.answer : 0;
  document.querySelectorAll('input[name=q_answer]').forEach(r=>{
    r.checked = (Number(r.value) === ansVal);
  });

  onTypeChange();
  document.getElementById('modal-bg').classList.add('show');
}

function nextOrder(mapId, zoneId){
  const missions = (missionsCache[mapId] || []).filter(m => m.zone_id === zoneId);
  if(missions.length === 0) return 1;
  return Math.max(...missions.map(m => m.order || 1)) + 1;
}

function onTypeChange(){
  const type = document.getElementById('f_type').value;
  document.getElementById('quizField').style.display = (type === 'quiz') ? 'block' : 'none';
  document.getElementById('contentField').style.display = (type === 'quiz') ? 'none' : 'block';
}

function closeModal(){
  document.getElementById('modal-bg').classList.remove('show');
}

async function saveMission(){
  const title = document.getElementById('f_title').value.trim();
  const type = document.getElementById('f_type').value;
  const order = parseInt(document.getElementById('f_order').value, 10) || 1;
  const required = document.getElementById('f_required').checked;

  if(!title){
    alert('미션 제목을 입력해주세요.');
    return;
  }

  let content = null;
  let quiz = null;

  if(type === 'quiz'){
    const question = document.getElementById('q_question').value.trim();
    const options = [0,1,2,3].map(i => document.getElementById('q_opt'+i).value.trim());
    const answerInput = document.querySelector('input[name=q_answer]:checked');
    if(!question || options.some(o => !o) || !answerInput){
      alert('퀴즈 질문, 보기 4개, 정답을 모두 입력해주세요.');
      return;
    }
    quiz = { question, options, answer: Number(answerInput.value) };
  }else{
    content = document.getElementById('f_content').value.trim();
    if(!content){
      alert('내용(URL)을 입력해주세요.');
      return;
    }
  }

  const row = {
    id: editingId || `${ROOM_ID}_${editingMapId}_${editingZoneId}_${Date.now()}`,
    room_id: ROOM_ID,
    map_id: editingMapId,
    zone_id: editingZoneId,
    teacher_id: currentUserId,
    title, type, content, order, required, quiz
  };

  try{
    const { error } = await client.from('missions').upsert(row);
    if(error) throw error;
    closeModal();
    showToast('저장되었습니다.');
    await loadMissions(editingMapId);
    renderZones(editingMapId);
  }catch(e){
    console.error(e);
    alert('저장에 실패했습니다: ' + e.message);
  }
}

async function deleteMission(mapId, mission){
  if(!confirm(`"${mission.title}" 미션을 삭제할까요?`)) return;
  try{
    const { error } = await client.from('missions').delete().eq('id', mission.id);
    if(error) throw error;
    showToast('삭제되었습니다.');
    await loadMissions(mapId);
    renderZones(mapId);
  }catch(e){
    console.error(e);
    alert('삭제에 실패했습니다: ' + e.message);
  }
}

/* ===================== 토스트 ===================== */
let toastTimer = null;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.style.display = 'none', 2000);
}
</script>
