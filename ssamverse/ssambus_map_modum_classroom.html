.remote-player.flip svg{transform:scaleX(-1)}
.remote-player .nick{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;background:rgba(255,255,255,.9);padding:1px 5px;border-radius:4px;white-space:nowrap;font-weight:600}

html{height:100%}
body{height:100%;align-items:stretch;padding:0;overflow:hidden;font-family:'Noto Sans KR',sans-serif;background:linear-gradient(to bottom,#0A1628,#0E1E34)}

#char-btn:hover{background:rgba(41,90,172,.9)}
h2{text-align:center;padding-top:18px;color:rgba(255,255,255,.85);font-size:.95rem;font-weight:600;letter-spacing:-.01em}

<body style="font-family:'Noto Sans KR',sans-serif">
<a id="main-btn" href="index.html">메인</a>

<div class="stage-wrap">
<div class="stage">
  <canvas id="map" width="1920" height="2112"></canvas>

  <span><span class="sw" style="background:#8b5e3c"></span>교사책상</span>
  <span><span class="sw" style="background:#1e5c3a"></span>칠판</span>
  <span><span class="sw" style="background:#27ae60"></span>출입구</span>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
/* === Modum Classroom 40×44 ===
   12 group tables (2×6 tiles each), 4 cols × 3 rows
   Groups isolated by 8+ tiles for proximity chat separation */
var TS=48,COLS=40,ROWS=44,VIEW_W=720,VIEW_H=672;

var TEACHER_VIEW=new URLSearchParams(window.location.search).get('teacherView')==='1';
if(TEACHER_VIEW){
  document.body.style.padding='0';
  document.body.style.background='transparent';
  document.querySelectorAll('h2,.info,.legend').forEach(function(el){el.style.display='none';});
}
(function(){
  var _s=window.location.search;
  var _rm=(_s.match(/[?&]room=([^&]+)/)||[])[1];
  if(_rm&&!TEACHER_VIEW){
    var _mb=document.getElementById('main-btn');
    var _cb=document.getElementById('char-btn');
    if(_mb)_mb.style.display='none';
    if(_cb){
      _cb.style.cssText='position:fixed;top:14px;left:14px;z-index:999;background:rgba(52,112,212,.85);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.4);backdrop-filter:blur(8px);text-decoration:none;display:inline';
      var _nk=((_s.match(/[?&]nickname=([^&]*)/)||[])[1])||'';
      try{_nk=_nk||sessionStorage.getItem('ssambus_nickname')||'';}catch(e){}
      var _mf=window.location.pathname.split('/').pop()||'ssambus_map_modum_classroom.html';
      _cb.href='ssambus_characters.html?room='+_rm+'&map='+_mf+(_nk?'&nickname='+_nk:'');
    }
  }
})();

/* Tile: 0=floor 1=wall 2=blackboard 3=teacher-desk 4=group-table 5=door 9=plant */
var grid=[];
for(var r=0;r<ROWS;r++){
  grid[r]=[];
  for(var c=0;c<COLS;c++){
    grid[r][c]=(r===0||r===ROWS-1||c===0||c===COLS-1)?1:0;
  }
}

/* Blackboard on top wall */
for(var c=3;c<=36;c++) grid[0][c]=2;

/* Teacher desk: rows 1-2, cols 18-21 */
for(var c=18;c<=21;c++){grid[1][c]=3;grid[2][c]=3;}

/* Door on right wall: rows 22 */
grid[22][COLS-1]=5;

/* Plants in aisles */
grid[3][1]=9; grid[3][COLS-2]=9;
grid[41][1]=9; grid[41][COLS-2]=9;

/* 12 group tables (tile 4): 4 cols × 3 row-groups, each table 2 wide × 6 tall
   Column starts: 3,14,25,36  |  Row starts: 5,20,35
   Horizontal isolation: student at col 5 → next student at col 13 → gap=8 tiles ✓
   Vertical isolation:   student at row 11 → next student at row 19 → gap=8 tiles ✓ */
var TABLE_COLS=[3,14,25,36];
var TABLE_ROW_STARTS=[5,20,35];

for(var tri=0;tri<TABLE_ROW_STARTS.length;tri++){
  for(var tci=0;tci<TABLE_COLS.length;tci++){
    var rS=TABLE_ROW_STARTS[tri], cS=TABLE_COLS[tci];
    for(var dr=0;dr<6;dr++){
      for(var dc=0;dc<2;dc++){
        grid[rS+dr][cS+dc]=4;
      }
    }
  }
}

var WALK=[0,5];
function isWalk(t){return WALK.indexOf(t)>=0;}

var cv=document.getElementById('map');
var ctx=cv.getContext('2d');

/* Character */
var __savedChar=(function(){
  try{
    var _cp=new URLSearchParams(window.location.search).get('c');
    if(_cp) return JSON.parse(_cp);
    return JSON.parse(localStorage.getItem('ssambus_player_character'));
  }catch(e){return null;}
})();
var PLAYER=Object.assign({
  type:'student',skin:'#FDEBD0',hcolor:'#1a1008',hair:'short',
  ccolor:'#1a3a6b',cloth:'suit',gender:'male',acc:[],dir:'down'
},__savedChar||{});
function renderPlayer(){
  document.getElementById('cg_p').innerHTML=renderCharacterSVG(PLAYER);
  document.getElementById('player').classList.toggle('flip',PLAYER.dir==='left'&&!PLAYER._facingRight);
}

/* === Tile drawing functions === */

function drawFloor(x,y,c,r){
  ctx.fillStyle=((c+r)%2===0)?'#d4a96a':'#c9a060';
  ctx.fillRect(x,y,TS,TS);
  ctx.strokeStyle='rgba(100,60,10,0.15)';
  ctx.lineWidth=1;
  for(var i=0;i<4;i++){
    ctx.beginPath();
    ctx.moveTo(x,y+i*13+4);ctx.lineTo(x+TS,y+i*13+4);
    ctx.stroke();
  }
  ctx.strokeStyle='rgba(120,80,20,0.18)';
  ctx.lineWidth=0.5;
  ctx.strokeRect(x+0.5,y+0.5,TS-1,TS-1);
}

function drawWall(x,y){
  var grad=ctx.createLinearGradient(x,y,x,y+TS);
  grad.addColorStop(0,'#e8ddd0');
  grad.addColorStop(1,'#d5c8b8');
  ctx.fillStyle=grad;
  ctx.fillRect(x,y,TS,TS);
  ctx.strokeStyle='rgba(80,60,40,0.12)';
  ctx.lineWidth=1;
  ctx.strokeRect(x+4,y+4,TS-8,TS-8);
}

function drawBlackboard(x,y){
  ctx.fillStyle='#1e5c3a';
  ctx.fillRect(x,y,TS,TS);
  ctx.strokeStyle='#2e8c5a';
  ctx.lineWidth=2;
  ctx.strokeRect(x+2,y+2,TS-4,TS-4);
  ctx.fillStyle='rgba(230,255,210,0.55)';
  ctx.fillRect(x+6,y+10,TS-12,3);
  ctx.fillRect(x+6,y+18,TS-18,3);
  ctx.fillRect(x+8,y+26,TS-20,3);
  ctx.fillStyle='rgba(210,255,190,0.25)';
  ctx.beginPath();
  ctx.arc(x+TS*0.6,y+TS*0.7,8,0,Math.PI*2);
  ctx.fill();
}

function drawTeacherDesk(x,y,r,c){
  ctx.shadowColor='rgba(0,0,0,0.45)';ctx.shadowBlur=0;ctx.shadowOffsetX=5;ctx.shadowOffsetY=5;
  ctx.fillStyle='#7a4e2c';
  ctx.fillRect(x,y,TS,TS);
  ctx.strokeStyle='rgba(60,30,10,0.25)';
  ctx.lineWidth=1;
  for(var i=1;i<=3;i++){
    ctx.beginPath();
    ctx.moveTo(x,y+i*TS/4);ctx.lineTo(x+TS,y+i*TS/4);
    ctx.stroke();
  }
  var topE=(r===0||grid[r-1][c]!==3);
  var botE=(r===ROWS-1||grid[r+1][c]!==3);
  var lefE=(c===0||grid[r][c-1]!==3);
  var rigE=(c===COLS-1||grid[r][c+1]!==3);
  ctx.strokeStyle='#5a3010';
  ctx.lineWidth=3;
  ctx.beginPath();
  if(topE){ctx.moveTo(x+1.5,y+1.5);ctx.lineTo(x+TS-1.5,y+1.5);}
  if(botE){ctx.moveTo(x+1.5,y+TS-1.5);ctx.lineTo(x+TS-1.5,y+TS-1.5);}
  if(lefE){ctx.moveTo(x+1.5,y+1.5);ctx.lineTo(x+1.5,y+TS-1.5);}
  if(rigE){ctx.moveTo(x+TS-1.5,y+1.5);ctx.lineTo(x+TS-1.5,y+TS-1.5);}
  ctx.stroke();
  /* sheen */
  ctx.fillStyle='rgba(255,255,255,0.07)';
  if(topE) ctx.fillRect(x+(lefE?3:0),y+3,TS-(lefE?3:0)-(rigE?3:0),TS/3);
  ctx.shadowColor='transparent';
}

function drawGroupTable(x,y,r,c){
  ctx.shadowColor='rgba(0,0,0,0.45)';ctx.shadowBlur=0;ctx.shadowOffsetX=5;ctx.shadowOffsetY=5;
  /* warm amber wood for conference tables */
  var light=((c+r)%2===0);
  ctx.fillStyle=light?'#c8a472':'#b8945e';
  ctx.fillRect(x,y,TS,TS);
  /* wood grain */
  ctx.strokeStyle='rgba(90,50,10,0.15)';
  ctx.lineWidth=0.8;
  for(var i=1;i<=4;i++){
    ctx.beginPath();
    ctx.moveTo(x,y+i*TS/5);ctx.lineTo(x+TS,y+i*TS/5);
    ctx.stroke();
  }
  /* outer border on exposed edges */
  var topE=(r===0||grid[r-1][c]!==4);
  var botE=(r===ROWS-1||grid[r+1][c]!==4);
  var lefE=(c===0||grid[r][c-1]!==4);
  var rigE=(c===COLS-1||grid[r][c+1]!==4);
  ctx.strokeStyle='#7a4a20';
  ctx.lineWidth=3;
  ctx.beginPath();
  if(topE){ctx.moveTo(x+1.5,y+1.5);ctx.lineTo(x+TS-1.5,y+1.5);}
  if(botE){ctx.moveTo(x+1.5,y+TS-1.5);ctx.lineTo(x+TS-1.5,y+TS-1.5);}
  if(lefE){ctx.moveTo(x+1.5,y+1.5);ctx.lineTo(x+1.5,y+TS-1.5);}
  if(rigE){ctx.moveTo(x+TS-1.5,y+1.5);ctx.lineTo(x+TS-1.5,y+TS-1.5);}
  ctx.stroke();
  /* highlight sheen */
  ctx.fillStyle='rgba(255,255,255,0.07)';
  ctx.fillRect(x+(lefE?4:0),y+(topE?4:0),TS-(lefE?4:0)-(rigE?4:0),(TS-(topE?4:0))/2);
  ctx.shadowColor='transparent';
}

function drawDoor(x,y){
  ctx.shadowColor='rgba(0,0,0,0.45)';ctx.shadowBlur=0;ctx.shadowOffsetX=5;ctx.shadowOffsetY=5;
  ctx.fillStyle='#1a472a';
  ctx.fillRect(x,y,TS,TS);
  ctx.fillStyle='#27ae60';
  ctx.fillRect(x+4,y+4,TS-8,TS-8);
  ctx.strokeStyle='rgba(255,255,255,0.3)';
  ctx.lineWidth=1;
  ctx.strokeRect(x+4,y+4,TS-8,TS-8);
  ctx.fillStyle='rgba(255,255,255,0.9)';
  ctx.font='bold 18px sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('→',x+TS/2,y+TS/2);
  ctx.shadowColor='transparent';
}

function drawPlant(x,y){
  ctx.shadowColor='rgba(0,0,0,0.45)';ctx.shadowBlur=0;ctx.shadowOffsetX=5;ctx.shadowOffsetY=5;
  /* pot */
  ctx.fillStyle='#c0392b';
  ctx.beginPath();
  ctx.roundRect(x+TS/2-8,y+TS-16,16,12,2);
  ctx.fill();
  /* stem */
  ctx.strokeStyle='#1e8449';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(x+TS/2,y+TS-16);
  ctx.bezierCurveTo(x+TS/2,y+TS/2+4,x+TS/2-6,y+TS/2,x+TS/2,y+TS/2-6);
  ctx.stroke();
  /* leaves */
  ctx.fillStyle='#2ecc71';
  ctx.beginPath();
  ctx.ellipse(x+TS/2-7,y+TS/2,8,5,0.5,0,Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x+TS/2+7,y+TS/2-6,8,5,-0.5,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#27ae60';
  ctx.beginPath();
  ctx.ellipse(x+TS/2,y+TS/2-12,6,9,0,0,Math.PI*2);
  ctx.fill();
  ctx.shadowColor='transparent';
}

function drawMap(){
  for(var r=0;r<ROWS;r++){
    for(var c=0;c<COLS;c++){
      var x=c*TS,y=r*TS,t=grid[r][c];
      if(t===1) drawWall(x,y);
      else if(t===2) drawBlackboard(x,y);
      else if(t===3) drawTeacherDesk(x,y,r,c);
      else if(t===4) drawGroupTable(x,y,r,c);
      else if(t===5) drawDoor(x,y);
      else if(t===9) drawPlant(x,y);
      else drawFloor(x,y,c,r);
    }
  }

  /* 모둠 번호 레이블: 각 테이블 중앙에 표시 */
  ctx.save();
  ctx.font='bold 13px "Noto Sans KR",sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  var num=1;
  for(var tri=0;tri<TABLE_ROW_STARTS.length;tri++){
    for(var tci=0;tci<TABLE_COLS.length;tci++){
      var rS=TABLE_ROW_STARTS[tri], cS=TABLE_COLS[tci];
      /* center of 2×6 table */
      var tx=(cS+1)*TS;        /* horizontally between the 2 tiles */
      var ty=(rS*TS+3*TS);     /* vertically at tile 3 top = 3/6 point */
      /* shadow */
      ctx.fillStyle='rgba(0,0,0,0.25)';
      ctx.fillText('모둠 '+num, tx+1, ty+1);
      /* text */
      ctx.fillStyle='rgba(80,40,10,0.85)';
      ctx.fillText('모둠 '+num, tx, ty);
      num++;
    }
  }
  ctx.restore();

  /* 45-degree drop shadows */
  ctx.fillStyle='rgba(0,0,0,0.30)';
  for(var __r=0;__r<ROWS;__r++){for(var __c=0;__c<COLS;__c++){
    if(isWalk(grid[__r][__c])) continue;
    var __x=__c*TS,__y=__r*TS;
    if((__c+1<COLS)&&isWalk(grid[__r][__c+1])&&grid[__r][__c+1]!==5) ctx.fillRect(__x+TS,__y+5,6,TS);
    if((__r+1<ROWS)&&isWalk(grid[__r+1][__c])&&grid[__r+1][__c]!==5) ctx.fillRect(__x+5,__y+TS,TS,6);
  }}
}
drawMap();

function updateCamera(){
  var _sw=document.querySelector('.stage-wrap');
  var _vw=_sw.clientWidth||VIEW_W;
  var _vh=_sw.clientHeight||VIEW_H;
  if(TEACHER_VIEW){
    _sw.style.overflow='visible';
    return;
  }
  var stage=document.querySelector('.stage');
  var offX=Math.max(0,Math.min(pos.c*TS-_vw/2+TS/2,COLS*TS-_vw));
  var offY=Math.max(0,Math.min(pos.r*TS-_vh/2+TS/2,ROWS*TS-_vh));
  stage.style.transform='translate(-'+offX+'px,-'+offY+'px)';
}

var pos={r:22,c:38}; /* near entrance */
function placePlayer(){
  var el=document.getElementById('player');
  if(TEACHER_VIEW) el.style.display='none';
  el.style.left=(pos.c*TS)+'px';
  el.style.top=(pos.r*TS-24)+'px';
  updateCamera();
  try{broadcastMyPosition();}catch(e){}
  try{checkZoneOnMove(pos);}catch(e){}
}
function move(dir){
  var nr=pos.r,nc=pos.c;
  if(dir==='up') nr--;
  else if(dir==='down') nr++;
  else if(dir==='left') nc--;
  else if(dir==='right') nc++;
  PLAYER._facingRight=(dir==='right');
  PLAYER.dir=(dir==='right')?'left':dir;
  renderPlayer();
  if(nr<0||nr>=ROWS||nc<0||nc>=COLS) return;
  if(!isWalk(grid[nr][nc])) return;
  try{if(__rtIsOverlayBlocked(nr,nc)) return;}catch(e){}
  try{if(__rtIsTileOccupied(nr,nc)) return;}catch(e){}
  try{if(typeof __msBlockExit==='function'&&__msBlockExit(nr,nc)){__msShowBlockedNotice();return;}}catch(e){}
  pos.r=nr; pos.c=nc;
  placePlayer();
}
window.addEventListener('keydown',function(e){
  if(TEACHER_VIEW) return;
  var m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
  if(m[e.key]){e.preventDefault();move(m[e.key]);}
});
if(!TEACHER_VIEW){
  var sw=document.querySelector('.stage-wrap');
  var tx=0,ty=0,ta=false;
  sw.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;ta=true;tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
  sw.addEventListener('touchmove',function(e){if(ta)e.preventDefault();},{passive:false});
  sw.addEventListener('touchend',function(e){
    if(!ta)return;ta=false;
    var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
    if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;
    if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');
    else move(dy>0?'down':'up');
  },{passive:true});
}
window.addEventListener('resize',updateCamera);
renderPlayer();
try{placePlayer();}catch(e){console.warn('[modum_classroom] placePlayer:',e);}
try{initRealtime('modum_classroom');}catch(e){console.warn('[modum_classroom] realtime:',e);}
