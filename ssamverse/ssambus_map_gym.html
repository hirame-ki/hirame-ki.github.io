<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>쌤버스 - 체육관 맵</title>
<style>
*{box-sizing:border-box}
body{font-family:sans-serif;background:#0a1628;display:flex;flex-direction:column;align-items:center;padding:20px;margin:0}
#main-btn{position:fixed;top:12px;left:12px;z-index:999;background:#e67e22;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);text-decoration:none}
#char-btn{position:fixed;top:12px;left:12px;z-index:999;background:#2980b9;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);text-decoration:none;display:none}
h2{margin:.3rem 0;color:#fff;font-size:1.1rem}
.info{font-size:12px;color:#aaa;margin-bottom:12px;text-align:center}
.stage-wrap{width:768px;max-width:100%;height:672px;overflow:hidden;border:3px solid #e67e22;border-radius:8px;box-shadow:0 0 24px rgba(230,126,34,0.4)}
.stage{position:relative;line-height:0}
#map{display:block}
#player{position:absolute;width:48px;height:72px;pointer-events:none;transition:left .1s linear,top .1s linear;z-index:5}
#player svg{display:block;width:100%;height:100%;overflow:visible}
#player.flip svg{transform:scaleX(-1)}
.remote-player{position:absolute;width:48px;height:72px;pointer-events:none;transition:left .15s linear,top .15s linear;z-index:4}
.remote-player svg{display:block;width:100%;height:100%;overflow:visible}
.remote-player.flip svg{transform:scaleX(-1)}
.remote-player .nick{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;background:rgba(255,255,255,.9);padding:1px 5px;border-radius:4px;white-space:nowrap;font-weight:600}
.pad{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px 52px;gap:4px;margin-top:14px}
.pad button{font-size:20px;border-radius:10px;border:none;background:#e67e22;color:#fff;cursor:pointer;font-weight:700;box-shadow:0 3px 0 #a05010}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 0 #a05010}
.legend{margin-top:10px;font-size:12px;color:#aaa;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.legend span{display:flex;align-items:center;gap:4px}
.sw{display:inline-block;width:13px;height:13px;border-radius:3px}
</style>
</head>
<body>
<a id="main-btn" href="index.html">메인</a>
<a id="char-btn" href="#">캐릭터 변경</a>
<h2>쌤버스 - 체육관</h2>
<div class="info">방향키 또는 버튼으로 이동하세요</div>
<div class="stage-wrap">
<div class="stage">
  <canvas id="map" width="2304" height="1152"></canvas>
  <div id="player"><svg viewBox="0 0 60 76"><g id="cg_p"></g></svg></div>
  <div id="remote-players"></div>
</div>
</div>
<div class="pad">
  <div></div><button onclick="move('up')">&#8593;</button><div></div>
  <button onclick="move('left')">&#8592;</button><div></div><button onclick="move('right')">&#8594;</button>
  <div></div><button onclick="move('down')">&#8595;</button><div></div>
</div>
<div class="legend">
  <span><span class="sw" style="background:#c8a050"></span>마루</span>
  <span><span class="sw" style="background:#2c3e50"></span>벽</span>
  <span><span class="sw" style="background:#d4aa5a"></span>농구코트</span>
  <span><span class="sw" style="background:#7a7a80"></span>창고</span>
  <span><span class="sw" style="background:#c8a04a"></span>박스(장애물)</span>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="ssambus_supabase_config.js"></script>
<script src="ssambus_character_render.js"></script>
<script src="ssambus_realtime.js"></script>
<script src="ssambus_missions.js"></script>
<script>
/* === Gym map 48x24 (체육관 3/4 + 창고 1/4) === */
var TS=48,COLS=48,ROWS=24,VIEW_W=768,VIEW_H=672;

var TEACHER_VIEW=new URLSearchParams(window.location.search).get('teacherView')==='1';
if(TEACHER_VIEW){
  document.body.style.padding='0';
  document.body.style.background='#fff';
  document.body.style.overflow='hidden';
  document.querySelectorAll('h2,.info,.pad,.legend').forEach(function(el){el.style.display='none';});
  var sw=document.querySelector('.stage-wrap');
  if(sw){
    sw.style.width=(COLS*TS)+'px';
    sw.style.height=(ROWS*TS)+'px';
    sw.style.overflow='visible';
    sw.style.border='none';
    sw.style.borderRadius='0';
    sw.style.boxShadow='none';
  }
}
(function(){
  var _p=new URLSearchParams(window.location.search);
  var _room=_p.get('room');
  if(_room&&!TEACHER_VIEW){
    document.getElementById('main-btn').style.display='none';
    var _cb=document.getElementById('char-btn');
    _cb.style.display='';
    var _nick=_p.get('nickname')||sessionStorage.getItem('ssambus_nickname')||'';
    var _map=window.location.pathname.split('/').pop();
    var _cp=new URLSearchParams({room:_room,map:_map});
    if(_nick)_cp.set('nickname',_nick);
    _cb.href='ssambus_characters.html?'+_cp.toString();
  }
})();

/* Tile: 0=gym-floor 1=wall 2=basketball-court 4=storage-floor 5=storage-box(obstacle) 6=equipment-zone 7=exit-gate */
/* Layout:
   cols 1-34: 체육관 (court cols 2-33, equipment rows 1-2/21-22)
   col 35: 칸막이 벽 (rows 10-11에만 통로)
   cols 36-46: 창고 (boxes scattered) */
var grid=[];
for(var r=0;r<ROWS;r++){
  grid[r]=[];
  for(var c=0;c<COLS;c++){
    var isWall=(r===0||r===ROWS-1||c===0||c===COLS-1);
    var isDivider=(c===35&&!(r>=10&&r<=11));
    var inStorage=(c>=36&&c<=46);
    var inCourt=(r>=3&&r<=20&&c>=2&&c<=33);
    var inGym=(c>=1&&c<=34);
    var isEntry=((r<=2||r>=21)&&inGym);
    if(isWall||isDivider) grid[r][c]=1;
    else if(inStorage) grid[r][c]=4;
    else if(inCourt) grid[r][c]=2;
    else if(isEntry) grid[r][c]=6;
    else grid[r][c]=0;
  }
}
/* Divider opening at rows 10-11 → 창고 통로 */
grid[10][35]=4; grid[11][35]=4;

/* 창고 박스 장애물 (type 5, 통행 불가) */
[[2,37],[2,38],[2,39],[2,40],[2,41],[2,42],[2,43],[2,44],[2,45],[2,46],
 [3,38],[3,40],[3,42],[3,44],[3,46],
 [5,41],[5,42],[6,41],[6,42],
 [5,45],[5,46],[6,46],
 [8,38],[8,39],[9,38],
 [8,43],[8,44],[9,44],
 [13,37],[13,38],[14,37],
 [13,45],[13,46],[14,46],
 [16,41],[17,41],[17,42],
 [19,37],[19,38],[19,39],[19,40],[19,41],[19,42],[19,43],[19,44],[19,45],[19,46],
 [20,38],[20,40],[20,42],[20,44],
 [21,37],[21,45],[21,46]
].forEach(function(a){grid[a[0]][a[1]]=5;});

/* Exit gate at top wall */
grid[0][10]=7; grid[0][11]=7;

var WALK=[0,2,4,6,7];
function isWalk(t){return WALK.indexOf(t)>=0;}

var cv=document.getElementById('map');
var ctx=cv.getContext('2d');

var __savedChar=(function(){
  try{
    var _cp=new URLSearchParams(window.location.search).get('c');
    if(_cp) return JSON.parse(_cp);
    return JSON.parse(localStorage.getItem('ssambus_player_character'));
  }catch(e){return null;}
})();
var PLAYER=Object.assign({
  type:'student',skin:'#FDEBD0',hcolor:'#1a1008',hair:'short',
  ccolor:'#1a3a6b',cloth:'suit',gender:'male',acc:[],dir:'down'
},__savedChar||{});
function renderPlayer(){
  document.getElementById('cg_p').innerHTML=renderCharacterSVG(PLAYER);
  document.getElementById('player').classList.toggle('flip',PLAYER.dir==='left'&&!PLAYER._facingRight);
}

/* 체육관 마루: 단풍나무 목재 */
function drawFloor(x,y,c,r){
  ctx.fillStyle=((r+c)%2===0)?'#c8a050':'#bc9445';
  ctx.fillRect(x,y,TS,TS);
  ctx.strokeStyle='rgba(90,50,0,0.14)';
  ctx.lineWidth=1;
  for(var i=0;i<5;i++){
    ctx.beginPath();
    ctx.moveTo(x,y+i*10+2); ctx.lineTo(x+TS,y+i*10+2);
    ctx.stroke();
  }
}

/* 벽 */
function drawWall(x,y){
  ctx.fillStyle='#2c3e50';
  ctx.fillRect(x,y,TS,TS);
  ctx.fillStyle='#1a252f';
  ctx.fillRect(x,y+TS-6,TS,6);
  ctx.fillStyle='rgba(255,255,255,0.07)';
  ctx.fillRect(x,y,TS,4);
  ctx.strokeStyle='rgba(255,255,255,0.05)';
  ctx.lineWidth=1;
  ctx.strokeRect(x+3,y+3,TS-6,TS-9);
}

/* 농구 코트 마루 (밝은 목재) */
function drawCourt(x,y,c,r){
  ctx.fillStyle=((r+c)%2===0)?'#d4aa5a':'#c89a40';
  ctx.fillRect(x,y,TS,TS);
  ctx.strokeStyle='rgba(90,50,0,0.10)';
  ctx.lineWidth=1;
  for(var i=0;i<5;i++){
    ctx.beginPath();
    ctx.moveTo(x,y+i*10+2); ctx.lineTo(x+TS,y+i*10+2);
    ctx.stroke();
  }
}

/* 창고 바닥: 콘크리트 */
function drawStorageFloor(x,y,c,r){
  ctx.fillStyle=((r+c)%2===0)?'#7a7a80':'#72727a';
  ctx.fillRect(x,y,TS,TS);
  ctx.strokeStyle='rgba(0,0,0,0.18)';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(x+TS/2,y); ctx.lineTo(x+TS/2,y+TS);
  ctx.moveTo(x,y+TS/2); ctx.lineTo(x+TS,y+TS/2);
  ctx.stroke();
}

/* 창고 박스: 골판지 상자 */
function drawStorageBox(x,y){
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.fillRect(x+5,y+TS-5,TS-5,4);
  ctx.fillStyle='#c8a04a';
  ctx.fillRect(x+3,y+6,TS-6,TS-10);
  ctx.fillStyle='#a07830';
  ctx.fillRect(x+3,y+6,TS-6,8);
  ctx.fillStyle='#b89040';
  ctx.fillRect(x+3,y+6,TS/2-4,7);
  ctx.fillStyle='rgba(200,160,50,0.55)';
  ctx.fillRect(x+3,y+TS/2-1,TS-6,3);
  ctx.fillRect(x+TS/2-1,y+6,3,TS-10);
  ctx.fillStyle='rgba(0,0,0,0.16)';
  ctx.fillRect(x+TS-8,y+6,5,TS-10);
}

/* 입구/장비 구역 */
function drawEquipment(x,y,c,r){
  ctx.fillStyle=((r+c)%2===0)?'#b8902e':'#a07828';
  ctx.fillRect(x,y,TS,TS);
  ctx.strokeStyle='rgba(255,200,0,0.32)';
  ctx.lineWidth=2;
  ctx.strokeRect(x+4,y+4,TS-8,TS-8);
}

/* 출입구 */
function drawExitGate(x,y){
  ctx.fillStyle='#b8902e';
  ctx.fillRect(x,y,TS,TS);
  ctx.fillStyle='#27ae60';
  ctx.fillRect(x+3,y+2,8,TS-4);
  ctx.fillRect(x+TS-11,y+2,8,TS-4);
  ctx.fillStyle='#2ecc71';
  ctx.fillRect(x+3,y+2,TS-6,10);
  ctx.fillStyle='#ffffff';
  ctx.font='bold 9px sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('EXIT',x+TS/2,y+TS*0.42);
  ctx.strokeStyle='#f1c40f';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(x+TS*0.25,y+TS*0.7);
  ctx.lineTo(x+TS*0.75,y+TS*0.7);
  ctx.moveTo(x+TS*0.6,y+TS*0.6);
  ctx.lineTo(x+TS*0.75,y+TS*0.7);
  ctx.lineTo(x+TS*0.6,y+TS*0.8);
  ctx.stroke();
}

/* 농구 코트 라인 오버레이 (타일 경계 없이 깨끗한 선) */
function drawBasketballOverlay(){
  var cx1=2*TS, cy1=3*TS, cx2=34*TS, cy2=21*TS;
  var fw=cx2-cx1, fh=cy2-cy1;
  var mx=(cx1+cx2)/2, my=(cy1+cy2)/2;

  ctx.save();
  ctx.strokeStyle='rgba(210,100,20,0.92)';
  ctx.fillStyle='rgba(210,100,20,0.92)';
  ctx.lineWidth=4; ctx.lineCap='butt';

  /* 외곽선 */
  ctx.strokeRect(cx1,cy1,fw,fh);

  /* 하프라인 */
  ctx.beginPath(); ctx.moveTo(mx,cy1); ctx.lineTo(mx,cy2); ctx.stroke();

  /* 센터서클 */
  ctx.beginPath(); ctx.arc(mx,my,115,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(mx,my,10,0,Math.PI*2); ctx.fill();

  /* 왼쪽 키/자유투 라인 */
  var kd=240,kh=380;
  ctx.strokeRect(cx1,my-kh/2,kd,kh);
  ctx.beginPath(); ctx.arc(cx1+kd,my,90,Math.PI/2,Math.PI*3/2); ctx.stroke();
  ctx.setLineDash([7,7]);
  ctx.beginPath(); ctx.arc(cx1+kd,my,90,-Math.PI/2,Math.PI/2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(cx1,my,60,-Math.PI/2,Math.PI/2); ctx.stroke();

  /* 오른쪽 키/자유투 라인 */
  ctx.strokeRect(cx2-kd,my-kh/2,kd,kh);
  ctx.beginPath(); ctx.arc(cx2-kd,my,90,-Math.PI/2,Math.PI/2); ctx.stroke();
  ctx.setLineDash([7,7]);
  ctx.beginPath(); ctx.arc(cx2-kd,my,90,Math.PI/2,Math.PI*3/2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(cx2,my,60,Math.PI/2,Math.PI*3/2); ctx.stroke();

  /* 3점 라인 */
  var cd=285, tp3r=355;
  var hp=Math.sqrt(tp3r*tp3r-cd*cd);
  var a1=Math.atan2(-cd,hp), a2=Math.atan2(cd,hp);
  var b2=Math.atan2(cd,-hp), b1=Math.atan2(-cd,-hp);
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(cx1,my-cd); ctx.lineTo(cx1+hp,my-cd);
  ctx.moveTo(cx1,my+cd); ctx.lineTo(cx1+hp,my+cd);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(cx1,my,tp3r,a1,a2,false); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx2,my-cd); ctx.lineTo(cx2-hp,my-cd);
  ctx.moveTo(cx2,my+cd); ctx.lineTo(cx2-hp,my+cd);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(cx2,my,tp3r,b2,b1,false); ctx.stroke();

  ctx.restore();

  /* 골대 */
  drawHoop(cx1,my,false);
  drawHoop(cx2,my,true);
}

function drawHoop(bx,by,toLeft){
  var dx=toLeft?-1:1;
  ctx.fillStyle='rgba(220,220,220,0.9)';
  ctx.fillRect(bx-3,by-28,6,56);
  ctx.strokeStyle='#555'; ctx.lineWidth=2;
  ctx.strokeRect(bx-3,by-28,6,56);
  ctx.fillStyle='#999';
  ctx.fillRect(bx,by-3,dx*22,6);
  ctx.strokeStyle='#e74c3c'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.arc(bx+dx*28,by,18,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1.5;
  for(var i=0;i<6;i++){
    var a=i*Math.PI/3;
    ctx.beginPath();
    ctx.moveTo(bx+dx*28+18*Math.cos(a),by+18*Math.sin(a));
    ctx.lineTo(bx+dx*28,by+22);
    ctx.stroke();
  }
}

function drawMap(){
  for(var r=0;r<ROWS;r++){
    for(var c=0;c<COLS;c++){
      var x=c*TS,y=r*TS,t=grid[r][c];
      if(t===1) drawWall(x,y);
      else if(t===7) drawExitGate(x,y);
      else if(t===2) drawCourt(x,y,c,r);
      else if(t===4) drawStorageFloor(x,y,c,r);
      else if(t===5) drawStorageBox(x,y);
      else if(t===6) drawEquipment(x,y,c,r);
      else drawFloor(x,y,c,r);
    }
  }
  /* 농구 코트 라인 오버레이 */
  drawBasketballOverlay();
  /* 창고 표지 */
  ctx.save();
  ctx.fillStyle='rgba(241,196,15,0.95)';
  ctx.font='bold 15px sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('창',35*TS+TS/2,6*TS+TS/2);
  ctx.fillText('고',35*TS+TS/2,7*TS+TS/2);
  ctx.fillStyle='rgba(255,255,255,0.75)';
  ctx.font='18px sans-serif';
  ctx.fillText('→',35*TS+TS/2,8*TS+TS/2);
  ctx.restore();
}
drawMap();

function updateCamera(){
  var stage=document.querySelector('.stage');
  if(TEACHER_VIEW){ stage.style.transform='translate(0,0)'; return; }
  var offX=Math.max(0,Math.min(pos.c*TS-VIEW_W/2+TS/2,COLS*TS-VIEW_W));
  var offY=Math.max(0,Math.min(pos.r*TS-VIEW_H/2+TS/2,ROWS*TS-VIEW_H));
  stage.style.transform='translate(-'+offX+'px,-'+offY+'px)';
}

var pos={r:12,c:15};
function placePlayer(){
  var el=document.getElementById('player');
  if(TEACHER_VIEW) el.style.display='none';
  el.style.left=(pos.c*TS)+'px';
  el.style.top=(pos.r*TS-24)+'px';
  updateCamera();
  try{broadcastMyPosition();}catch(e){}
  try{checkZoneOnMove(pos);}catch(e){}
}
function move(dir){
  var nr=pos.r,nc=pos.c;
  if(dir==='up') nr--;
  else if(dir==='down') nr++;
  else if(dir==='left') nc--;
  else if(dir==='right') nc++;
  PLAYER._facingRight=(dir==='right');
  PLAYER.dir=(dir==='right')?'left':dir;
  renderPlayer();
  if(nr<0||nr>=ROWS||nc<0||nc>=COLS) return;
  if(!isWalk(grid[nr][nc])) return;
  try{if(__rtIsOverlayBlocked(nr,nc)) return;}catch(e){}
  try{if(__rtIsTileOccupied(nr,nc)) return;}catch(e){}
  try{if(typeof __msBlockExit==='function'&&__msBlockExit(nr,nc)){__msShowBlockedNotice();return;}}catch(e){}
  pos.r=nr; pos.c=nc;
  placePlayer();
}
window.addEventListener('keydown',function(e){
  if(TEACHER_VIEW) return;
  var m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
  if(m[e.key]){e.preventDefault();move(m[e.key]);}
});
if(!TEACHER_VIEW){
  var sw=document.querySelector('.stage-wrap');
  var tx=0,ty=0,ta=false;
  sw.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;ta=true;tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
  sw.addEventListener('touchmove',function(e){if(ta)e.preventDefault();},{passive:false});
  sw.addEventListener('touchend',function(e){
    if(!ta)return;ta=false;
    var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
    if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;
    if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');
    else move(dy>0?'down':'up');
  },{passive:true});
}
renderPlayer();
try{placePlayer();}catch(e){console.warn('[gym] placePlayer:',e);}
try{initRealtime('gym');}catch(e){console.warn('[gym] realtime:',e);}
if(!TEACHER_VIEW){
  try{initMissionSystem('gym');}catch(e){console.warn('[gym] missions:',e);}
}
try{loadMapOverlays('gym',ctx,TS);}catch(e){console.warn('[gym] overlays:',e);}
</script>
</body>
</html>
