<!DOCTYPE html>
<html lang="ko">
<head>

<title>쌤버스 - 급식실 맵</title>
<style>
*{box-sizing:border-box}
body{font-family:sans-serif;background:#1a2535;display:flex;flex-direction:column;align-items:center;padding:20px;margin:0}
#main-btn{position:fixed;top:12px;left:12px;z-index:999;background:#2c3e50;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);text-decoration:none}
#char-btn{position:fixed;top:12px;left:12px;z-index:999;background:#e67e22;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);text-decoration:none;display:none}
h2{margin:.3rem 0;color:#fff;font-size:1.1rem}
.info{font-size:12px;color:#aaa;margin-bottom:12px;text-align:center}
.stage-wrap{width:720px;max-width:100%;height:672px;overflow:hidden;border:3px solid #e67e22;border-radius:8px;box-shadow:0 0 24px rgba(230,126,34,0.4)}
.stage{position:relative;line-height:0}
#map{display:block}
#player{position:absolute;width:48px;height:72px;pointer-events:none;transition:left .1s linear,top .1s linear;z-index:5}
#player svg{display:block;width:100%;height:100%;overflow:visible}
#player.flip svg{transform:scaleX(-1)}
.remote-player{position:absolute;width:48px;height:72px;pointer-events:none;transition:left .15s linear,top .15s linear;z-index:4}
.remote-player svg{display:block;width:100%;height:100%;overflow:visible}
.remote-player.flip svg{transform:scaleX(-1)}
.remote-player .nick{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;background:rgba(255,255,255,.9);padding:1px 5px;border-radius:4px;white-space:nowrap;font-weight:600}
.pad{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px 52px;gap:4px;margin-top:14px}
.pad button{font-size:20px;border-radius:10px;border:none;background:#e67e22;color:#fff;cursor:pointer;font-weight:700;box-shadow:0 3px 0 #a04000}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 0 #a04000}
.legend{margin-top:10px;font-size:12px;color:#aaa;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.legend span{display:flex;align-items:center;gap:4px}
.sw{display:inline-block;width:13px;height:13px;border-radius:3px}

/* --- fullscreen + classroom design overrides --- */
html{height:100%}
body{height:100%;align-items:stretch;padding:0;overflow:hidden;font-family:'Noto Sans KR',sans-serif;background:linear-gradient(to bottom,#0A1628,#0E1E34)}
#main-btn{background:rgba(26,53,88,.85);border-radius:10px;padding:8px 16px;font-size:13px;font-weight:600;box-shadow:0 2px 12px rgba(0,0,0,.4);backdrop-filter:blur(8px);font-family:'Noto Sans KR',sans-serif;transition:all .15s;display:flex;align-items:center;gap:6px}
#main-btn:hover{background:rgba(17,36,64,.9)}
#char-btn{background:rgba(52,112,212,.85);border-radius:10px;padding:8px 16px;font-size:13px;font-weight:600;box-shadow:0 2px 12px rgba(0,0,0,.4);backdrop-filter:blur(8px);font-family:'Noto Sans KR',sans-serif;transition:all .15s}
#char-btn:hover{background:rgba(41,90,172,.9)}
h2{text-align:center;padding-top:18px;color:rgba(255,255,255,.85);font-size:.95rem;font-weight:600;letter-spacing:-.01em}
.info{text-align:center;color:rgba(255,255,255,.4);font-weight:400}
.stage-wrap{flex:1;min-height:0;width:100%}
.legend{justify-content:center;padding-bottom:10px;font-size:11.5px;color:rgba(255,255,255,.45)}
</style>
</head>

<h2>쌤버스 - 급식실</h2>
<div class="info">방향키 · 화면 스와이프로 이동</div>
<div class="stage-wrap">
<div class="stage">
  <canvas id="map" width="2880" height="2880"></canvas>
  <div id="player"><svg viewBox="0 0 60 76"><g id="cg_p"></g></svg></div>

</div>
</div>

  <span><span class="sw" style="background:#f2e8d8"></span>급식실</span>
  <span><span class="sw" style="background:#d8d8d4"></span>주방</span>
  <span><span class="sw" style="background:#8b5e3c"></span>식탁</span>
  <span><span class="sw" style="background:#e67e22"></span>배식대</span>
  <span><span class="sw" style="background:#27ae60"></span>출입구</span>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="ssambus_supabase_config.js"></script>
<script src="ssambus_character_render.js?v=20260628b"></script>

<script src="ssambus_missions.js?v=20260630b"></script>
<script>
/* === Cafeteria 60x60 ===
   Top 1/4 (rows 1-18): 주방 (enterable kitchen)
   Row 19: 배식대 serving counter + 3 serving windows
   Bottom 3/4 (rows 20-58): 급식실 dining */
var TS=48,COLS=60,ROWS=60,VIEW_W=720,VIEW_H=672;

var TEACHER_VIEW=new URLSearchParams(window.location.search).get('teacherView')==='1';
if(TEACHER_VIEW){
  document.body.style.padding='0';document.body.style.background='transparent';
  document.querySelectorAll('h2,.info,.pad,.legend').forEach(function(el){el.style.display='none';});
}
(function(){
  var _s=window.location.search,_rm=(_s.match(/[?&]room=([^&]+)/)||[])[1];
  if(_rm&&!TEACHER_VIEW){
    var _mb=document.getElementById('main-btn'),_cb=document.getElementById('char-btn');
    if(_mb)_mb.style.display='none';
    if(_cb){
      _cb.style.cssText='position:fixed;top:12px;left:12px;z-index:999;background:#e67e22;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);text-decoration:none;display:inline';
      var _nk=((_s.match(/[?&]nickname=([^&]*)/)||[])[1])||'';
      try{_nk=_nk||sessionStorage.getItem('ssambus_nickname')||'';}catch(e){}
      var _tm=/[?&]teacherMode=1(?:&|$)/.test(_s);
      _cb.href='ssambus_characters.html?room='+_rm+'&map=ssambus_map_cafeteria.html'+(_nk?'&nickname='+_nk:'')+(_tm?'&teacherMode=1':'');
    }
  }
})();

/* Tile: 0=dining-floor 1=wall 2=kitchen-floor 3=cookstation 4=serving-counter 5=door
         6=dining-table 7=trash-return 8=fridge 9=sink 10=food-prep-table */
var grid=[];
for(var r=0;r<ROWS;r++){
  grid[r]=[];
  for(var c=0;c<COLS;c++) grid[r][c]=(r===0||r===ROWS-1||c===0||c===COLS-1)?1:0;
}

/* === KITCHEN (rows 1-18) === */
for(var r=1;r<=18;r++) for(var c=1;c<=COLS-2;c++) grid[r][c]=2;
/* Cook stations: 3 island groups */
/* Island 1: cols 4-16, rows 4-7 */
for(var r=4;r<=7;r++) for(var c=4;c<=16;c++) grid[r][c]=3;
/* Island 2: cols 22-34, rows 4-7 */
for(var r=4;r<=7;r++) for(var c=22;c<=34;c++) grid[r][c]=3;
/* Island 3: cols 40-52, rows 4-7 */
for(var r=4;r<=7;r++) for(var c=40;c<=52;c++) grid[r][c]=3;
/* Food prep tables: row 10-11 */
for(var c=4;c<=55;c++) grid[10][c]=10;
for(var c=4;c<=55;c++) grid[11][c]=10;
/* Fridges & storage: row 2, right side */
for(var c=42;c<=57;c++) grid[2][c]=8;
for(var c=42;c<=57;c++) grid[3][c]=8;
/* Sinks: cols 54-57, rows 14-16 */
for(var r=14;r<=16;r++) for(var c=54;c<=57;c++) grid[r][c]=9;
/* Small sink left */
for(var r=14;r<=15;r++) for(var c=4;c<=7;c++) grid[r][c]=9;
/* Kitchen entry door (from dining via serving row) → accessible via door tiles */
grid[0][10]=5;grid[0][30]=5;grid[0][50]=5; /* kitchen top exits */

/* === SERVING COUNTER (row 19) === */
for(var c=1;c<=COLS-2;c++) grid[19][c]=4;
/* Three serving windows (open passages) */
grid[19][15]=0;grid[19][30]=0;grid[19][45]=0;

/* === DINING AREA (rows 20-58) === */
/* Dining tables: long natural wood tables (6 wide × 2 tall)
   3 columns of tables, 5 rows of tables */
var tblCols=[[4,9],[22,27],[40,45],[12,17],[30,35],[48,53]];
var tblRows=[22,28,34,40,46,52];
tblRows.forEach(function(tr){
  tblCols.forEach(function(cc){
    for(var dc=cc[0];dc<=cc[1];dc++){
      grid[tr][dc]=6;
      grid[tr+1][dc]=6;
    }
  });
});
/* Trash return area bottom-right */
for(var c=COLS-9;c<=COLS-2;c++) grid[ROWS-5][c]=7;
for(var c=COLS-9;c<=COLS-2;c++) grid[ROWS-4][c]=7;
/* Bottom exits */
grid[ROWS-1][10]=5;grid[ROWS-1][30]=5;grid[ROWS-1][50]=5;

var WALK=[0,5,2];
function isWalk(t){return WALK.indexOf(t)>=0;}

var cv=document.getElementById('map'),ctx=cv.getContext('2d');
var __savedChar=(function(){
  try{var _cp=new URLSearchParams(window.location.search).get('c');if(_cp)return JSON.parse(_cp);return JSON.parse(localStorage.getItem('ssambus_player_character'));}catch(e){return null;}
})();
var PLAYER=Object.assign({type:'student',skin:'#FDEBD0',hcolor:'#1a1008',hair:'short',ccolor:'#e67e22',cloth:'suit',gender:'male',acc:[],dir:'down'},__savedChar||{});
function renderPlayer(){
  document.getElementById('cg_p').innerHTML=renderCharacterSVG(PLAYER);
  document.getElementById('player').classList.toggle('flip',PLAYER.dir==='left'&&!PLAYER._facingRight);
}

function drawDiningFloor(x,y,c,r){
  ctx.fillStyle=((c+r)%2===0)?'#f2e8d8':'#edddd0';
  ctx.fillRect(x,y,TS,TS);
  ctx.strokeStyle='rgba(160,120,70,0.1)';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,TS-1,TS-1);
}
function drawKitchenFloor(x,y,c,r){
  ctx.fillStyle=((c+r)%2===0)?'#e0e0dc':'#d8d8d4';
  ctx.fillRect(x,y,TS,TS);
  ctx.strokeStyle='rgba(160,160,150,0.15)';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,TS-1,TS-1);
}
function drawWall(x,y){
  ctx.fillStyle='#f0e8d8';ctx.fillRect(x,y,TS,TS);
  ctx.fillStyle='rgba(180,130,60,.1)';ctx.fillRect(x+4,y+4,TS-8,TS-8);
}
function drawCookStation(x,y){
  ctx.shadowColor='rgba(0,0,0,0.45)';ctx.shadowBlur=0;ctx.shadowOffsetX=5;ctx.shadowOffsetY=5;
  ctx.fillStyle='#8a8a88';ctx.fillRect(x,y,TS,TS);
  ctx.fillStyle='#a0a09e';ctx.fillRect(x+2,y+2,TS-4,TS-4);
  /* Burner rings */
  var bpos=[[12,12],[36,12],[12,36],[36,36]];
  bpos.forEach(function(b){
    ctx.strokeStyle='#505050';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x+b[0],y+b[1],8,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='#333';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x+b[0],y+b[1],5,0,Math.PI*2);ctx.stroke();
    /* flame */
    ctx.fillStyle='rgba(255,120,0,.5)';ctx.beginPath();ctx.arc(x+b[0],y+b[1],3.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,220,0,.4)';ctx.beginPath();ctx.arc(x+b[0],y+b[1],2,0,Math.PI*2);ctx.fill();
  });
  /* Pot on one burner */
  if(Math.round(x/TS+y/TS)%3===0){
    ctx.fillStyle='#5a5050';ctx.beginPath();ctx.ellipse(x+36,y+36,10,7,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(200,230,255,.3)';ctx.beginPath();ctx.ellipse(x+36,y+36,8,5,0,0,Math.PI*2);ctx.fill();
  }
  ctx.shadowColor='transparent';
}
function drawFoodPrepTable(x,y){
  ctx.shadowColor='rgba(0,0,0,0.45)';ctx.shadowBlur=0;ctx.shadowOffsetX=5;ctx.shadowOffsetY=5;
  ctx.fillStyle='#b0b8a8';ctx.fillRect(x,y,TS,TS);
  ctx.fillStyle='#c8d0c0';ctx.fillRect(x+2,y+2,TS-4,TS*0.55);
  ctx.fillStyle='#a8b098';ctx.fillRect(x+2,y+2,TS-4,4);
  /* cutting board */
  if(Math.round(x/TS+y/TS)%4===0){
    ctx.fillStyle='#d4a870';ctx.fillRect(x+6,y+8,TS-12,TS*0.35);
    ctx.strokeStyle='rgba(180,130,60,.3)';ctx.lineWidth=1;
    for(var i=0;i<4;i++) ctx.strokeRect(x+7+i*(TS-14)/4,y+9,(TS-14)/4-1,TS*0.33);
  }
  ctx.shadowColor='transparent';
}
function drawServingCounter(x,y,c){
  ctx.shadowColor='rgba(0,0,0,0.45)';ctx.shadowBlur=0;ctx.shadowOffsetX=5;ctx.shadowOffsetY=5;
  ctx.fillStyle='#d35400';ctx.fillRect(x,y,TS,TS);
  ctx.fillStyle='#e67e22';ctx.fillRect(x+2,y+4,TS-4,TS-8);
  /* Tray of food */
  if((c+1)%4===0){
    ctx.fillStyle='#c8b870';ctx.fillRect(x+5,y+10,TS-10,TS-20);
    /* rice */
    ctx.fillStyle='#f0ece0';ctx.fillRect(x+7,y+12,10,TS-24);
    /* side dish */
    ctx.fillStyle='#c0392b';ctx.fillRect(x+20,y+12,8,TS-24);
    /* soup */
    ctx.fillStyle='#8b6040';ctx.fillRect(x+31,y+12,8,TS-24);
  }
  ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(x+2,y+TS-5,TS-4,4);
  ctx.shadowColor='transparent';
}
function drawDiningTable(x,y,r,c){
  ctx.shadowColor='rgba(0,0,0,0.45)';ctx.shadowBlur=0;ctx.shadowOffsetX=5;ctx.shadowOffsetY=5;
  /* Natural warm wood color */
  var isTopRow=(r===22||r===28||r===34||r===40||r===46||r===52);
  ctx.fillStyle='#6b4226';ctx.fillRect(x,y,TS,TS);
  ctx.fillStyle='#8b5e3c';ctx.fillRect(x+1,y+(isTopRow?2:0),TS-2,(isTopRow?TS-2:TS-2));
  ctx.fillStyle='#9a6e4c';ctx.fillRect(x+3,y+(isTopRow?4:2),TS-6,TS-6);
  /* wood grain */
  ctx.strokeStyle='rgba(100,60,20,.15)';ctx.lineWidth=1;
  for(var i=0;i<3;i++){ctx.beginPath();ctx.moveTo(x+2,y+8+i*12);ctx.lineTo(x+TS-2,y+8+i*12);ctx.stroke();}
  /* food items (scattered on table) */
  if((c+r)%3===0){
    ctx.fillStyle='#c8b870';ctx.fillRect(x+5,y+10,12,TS-20);
    ctx.fillStyle='#e8e4d0';ctx.fillRect(x+6,y+11,10,TS-22);
  }
  if((c+r)%5===2){
    ctx.fillStyle='#f0a060';ctx.beginPath();ctx.ellipse(x+TS*0.7,y+TS*0.5,8,6,0,0,Math.PI*2);ctx.fill();
  }
  ctx.shadowColor='transparent';
}
function drawTrashReturn(x,y){
  ctx.shadowColor='rgba(0,0,0,0.45)';ctx.shadowBlur=0;ctx.shadowOffsetX=5;ctx.shadowOffsetY=5;
  ctx.fillStyle='#2ecc71';ctx.fillRect(x,y,TS,TS);
  ctx.fillStyle='#27ae60';ctx.fillRect(x+3,y+3,TS-6,TS-6);
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('반납',x+TS/2,y+TS*0.45);
  ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillRect(x+6,y+TS*0.55,TS-12,TS*0.12);
  ctx.fillRect(x+6,y+TS*0.7,TS-12,TS*0.12);
  ctx.shadowColor='transparent';
}
function drawFridge(x,y){
  ctx.shadowColor='rgba(0,0,0,0.45)';ctx.shadowBlur=0;ctx.shadowOffsetX=5;ctx.shadowOffsetY=5;
  ctx.fillStyle='#bdc3c7';ctx.fillRect(x,y,TS,TS);
  ctx.fillStyle='#ecf0f1';ctx.fillRect(x+3,y+3,TS-6,TS/2-3);
  ctx.fillStyle='#d0d3d4';ctx.fillRect(x+3,y+TS/2,TS-6,TS/2-3);
  ctx.strokeStyle='#aaa';ctx.lineWidth=1;ctx.strokeRect(x+3,y+3,TS-6,TS/2-3);ctx.strokeRect(x+3,y+TS/2,TS-6,TS/2-3);
  ctx.fillStyle='#95a5a6';ctx.fillRect(x+TS-8,y+TS*0.2,4,6);ctx.fillRect(x+TS-8,y+TS*0.6,4,6);
  ctx.shadowColor='transparent';
}
function drawKitchenSink(x,y){
  ctx.shadowColor='rgba(0,0,0,0.45)';ctx.shadowBlur=0;ctx.shadowOffsetX=5;ctx.shadowOffsetY=5;
  ctx.fillStyle='#999';ctx.fillRect(x,y,TS,TS);
  ctx.fillStyle='#ddd';ctx.fillRect(x+4,y+4,TS-8,TS-8);
  ctx.fillStyle='#bbb';ctx.fillRect(x+8,y+8,TS-16,TS-16);
  ctx.strokeStyle='#888';ctx.lineWidth=1;ctx.strokeRect(x+8,y+8,TS-16,TS-16);
  ctx.fillStyle='#7f8c8d';ctx.fillRect(x+TS/2-2,y+2,4,7);
  ctx.shadowColor='transparent';
}
function drawDoor(x,y){
  ctx.shadowColor='rgba(0,0,0,0.45)';ctx.shadowBlur=0;ctx.shadowOffsetX=5;ctx.shadowOffsetY=5;
  ctx.fillStyle='#e67e22';ctx.fillRect(x,y,TS,TS);
  ctx.fillStyle='#27ae60';ctx.fillRect(x+5,y+3,TS-10,TS-6);
  ctx.fillStyle='#fff';ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('EXIT',x+TS/2,y+TS*0.38);
  ctx.strokeStyle='#fff';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(x+12,y+TS*0.62);ctx.lineTo(x+TS-8,y+TS*0.62);
  ctx.moveTo(x+TS-14,y+TS*0.62-6);ctx.lineTo(x+TS-8,y+TS*0.62);ctx.lineTo(x+TS-14,y+TS*0.62+6);ctx.stroke();
  ctx.fillStyle='#f1c40f';ctx.beginPath();ctx.arc(x+10,y+TS*0.5,3.5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#f1c40f';ctx.lineWidth=2;ctx.strokeRect(x+5,y+3,TS-10,TS-6);
  ctx.shadowColor='transparent';
}

function drawMap(){
  for(var r=0;r<ROWS;r++){
    for(var c=0;c<COLS;c++){
      var x=c*TS,y=r*TS,t=grid[r][c];
      if(t===1) drawWall(x,y);
      else if(t===2) drawKitchenFloor(x,y,c,r);
      else if(t===3) drawCookStation(x,y);
      else if(t===4) drawServingCounter(x,y,c);
      else if(t===5) drawDoor(x,y);
      else if(t===6) drawDiningTable(x,y,r,c);
      else if(t===7) drawTrashReturn(x,y);
      else if(t===8) drawFridge(x,y);
      else if(t===9) drawKitchenSink(x,y);
      else if(t===10) drawFoodPrepTable(x,y);
      else drawDiningFloor(x,y,c,r);
    }
  }
  /* Serving window warm glow */
  [15,30,45].forEach(function(wc){
    var grd=ctx.createRadialGradient(wc*TS+TS/2,19*TS,3,wc*TS+TS/2,19*TS,TS*2.5);
    grd.addColorStop(0,'rgba(255,180,80,.2)');grd.addColorStop(1,'rgba(255,180,80,0)');
    ctx.fillStyle=grd;ctx.fillRect((wc-3)*TS,(17)*TS,7*TS,5*TS);
  });
  /* Kitchen label */
  ctx.fillStyle='rgba(100,100,100,.2)';ctx.font='bold 52px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('주방',COLS*TS/2,10*TS);
  /* Dining label */
  ctx.fillStyle='rgba(180,120,60,.08)';ctx.font='bold 52px sans-serif';
  ctx.fillText('급식실',COLS*TS/2,38*TS);
  /* 45-degree drop shadows */
  ctx.fillStyle='rgba(0,0,0,0.30)';
  for(var __r=0;__r<ROWS;__r++){for(var __c=0;__c<COLS;__c++){
    if(isWalk(grid[__r][__c])) continue;
    var __x=__c*TS,__y=__r*TS;
    if((__c+1<COLS)&&isWalk(grid[__r][__c+1])&&grid[__r][__c+1]!==5) ctx.fillRect(__x+TS,__y+5,6,TS);
    if((__r+1<ROWS)&&isWalk(grid[__r+1][__c])&&grid[__r+1][__c]!==5) ctx.fillRect(__x+5,__y+TS,TS,6);
  }}
}
drawMap();

function updateCamera(){var _sw=document.querySelector('.stage-wrap');var _vw=_sw.clientWidth||VIEW_W;var _vh=_sw.clientHeight||VIEW_H;
  if(TEACHER_VIEW){var wrap=document.querySelector('.stage-wrap');wrap.style.width=(COLS*TS)+'px';wrap.style.height=(ROWS*TS)+'px';wrap.style.overflow='visible';return;}
  var stage=document.querySelector('.stage');
  var offX=Math.max(0,Math.min(pos.c*TS-_vw/2+TS/2,COLS*TS-_vw));
  var offY=Math.max(0,Math.min(pos.r*TS-_vh/2+TS/2,ROWS*TS-_vh));
  stage.style.transform='translate(-'+offX+'px,-'+offY+'px)';
}
var pos={r:21,c:30};
function placePlayer(){
  var el=document.getElementById('player');
  if(TEACHER_VIEW) el.style.display='none';
  el.style.left=(pos.c*TS)+'px';el.style.top=(pos.r*TS-24)+'px';
  updateCamera();
  try{broadcastMyPosition();}catch(e){}
  try{checkZoneOnMove(pos);}catch(e){}
}
function move(dir){
  var nr=pos.r,nc=pos.c;
  if(dir==='up') nr--;else if(dir==='down') nr++;else if(dir==='left') nc--;else if(dir==='right') nc++;
  PLAYER._facingRight=(dir==='right');PLAYER.dir=(dir==='right')?'left':dir;renderPlayer();
  if(nr<0||nr>=ROWS||nc<0||nc>=COLS) return;
  if(!isWalk(grid[nr][nc])) return;
  try{if(__rtIsOverlayBlocked(nr,nc)) return;}catch(e){}
  try{if(__rtIsTileOccupied(nr,nc)) return;}catch(e){}
  try{if(typeof __msBlockExit==='function'&&__msBlockExit(nr,nc)){__msShowBlockedNotice();return;}}catch(e){}
  pos.r=nr;pos.c=nc;placePlayer();
}
window.addEventListener('keydown',function(e){
  if(TEACHER_VIEW) return;
  var m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
  if(m[e.key]){e.preventDefault();move(m[e.key]);}
});
if(!TEACHER_VIEW){
  var sw2=document.querySelector('.stage-wrap');var tx=0,ty=0,ta=false;
  sw2.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;ta=true;tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
  sw2.addEventListener('touchmove',function(e){if(ta)e.preventDefault();},{passive:false});
  sw2.addEventListener('touchend',function(e){
    if(!ta)return;ta=false;var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
    if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;
    if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');else move(dy>0?'down':'up');
  },{passive:true});
}
renderPlayer();
try{placePlayer();}catch(e){console.warn('[cafeteria] placePlayer:',e);}
try{initRealtime('cafeteria');}catch(e){console.warn('[cafeteria] realtime:',e);}
if(!TEACHER_VIEW){
  try{initMissionSystem('cafeteria');}catch(e){console.warn('[cafeteria] missions:',e);}
}
try{loadMapOverlays('cafeteria',ctx,TS);}catch(e){console.warn('[cafeteria] overlays:',e);}
window.addEventListener('resize',updateCamera);
</script>
