<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>쌤버스 - 교실 맵</title>
<style>
*{box-sizing:border-box}
body{font-family:sans-serif;background:#1a2535;display:flex;flex-direction:column;align-items:center;padding:20px;margin:0}
#main-btn{position:fixed;top:12px;left:12px;z-index:999;background:#2c3e50;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);text-decoration:none}
#char-btn{position:fixed;top:12px;left:12px;z-index:999;background:#2980b9;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);text-decoration:none;display:none}
h2{margin:.3rem 0;color:#fff;font-size:1.1rem}
.info{font-size:12px;color:#aaa;margin-bottom:12px;text-align:center}
.stage-wrap{width:720px;max-width:100%;height:672px;overflow:hidden;border:3px solid #4a6fa5;border-radius:8px;box-shadow:0 0 24px rgba(74,111,165,0.5)}
.stage{position:relative;line-height:0}
#map{display:block}
#player{position:absolute;width:48px;height:72px;pointer-events:none;transition:left .1s linear,top .1s linear;z-index:5}
#player svg{display:block;width:100%;height:100%;overflow:visible}
#player.flip svg{transform:scaleX(-1)}
.remote-player{position:absolute;width:48px;height:72px;pointer-events:none;transition:left .15s linear,top .15s linear;z-index:4}
.remote-player svg{display:block;width:100%;height:100%;overflow:visible}
.remote-player.flip svg{transform:scaleX(-1)}
.remote-player .nick{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;background:rgba(255,255,255,.9);padding:1px 5px;border-radius:4px;white-space:nowrap;font-weight:600}
.pad{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px 52px;gap:4px;margin-top:14px}
.pad button{font-size:20px;border-radius:10px;border:none;background:#4a6fa5;color:#fff;cursor:pointer;font-weight:700;box-shadow:0 3px 0 #2c4a70}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 0 #2c4a70}
.legend{margin-top:10px;font-size:12px;color:#aaa;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.legend span{display:flex;align-items:center;gap:4px}
.sw{display:inline-block;width:13px;height:13px;border-radius:3px}
</style>
</head>
<body>
<a id="main-btn" href="index.html">메인</a>
<a id="char-btn" href="#">캐릭터 변경</a>
<h2>쌤버스 - 교실</h2>
<div class="info">방향키 또는 버튼으로 이동하세요</div>
<div class="stage-wrap">
<div class="stage">
  <canvas id="map" width="2880" height="2880"></canvas>
  <div id="player"><svg viewBox="0 0 60 76"><g id="cg_p"></g></svg></div>
  <div id="remote-players"></div>
</div>
</div>
<div class="pad">
  <div></div><button onclick="move('up')">&#8593;</button><div></div>
  <button onclick="move('left')">&#8592;</button><div></div><button onclick="move('right')">&#8594;</button>
  <div></div><button onclick="move('down')">&#8595;</button><div></div>
</div>
<div class="legend">
  <span><span class="sw" style="background:#d4a96a"></span>바닥</span>
  <span><span class="sw" style="background:#1e5c3a"></span>칠판</span>
  <span><span class="sw" style="background:#8b5e3c"></span>교사책상</span>
  <span><span class="sw" style="background:#c8a06e"></span>학생책상</span>
  <span><span class="sw" style="background:#27ae60"></span>출입구</span>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="ssambus_supabase_config.js"></script>
<script src="ssambus_character_render.js"></script>
<script src="ssambus_realtime.js"></script>
<script src="ssambus_missions.js"></script>
<script>
/* === Classroom map 60x60 === */
var TS=48,COLS=60,ROWS=60,VIEW_W=720,VIEW_H=672;

var TEACHER_VIEW=new URLSearchParams(window.location.search).get('teacherView')==='1';
if(TEACHER_VIEW){
  document.body.style.padding='0';
  document.body.style.background='transparent';
  document.querySelectorAll('h2,.info,.pad,.legend').forEach(function(el){el.style.display='none';});
}
(function(){
  var _p=new URLSearchParams(window.location.search);
  var _room=_p.get('room');
  if(_room&&!TEACHER_VIEW){
    document.getElementById('main-btn').style.display='none';
    var _cb=document.getElementById('char-btn');
    _cb.style.display='inline';
    var _nick=_p.get('nickname')||sessionStorage.getItem('ssambus_nickname')||'';
    var _map=window.location.pathname.split('/').pop();
    var _cp=new URLSearchParams({room:_room,map:_map});
    if(_nick)_cp.set('nickname',_nick);
    _cb.href='ssambus_characters.html?'+_cp.toString();
  }
})();

/* Tile: 0=floor 1=wall 2=blackboard 3=teacher-desk 4=student-desk 5=door(EXIT) 7=bulletin 8=TV 9=plant */
var grid=[];
for(var r=0;r<ROWS;r++){
  grid[r]=[];
  for(var c=0;c<COLS;c++){
    grid[r][c]=(r===0||r===ROWS-1||c===0||c===COLS-1)?1:0;
  }
}
/* Top row: TV cols 0-2 (3 tiles), blackboard cols 3-48 */
grid[0][0]=8; grid[0][1]=8; grid[0][2]=8;
for(var c=3;c<=48;c++) grid[0][c]=2;
/* Teacher desk: row 2, cols 24-35 */
for(var c=24;c<=35;c++) grid[2][c]=3;
/* Student desks: 6 cols x 5 rows = 30 desks */
var deskCols=[8,16,24,32,40,48];
var deskRows=[12,20,28,36,44];
for(var di=0;di<deskRows.length;di++){
  for(var dj=0;dj<deskCols.length;dj++){
    grid[deskRows[di]][deskCols[dj]]=4;
  }
}
/* Doors on right wall (EXIT) */
grid[10][COLS-1]=5;
grid[48][COLS-1]=5;
/* Bulletin board: second-to-last row */
for(var c=1;c<=COLS-2;c++) grid[ROWS-2][c]=7;
/* Corner plants */
grid[4][4]=9; grid[4][COLS-5]=9; grid[ROWS-6][4]=9; grid[ROWS-6][COLS-5]=9;

var WALK=[0,5];
function isWalk(t){return WALK.indexOf(t)>=0;}

var cv=document.getElementById('map');
var ctx=cv.getContext('2d');

/* Character data: URL param ?c= or localStorage */
var __savedChar=(function(){
  try{
    var _cp=new URLSearchParams(window.location.search).get('c');
    if(_cp) return JSON.parse(_cp);
    return JSON.parse(localStorage.getItem('ssambus_player_character'));
  }catch(e){return null;}
})();
var PLAYER=Object.assign({
  type:'student',skin:'#FDEBD0',hcolor:'#1a1008',hair:'short',
  ccolor:'#1a3a6b',cloth:'suit',gender:'male',acc:[],dir:'down'
},__savedChar||{});
function renderPlayer(){
  document.getElementById('cg_p').innerHTML=renderCharacterSVG(PLAYER);
  document.getElementById('player').classList.toggle('flip',PLAYER.dir==='left'&&!PLAYER._facingRight);
}

/* Floor: warm parquet wood */
function drawFloor(x,y,c,r){
  ctx.fillStyle=((c+r)%2===0)?'#d4a96a':'#c9a060';
  ctx.fillRect(x,y,TS,TS);
  ctx.strokeStyle='rgba(100,60,10,0.15)';
  ctx.lineWidth=1;
  for(var i=0;i<4;i++){
    ctx.beginPath();
    ctx.moveTo(x,y+i*13+4); ctx.lineTo(x+TS,y+i*13+4);
    ctx.stroke();
  }
  ctx.strokeStyle='rgba(120,80,20,0.18)';
  ctx.lineWidth=0.5;
  ctx.strokeRect(x+0.5,y+0.5,TS-1,TS-1);
}

/* Wall: cream with subtle panel */
function drawWall(x,y){
  var grad=ctx.createLinearGradient(x,y,x,y+TS);
  grad.addColorStop(0,'#e8ddd0');
  grad.addColorStop(1,'#d5c8b8');
  ctx.fillStyle=grad;
  ctx.fillRect(x,y,TS,TS);
  ctx.strokeStyle='rgba(80,60,40,0.12)';
  ctx.lineWidth=1;
  ctx.strokeRect(x+4,y+4,TS-8,TS-8);
}

/* Window drawn on wall (col 0) */
function drawWindow(x,y){
  drawWall(x,y);
  ctx.fillStyle='#aee0f5';
  ctx.fillRect(x+5,y+6,TS-10,TS-14);
  ctx.strokeStyle='#4a6fa5';
  ctx.lineWidth=2;
  ctx.strokeRect(x+5,y+6,TS-10,TS-14);
  ctx.beginPath();
  ctx.moveTo(x+TS/2,y+6); ctx.lineTo(x+TS/2,y+TS-8);
  ctx.moveTo(x+5,y+(TS-14)/2+6); ctx.lineTo(x+TS-5,y+(TS-14)/2+6);
  ctx.stroke();
  /* sky glare */
  ctx.fillStyle='rgba(255,255,255,0.3)';
  ctx.fillRect(x+7,y+8,TS/2-10,8);
}

/* Blackboard: vivid dark green with chalk marks */
function drawBlackboard(x,y){
  ctx.fillStyle='#1e5c3a';
  ctx.fillRect(x,y,TS,TS);
  ctx.strokeStyle='#2e8c5a';
  ctx.lineWidth=2;
  ctx.strokeRect(x+2,y+2,TS-4,TS-4);
  /* chalk lines */
  ctx.fillStyle='rgba(230,255,210,0.55)';
  ctx.fillRect(x+6,y+10,TS-12,3);
  ctx.fillRect(x+6,y+18,TS-18,3);
  ctx.fillRect(x+8,y+26,TS-20,3);
  /* chalk dust */
  ctx.fillStyle='rgba(210,255,190,0.25)';
  ctx.beginPath();
  ctx.arc(x+TS*0.6,y+TS*0.7,8,0,Math.PI*2);
  ctx.fill();
}

/* Large TV: 3-tile wide smart board (cols 0,1,2) */
function drawTV(x,y,col){
  ctx.fillStyle='#0d1a2a';
  ctx.fillRect(x,y,TS,TS);
  /* screen area per tile */
  var sx=x+(col===0?4:0), sw=TS-(col===0?4:0)-(col===2?4:0);
  ctx.fillStyle='#1040a0';
  ctx.fillRect(sx,y+4,sw,TS-8);
  /* screen content: horizontal lesson lines */
  ctx.fillStyle='rgba(140,210,255,0.55)';
  ctx.fillRect(sx+2,y+9,sw-4,4);
  ctx.fillStyle='rgba(140,210,255,0.3)';
  ctx.fillRect(sx+2,y+17,sw-6,3);
  ctx.fillRect(sx+2,y+24,sw-8,3);
  ctx.fillRect(sx+2,y+31,sw-4,3);
  /* center tile: class label overlay */
  if(col===1){
    ctx.fillStyle='rgba(255,255,255,0.92)';
    ctx.font='bold 13px sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('SMART TV',x+TS/2,y+TS/2+2);
    ctx.fillStyle='rgba(255,255,255,0.15)';
    ctx.fillRect(sx,y+4,sw,TS*0.35);
  }
  /* frame border */
  if(col===0){
    ctx.fillStyle='#0a1018';
    ctx.fillRect(x,y,4,TS);
    ctx.fillRect(x,y,TS,4);
    ctx.fillRect(x,y+TS-4,TS,4);
  } else if(col===2){
    ctx.fillStyle='#0a1018';
    ctx.fillRect(x+TS-4,y,4,TS);
    ctx.fillRect(x,y,TS,4);
    ctx.fillRect(x,y+TS-4,TS,4);
    /* wall mount bracket */
    ctx.fillStyle='#555';
    ctx.fillRect(x+TS-4,y+16,6,16);
    /* power LED */
    ctx.fillStyle='#00ff88';
    ctx.beginPath();
    ctx.arc(x+TS-8,y+TS-8,3,0,Math.PI*2);
    ctx.fill();
  } else {
    ctx.fillStyle='#0a1018';
    ctx.fillRect(x,y,TS,4);
    ctx.fillRect(x,y+TS-4,TS,4);
  }
}

/* Teacher desk: dark rich wood */
function drawTeacherDesk(x,y){
  ctx.fillStyle='#5a3010';
  ctx.fillRect(x,y,TS,TS);
  ctx.fillStyle='#8b5e3c';
  ctx.fillRect(x+2,y+5,TS-4,TS*0.5);
  ctx.strokeStyle='rgba(40,20,0,0.3)';
  ctx.lineWidth=1;
  for(var i=0;i<3;i++){
    ctx.beginPath(); ctx.moveTo(x+5,y+9+i*8); ctx.lineTo(x+TS-5,y+9+i*8); ctx.stroke();
  }
  /* papers on desk */
  ctx.fillStyle='rgba(255,255,240,0.85)';
  ctx.fillRect(x+5,y+8,14,11);
  ctx.fillRect(x+TS-19,y+8,14,11);
  /* pencil holder */
  ctx.fillStyle='#e74c3c';
  ctx.fillRect(x+TS/2-3,y+9,6,10);
}

/* Student desk: warm wood */
function drawStudentDesk(x,y){
  ctx.fillStyle='#8a5520';
  ctx.fillRect(x,y,TS,TS);
  ctx.fillStyle='#c8a06e';
  ctx.fillRect(x+2,y+5,TS-4,TS*0.5);
  ctx.strokeStyle='rgba(80,50,10,0.22)';
  ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x+4,y+11); ctx.lineTo(x+TS-4,y+11); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+4,y+19); ctx.lineTo(x+TS-4,y+19); ctx.stroke();
  /* book */
  ctx.fillStyle='#e74c3c';
  ctx.fillRect(x+7,y+8,10,14);
  ctx.fillStyle='#c0392b';
  ctx.fillRect(x+7,y+8,2,14);
  /* pencil */
  ctx.fillStyle='#f1c40f';
  ctx.fillRect(x+TS-15,y+9,3,12);
  ctx.fillStyle='#e67e22';
  ctx.beginPath();
  ctx.moveTo(x+TS-15,y+21); ctx.lineTo(x+TS-12,y+21); ctx.lineTo(x+TS-13.5,y+25);
  ctx.closePath(); ctx.fill();
}

/* Door: vivid green EXIT marker */
function drawDoor(x,y){
  /* orange frame */
  ctx.fillStyle='#e67e22';
  ctx.fillRect(x,y,TS,TS);
  /* green door panel */
  ctx.fillStyle='#27ae60';
  ctx.fillRect(x+5,y+3,TS-10,TS-6);
  /* EXIT label */
  ctx.fillStyle='#ffffff';
  ctx.font='bold 9px sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('EXIT',x+TS/2,y+TS*0.38);
  /* arrow pointing right */
  ctx.strokeStyle='#ffffff';
  ctx.lineWidth=2.5;
  ctx.beginPath();
  ctx.moveTo(x+12,y+TS*0.62);
  ctx.lineTo(x+TS-8,y+TS*0.62);
  ctx.moveTo(x+TS-14,y+TS*0.62-6);
  ctx.lineTo(x+TS-8,y+TS*0.62);
  ctx.lineTo(x+TS-14,y+TS*0.62+6);
  ctx.stroke();
  /* handle */
  ctx.fillStyle='#f1c40f';
  ctx.beginPath();
  ctx.arc(x+10,y+TS*0.5,3.5,0,Math.PI*2);
  ctx.fill();
  /* bright glow border */
  ctx.strokeStyle='#f1c40f';
  ctx.lineWidth=2;
  ctx.strokeRect(x+5,y+3,TS-10,TS-6);
}

/* Bulletin board: cork with colorful papers */
var PAPER_COLORS=['#e74c3c','#3498db','#f1c40f','#2ecc71','#e67e22','#9b59b6','#1abc9c','#e91e63'];
function drawBulletin(x,y,c){
  ctx.fillStyle='#b8860b';
  ctx.fillRect(x,y,TS,TS);
  ctx.fillStyle='rgba(180,130,0,0.3)';
  for(var di=0;di<3;di++){
    for(var dj=0;dj<3;dj++){
      ctx.fillRect(x+di*7+3,y+dj*7+3,5,5);
    }
  }
  var pc=PAPER_COLORS[c%8];
  ctx.fillStyle=pc;
  ctx.fillRect(x+4,y+5,TS-8,TS*0.58);
  ctx.strokeStyle='rgba(255,255,255,0.45)';
  ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x+7,y+11); ctx.lineTo(x+TS-7,y+11); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+7,y+17); ctx.lineTo(x+TS-9,y+17); ctx.stroke();
  /* thumbtack */
  ctx.fillStyle='#e74c3c';
  ctx.beginPath(); ctx.arc(x+TS/2,y+6,3,0,Math.PI*2); ctx.fill();
}

/* Plant: pot with leaves */
function drawPlant(x,y){
  /* background floor */
  ctx.fillStyle='#c9a060';
  ctx.fillRect(x,y,TS,TS);
  /* pot */
  ctx.fillStyle='#8B4513';
  ctx.fillRect(x+12,y+TS*0.6,TS-24,TS*0.34);
  ctx.fillStyle='#a0522d';
  ctx.fillRect(x+10,y+TS*0.6-4,TS-20,5);
  /* leaves */
  ctx.fillStyle='#27ae60';
  ctx.beginPath(); ctx.ellipse(x+TS/2,y+TS*0.44,12,18,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#2ecc71';
  ctx.beginPath(); ctx.ellipse(x+TS/2-8,y+TS*0.38,8,13,-0.4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+TS/2+8,y+TS*0.36,8,13,0.4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#58d68d';
  ctx.beginPath(); ctx.ellipse(x+TS/2,y+TS*0.3,6,10,0,0,Math.PI*2); ctx.fill();
  /* flower */
  ctx.fillStyle='#f1c40f';
  ctx.beginPath(); ctx.arc(x+TS/2+4,y+TS*0.28,4,0,Math.PI*2); ctx.fill();
}

/* Window rows (every 8 rows on left wall) */
var WIN_ROWS=[5,13,21,29,37,45,53];

function drawMap(){
  for(var r=0;r<ROWS;r++){
    for(var c=0;c<COLS;c++){
      var x=c*TS,y=r*TS,t=grid[r][c];
      if(t===1){
        /* windows on left wall */
        if(c===0&&WIN_ROWS.indexOf(r)>=0) drawWindow(x,y);
        else drawWall(x,y);
      }
      else if(t===2) drawBlackboard(x,y);
      else if(t===3) drawTeacherDesk(x,y);
      else if(t===4) drawStudentDesk(x,y);
      else if(t===5) drawDoor(x,y);
      else if(t===7) drawBulletin(x,y,c);
      else if(t===8) drawTV(x,y,c);
      else if(t===9) drawPlant(x,y);
      else drawFloor(x,y,c,r);
    }
  }
  /* Chair shadows under each student desk */
  ctx.fillStyle='rgba(80,50,10,0.18)';
  for(var di=0;di<deskRows.length;di++){
    for(var dj=0;dj<deskCols.length;dj++){
      var cx2=deskCols[dj]*TS+TS/2;
      var cy2=(deskRows[di]+1)*TS+TS*0.3;
      ctx.beginPath();
      ctx.ellipse(cx2,cy2,16,9,0,0,Math.PI*2);
      ctx.fill();
    }
  }
}
drawMap();

function updateCamera(){
  if(TEACHER_VIEW){
    var wrap=document.querySelector('.stage-wrap');
    wrap.style.width=(COLS*TS)+'px';
    wrap.style.height=(ROWS*TS)+'px';
    wrap.style.overflow='visible';
    return;
  }
  var stage=document.querySelector('.stage');
  var offX=Math.max(0,Math.min(pos.c*TS-VIEW_W/2+TS/2,COLS*TS-VIEW_W));
  var offY=Math.max(0,Math.min(pos.r*TS-VIEW_H/2+TS/2,ROWS*TS-VIEW_H));
  stage.style.transform='translate(-'+offX+'px,-'+offY+'px)';
}

var pos={r:6,c:30};
function placePlayer(){
  var el=document.getElementById('player');
  if(TEACHER_VIEW) el.style.display='none';
  el.style.left=(pos.c*TS)+'px';
  el.style.top=(pos.r*TS-24)+'px';
  updateCamera();
  try{broadcastMyPosition();}catch(e){}
  try{checkZoneOnMove(pos);}catch(e){}
}
function move(dir){
  var nr=pos.r,nc=pos.c;
  if(dir==='up') nr--;
  else if(dir==='down') nr++;
  else if(dir==='left') nc--;
  else if(dir==='right') nc++;
  PLAYER._facingRight=(dir==='right');
  PLAYER.dir=(dir==='right')?'left':dir;
  renderPlayer();
  if(nr<0||nr>=ROWS||nc<0||nc>=COLS) return;
  if(!isWalk(grid[nr][nc])) return;
  try{if(__rtIsOverlayBlocked(nr,nc)) return;}catch(e){}
  try{if(__rtIsTileOccupied(nr,nc)) return;}catch(e){}
  try{if(typeof __msBlockExit==='function'&&__msBlockExit(nr,nc)){__msShowBlockedNotice();return;}}catch(e){}
  pos.r=nr; pos.c=nc;
  placePlayer();
}
window.addEventListener('keydown',function(e){
  if(TEACHER_VIEW) return;
  var m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
  if(m[e.key]){e.preventDefault();move(m[e.key]);}
});
if(!TEACHER_VIEW){
  var sw=document.querySelector('.stage-wrap');
  var tx=0,ty=0,ta=false;
  sw.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;ta=true;tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
  sw.addEventListener('touchmove',function(e){if(ta)e.preventDefault();},{passive:false});
  sw.addEventListener('touchend',function(e){
    if(!ta)return;ta=false;
    var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
    if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;
    if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');
    else move(dy>0?'down':'up');
  },{passive:true});
}
renderPlayer();
try{placePlayer();}catch(e){console.warn('[classroom] placePlayer:',e);}
try{initRealtime('classroom');}catch(e){console.warn('[classroom] realtime:',e);}
if(!TEACHER_VIEW){
  try{initMissionSystem('classroom');}catch(e){console.warn('[classroom] missions:',e);}
  try{loadMapOverlays('classroom',ctx,TS);}catch(e){console.warn('[classroom] overlays:',e);}
}
</script>
</body>
</html>
