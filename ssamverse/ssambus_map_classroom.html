<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>쌤버스 - 교실 맵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:linear-gradient(to bottom,#0A1628,#0E1E34);display:flex;flex-direction:column;align-items:center;padding:20px;margin:0;min-height:100vh}
#main-btn{position:fixed;top:14px;left:14px;z-index:999;background:rgba(26,53,88,.85);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.4);text-decoration:none;backdrop-filter:blur(8px);font-family:'Noto Sans KR',sans-serif;transition:all .15s;display:flex;align-items:center;gap:6px}
#main-btn:hover{background:rgba(17,36,64,.9)}
#char-btn{position:fixed;top:14px;left:14px;z-index:999;background:rgba(52,112,212,.85);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.4);text-decoration:none;backdrop-filter:blur(8px);font-family:'Noto Sans KR',sans-serif;transition:all .15s;display:none;align-items:center;gap:6px}
#char-btn:hover{background:rgba(41,90,172,.9)}
h2{margin:.3rem 0;color:rgba(255,255,255,.85);font-size:.95rem;font-weight:600;letter-spacing:-.01em}
.info{font-size:12px;color:rgba(255,255,255,.4);margin-bottom:12px;text-align:center;font-weight:400}
.stage-wrap{width:720px;max-width:100%;height:672px;overflow:hidden;border:2px solid rgba(52,112,212,.5);border-radius:12px;box-shadow:0 0 40px rgba(52,112,212,.25),0 0 0 1px rgba(255,255,255,.04)}
.stage{position:relative;line-height:0}
#map{display:block}
#player{position:absolute;width:48px;height:72px;pointer-events:none;transition:left .1s linear,top .1s linear;z-index:5}
#player svg{display:block;width:100%;height:100%;overflow:visible}
#player.flip svg{transform:scaleX(-1)}
.remote-player{position:absolute;width:48px;height:72px;pointer-events:none;transition:left .15s linear,top .15s linear;z-index:4}
.remote-player svg{display:block;width:100%;height:100%;overflow:visible}
.remote-player.flip svg{transform:scaleX(-1)}
.remote-player .nick{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;background:rgba(255,255,255,.9);padding:1px 5px;border-radius:4px;white-space:nowrap;font-weight:600}
.pad{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px 52px;gap:5px;margin-top:14px}
.pad button{font-size:20px;border-radius:12px;border:none;background:rgba(26,53,88,.8);color:rgba(255,255,255,.9);cursor:pointer;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.35),0 0 12px rgba(52,112,212,.15);backdrop-filter:blur(4px);transition:all .1s}
.pad button:hover{background:rgba(52,112,212,.7)}
.pad button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.legend{margin-top:10px;font-size:11.5px;color:rgba(255,255,255,.45);display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.legend span{display:flex;align-items:center;gap:4px}
.sw{display:inline-block;width:13px;height:13px;border-radius:3px}

/* --- fullscreen + classroom design overrides --- */
html{height:100%}
body{height:100%;align-items:stretch;padding:0;overflow:hidden;font-family:'Noto Sans KR',sans-serif;background:linear-gradient(to bottom,#0A1628,#0E1E34)}
#main-btn{background:rgba(26,53,88,.85);border-radius:10px;padding:8px 16px;font-size:13px;font-weight:600;box-shadow:0 2px 12px rgba(0,0,0,.4);backdrop-filter:blur(8px);font-family:'Noto Sans KR',sans-serif;transition:all .15s;display:flex;align-items:center;gap:6px}
#main-btn:hover{background:rgba(17,36,64,.9)}
#char-btn{background:rgba(52,112,212,.85);border-radius:10px;padding:8px 16px;font-size:13px;font-weight:600;box-shadow:0 2px 12px rgba(0,0,0,.4);backdrop-filter:blur(8px);font-family:'Noto Sans KR',sans-serif;transition:all .15s}
#char-btn:hover{background:rgba(41,90,172,.9)}
h2{text-align:center;padding-top:18px;color:rgba(255,255,255,.85);font-size:.95rem;font-weight:600;letter-spacing:-.01em}
.info{text-align:center;color:rgba(255,255,255,.4);font-weight:400}
.stage-wrap{flex:1;min-height:0;width:100%}
.legend{justify-content:center;padding-bottom:10px;font-size:11.5px;color:rgba(255,255,255,.45)}
</style>
</head>
<body style="font-family: &quot;Noto Sans KR&quot;">
<a id="main-btn" href="index.html">메인</a>
<a id="char-btn" href="#">캐릭터 변경</a>
<h2>쌤버스 - 교실</h2>
<div class="info">방향키 · 화면 스와이프로 이동</div>
<div class="stage-wrap">
<div class="stage">
  <canvas id="map" width="2880" height="2880"></canvas>
  <div id="player"><svg viewBox="0 0 60 76"><g id="cg_p"></g></svg></div>
  <div id="remote-players"></div>
</div>
</div>

<div class="legend">
  <span><span class="sw" style="background:#d4a96a"></span>바닥</span>
  <span><span class="sw" style="background:#1e5c3a"></span>칠판</span>
  <span><span class="sw" style="background:#8b5e3c"></span>교사책상</span>
  <span><span class="sw" style="background:#c8a06e"></span>학생책상</span>
  <span><span class="sw" style="background:#27ae60"></span>출입구</span>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="ssambus_supabase_config.js"></script>
<script src="ssambus_character_render.js?v=20260628"></script>
<script src="ssambus_realtime.js?v=20260628a"></script>
<script src="ssambus_missions.js"></script>
<script>
/* === Classroom map 60x60 === */
var TS=48,COLS=60,ROWS=60,VIEW_W=720,VIEW_H=672;

var TEACHER_VIEW=new URLSearchParams(window.location.search).get('teacherView')==='1';
if(TEACHER_VIEW){
  document.body.style.padding='0';
  document.body.style.background='transparent';
  document.querySelectorAll('h2,.info,.pad,.legend').forEach(function(el){el.style.display='none';});
}
(function(){
  var _s=window.location.search;
  var _rm=(_s.match(/[?&]room=([^&]+)/)||[])[1];
  if(_rm&&!TEACHER_VIEW){
    var _mb=document.getElementById('main-btn');
    var _cb=document.getElementById('char-btn');
    if(_mb)_mb.style.display='none';
    if(_cb){
      _cb.style.cssText='position:fixed;top:12px;left:12px;z-index:999;background:#2980b9;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);text-decoration:none;display:inline';
      var _nk=((_s.match(/[?&]nickname=([^&]*)/)||[])[1])||'';
      try{_nk=_nk||sessionStorage.getItem('ssambus_nickname')||'';}catch(e){}
      var _mf=window.location.pathname.split('/').pop()||'ssambus_map_classroom.html';
      _cb.href='ssambus_characters.html?room='+_rm+'&map='+_mf+(_nk?'&nickname='+_nk:'');
    }
  }
})();

/* Tile: 0=floor 1=wall 2=blackboard 3=teacher-desk 4=student-desk(anchor) 5=door(EXIT) 7=bulletin 8=TV 9=plant 41=desk-continuation */
var grid=[];
for(var r=0;r<ROWS;r++){
  grid[r]=[];
  for(var c=0;c<COLS;c++){
    grid[r][c]=(r===0||r===ROWS-1||c===0||c===COLS-1)?1:0;
  }
}
/* Top row: TV cols 0-2 (3 tiles), blackboard cols 3-48 */
grid[0][0]=8; grid[0][1]=8; grid[0][2]=8;
for(var c=3;c<=48;c++) grid[0][c]=2;
/* Teacher desk: row 2, cols 24-35 */
for(var c=24;c<=35;c++) grid[2][c]=3;
/* Student desks: 6 cols x 5 rows = 30 desks, each 2×2 tiles (type4=anchor, type41=continuation) */
var deskCols=[8,16,24,32,40,48];
var deskRows=[12,20,28,36,44];
for(var di=0;di<deskRows.length;di++){
  for(var dj=0;dj<deskCols.length;dj++){
    var _dr=deskRows[di],_dc=deskCols[dj];
    grid[_dr][_dc]=4;      // anchor (top-left, 여기서 그림)
    grid[_dr][_dc+1]=41;   // 오른쪽
    grid[_dr+1][_dc]=41;   // 아래
    grid[_dr+1][_dc+1]=41; // 아래오른쪽
  }
}
/* Doors on right wall (EXIT) */
grid[10][COLS-1]=5;
grid[48][COLS-1]=5;
/* Bulletin board: second-to-last row */
for(var c=1;c<=COLS-2;c++) grid[ROWS-2][c]=7;
/* Corner plants */
grid[4][4]=9; grid[4][COLS-5]=9; grid[ROWS-6][4]=9; grid[ROWS-6][COLS-5]=9;

var WALK=[0,5];
function isWalk(t){return WALK.indexOf(t)>=0;}

var cv=document.getElementById('map');
var ctx=cv.getContext('2d');

/* Character data: URL param ?c= or localStorage */
var __savedChar=(function(){
  try{
    var _cp=new URLSearchParams(window.location.search).get('c');
    if(_cp) return JSON.parse(_cp);
    return JSON.parse(localStorage.getItem('ssambus_player_character'));
  }catch(e){return null;}
})();
var PLAYER=Object.assign({
  type:'student',skin:'#FDEBD0',hcolor:'#1a1008',hair:'short',
  ccolor:'#1a3a6b',cloth:'suit',gender:'male',acc:[],dir:'down'
},__savedChar||{});
function renderPlayer(){
  document.getElementById('cg_p').innerHTML=renderCharacterSVG(PLAYER);
  document.getElementById('player').classList.toggle('flip',PLAYER.dir==='left'&&!PLAYER._facingRight);
}

/* Floor: warm parquet wood */
function drawFloor(x,y,c,r){
  ctx.fillStyle=((c+r)%2===0)?'#d4a96a':'#c9a060';
  ctx.fillRect(x,y,TS,TS);
  ctx.strokeStyle='rgba(100,60,10,0.15)';
  ctx.lineWidth=1;
  for(var i=0;i<4;i++){
    ctx.beginPath();
    ctx.moveTo(x,y+i*13+4); ctx.lineTo(x+TS,y+i*13+4);
    ctx.stroke();
  }
  ctx.strokeStyle='rgba(120,80,20,0.18)';
  ctx.lineWidth=0.5;
  ctx.strokeRect(x+0.5,y+0.5,TS-1,TS-1);
}

/* Wall: cream with subtle panel */
function drawWall(x,y){
  var grad=ctx.createLinearGradient(x,y,x,y+TS);
  grad.addColorStop(0,'#e8ddd0');
  grad.addColorStop(1,'#d5c8b8');
  ctx.fillStyle=grad;
  ctx.fillRect(x,y,TS,TS);
  ctx.strokeStyle='rgba(80,60,40,0.12)';
  ctx.lineWidth=1;
  ctx.strokeRect(x+4,y+4,TS-8,TS-8);
}

/* Window drawn on wall (col 0) */
function drawWindow(x,y){
  drawWall(x,y);
  ctx.fillStyle='#aee0f5';
  ctx.fillRect(x+5,y+6,TS-10,TS-14);
  ctx.strokeStyle='#4a6fa5';
  ctx.lineWidth=2;
  ctx.strokeRect(x+5,y+6,TS-10,TS-14);
  ctx.beginPath();
  ctx.moveTo(x+TS/2,y+6); ctx.lineTo(x+TS/2,y+TS-8);
  ctx.moveTo(x+5,y+(TS-14)/2+6); ctx.lineTo(x+TS-5,y+(TS-14)/2+6);
  ctx.stroke();
  /* sky glare */
  ctx.fillStyle='rgba(255,255,255,0.3)';
  ctx.fillRect(x+7,y+8,TS/2-10,8);
}

/* Blackboard: vivid dark green with chalk marks */
function drawBlackboard(x,y){
  ctx.fillStyle='#1e5c3a';
  ctx.fillRect(x,y,TS,TS);
  ctx.strokeStyle='#2e8c5a';
  ctx.lineWidth=2;
  ctx.strokeRect(x+2,y+2,TS-4,TS-4);
  /* chalk lines */
  ctx.fillStyle='rgba(230,255,210,0.55)';
  ctx.fillRect(x+6,y+10,TS-12,3);
  ctx.fillRect(x+6,y+18,TS-18,3);
  ctx.fillRect(x+8,y+26,TS-20,3);
  /* chalk dust */
  ctx.fillStyle='rgba(210,255,190,0.25)';
  ctx.beginPath();
  ctx.arc(x+TS*0.6,y+TS*0.7,8,0,Math.PI*2);
  ctx.fill();
}

/* Large TV: 3-tile wide smart board (cols 0,1,2) */
function drawTV(x,y,col){
  ctx.fillStyle='#0d1a2a';
  ctx.fillRect(x,y,TS,TS);
  /* screen area per tile */
  var sx=x+(col===0?4:0), sw=TS-(col===0?4:0)-(col===2?4:0);
  ctx.fillStyle='#1040a0';
  ctx.fillRect(sx,y+4,sw,TS-8);
  /* screen content: horizontal lesson lines */
  ctx.fillStyle='rgba(140,210,255,0.55)';
  ctx.fillRect(sx+2,y+9,sw-4,4);
  ctx.fillStyle='rgba(140,210,255,0.3)';
  ctx.fillRect(sx+2,y+17,sw-6,3);
  ctx.fillRect(sx+2,y+24,sw-8,3);
  ctx.fillRect(sx+2,y+31,sw-4,3);
  /* center tile: class label overlay */
  if(col===1){
    ctx.fillStyle='rgba(255,255,255,0.92)';
    ctx.font='bold 13px sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('SMART TV',x+TS/2,y+TS/2+2);
    ctx.fillStyle='rgba(255,255,255,0.15)';
    ctx.fillRect(sx,y+4,sw,TS*0.35);
  }
  /* frame border */
  if(col===0){
    ctx.fillStyle='#0a1018';
    ctx.fillRect(x,y,4,TS);
    ctx.fillRect(x,y,TS,4);
    ctx.fillRect(x,y+TS-4,TS,4);
  } else if(col===2){
    ctx.fillStyle='#0a1018';
    ctx.fillRect(x+TS-4,y,4,TS);
    ctx.fillRect(x,y,TS,4);
    ctx.fillRect(x,y+TS-4,TS,4);
    /* wall mount bracket */
    ctx.fillStyle='#555';
    ctx.fillRect(x+TS-4,y+16,6,16);
    /* power LED */
    ctx.fillStyle='#00ff88';
    ctx.beginPath();
    ctx.arc(x+TS-8,y+TS-8,3,0,Math.PI*2);
    ctx.fill();
  } else {
    ctx.fillStyle='#0a1018';
    ctx.fillRect(x,y,TS,4);
    ctx.fillRect(x,y+TS-4,TS,4);
  }
}

/* Teacher desk: dark rich wood */
function drawTeacherDesk(x,y){
  ctx.shadowColor='rgba(0,0,0,0.45)';ctx.shadowBlur=0;ctx.shadowOffsetX=5;ctx.shadowOffsetY=5;
  ctx.fillStyle='#5a3010';
  ctx.fillRect(x,y,TS,TS);
  ctx.fillStyle='#8b5e3c';
  ctx.fillRect(x+2,y+5,TS-4,TS*0.5);
  ctx.strokeStyle='rgba(40,20,0,0.3)';
  ctx.lineWidth=1;
  for(var i=0;i<3;i++){
    ctx.beginPath(); ctx.moveTo(x+5,y+9+i*8); ctx.lineTo(x+TS-5,y+9+i*8); ctx.stroke();
  }
  /* papers on desk */
  ctx.fillStyle='rgba(255,255,240,0.85)';
  ctx.fillRect(x+5,y+8,14,11);
  ctx.fillRect(x+TS-19,y+8,14,11);
  /* pencil holder */
  ctx.fillStyle='#e74c3c';
  ctx.fillRect(x+TS/2-3,y+9,6,10);
  ctx.shadowColor='transparent';
}

/* Student desk: warm wood, 2×2 tiles */
function drawStudentDesk(x,y){
  var W=TS*2,H=TS*2;
  ctx.shadowColor='rgba(0,0,0,0.45)';ctx.shadowBlur=0;ctx.shadowOffsetX=7;ctx.shadowOffsetY=7;
  /* 책상 본체 */
  ctx.fillStyle='#8a5520';
  ctx.fillRect(x,y,W,H);
  /* 상판 밝은 면 */
  ctx.fillStyle='#c8a06e';
  ctx.fillRect(x+3,y+8,W-6,H*0.42);
  /* 나무결 */
  ctx.strokeStyle='rgba(80,50,10,0.2)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x+6,y+18); ctx.lineTo(x+W-6,y+18); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+6,y+30); ctx.lineTo(x+W-6,y+30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+6,y+42); ctx.lineTo(x+W-6,y+42); ctx.stroke();
  /* 책 */
  ctx.fillStyle='#e74c3c';
  ctx.fillRect(x+12,y+14,20,26);
  ctx.fillStyle='#c0392b';
  ctx.fillRect(x+12,y+14,4,26);
  ctx.fillStyle='rgba(255,255,255,0.15)';
  ctx.fillRect(x+17,y+15,12,3);
  /* 필통 */
  ctx.fillStyle='#2980b9';
  ctx.fillRect(x+W-38,y+14,16,22);
  ctx.fillStyle='#1a5276';
  ctx.fillRect(x+W-38,y+14,16,4);
  /* 연필 */
  ctx.fillStyle='#f1c40f';
  ctx.fillRect(x+W-18,y+14,5,22);
  ctx.fillStyle='#e67e22';
  ctx.beginPath();
  ctx.moveTo(x+W-18,y+36); ctx.lineTo(x+W-13,y+36); ctx.lineTo(x+W-15.5,y+42);
  ctx.closePath(); ctx.fill();
  ctx.shadowColor='transparent';
}

/* Door: vivid green EXIT marker */
function drawDoor(x,y){
  ctx.shadowColor='rgba(0,0,0,0.45)';ctx.shadowBlur=0;ctx.shadowOffsetX=5;ctx.shadowOffsetY=5;
  /* orange frame */
  ctx.fillStyle='#e67e22';
  ctx.fillRect(x,y,TS,TS);
  /* green door panel */
  ctx.fillStyle='#27ae60';
  ctx.fillRect(x+5,y+3,TS-10,TS-6);
  /* EXIT label */
  ctx.fillStyle='#ffffff';
  ctx.font='bold 9px sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('EXIT',x+TS/2,y+TS*0.38);
  /* arrow pointing right */
  ctx.strokeStyle='#ffffff';
  ctx.lineWidth=2.5;
  ctx.beginPath();
  ctx.moveTo(x+12,y+TS*0.62);
  ctx.lineTo(x+TS-8,y+TS*0.62);
  ctx.moveTo(x+TS-14,y+TS*0.62-6);
  ctx.lineTo(x+TS-8,y+TS*0.62);
  ctx.lineTo(x+TS-14,y+TS*0.62+6);
  ctx.stroke();
  /* handle */
  ctx.fillStyle='#f1c40f';
  ctx.beginPath();
  ctx.arc(x+10,y+TS*0.5,3.5,0,Math.PI*2);
  ctx.fill();
  /* bright glow border */
  ctx.strokeStyle='#f1c40f';
  ctx.lineWidth=2;
  ctx.strokeRect(x+5,y+3,TS-10,TS-6);
  ctx.shadowColor='transparent';
}

/* Bulletin board: cork with colorful papers */
var PAPER_COLORS=['#e74c3c','#3498db','#f1c40f','#2ecc71','#e67e22','#9b59b6','#1abc9c','#e91e63'];
function drawBulletin(x,y,c){
  ctx.shadowColor='rgba(0,0,0,0.45)';ctx.shadowBlur=0;ctx.shadowOffsetX=5;ctx.shadowOffsetY=5;
  ctx.fillStyle='#b8860b';
  ctx.fillRect(x,y,TS,TS);
  ctx.fillStyle='rgba(180,130,0,0.3)';
  for(var di=0;di<3;di++){
    for(var dj=0;dj<3;dj++){
      ctx.fillRect(x+di*7+3,y+dj*7+3,5,5);
    }
  }
  var pc=PAPER_COLORS[c%8];
  ctx.fillStyle=pc;
  ctx.fillRect(x+4,y+5,TS-8,TS*0.58);
  ctx.strokeStyle='rgba(255,255,255,0.45)';
  ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x+7,y+11); ctx.lineTo(x+TS-7,y+11); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+7,y+17); ctx.lineTo(x+TS-9,y+17); ctx.stroke();
  /* thumbtack */
  ctx.fillStyle='#e74c3c';
  ctx.beginPath(); ctx.arc(x+TS/2,y+6,3,0,Math.PI*2); ctx.fill();
  ctx.shadowColor='transparent';
}

/* Plant: pot with leaves */
function drawPlant(x,y){
  /* background floor */
  ctx.fillStyle='#c9a060';
  ctx.fillRect(x,y,TS,TS);
  ctx.shadowColor='rgba(0,0,0,0.45)';ctx.shadowBlur=0;ctx.shadowOffsetX=5;ctx.shadowOffsetY=5;
  /* pot */
  ctx.fillStyle='#8B4513';
  ctx.fillRect(x+12,y+TS*0.6,TS-24,TS*0.34);
  ctx.fillStyle='#a0522d';
  ctx.fillRect(x+10,y+TS*0.6-4,TS-20,5);
  /* leaves */
  ctx.fillStyle='#27ae60';
  ctx.beginPath(); ctx.ellipse(x+TS/2,y+TS*0.44,12,18,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#2ecc71';
  ctx.beginPath(); ctx.ellipse(x+TS/2-8,y+TS*0.38,8,13,-0.4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+TS/2+8,y+TS*0.36,8,13,0.4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#58d68d';
  ctx.beginPath(); ctx.ellipse(x+TS/2,y+TS*0.3,6,10,0,0,Math.PI*2); ctx.fill();
  /* flower */
  ctx.fillStyle='#f1c40f';
  ctx.beginPath(); ctx.arc(x+TS/2+4,y+TS*0.28,4,0,Math.PI*2); ctx.fill();
  ctx.shadowColor='transparent';
}

/* Window rows (every 8 rows on left wall) */
var WIN_ROWS=[5,13,21,29,37,45,53];

function drawMap(){
  for(var r=0;r<ROWS;r++){
    for(var c=0;c<COLS;c++){
      var x=c*TS,y=r*TS,t=grid[r][c];
      if(t===1){
        /* windows on left wall */
        if(c===0&&WIN_ROWS.indexOf(r)>=0) drawWindow(x,y);
        else drawWall(x,y);
      }
      else if(t===2) drawBlackboard(x,y);
      else if(t===3) drawTeacherDesk(x,y);
      else if(t===4) drawStudentDesk(x,y);
      else if(t===41){ /* 책상 연속 타일 – anchor에서 이미 그림 */ }
      else if(t===5) drawDoor(x,y);
      else if(t===7) drawBulletin(x,y,c);
      else if(t===8) drawTV(x,y,c);
      else if(t===9) drawPlant(x,y);
      else drawFloor(x,y,c,r);
    }
  }
  /* 45-degree drop shadows */
  ctx.fillStyle='rgba(0,0,0,0.30)';
  for(var __r=0;__r<ROWS;__r++){for(var __c=0;__c<COLS;__c++){
    if(isWalk(grid[__r][__c])) continue;
    var __x=__c*TS,__y=__r*TS;
    if((__c+1<COLS)&&isWalk(grid[__r][__c+1])&&grid[__r][__c+1]!==5) ctx.fillRect(__x+TS,__y+5,6,TS);
    if((__r+1<ROWS)&&isWalk(grid[__r+1][__c])&&grid[__r+1][__c]!==5) ctx.fillRect(__x+5,__y+TS,TS,6);
  }}
}
drawMap();

function updateCamera(){var _sw=document.querySelector('.stage-wrap');var _vw=_sw.clientWidth||VIEW_W;var _vh=_sw.clientHeight||VIEW_H;
  if(TEACHER_VIEW){
    var wrap=document.querySelector('.stage-wrap');
    wrap.style.width=(COLS*TS)+'px';
    wrap.style.height=(ROWS*TS)+'px';
    wrap.style.overflow='visible';
    return;
  }
  var stage=document.querySelector('.stage');
  var offX=Math.max(0,Math.min(pos.c*TS-_vw/2+TS/2,COLS*TS-_vw));
  var offY=Math.max(0,Math.min(pos.r*TS-_vh/2+TS/2,ROWS*TS-_vh));
  stage.style.transform='translate(-'+offX+'px,-'+offY+'px)';
}

var pos={r:6,c:30};
function placePlayer(){
  var el=document.getElementById('player');
  if(TEACHER_VIEW) el.style.display='none';
  el.style.left=(pos.c*TS)+'px';
  el.style.top=(pos.r*TS-24)+'px';
  updateCamera();
  try{broadcastMyPosition();}catch(e){}
  try{checkZoneOnMove(pos);}catch(e){}
}
function move(dir){
  var nr=pos.r,nc=pos.c;
  if(dir==='up') nr--;
  else if(dir==='down') nr++;
  else if(dir==='left') nc--;
  else if(dir==='right') nc++;
  PLAYER._facingRight=(dir==='right');
  PLAYER.dir=(dir==='right')?'left':dir;
  renderPlayer();
  if(nr<0||nr>=ROWS||nc<0||nc>=COLS) return;
  if(!isWalk(grid[nr][nc])) return;
  try{if(__rtIsOverlayBlocked(nr,nc)) return;}catch(e){}
  try{if(__rtIsTileOccupied(nr,nc)) return;}catch(e){}
  try{if(typeof __msBlockExit==='function'&&__msBlockExit(nr,nc)){__msShowBlockedNotice();return;}}catch(e){}
  pos.r=nr; pos.c=nc;
  placePlayer();
}
window.addEventListener('keydown',function(e){
  if(TEACHER_VIEW) return;
  var m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
  if(m[e.key]){e.preventDefault();move(m[e.key]);}
});
if(!TEACHER_VIEW){
  var sw=document.querySelector('.stage-wrap');
  var tx=0,ty=0,ta=false;
  sw.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;ta=true;tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
  sw.addEventListener('touchmove',function(e){if(ta)e.preventDefault();},{passive:false});
  sw.addEventListener('touchend',function(e){
    if(!ta)return;ta=false;
    var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
    if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;
    if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');
    else move(dy>0?'down':'up');
  },{passive:true});
}
renderPlayer();
try{placePlayer();}catch(e){console.warn('[classroom] placePlayer:',e);}
try{initRealtime('classroom');}catch(e){console.warn('[classroom] realtime:',e);}
if(!TEACHER_VIEW){
  try{initMissionSystem('classroom');}catch(e){console.warn('[classroom] missions:',e);}
}
try{loadMapOverlays('classroom',ctx,TS);}catch(e){console.warn('[classroom] overlays:',e);}
window.addEventListener('resize',updateCamera);
</script>
