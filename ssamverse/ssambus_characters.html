<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>쌤버스 캐릭터 시스템</title>
<style>
body{font-family:sans-serif;padding:20px;background:#fff}
.wrap{display:flex;gap:1.5rem;padding:1rem 0;flex-wrap:wrap}
.preview{display:flex;flex-direction:column;align-items:center;gap:.8rem;min-width:180px}
.opts{flex:1;min-width:260px}
.og{margin-bottom:1rem}
.ol{font-size:12px;color:#666;margin-bottom:6px;display:block}
.sr{display:flex;gap:5px;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0}
.sw.on{border-color:#000}
.sb{padding:3px 9px;font-size:11px;border-radius:6px;cursor:pointer;border:1px solid #ccc;background:#fff;margin-bottom:3px}
.sb.on{background:#eee;border-color:#999}
.ab{padding:3px 9px;font-size:11px;border-radius:6px;cursor:pointer;border:1px solid #ccc;background:#fff;margin-bottom:3px}
.ab.on{background:#eee;border-color:#999;font-weight:500}
.dr{display:flex;gap:6px;margin-top:6px}
.tabs{display:flex;gap:8px;margin-bottom:1rem}
.tab{padding:5px 16px;font-size:13px;border-radius:6px;cursor:pointer;border:1px solid #ccc;background:#fff}
.tab.on{background:#eee;border-color:#999;font-weight:500}
.section{display:none}
.section.on{display:block}
.enter-bar{display:flex;align-items:center;gap:8px;margin-bottom:1rem;padding:10px 12px;background:#f5f5f5;border-radius:8px;flex-wrap:wrap}
.enter-bar select{padding:5px 8px;border-radius:6px;border:1px solid #ccc;font-size:13px}
.enter-bar button{padding:7px 16px;border-radius:6px;border:none;background:#2c3e50;color:#fff;font-size:13px;font-weight:500;cursor:pointer}
.enter-bar button:hover{background:#1a252f}
#nicknameInput{padding:6px 10px;border-radius:6px;border:2px solid #3498db;font-size:13px;width:140px;outline:none}
#nicknameInput:focus{border-color:#1a5276}
.nick-label{font-size:13px;color:#444;font-weight:500;white-space:nowrap}
</style>
</head>
<body>

<div id="welcomeBanner" style="display:none;background:#eaf4ff;border:1px solid #b8dcff;border-radius:8px;padding:10px 14px;margin-bottom:1rem;font-size:13px;color:#1a5276">
  🎨 나만의 캐릭터를 자유롭게 꾸민 뒤, <b>"이 캐릭터로 입장하기"</b> 버튼을 눌러 교실로 입장하세요!
</div>

<div class="enter-bar">
  <span class="nick-label">이름:</span>
  <input type="text" id="nicknameInput" placeholder="이름을 입력하세요" maxlength="10" autocomplete="off">
  <label>교실: <select id="mapSelect">
    <option value="ssambus_map_classroom.html">일반 교실</option>
    <option value="ssambus_map_library.html">도서관</option>
    <option value="ssambus_map_playground.html">운동장</option>
    <option value="ssambus_map_gym.html">체육관</option>
    <option value="ssambus_map_city.html">현대 도시</option>
    <option value="ssambus_map_forest.html">자연 숲</option>
  </select></label>
  <button onclick="enterMap()">이 캐릭터로 입장하기</button>
</div>

<div class="tabs">
  <button class="tab on" onclick="switchTab('student',this)">교복 캐릭터</button>
  <button class="tab" onclick="switchTab('teacher',this)">교사 캐릭터</button>
  <button class="tab" onclick="switchTab('fantasy',this)">판타지 캐릭터</button>
</div>

<script src="ssambus_character_render.js"></script>
<script>
var ST={
  s:{skin:'#FDEBD0',hcolor:'#1a1008',hair:'short',ccolor:'#1a3a6b',acc:[],dir:'down',gender:'male'},
  t:{skin:'#FDEBD0',hcolor:'#1a1008',hair:'short',cloth:'suit',ccolor:'#2C3E50',acc:[],dir:'down',gender:'male'},
  f:{skin:'#FDEBD0',hcolor:'#4A2E7A',hair:'short',cloth:'mage',ccolor:'#4A235A',acc:[],dir:'down',gender:'male'}
};
var TAB_MAP={student:'s',teacher:'t',fantasy:'f'};
var currentChar='s';
function switchTab(id,el){document.querySelectorAll('.tab').forEach(function(e){e.classList.remove('on')});document.querySelectorAll('.section').forEach(function(e){e.classList.remove('on')});el.classList.add('on');document.getElementById('S_'+id).classList.add('on');currentChar=TAB_MAP[id];}
function pickS(c,k,gid,el){ST[c][k]=el.dataset.v;document.querySelectorAll('#'+gid+' .sw').forEach(function(e){e.classList.remove('on')});el.classList.add('on');render(c);}
function pickB(c,k,gid,el){ST[c][k]=el.dataset.v;document.querySelectorAll('#'+gid+' .sb').forEach(function(e){e.classList.remove('on')});el.classList.add('on');render(c);}
function togAcc(c,el){var v=el.dataset.v,i=ST[c].acc.indexOf(v);if(i>-1){ST[c].acc.splice(i,1);el.classList.remove('on');}else{ST[c].acc.push(v);el.classList.add('on');}render(c);}
function setDir(c,el){ST[c].dir=el.dataset.d;var sid=c==='s'?'student':(c==='t'?'teacher':'fantasy');document.querySelectorAll('#S_'+sid+' .dr .sb').forEach(function(e){e.classList.remove('on')});el.classList.add('on');render(c);}
function enterMap(){
  var nickname = (document.getElementById('nicknameInput').value || '').trim();
  if(!nickname){ alert('이름을 입력해주세요.'); document.getElementById('nicknameInput').focus(); return; }

  var type = currentChar==='s'?'student':(currentChar==='t'?'teacher':'fantasy');
  var data = Object.assign({type:type}, ST[currentChar]);
  var charJson = JSON.stringify(data);

  try { sessionStorage.setItem('ssambus_nickname', nickname); } catch(e) {}
  try { localStorage.setItem('ssambus_player_character', charJson); } catch(e) {}

  var target = document.getElementById('mapSelect').value;
  var params = new URLSearchParams(window.location.search);
  params.delete('map');
  params.set('nickname', nickname);
  params.set('c', charJson);
  window.location.href = target + '?' + params.toString();
}

/* 학생 초대 링크로 들어온 경우, 원래 가려던 맵을 자동으로 선택하고 안내 문구를 보여줍니다 */
(function(){
  var params = new URLSearchParams(window.location.search);
  var targetMap = params.get('map');
  if(params.get('room')){
    document.getElementById('welcomeBanner').style.display = '';
  }
  if(targetMap){
    var select = document.getElementById('mapSelect');
    for(var i=0; i<select.options.length; i++){
      if(select.options[i].value === targetMap){ select.value = targetMap; break; }
    }
  }
  // URL 또는 sessionStorage에서 이름 복원
  var savedNick = params.get('nickname') || sessionStorage.getItem('ssambus_nickname') || '';
  if(savedNick) document.getElementById('nicknameInput').value = savedNick;
})();

function render(c){
  var s=ST[c];
  var type=c==='s'?'student':(c==='t'?'teacher':'fantasy');
  document.getElementById('cg_'+c).innerHTML=renderCharacterSVG(Object.assign({type:type},s));
}
render('s');
render('t');
render('f');
</script>
