<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>쌤버스 - 운동장 맵</title>
<style>
*{box-sizing:border-box}
body{font-family:sans-serif;background:#0a1a2e;display:flex;flex-direction:column;align-items:center;padding:20px;margin:0}
#main-btn{position:fixed;top:12px;left:12px;z-index:999;background:#f9ca24;color:#000;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);text-decoration:none}
h2{margin:.3rem 0;color:#fff;font-size:1.1rem}
.info{font-size:12px;color:#aaa;margin-bottom:12px;text-align:center}
.stage-wrap{width:768px;max-width:100%;height:672px;overflow:hidden;border:3px solid #f9ca24;border-radius:8px;box-shadow:0 0 24px rgba(249,202,36,0.4)}
.stage{position:relative;line-height:0}
#map{display:block}
#player{position:absolute;width:48px;height:72px;pointer-events:none;transition:left .1s linear,top .1s linear;z-index:5}
#player svg{display:block;width:100%;height:100%;overflow:visible}
#player.flip svg{transform:scaleX(-1)}
.remote-player{position:absolute;width:48px;height:72px;pointer-events:none;transition:left .15s linear,top .15s linear;z-index:4}
.remote-player svg{display:block;width:100%;height:100%;overflow:visible}
.remote-player.flip svg{transform:scaleX(-1)}
.remote-player .nick{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;background:rgba(255,255,255,.9);padding:1px 5px;border-radius:4px;white-space:nowrap;font-weight:600}
.pad{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px 52px;gap:4px;margin-top:14px}
.pad button{font-size:20px;border-radius:10px;border:none;background:#f9ca24;color:#000;cursor:pointer;font-weight:700;box-shadow:0 3px 0 #c09000}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 0 #c09000}
.legend{margin-top:10px;font-size:12px;color:#aaa;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.legend span{display:flex;align-items:center;gap:4px}
.sw{display:inline-block;width:13px;height:13px;border-radius:3px}
</style>
</head>
<body>
<a id="main-btn" href="index.html">메인</a>
<h2>쌤버스 - 운동장</h2>
<div class="info">방향키 또는 버튼으로 이동하세요</div>
<div class="stage-wrap">
<div class="stage">
  <canvas id="map" width="2688" height="1152"></canvas>
  <div id="player"><svg viewBox="0 0 60 76"><g id="cg_p"></g></svg></div>
  <div id="remote-players"></div>
</div>
</div>
<div class="pad">
  <div></div><button onclick="move('up')">&#8593;</button><div></div>
  <button onclick="move('left')">&#8592;</button><div></div><button onclick="move('right')">&#8594;</button>
  <div></div><button onclick="move('down')">&#8595;</button><div></div>
</div>
<div class="legend">
  <span><span class="sw" style="background:#1a8a30"></span>축구장 잔디</span>
  <span><span class="sw" style="background:#c8401a"></span>육상 트랙</span>
  <span><span class="sw" style="background:#3a3a4a"></span>펜스</span>
  <span><span class="sw" style="background:#ffffff;border:1px solid #666"></span>축구장 라인</span>
  <span><span class="sw" style="background:#27ae60"></span>출입구</span>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="ssambus_supabase_config.js"></script>
<script src="ssambus_character_render.js"></script>
<script src="ssambus_realtime.js"></script>
<script src="ssambus_missions.js"></script>
<script>
/* === Playground map 56x24 — Soccer field === */
var TS=48,COLS=56,ROWS=24,VIEW_W=768,VIEW_H=672;

var TEACHER_VIEW=new URLSearchParams(window.location.search).get('teacherView')==='1';
if(TEACHER_VIEW){
  document.body.style.padding='0';
  document.body.style.background='transparent';
  document.querySelectorAll('h2,.info,.pad,.legend').forEach(function(el){el.style.display='none';});
}

/* Tile: 1=fence 2=running-track 3=grass(soccer field) 5=exit-gate */
var grid=[];
for(var r=0;r<ROWS;r++){
  grid[r]=[];
  for(var c=0;c<COLS;c++){
    var isFence=(r===0||r===ROWS-1||c===0||c===COLS-1);
    var isTrack=(!isFence&&(r<=2||r>=ROWS-3||c<=2||c>=COLS-3));
    if(isFence) grid[r][c]=1;
    else if(isTrack) grid[r][c]=2;
    else grid[r][c]=3;
  }
}
/* Exit gate at top fence */
grid[0][27]=5; grid[0][28]=5;

var WALK=[2,3,5];
function isWalk(t){return WALK.indexOf(t)>=0;}

var cv=document.getElementById('map');
var ctx=cv.getContext('2d');

var __savedChar=(function(){
  try{
    var _cp=new URLSearchParams(window.location.search).get('c');
    if(_cp) return JSON.parse(_cp);
    return JSON.parse(localStorage.getItem('ssambus_player_character'));
  }catch(e){return null;}
})();
var PLAYER=Object.assign({
  type:'student',skin:'#FDEBD0',hcolor:'#1a1008',hair:'short',
  ccolor:'#1a3a6b',cloth:'suit',gender:'male',acc:[],dir:'down'
},__savedChar||{});
function renderPlayer(){
  document.getElementById('cg_p').innerHTML=renderCharacterSVG(PLAYER);
  document.getElementById('player').classList.toggle('flip',PLAYER.dir==='left'&&!PLAYER._facingRight);
}

/* Fence: dark metal chain-link */
function drawFence(x,y){
  ctx.fillStyle='#3a3a4a';
  ctx.fillRect(x,y,TS,TS);
  /* vertical steel posts */
  ctx.fillStyle='#5a5a6a';
  ctx.fillRect(x+TS/2-2,y,4,TS);
  /* chain-link diamond pattern */
  ctx.strokeStyle='rgba(180,180,200,0.45)';
  ctx.lineWidth=1;
  for(var i=0;i<4;i++){
    ctx.beginPath();
    ctx.moveTo(x,y+i*12+6); ctx.lineTo(x+TS,y+i*12+6);
    ctx.stroke();
  }
  for(var j=0;j<5;j++){
    ctx.beginPath();
    ctx.moveTo(x+j*12,y); ctx.lineTo(x+j*12,y+TS);
    ctx.stroke();
  }
}

/* Running track: vivid orange-red clay with white lane lines */
function drawTrack(x,y,c,r){
  /* alternating track strips */
  ctx.fillStyle=((c+r)%2===0)?'#c8401a':'#d94e28';
  ctx.fillRect(x,y,TS,TS);
  /* rubber texture dots */
  ctx.fillStyle='rgba(0,0,0,0.08)';
  var seed=c*7+r*11;
  for(var i=0;i<6;i++){
    ctx.beginPath();
    ctx.arc(x+4+((seed*13+i*23)%38),y+4+((seed*17+i*11)%38),2,0,Math.PI*2);
    ctx.fill();
  }
  /* lane divider line */
  if(r===1||r===ROWS-3){
    ctx.strokeStyle='rgba(255,255,255,0.7)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(x,y+TS-1); ctx.lineTo(x+TS,y+TS-1);
    ctx.stroke();
  }
  if(c===1||c===COLS-4){
    ctx.strokeStyle='rgba(255,255,255,0.7)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(x+TS-1,y); ctx.lineTo(x+TS-1,y+TS);
    ctx.stroke();
  }
}

/* Grass: stadium alternating green stripes */
function drawGrass(x,y,c,r){
  /* vertical stripes every 4 cols */
  var stripe=Math.floor((c-3)/4)%2;
  ctx.fillStyle=stripe===0?'#1a8a30':'#22a03a';
  ctx.fillRect(x,y,TS,TS);
  /* subtle blade texture */
  ctx.strokeStyle='rgba(255,255,255,0.04)';
  ctx.lineWidth=1;
  for(var i=0;i<3;i++){
    ctx.beginPath();
    ctx.moveTo(x+8+i*16,y+TS-6); ctx.lineTo(x+12+i*16,y+TS-14);
    ctx.stroke();
  }
}

/* Exit gate */
function drawExitGate(x,y){
  ctx.fillStyle='#3a3a4a';
  ctx.fillRect(x,y,TS,TS);
  ctx.fillStyle='#27ae60';
  ctx.fillRect(x+2,y,9,TS);
  ctx.fillRect(x+TS-11,y,9,TS);
  ctx.fillStyle='#2ecc71';
  ctx.fillRect(x+2,y,TS-4,10);
  ctx.fillStyle='#ffffff';
  ctx.font='bold 9px sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('EXIT',x+TS/2,y+TS*0.5);
  ctx.strokeStyle='#f1c40f';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(x+14,y+TS*0.72);
  ctx.lineTo(x+TS-8,y+TS*0.72);
  ctx.moveTo(x+TS-15,y+TS*0.62);
  ctx.lineTo(x+TS-8,y+TS*0.72);
  ctx.lineTo(x+TS-15,y+TS*0.82);
  ctx.stroke();
}

/* Soccer field lines drawn as canvas overlay */
function drawSoccerLines(){
  /* field canvas bounds (grass area: cols 3-52, rows 3-20) */
  var fx1=3*TS, fy1=3*TS;
  var fx2=53*TS, fy2=21*TS;
  var fw=fx2-fx1, fh=fy2-fy1;
  var cx=fx1+fw/2, cy=fy1+fh/2;

  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.92)';
  ctx.fillStyle='rgba(255,255,255,0.92)';
  ctx.lineWidth=4;
  ctx.lineCap='square';

  /* Field boundary */
  ctx.strokeRect(fx1,fy1,fw,fh);

  /* Center line */
  ctx.beginPath();
  ctx.moveTo(cx,fy1); ctx.lineTo(cx,fy2);
  ctx.stroke();

  /* Center circle (r=160px ≈ 3.3 tiles) */
  ctx.beginPath();
  ctx.arc(cx,cy,160,0,Math.PI*2);
  ctx.stroke();

  /* Center spot */
  ctx.beginPath();
  ctx.arc(cx,cy,8,0,Math.PI*2);
  ctx.fill();

  /* Penalty areas (300px wide × 460px tall from goal line) */
  var paW=300, paH=460;
  ctx.strokeRect(fx1,cy-paH/2,paW,paH);
  ctx.strokeRect(fx2-paW,cy-paH/2,paW,paH);

  /* Goal areas / 6-yard boxes (140px wide × 280px tall) */
  var gaW=140, gaH=280;
  ctx.strokeRect(fx1,cy-gaH/2,gaW,gaH);
  ctx.strokeRect(fx2-gaW,cy-gaH/2,gaW,gaH);

  /* Penalty spots (200px from goal line) */
  ctx.beginPath(); ctx.arc(fx1+200,cy,8,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(fx2-200,cy,8,0,Math.PI*2); ctx.fill();

  /* Penalty arc (D) */
  ctx.beginPath();
  ctx.arc(fx1+200,cy,160,Math.PI*1.75,Math.PI*0.25);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(fx2-200,cy,160,Math.PI*0.75,Math.PI*1.25);
  ctx.stroke();

  /* Corner arcs */
  ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(fx1,fy1,32,0,Math.PI/2); ctx.stroke();
  ctx.beginPath(); ctx.arc(fx2,fy1,32,Math.PI/2,Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.arc(fx1,fy2,32,-Math.PI/2,0); ctx.stroke();
  ctx.beginPath(); ctx.arc(fx2,fy2,32,Math.PI,-Math.PI/2); ctx.stroke();

  ctx.restore();
}

/* Soccer goals */
function drawGoals(){
  var fx1=3*TS, fx2=53*TS;
  var cy=(3*TS+21*TS)/2; /* vertical center of field */
  var gd=80; /* goal depth (pixels into track) */
  var gh=288; /* goal height */

  ctx.save();
  ctx.lineWidth=5;
  ctx.strokeStyle='#ffffff';
  ctx.fillStyle='rgba(255,255,255,0.12)';

  /* Left goal */
  ctx.beginPath();
  ctx.moveTo(fx1,cy-gh/2);
  ctx.lineTo(fx1-gd,cy-gh/2);
  ctx.lineTo(fx1-gd,cy+gh/2);
  ctx.lineTo(fx1,cy+gh/2);
  ctx.stroke();
  /* net fill */
  ctx.fillRect(fx1-gd,cy-gh/2,gd,gh);
  /* net lines */
  ctx.strokeStyle='rgba(255,255,255,0.35)';
  ctx.lineWidth=1.5;
  for(var ny=cy-gh/2;ny<cy+gh/2;ny+=24){
    ctx.beginPath(); ctx.moveTo(fx1-gd,ny); ctx.lineTo(fx1,ny); ctx.stroke();
  }
  for(var nx=fx1-gd;nx<=fx1;nx+=20){
    ctx.beginPath(); ctx.moveTo(nx,cy-gh/2); ctx.lineTo(nx,cy+gh/2); ctx.stroke();
  }
  /* post caps */
  ctx.fillStyle='#ffffff';
  ctx.strokeStyle='#ffffff';
  ctx.lineWidth=5;
  ctx.beginPath(); ctx.arc(fx1,cy-gh/2,5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(fx1,cy+gh/2,5,0,Math.PI*2); ctx.fill();

  /* Right goal */
  ctx.strokeStyle='#ffffff';
  ctx.fillStyle='rgba(255,255,255,0.12)';
  ctx.lineWidth=5;
  ctx.beginPath();
  ctx.moveTo(fx2,cy-gh/2);
  ctx.lineTo(fx2+gd,cy-gh/2);
  ctx.lineTo(fx2+gd,cy+gh/2);
  ctx.lineTo(fx2,cy+gh/2);
  ctx.stroke();
  ctx.fillRect(fx2,cy-gh/2,gd,gh);
  ctx.strokeStyle='rgba(255,255,255,0.35)';
  ctx.lineWidth=1.5;
  for(var ny2=cy-gh/2;ny2<cy+gh/2;ny2+=24){
    ctx.beginPath(); ctx.moveTo(fx2,ny2); ctx.lineTo(fx2+gd,ny2); ctx.stroke();
  }
  for(var nx2=fx2;nx2<=fx2+gd;nx2+=20){
    ctx.beginPath(); ctx.moveTo(nx2,cy-gh/2); ctx.lineTo(nx2,cy+gh/2); ctx.stroke();
  }
  ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.arc(fx2,cy-gh/2,5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(fx2,cy+gh/2,5,0,Math.PI*2); ctx.fill();

  ctx.restore();
}

function drawMap(){
  for(var r=0;r<ROWS;r++){
    for(var c=0;c<COLS;c++){
      var x=c*TS,y=r*TS,t=grid[r][c];
      if(t===1) drawFence(x,y);
      else if(t===5) drawExitGate(x,y);
      else if(t===2) drawTrack(x,y,c,r);
      else drawGrass(x,y,c,r);
    }
  }
  /* Soccer field markings drawn on top of grass tiles */
  drawSoccerLines();
  drawGoals();
}
drawMap();

function updateCamera(){
  var stage=document.querySelector('.stage');
  var offX=Math.max(0,Math.min(pos.c*TS-VIEW_W/2+TS/2,COLS*TS-VIEW_W));
  var offY=Math.max(0,Math.min(pos.r*TS-VIEW_H/2+TS/2,ROWS*TS-VIEW_H));
  stage.style.transform='translate(-'+offX+'px,-'+offY+'px)';
}

var pos={r:11,c:27};
function placePlayer(){
  var el=document.getElementById('player');
  if(TEACHER_VIEW) el.style.display='none';
  el.style.left=(pos.c*TS)+'px';
  el.style.top=(pos.r*TS-24)+'px';
  updateCamera();
  try{broadcastMyPosition();}catch(e){}
  try{checkZoneOnMove(pos);}catch(e){}
}
function move(dir){
  var nr=pos.r,nc=pos.c;
  if(dir==='up') nr--;
  else if(dir==='down') nr++;
  else if(dir==='left') nc--;
  else if(dir==='right') nc++;
  PLAYER._facingRight=(dir==='right');
  PLAYER.dir=(dir==='right')?'left':dir;
  renderPlayer();
  if(nr<0||nr>=ROWS||nc<0||nc>=COLS) return;
  if(!isWalk(grid[nr][nc])) return;
  try{if(__rtIsOverlayBlocked(nr,nc)) return;}catch(e){}
  try{if(typeof __msBlockExit==='function'&&__msBlockExit(nr,nc)){__msShowBlockedNotice();return;}}catch(e){}
  pos.r=nr; pos.c=nc;
  placePlayer();
}
window.addEventListener('keydown',function(e){
  if(TEACHER_VIEW) return;
  var m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
  if(m[e.key]){e.preventDefault();move(m[e.key]);}
});
if(!TEACHER_VIEW){
  var sw=document.querySelector('.stage-wrap');
  var tx=0,ty=0,ta=false;
  sw.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;ta=true;tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
  sw.addEventListener('touchmove',function(e){if(ta)e.preventDefault();},{passive:false});
  sw.addEventListener('touchend',function(e){
    if(!ta)return;ta=false;
    var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
    if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;
    if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');
    else move(dy>0?'down':'up');
  },{passive:true});
}
renderPlayer();
try{placePlayer();}catch(e){console.warn('[playground] placePlayer:',e);}
try{initRealtime('playground');}catch(e){console.warn('[playground] realtime:',e);}
if(!TEACHER_VIEW){
  try{initMissionSystem('playground');}catch(e){console.warn('[playground] missions:',e);}
  try{loadMapOverlays('playground',ctx,TS);}catch(e){console.warn('[playground] overlays:',e);}
}
</script>
</body>
</html>
