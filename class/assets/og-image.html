<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>수업서랍 썸네일 원본 (1200×630)</title>
<!-- 이 파일을 고친 뒤 크롬 헤드리스로 다시 찍으면 og-image.png 가 갱신됩니다 (PRD 부록 참고) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #1E2330; --ink-2: #555C6B; --ink-3: #9299A6; --line: #ECE6DC;
    --time: #FF8A65; --time-soft: #FFF0EA; --pick: #8B7CF6; --pick-soft: #F1EEFF;
    --team: #2FBF9B; --team-soft: #E4F7F1; --mood: #4A9EF5; --mood-soft: #E9F3FF; --share: #F2AE2E; --share-soft: #FFF5DD;
  }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: 'Pretendard Variable', Pretendard, sans-serif; background: #FAF7F2; color: var(--ink); position: relative; letter-spacing: -0.02em; }
  .blob { position: absolute; border-radius: 50%; filter: blur(80px); }
  .b1 { width: 560px; height: 560px; background: #FFDCCF; left: -200px; top: -240px; opacity: .9; }
  .b2 { width: 520px; height: 520px; background: #E7E2FF; right: -120px; top: -140px; opacity: .9; }
  .b3 { width: 520px; height: 420px; background: #D6F3E8; right: 160px; bottom: -260px; opacity: .9; }
  .grain { position: absolute; inset: 0; background-image: radial-gradient(rgba(0,0,0,.035) 1px, transparent 1px); background-size: 22px 22px; mask-image: linear-gradient(90deg, transparent, #000 40%, #000 60%, transparent); }

  .left { position: absolute; left: 72px; top: 64px; width: 520px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 54px; height: 54px; }
  .brand b { font-size: 28px; font-weight: 800; letter-spacing: -0.04em; display: block; }
  .brand small { font-family: Outfit, sans-serif; font-size: 12.5px; font-weight: 600; letter-spacing: .28em; color: var(--ink-3); }
  h1 { margin-top: 58px; font-size: 76px; line-height: 1.12; font-weight: 800; letter-spacing: -0.055em; }
  h1 em { font-style: normal; background: linear-gradient(120deg, #FF8C6B, #E85E3F 70%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 26px; font-size: 23px; line-height: 1.55; color: var(--ink-2); font-weight: 500; }
  .sub b { color: var(--ink); font-weight: 700; }
  .chips { position: absolute; left: 72px; bottom: 58px; display: flex; gap: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px 0 12px; border-radius: 999px; background: #fff; border: 1px solid var(--line); font-size: 17px; font-weight: 700; box-shadow: 0 2px 8px rgba(60,44,20,.05); }
  .chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }

  /* 오른쪽: 나란히 쓰는 화면 */
  .win { position: absolute; right: 64px; top: 118px; width: 540px; height: 372px; background: rgba(255,255,255,.72); border: 1px solid #fff; border-radius: 28px; box-shadow: 0 30px 70px -20px rgba(90,60,30,.28), 0 0 0 1px rgba(236,230,220,.9); padding: 16px; display: grid; grid-template-columns: 1.08fr 1fr; gap: 12px; backdrop-filter: blur(8px); }
  .pane { background: #fff; border-radius: 20px; border: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; }
  .ph { display: flex; align-items: center; gap: 8px; padding: 11px 14px; font-size: 15px; font-weight: 800; background: linear-gradient(180deg, var(--cs), #fff); border-bottom: 1px solid var(--line); }
  .ph span { width: 24px; height: 24px; border-radius: 8px; background: #fff; display: grid; place-items: center; color: var(--c); box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .ph svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .teams { flex: 1; padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .tm { border-radius: 14px; border: 1px solid var(--line); position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .tm::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--c); }
  .tm b { font-size: 13px; font-weight: 800; }
  .tm strong { font-family: Outfit, sans-serif; font-size: 40px; font-weight: 600; line-height: 1; color: var(--c); letter-spacing: -0.03em; }
  .tm .crown { position: absolute; left: 9px; top: 10px; width: 16px; height: 16px; stroke: #D99A0B; fill: none; stroke-width: 2; stroke-linejoin: round; }
  .timer { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .ring { position: relative; width: 176px; height: 176px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring div { position: absolute; inset: 0; display: grid; place-items: center; font-family: Outfit, sans-serif; font-size: 44px; font-weight: 600; letter-spacing: -0.03em; }
  .play { height: 38px; padding: 0 22px; border-radius: 12px; background: var(--time); color: #fff; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; box-shadow: 0 8px 16px rgba(255,138,101,.3); }

  .float { position: absolute; width: 64px; height: 64px; border-radius: 20px; background: #fff; display: grid; place-items: center; color: var(--c); box-shadow: 0 14px 30px rgba(90,60,30,.14); }
  .float::before { content: ''; position: absolute; inset: 6px; border-radius: 15px; background: var(--cs); }
  .float svg { position: relative; width: 30px; height: 30px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .f1 { right: 560px; top: 88px; transform: rotate(-8deg); }
  .f2 { right: 36px; top: 70px; transform: rotate(9deg); width: 58px; height: 58px; }
  .f3 { right: 548px; top: 440px; transform: rotate(7deg); width: 58px; height: 58px; }
  .f4 { right: 90px; top: 500px; transform: rotate(-6deg); }
  .plus { position: absolute; right: 322px; top: 504px; font-size: 16px; font-weight: 700; color: var(--ink-2); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; box-shadow: 0 6px 18px rgba(60,44,20,.08); display: flex; gap: 8px; align-items: center; }
  .plus em { font-style: normal; color: #E85E3F; font-weight: 800; }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grain"></div>

  <div class="left">
    <div class="brand"><img src="favicon.svg" alt=""><div><b>수업서랍</b><small>CLASS DRAWER</small></div></div>
    <h1>꺼내면 바로,<br><em>수업이 됩니다.</em></h1>
    <p class="sub">교실에 필요한 <b>19가지 수업 도구</b>를<br>한 서랍에 담고, <b>한 화면에 나란히</b> 띄워요.</p>
  </div>
  <div class="chips">
    <span class="chip" style="--c:var(--time)"><i></i>시간</span>
    <span class="chip" style="--c:var(--pick)"><i></i>뽑기</span>
    <span class="chip" style="--c:var(--team)"><i></i>모둠·점수</span>
    <span class="chip" style="--c:var(--mood)"><i></i>교실 분위기</span>
    <span class="chip" style="--c:var(--share)"><i></i>나눔</span>
  </div>

  <div class="win">
    <div class="pane" style="--c:var(--team);--cs:var(--team-soft)">
      <div class="ph"><span><svg viewBox="0 0 24 24"><path d="M8 21h8M12 16.5V21"/><path d="M7 3.5h10v5.5a5 5 0 0 1-10 0z"/><path d="M17 5.5h3v1.5a3.5 3.5 0 0 1-3.2 3.5M7 5.5H4v1.5a3.5 3.5 0 0 0 3.2 3.5"/></svg></span>점수판</div>
      <div class="teams">
        <div class="tm" style="--c:#FF8A65"><svg class="crown" viewBox="0 0 24 24"><path d="M3.5 8l4 3.5L12 5l4.5 6.5 4-3.5-1.8 10.5H5.3z"/></svg><b>해바라기</b><strong>12</strong></div>
        <div class="tm" style="--c:#8B7CF6"><b>무지개</b><strong>9</strong></div>
        <div class="tm" style="--c:#2FBF9B"><b>새싹</b><strong>8</strong></div>
        <div class="tm" style="--c:#4A9EF5"><b>파도</b><strong>6</strong></div>
      </div>
    </div>
    <div class="pane" style="--c:var(--time);--cs:var(--time-soft)">
      <div class="ph"><span><svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.6 2"/><path d="M9.5 2.5h5"/></svg></span>타이머</div>
      <div class="timer">
        <div class="ring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" fill="none" stroke="#FFF0EA" stroke-width="14"/><circle cx="100" cy="100" r="88" fill="none" stroke="#FF8A65" stroke-width="14" stroke-linecap="round" stroke-dasharray="553" stroke-dashoffset="190"/></svg><div>03:00</div></div>
        <div class="play">▶ 진행 중</div>
      </div>
    </div>
  </div>

  <div class="float f1" style="--c:var(--pick);--cs:var(--pick-soft)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.2"/><path d="M12 3v6.8M19.8 16.5l-5.9-3.4M4.2 16.5l5.9-3.4"/></svg></div>
  <div class="float f2" style="--c:var(--pick);--cs:var(--pick-soft)"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20.5a7 7 0 0 1 14 0"/><path d="M19.5 2.5v3.5M17.75 4.25h3.5"/></svg></div>
  <div class="float f3" style="--c:var(--mood);--cs:var(--mood-soft)"><svg viewBox="0 0 24 24"><path d="M3.5 16.5a8.5 8.5 0 1 1 17 0"/><path d="M12 16.5l4.2-5.2"/><circle cx="12" cy="16.5" r="1.4"/></svg></div>
  <div class="float f4" style="--c:var(--share);--cs:var(--share-soft)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><path d="M14 14h3v3h-3zM20 17.5V21h-3.5"/></svg></div>
  <div class="plus">점수판 <em>+</em> 타이머, 한 화면에</div>
</body>
</html>
