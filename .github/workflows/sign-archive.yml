name: "sign: Archive Old Signatures"

# 2개월(기본값 60일)이 지난 서명 기록을 각 기관 자신의 구글 드라이브로
# 백업(엑셀 저장 + 이메일 알림)한 뒤 Supabase에서 삭제해 DB 용량을 가볍게 유지한다.
# hirame-ki.github.io 저장소는 여러 프로젝트가 같이 있으므로 시크릿 이름은
# "SIGN_" 접두사로 다른 프로젝트와 구분한다.

on:
  schedule:
    - cron: '0 4 * * 1'   # 매주 월요일 UTC 04:00 (KST 오후 1시)
  workflow_dispatch: {}

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 기관별 아카이브 실행
        env:
          SUPABASE_URL: ${{ secrets.SIGN_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SIGN_SUPABASE_SERVICE_ROLE_KEY }}
          ARCHIVE_DAYS: '60'
        run: node .github/scripts/sign-run-archive.mjs
