<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; font-size: 14px; color: #17202c; margin: 0; padding: 4px 6px; }
    h3 { font-size: 14px; color: #1d5bb5; margin: 16px 0 8px; border-bottom: 1px solid #e1e6ee; padding-bottom: 4px; }
    label { display: block; font-size: 12.5px; font-weight: 700; color: #5d6878; margin-bottom: 8px; }
    input, select { display: block; width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; padding: 7px 9px; border: 1px solid #c9d1dd; border-radius: 6px; margin-top: 3px; font-weight: 400; color: #17202c; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .levels label { border: 2px solid #c9d1dd; border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; color: #17202c; font-size: 14px; margin: 0; }
    .levels label.on { border-color: #1d5bb5; background: #e9f0fb; color: #1d5bb5; }
    .levels input { display: none; }
    .levels small { display: block; font-weight: 400; color: #5d6878; font-size: 11.5px; margin-top: 2px; }
    .chk { display: flex; gap: 6px; align-items: center; font-weight: 500; color: #17202c; }
    .chk input { width: auto; display: inline; margin: 0; }
    .hint { font-weight: 400; color: #5d6878; }
    .bar { position: sticky; bottom: 0; background: #fff; padding: 12px 0 4px; display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid #e1e6ee; margin-top: 14px; }
    button { font: inherit; font-weight: 700; border-radius: 8px; padding: 9px 18px; border: 1px solid #c9d1dd; background: #fff; cursor: pointer; }
    button.primary { background: #1d5bb5; color: #fff; border-color: #1d5bb5; }
    .slot { display: grid; grid-template-columns: 1.2fr 1fr auto 1fr auto; gap: 6px; align-items: center; margin-bottom: 6px; }
    .slot input { margin: 0; }
    .slot .del { padding: 6px 10px; color: #c8322a; }
    #msg { margin-top: 10px; padding: 10px 12px; border-radius: 8px; display: none; white-space: pre-line; }
    #msg.ok { display: block; background: #e4f4ec; color: #10502f; }
    #msg.err { display: block; background: #fdeceb; color: #7d1d17; }
  </style>
</head>
<body>
  <form id="f" onsubmit="return false">
    <h3>학교급</h3>
    <div class="levels">
      <label><input type="radio" name="level" value="초등학교">초등학교<small>1~6학년 · 늘봄 · 강사</small></label>
      <label><input type="radio" name="level" value="중학교">중학교<small>1~3학년 · 방과후학교</small></label>
      <label><input type="radio" name="level" value="고등학교">고등학교<small>1~3학년 · 방과후학교</small></label>
    </div>
    <h3>학교 정보</h3>
    <label>학교명 <input name="schoolName" placeholder="예: 한빛초등학교"></label>
    <div class="two">
      <label>학년도 <input name="year" placeholder="2026"></label>
      <label>학기 <input name="term" placeholder="예: 2학기, 여름방학"></label>
    </div>
    <div class="two">
      <label>운영 시작일 <input name="opStart" type="date"></label>
      <label>운영 종료일 <input name="opEnd" type="date"></label>
    </div>
    <div class="two">
      <label>담당부서 <input name="dept" placeholder="예: 방과후부"></label>
      <label>담당자 <input name="manager"></label>
    </div>
    <label>연락처 <span class="hint">(가정통신문 문의처)</span><input name="phone" placeholder="예: 02-000-0000"></label>
    <h3>운영 규칙</h3>
    <div class="two">
      <label>선발 방식 <select name="method"><option>추첨</option><option>선착순</option><option>담당자선정</option></select></label>
      <label>학생 1명 최대 신청 <input name="maxCount" type="number" min="0" value="3"></label>
    </div>
    <label class="chk"><input type="checkbox" name="feeUse"> 수강료 금액 표시하기 <span class="hint">(결제 기능 없이 금액만 보여 줍니다)</span></label>
    <h3>비밀번호 <span class="hint" id="pwHint"></span></h3>
    <div class="two">
      <label>관리자 비밀번호 <input name="adminPw" type="password" autocomplete="new-password" placeholder="4자 이상"></label>
      <label>교사·강사 공용 비밀번호 <input name="teacherPw" type="password" autocomplete="new-password" placeholder="4자 이상"></label>
    </div>
    <h3>시간대 <span class="hint">— 학교급 예시값입니다. 학교 일과에 맞게 자유롭게 고치세요.</span></h3>
    <div id="slots"></div>
    <div style="display:flex;gap:6px;margin:6px 0 2px">
      <button type="button" id="addSlot">+ 시간대 추가</button>
      <button type="button" id="presetSlot">학교급 예시값으로 다시 채우기</button>
    </div>
    <p class="hint" style="font-size:12px;margin:4px 0 0">강좌 등록 때 빠른 선택 버튼과 현황판 묶음 제목으로 쓰입니다. 나중에 관리자 화면 [설정]이나 [시간대] 탭에서도 바꿀 수 있습니다.</p>
    <h3>추가 선택</h3>
    <label class="chk"><input type="checkbox" name="sample"> 예시 데이터(가상의 학생·강좌) 넣어서 체험하기 <span class="hint">— 지금 데이터는 지워집니다</span></label>
    <div id="msg"></div>
    <div class="bar">
      <button type="button" onclick="google.script.host.close()">닫기</button>
      <button type="button" class="primary" id="save">저장</button>
    </div>
  </form>
  <script>
    const CUR = <?!= currentJson ?>;
    const f = document.getElementById('f');
    ['schoolName', 'year', 'term', 'dept', 'manager', 'phone', 'opStart', 'opEnd', 'method', 'maxCount'].forEach(k => { if (CUR[k]) f.elements[k].value = CUR[k]; });
    f.elements.feeUse.checked = CUR.feeUse === '사용';
    if (CUR.level) { const r = f.querySelector(`[name=level][value="${CUR.level}"]`); if (r) r.checked = true; }
    document.getElementById('pwHint').textContent = CUR.hasAdminPw ? '(이미 정해져 있습니다. 바꿀 때만 입력)' : '(처음 정합니다)';
    const syncLevel = () => f.querySelectorAll('.levels label').forEach(l => l.classList.toggle('on', l.querySelector('input').checked));
    f.addEventListener('change', syncLevel); syncLevel();

    // 시간대 편집: 처음엔 시트에 있는 값, 없으면 고른 학교급의 예시값
    const box = document.getElementById('slots');
    let slotsTouched = (CUR.slots || []).length > 0;
    const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const slotRow = x => `<div class="slot"><input class="sn" placeholder="이름 (예: 1부)" value="${esc(x.name)}"><input class="ss" type="time" value="${esc(x.start)}"><span>~</span><input class="se" type="time" value="${esc(x.end)}"><button type="button" class="del" title="삭제">삭제</button></div>`;
    const setSlots = list => { box.innerHTML = list.map(slotRow).join(''); };
    const levelNow = () => { const r = f.querySelector('[name=level]:checked'); return r ? r.value : ''; };
    setSlots(slotsTouched ? CUR.slots : (CUR.presets[levelNow()] || []));
    f.querySelectorAll('[name=level]').forEach(r => r.addEventListener('change', () => { if (!slotsTouched) setSlots(CUR.presets[r.value] || []); }));
    box.addEventListener('input', () => { slotsTouched = true; });
    box.addEventListener('click', e => { if (e.target.classList.contains('del')) { e.target.closest('.slot').remove(); slotsTouched = true; } });
    document.getElementById('addSlot').onclick = () => { box.insertAdjacentHTML('beforeend', slotRow({ name: '', start: '', end: '' })); slotsTouched = true; };
    document.getElementById('presetSlot').onclick = () => {
      const lv = levelNow();
      if (!lv) return msg('학교급을 먼저 고르세요.');
      setSlots(CUR.presets[lv] || []); slotsTouched = false;
    };
    const readSlots = () => Array.from(box.querySelectorAll('.slot')).map(d => ({ name: d.querySelector('.sn').value, start: d.querySelector('.ss').value, end: d.querySelector('.se').value }));
    const msg = (t, ok) => { const m = document.getElementById('msg'); m.textContent = t; m.className = ok ? 'ok' : 'err'; m.scrollIntoView(); };

    document.getElementById('save').onclick = () => {
      const lv = f.querySelector('[name=level]:checked');
      if (!lv) return msg('학교급을 고르세요.');
      if (!f.elements.schoolName.value.trim()) return msg('학교명을 입력하세요.');
      if (f.elements.sample.checked && !confirm('예시 데이터를 넣으면 학생·교사·강좌·신청 탭의 내용이 바뀝니다. 계속할까요?')) return;
      const data = {
        level: lv.value, schoolName: f.elements.schoolName.value, year: f.elements.year.value, term: f.elements.term.value,
        opStart: f.elements.opStart.value, opEnd: f.elements.opEnd.value, dept: f.elements.dept.value, manager: f.elements.manager.value,
        phone: f.elements.phone.value, method: f.elements.method.value, maxCount: f.elements.maxCount.value,
        feeUse: f.elements.feeUse.checked ? '사용' : '사용안함', adminPw: f.elements.adminPw.value, teacherPw: f.elements.teacherPw.value,
        slots: readSlots(), sample: f.elements.sample.checked
      };
      const btn = document.getElementById('save');
      btn.disabled = true; btn.textContent = '저장 중…';
      google.script.run
        .withSuccessHandler(list => {
          btn.disabled = false; btn.textContent = '저장';
          msg('저장했습니다.\n' + (list || []).join('\n') + '\n\n다음 단계: [학생]·[교사] 탭에 명단을 넣고, 사용설명서 4단계(웹앱 배포)를 진행하세요.', true);
        })
        .withFailureHandler(e => { btn.disabled = false; btn.textContent = '저장'; msg(e.message || String(e)); })
        .setupSchool(data);
    };
  </script>
</body>
</html>
